<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05060d">
<script src="/labs/claude-shim.js"></script>
</head>
<body>
<title>Tool City</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
/* Layout: one full-screen 3D instrument. Top bar (name + Design), zoom dial on the right edge, one bottom sheet that holds the tools and every panel. Nothing floats over anything else. */
:root{
  --bg:#05060d; --ink:#efe6d2; --dim:#968e7d; --line:rgba(232,194,122,.26); --glass:rgba(11,12,24,.8);
  --accent:#e8c27a; --hud:#e8c27a; --chip:rgba(232,194,122,.1);
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --mono:'Courier Prime','Courier New',ui-monospace,monospace;
  --rad:10px; --sheet:120px; --top:64px;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--bg);overflow:hidden}
.tc [hidden]{display:none!important}
.tc{position:relative;height:100%;width:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--mono);-webkit-tap-highlight-color:transparent}
.tc[data-mode="cream"]{--bg:#efe4cf;--ink:#5c3018;--dim:#80624a;--line:rgba(92,48,24,.28);--glass:rgba(245,236,220,.9);--accent:#9c6b1f;--hud:#9c6b1f;--chip:rgba(156,107,31,.12);color-scheme:light}
.tc[data-mode="glass"]{--bg:#06121f;--ink:#e6f1f7;--dim:#8fb0c4;--line:rgba(127,211,255,.32);--glass:rgba(8,24,40,.7);--accent:#e8c27a;--hud:#7fd3ff;--chip:rgba(127,211,255,.12)}
.tc[data-mode="window"]{--bg:#0a0d12;--ink:#e9edf1;--dim:#93a0ad;--line:rgba(200,220,235,.22);--glass:rgba(16,22,30,.72);--accent:#e8c27a;--hud:#cfe3f2;--chip:rgba(200,220,235,.1)}
.tc[data-mode="alien"]{--bg:#030a06;--ink:#dcf7e4;--dim:#7fa58b;--line:rgba(125,255,176,.3);--glass:rgba(4,18,10,.8);--accent:#b6ff7a;--hud:#7dffb0;--chip:rgba(125,255,176,.1)}
.tc canvas.scene{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.tc button,.tc input,.tc textarea{font:inherit;color:var(--ink)}
.tc button{font-size:13px;letter-spacing:.06em;background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:8px 14px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .2s,color .2s,background .2s;white-space:nowrap}
.tc button:hover{border-color:var(--accent)}
.tc button:focus-visible,.tc input:focus-visible,.tc textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tc button[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);background:var(--chip)}
.tc[data-mode="cream"] button[aria-pressed="true"]{color:var(--ink)}

/* top bar */
.tc .top{position:absolute;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding-top:calc(12px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));pointer-events:none}
.tc .brand{min-width:0}
.tc .brand h1{margin:0;font-family:var(--display);font-weight:600;font-size:28px;line-height:1.05;color:var(--accent)}
.tc[data-mode="cream"] .brand h1{color:var(--ink)}
.tc .brand p{margin:4px 0 0;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.tc .top .menuBtn{pointer-events:auto}
.tc .menu{position:absolute;right:max(16px,env(safe-area-inset-right,0px));top:calc(var(--top) + 4px);z-index:8;width:min(280px,calc(100% - 32px));background:var(--glass);border:1px solid var(--line);border-radius:var(--rad);padding:12px;display:flex;flex-direction:column;gap:12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.tc .menu .row{display:flex;flex-wrap:wrap;gap:6px}
.tc .lab{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}

/* HUD frame: corner brackets around the scene area */
.tc .hud{position:absolute;left:max(10px,env(safe-area-inset-left,0px));right:max(10px,env(safe-area-inset-right,0px));top:calc(var(--top) + 4px);bottom:calc(var(--sheet) + 8px);pointer-events:none;z-index:2;transition:bottom .3s}
.tc .hud i{position:absolute;width:18px;height:18px;border-color:var(--hud);border-style:solid;opacity:.55}
.tc .hud i:nth-child(1){left:0;top:0;border-width:1px 0 0 1px}
.tc .hud i:nth-child(2){right:0;top:0;border-width:1px 1px 0 0}
.tc .hud i:nth-child(3){left:0;bottom:0;border-width:0 0 1px 1px}
.tc .hud i:nth-child(4){right:0;bottom:0;border-width:0 1px 1px 0}
.tc .hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--top) + 10px);z-index:3;max-width:calc(100% - 120px);text-align:center;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);pointer-events:none;text-wrap:balance}
.tc .hint.loud{color:var(--accent)}
.tc[data-mode="cream"] .hint.loud{color:var(--ink)}

/* zoom dial */
.tc .dial{position:absolute;z-index:4;right:max(12px,env(safe-area-inset-right,0px));bottom:calc(var(--sheet) + 20px);display:flex;flex-direction:column;align-items:center;gap:6px;transition:bottom .3s}
.tc .dial button{width:46px;height:46px;padding:0;display:grid;place-items:center;font-size:18px;letter-spacing:0;border-radius:50%}
.tc .dial span{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.tc .dial .rail{width:1px;height:10px;background:var(--line)}

/* labels projected from 3D */
.tc .labels{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden}
.tc .lbl{position:absolute;left:0;top:0;transform:translate(-50%,-100%);text-align:center;white-space:nowrap;padding:3px 8px;border-radius:6px;background:color-mix(in srgb,var(--bg) 62%,transparent);border:1px solid transparent;transition:opacity .25s;will-change:transform}
.tc .lbl b{display:block;font-family:var(--display);font-weight:600;font-size:16px;line-height:1.1;color:var(--ink)}
.tc .lbl span{display:block;font-size:10px;letter-spacing:.16em;text-transform:uppercase;margin-top:1px}
.tc .lbl.big b{font-size:22px}
.tc .lbl.sel{border-color:var(--accent)}
.tc .lbl.dist{background:none}
.tc .lbl.dist b{font-size:20px;letter-spacing:.02em}
.tc .lbl[hidden]{display:none!important}

/* bottom sheet */
.tc .sheet{position:absolute;left:0;right:0;bottom:0;z-index:5;background:var(--glass);border-top:1px solid var(--line);border-radius:18px 18px 0 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-height:min(48%,440px);display:flex;flex-direction:column}
.tc .sheet .bar{display:flex;align-items:center;gap:6px;padding-top:10px;padding-bottom:10px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}
.tc .sheet .bar::-webkit-scrollbar{display:none}
.tc .sheet .bar .grow{flex:1}
.tc .sheet .fold{width:40px;padding:8px 0;text-align:center}
.tc .body{overflow:auto;padding-bottom:6px;display:flex;flex-direction:column;gap:12px;min-height:0}
.tc .body[hidden]{display:none!important}
.tc .body h2{margin:0;font-family:var(--display);font-weight:600;font-size:22px;line-height:1.15;text-wrap:balance}
.tc .body p{margin:0;font-size:13px;line-height:1.5;color:var(--dim);max-width:65ch}
.tc .chips{display:flex;flex-wrap:wrap;gap:6px}
.tc .chips button{font-size:12px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px}
.tc .dot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}
.tc .field{display:flex;flex-direction:column;gap:4px}
.tc .field input,.tc .field textarea{background:transparent;border:1px solid var(--line);border-radius:var(--rad);padding:8px 10px;font-size:14px;width:100%;box-sizing:border-box}
.tc .field textarea{min-height:56px;resize:vertical;font-family:var(--mono)}
.tc .two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tc .two>*{min-width:0}
.tc .actions{display:flex;flex-wrap:wrap;gap:6px}
.tc a.open{display:inline-flex;align-items:center;gap:6px;font-size:13px;letter-spacing:.06em;color:var(--bg);background:var(--accent);border-radius:999px;padding:8px 16px;text-decoration:none}
.tc[data-mode="cream"] a.open{color:#f5ecdc;background:#5c3018}
.tc .legend{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.tc .legend button{border-radius:var(--rad);text-align:left;display:flex;align-items:center;gap:8px;white-space:normal}
.tc .legend small{margin-left:auto;color:var(--dim);font-variant-numeric:tabular-nums}
.tc .links{display:flex;flex-direction:column;gap:4px}
.tc .links button{border-radius:var(--rad);text-align:left;display:flex;align-items:center;gap:8px;white-space:normal}
.tc input[type=range]{width:100%;accent-color:var(--accent)}
.tc .toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(var(--sheet) + 16px);z-index:7;font-size:12px;letter-spacing:.08em;background:var(--glass);border:1px solid var(--accent);border-radius:999px;padding:8px 14px;max-width:calc(100% - 140px);text-align:center;transition:opacity .3s,bottom .3s}
.tc .warn{color:#e3895c}
@media (min-width:760px){
  .tc .sheet{left:auto;right:max(16px,env(safe-area-inset-right,0px));bottom:16px;width:400px;border:1px solid var(--line);border-radius:16px;max-height:calc(100% - var(--top) - 32px)}
  .tc .dial{right:calc(max(16px,env(safe-area-inset-right,0px)) + 416px);bottom:24px}
  .tc .hud{bottom:12px;right:calc(max(16px,env(safe-area-inset-right,0px)) + 412px)}
  .tc .toast{bottom:24px}
}
@media (prefers-reduced-motion:reduce){.tc *{transition:none!important}}
</style>

<div id="city" class="tc" data-mode="night"></div>

<script src="/labs/vendor/three-r128.min.js"></script>
<script>
/*
  ToolCity(root) — self-contained so it can also mount inside the Mandala later.
  Level 0 Mandala (top-down on the wheel) → Level 1 City (districts of tools) → Level 2 Sky (your city as one star).
  Data: blocks [{id,name,kind,shape,x,z,h,note,url}], links [{a,b}] saved in db doc city/main (local fallback).
*/
function ToolCity(root){
  const T = window.THREE;
  if(!T){ root.textContent = 'The 3D engine did not load. Check the connection and reload.'; return null; }

  const MANDALA_URL = '/labs/mandala';
  const KINDS = {
    art:{name:'Art', color:'#e3895c'},
    mind:{name:'Mind & System', color:'#73a3dc'},
    energy:{name:'Energy', color:'#7cc794'},
    constellation:{name:'Constellation', color:'#a98be0'},
    core:{name:'Core', color:'#d6b26e'}
  };
  const SHAPES = {
    wheel:{name:'Wheel', glyph:'◎'}, tower:{name:'Tower', glyph:'▮'}, block:{name:'Block', glyph:'▬'},
    cell:{name:'Cell', glyph:'●'}, dome:{name:'Dome', glyph:'◠'}, gear:{name:'Gear', glyph:'⚙'}, orb:{name:'Orb', glyph:'◉'}
  };
  const DISTRICT_ANGLE = {art:-Math.PI*0.75, mind:-Math.PI*0.25, energy:Math.PI*0.25, constellation:Math.PI*0.75};
  const DISTRICT_R = 27;

  // Starter city: the tools that exist today. Positions are offsets inside each district.
  const STARTER = [
    ['art','Art wheel','wheel',[0,0],1,'The Art world of the Mandala: sculpture, collections, dreams.',MANDALA_URL],
    ['art','Writing & Poetry','wheel',[-7,3],.8,'Poems kept as twins: your original beside a polished version.',MANDALA_URL],
    ['art','Concert Room','dome',[6,4],1,'Colour Brain Live: the 3D room where the visuals react to the beat.',''],
    ['art','Marble to Machine','block',[-4,-6],.9,'Instagram plan: six talk points toward the TEDx-style talk.',''],
    ['art','Data Art','tower',[5,-5],1.2,'Data-art pages for a brand pitch.',''],
    ['mind','Admin wheel','wheel',[0,0],1,'The Admin world of the Mandala: papers, contacts, the week.',MANDALA_URL],
    ['mind','Connecting Ideas','tower',[6,4],1.6,'The plan for the heart of Colour Brain: five layers of linked ideas.',''],
    ['mind','Colour Brain app','tower',[-6,4],2,'The real app (Next.js + Supabase) that all of this grows into.','/'],
    ['mind','One Shell','block',[-4,-6],.8,'One coherent design for the whole app: one shell, one map.',''],
    ['mind','Flame Room','block',[5,-5],.9,'Shared notes room with Martin and the launch roadmap.',''],
    ['energy','Energy wheel','wheel',[0,0],1,'The Energy world of the Mandala: body, rest, balance.',MANDALA_URL],
    ['energy','Fire Map','dome',[-6,4],1,'Magma suns and a breath guide: controlling the fire.',''],
    ['energy','Harmony Machine','gear',[6,4],1,'Calm study sound with separate layers.',''],
    ['energy','The Sky orrery','orb',[0,-7],1,'Real planets and your star map, inside the Mandala.',MANDALA_URL],
    ['constellation','Constellation wheel','wheel',[0,0],1,'The Constellation Club: for those who dream.',MANDALA_URL],
    ['constellation','Archetypes','wheel',[-7,3],.8,'Eight stars: Seer, Rebel, Maker, Architect, Keeper, Healer, Wanderer, Muse.',MANDALA_URL],
    ['constellation','Reflection Bubbles','cell',[6,4],1,'Groups of 2, 4, 6 growing to 600: the future of group chats.','/labs/reflection-bubbles'],
    ['constellation','Frontier Bubbles','cell',[-4,-6],1.1,'Living map of collective intelligence news and people.','/labs/frontier-bubbles'],
    ['constellation','World Map','block',[5,-6],.9,'AI for Collective Intelligence: the research world map.',''],
    ['constellation','Collective Brain','cell',[-7,-1],1.2,'Each member’s strengths and intentions as one living map you can ask.','/collective']
  ];
  const STARTER_LINKS = [
    ['mandala','Art wheel'],['mandala','Admin wheel'],['mandala','Energy wheel'],['mandala','Constellation wheel'],
    ['Art wheel','Writing & Poetry'],['Art wheel','Data Art'],['Writing & Poetry','Marble to Machine'],['Concert Room','Marble to Machine'],
    ['Concert Room','Harmony Machine'],['Energy wheel','Fire Map'],['Energy wheel','The Sky orrery'],['The Sky orrery','Archetypes'],
    ['Constellation wheel','Archetypes'],['Reflection Bubbles','Connecting Ideas'],['Reflection Bubbles','Collective Brain'],['Frontier Bubbles','World Map'],['Constellation wheel','Reflection Bubbles'],
    ['Connecting Ideas','Colour Brain app'],['One Shell','Colour Brain app'],['Flame Room','Connecting Ideas'],['Admin wheel','Flame Room']
  ];
  function starterCity(){
    const blocks = STARTER.map(([kind,name,shape,[ox,oz],h,note,url],i)=>{
      const a = DISTRICT_ANGLE[kind], cx = Math.sin(a)*DISTRICT_R, cz = Math.cos(a)*DISTRICT_R;
      // local frame: +oz points away from the centre, +ox to the side
      const ux = Math.sin(a), uz = Math.cos(a), sx = Math.cos(a), sz = -Math.sin(a);
      return {id:'b'+i, name, kind, shape, x:+(cx+ux*oz+sx*ox).toFixed(1), z:+(cz+uz*oz+sz*ox).toFixed(1), h, note, url};
    });
    const byName = Object.fromEntries(blocks.map(b=>[b.name,b.id]));
    const links = STARTER_LINKS.map(([a,b])=>({a:a==='mandala'?'mandala':byName[a], b:byName[b]}));
    return {blocks, links};
  }

  const MODES = {
    night:{bg:0x05060d, fog:0x05060d, grid:'232,194,122', geo:'232,194,122', pattern:'flower', glassy:false, light:1, ground:'#05060d'},
    cream:{bg:0xefe4cf, fog:0xefe4cf, grid:'92,48,24', geo:'156,107,31', pattern:'flower', glassy:false, light:1.25, ground:'#efe4cf'},
    glass:{bg:0x06121f, fog:0x06121f, grid:'127,211,255', geo:'232,194,122', pattern:'flower', glassy:true, light:1.1, ground:'#06121f'},
    window:{bg:0x0a0d12, fog:0x0a0d12, grid:'200,220,235', geo:'200,220,235', pattern:'none', glassy:true, light:1.05, ground:'#0a0d12'},
    alien:{bg:0x030a06, fog:0x030a06, grid:'125,255,176', geo:'182,255,122', pattern:'honey', glassy:false, light:.95, ground:'#030a06'}
  };
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  // ---------- state ----------
  let city = starterCity();
  let mode = 'night';
  try{ const m = localStorage.getItem('toolcity.mode'); if(m && MODES[m]) mode = m; }catch(e){}
  let selected = null;       // block id or 'mandala'
  let tool = null;           // null | 'connect' | 'move' | 'place'
  let connectFrom = null;
  let pending = null;        // new block draft waiting to be placed
  let sheetOpen = true;
  let userEdited = false;
  let dbDoc = null;

  // ---------- DOM ----------
  root.dataset.mode = mode;
  root.innerHTML = `
    <canvas class="scene" aria-label="3D map of your tools"></canvas>
    <div class="labels"></div>
    <div class="hud" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <header class="top">
      <div class="brand"><h1>Tool City</h1><p class="readout"></p></div>
      <button class="menuBtn" aria-expanded="false" aria-haspopup="true">Design ⋯</button>
    </header>
    <div class="menu" hidden>
      <div class="lab">Mode</div>
      <div class="row modes"></div>
      <div class="lab">View</div>
      <div class="row"><button data-act="reset-view">Reset view</button><button data-act="spin" aria-pressed="false">Slow orbit</button></div>
      <div class="lab">City</div>
      <div class="row restoreRow"><button data-act="restore">Restore starter city</button></div>
    </div>
    <div class="hint"></div>
    <nav class="dial" aria-label="Zoom level">
      <button data-level="2" title="Sky: your city as one star">✦</button><span>Sky</span><div class="rail"></div>
      <button data-level="1" title="City: all your tools">▦</button><span>City</span><div class="rail"></div>
      <button data-level="0" title="Mandala: the base">◎</button><span>Mandala</span>
    </nav>
    <section class="sheet" aria-label="City panel">
      <div class="bar">
        <button data-tool="add">＋ Block</button>
        <button data-tool="connect" aria-pressed="false">⟷ Connect</button>
        <button data-tool="move" aria-pressed="false">✥ Move</button>
        <span class="grow"></span>
        <button class="fold" aria-label="Collapse panel" aria-expanded="true">▾</button>
      </div>
      <div class="body"></div>
    </section>
    <div class="toast" hidden></div>`;
  const $ = s=>root.querySelector(s);
  const canvas=$('canvas.scene'), labelsEl=$('.labels'), hintEl=$('.hint'), readout=$('.readout'), menu=$('.menu'), menuBtn=$('.menuBtn'),
        sheet=$('.sheet'), body=$('.body'), fold=$('.fold'), toastEl=$('.toast');
  const el=(tag,props={},kids=[])=>{ const e=document.createElement(tag); for(const k in props){ if(k==='text') e.textContent=props[k]; else if(k==='class') e.className=props[k]; else if(k.startsWith('on')) e.addEventListener(k.slice(2),props[k]); else e.setAttribute(k,props[k]); } kids.forEach(c=>c&&e.appendChild(c)); return e; };

  // ---------- three setup ----------
  const renderer = new T.WebGLRenderer({canvas, antialias:true, alpha:false});
  renderer.setPixelRatio(Math.min(devicePixelRatio||1, 2));
  const scene = new T.Scene();
  scene.fog = new T.Fog(0x05060d, 90, 260);
  const camera = new T.PerspectiveCamera(45, 1, 0.5, 800);
  const hemi = new T.HemisphereLight(0xfff1d6, 0x101020, 0.75); scene.add(hemi);
  const sun = new T.DirectionalLight(0xffe6b8, 0.9); sun.position.set(30,60,20); scene.add(sun);
  const rim = new T.DirectionalLight(0x9fd4ff, 0.35); rim.position.set(-40,25,-30); scene.add(rim);

  const world = new T.Group(); scene.add(world);
  const cityGroup = new T.Group(); world.add(cityGroup);
  const linkGroup = new T.Group(); world.add(linkGroup);
  const skyGroup = new T.Group(); scene.add(skyGroup);

  // canvas texture helpers
  function canvasTex(size, draw){ const c=document.createElement('canvas'); c.width=c.height=size; draw(c.getContext('2d'), size); const t=new T.CanvasTexture(c); t.anisotropy=4; return t; }
  function haloTex(){ return canvasTex(128,(g,s)=>{ const r=g.createRadialGradient(s/2,s/2,0,s/2,s/2,s/2); r.addColorStop(0,'rgba(255,255,255,1)'); r.addColorStop(.25,'rgba(255,255,255,.45)'); r.addColorStop(1,'rgba(255,255,255,0)'); g.fillStyle=r; g.fillRect(0,0,s,s); }); }
  const HALO = haloTex();

  function drawMandala(g, s, colors, gold, ink, label){
    const c=s/2; g.clearRect(0,0,s,s);
    g.save(); g.translate(c,c);
    // base
    g.fillStyle='rgba(0,0,0,0)'; g.beginPath(); g.arc(0,0,c*.98,0,7); g.fill();
    const n=colors.length;
    for(let i=0;i<n;i++){ const a0=i/n*Math.PI*2-Math.PI/2, a1=(i+1)/n*Math.PI*2-Math.PI/2;
      g.fillStyle=colors[i]+'55'; g.beginPath(); g.moveTo(0,0); g.arc(0,0,c*.72,a0+.02,a1-.02); g.closePath(); g.fill(); }
    g.strokeStyle=gold; g.lineWidth=s/170;
    [.98,.9,.72,.5,.28].forEach(r=>{ g.beginPath(); g.arc(0,0,c*r,0,7); g.stroke(); });
    // octagon
    g.beginPath(); for(let i=0;i<=8;i++){ const a=i/8*Math.PI*2+Math.PI/8; g.lineTo(Math.cos(a)*c*.62,Math.sin(a)*c*.62);} g.stroke();
    // ticks
    for(let i=0;i<120;i++){ const a=i/120*Math.PI*2, l=i%10?.02:.05; g.beginPath(); g.moveTo(Math.cos(a)*c*.9,Math.sin(a)*c*.9); g.lineTo(Math.cos(a)*c*(.9+l),Math.sin(a)*c*(.9+l)); g.stroke(); }
    // spokes + petals

  canvas.addEventListener('pointerup',endPtr); canvas.addEventListener('pointercancel',endPtr);
  canvas.addEventListener('contextmenu',e=>e.preventDefault());
  canvas.addEventListener('wheel',e=>{ e.preventDefault(); tween=null; cam.dist=Math.min(420,Math.max(10,cam.dist*Math.exp(e.deltaY*.0012))); },{passive:false});
  function onTap(x,y){
    if(tool==='place' && pending){ const p=groundAt(x,y); if(p && Math.hypot(p.x,p.z)<90){ if(Math.hypot(p.x,p.z)<10.5){ toast('That is the Mandala plaza. Tap a spot outside the gold ring.'); return; } placePending(p.x,p.z); } return; }
    const id=pickAt(x,y);
    if(tool==='connect'){ if(!id) return; if(!connectFrom){ connectFrom=id; selected=id; hint('Now tap the block to connect to',true); applySelectionLook(); renderSheet(); return; }
      link(connectFrom,id); connectFrom=null; tool=null; hint(); selected=id; applySelectionLook(); renderSheet(); return; }
    if(id){ select(id); if(cam.dist>170) goLevel(1); } else if(selected){ select(null); }
  }
  // keyboard: arrows orbit, +/- zoom
  canvas.tabIndex=0; canvas.addEventListener('keydown',e=>{ const k=e.key; if(k==='ArrowLeft') cam.az+=.1; else if(k==='ArrowRight') cam.az-=.1; else if(k==='ArrowUp') cam.polar=Math.max(.02,cam.polar-.06); else if(k==='ArrowDown') cam.polar=Math.min(1.35,cam.polar+.06); else if(k==='+'||k==='=') cam.dist=Math.max(10,cam.dist*.88); else if(k==='-') cam.dist=Math.min(420,cam.dist*1.14); else return; e.preventDefault(); tween=null; });

  // ---------- loop ----------
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  let last=performance.now(), frame=0, running=true;
  const DAYS=['SUN','MON','TUE','WED','THU','FRI','SAT'];
  function tick(now){
    if(!running) return; requestAnimationFrame(tick);
    const dt=Math.min(.05,(now-last)/1000); last=now; frame++;
    const w=canvas.clientWidth, h=canvas.clientHeight;
    if(canvas.width!==Math.round(w*renderer.getPixelRatio()) || canvas.height!==Math.round(h*renderer.getPixelRatio())){ renderer.setSize(w,h,false); camera.aspect=w/Math.max(h,1); camera.fov = camera.aspect<1 ? 2*Math.atan(Math.tan(20*Math.PI/180)/camera.aspect)*180/Math.PI : 45; camera.updateProjectionMatrix(); }
    if(tween){ const k=Math.min(1,(now-tween.t0)/tween.ms), e=ease(k);
      cam.dist=tween.from.dist+(tween.to.dist-tween.from.dist)*e; cam.polar=tween.from.polar+(tween.to.polar-tween.from.polar)*e;
      let da=tween.to.az-tween.from.az; da=Math.atan2(Math.sin(da),Math.cos(da)); cam.az=tween.from.az+da*e;
      cam.target.lerpVectors(tween.from.target,tween.to.target,e); if(k>=1) tween=null; }
    if(autoSpin && !ptrs.size) cam.az+=dt*.06;
    // keep the scene centred in the free space between the top bar and the sheet
    { const sh=innerWidth>=760?0:(parseFloat(root.style.getPropertyValue('--sheet'))||0); const off=Math.round((sh-topPx)/2);
      if(camera.view===null || !camera.view || camera.view.offsetY!==off || camera.view.fullWidth!==w || camera.view.fullHeight!==h){ camera.setViewOffset(w,h,0,off,w,h); } }
    placeCamera();
    const t=now/1000, m=reduced?0:1;
    plazaDisc.rotation.z += dt*.05*m; coreOrbit.rotation.x=Math.PI/2+Math.sin(t*.4)*.3*m; coreOrbit.rotation.y+=dt*.4*m;
    core.position.y=coreHalo.position.y=3+Math.sin(t*1.2)*.15*m; coreHalo.material.opacity=.45+.15*Math.sin(t*2)*m;
    objects.forEach(r=>{
      if(r.spin){ if(r.spinAxis==='z') r.spin.rotation.z+=dt*.5*m; else r.spin.rotation.z+=dt*.25*m; }
      if(r.spin2) r.spin2.rotation.z-=dt*.25*1.9*m;
      if(r.blink) r.blink.material.opacity=.55+.35*Math.sin(t*2+r.b.x)*m;
      if(r.sel.material.opacity>0) r.sel.scale.setScalar(1+.04*Math.sin(t*4)*m);
      if(r.cell && m && frame%2===0){ const pa=r.cell.mesh.geometry.attributes.position, base=r.cell.base;
        for(let i=0;i<pa.count;i++){ const x=base[i*3],y=base[i*3+1],z=base[i*3+2]; const n=1+.08*Math.sin(x*1.7+t*1.3)*Math.sin(y*1.9+t)+.05*Math.sin(z*2.3-t*1.6); pa.array[i*3]=x*n; pa.array[i*3+1]=y*n; pa.array[i*3+2]=z*n; }
        pa.needsUpdate=true; r.cell.mesh.geometry.computeVertexNormals(); }
    });
    linkObjs.forEach(o=>o.pulses.forEach(p=>{ const u=((t*.18*m)+p.userData.off)%1; o.curve.getPoint(u,p.position); p.material.opacity=Math.sin(u*Math.PI)*.9; }));
    // what shows at each level
    const lv=levelOf(cam.dist);
    skyGroup.visible = cam.dist>120;
    cityStar.material.opacity = Math.max(0,Math.min(.55,(cam.dist-160)/300));
    scene.fog.near = cam.dist*.9; scene.fog.far = cam.dist*2.4+90;
    linkGroup.visible = cam.dist>30 || selected==='mandala';
    // readout + hint
    const d=new Date();
    readout.textContent=`${LEVELS[lv].name.toUpperCase()} · ${city.blocks.length} BLOCKS · ${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}`;
    root.querySelectorAll('.dial button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.level===lv)));
    const ht = hintOverride ? hintOverride : (lv===0?{text:'Pinch out or tap ▦ to zoom out to your city',loud:true}:lv===1?{text:'Tap a block · drag to turn · pinch to zoom'}:{text:'Your city as one star · more constellations later'});
    if(hintEl.textContent!==ht.text) hintEl.textContent=ht.text; hintEl.classList.toggle('loud',!!ht.loud);
    renderer.render(scene,camera);
    const top=Math.max(topPx+8, hintEl.offsetTop+hintEl.offsetHeight+4), sheetH=innerWidth>=760?0:(parseFloat(root.style.getPropertyValue('--sheet'))||0);
    layoutLabels(w,h,top,h-sheetH-8, innerWidth>=760?w-460:w-70);
  }
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){ running=false; } else if(!running){ running=true; last=performance.now(); requestAnimationFrame(tick); } });

  // ---------- boot ----------
  try{ if(localStorage.getItem('toolcity.sheet')==='0') sheetOpen=false; }catch(e){}
  setMode(mode); renderSheet(); setSheet(sheetOpen); placeCamera(); requestAnimationFrame(tick);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(()=>{ drawPlaza(); Object.keys(wheelTexCache).forEach(k=>delete wheelTexCache[k]); rebuildBlocks(); syncLayout(); });
  // first view: start on the Mandala, then glide out to the city (the zoom-out is the point)
  setTimeout(()=>{ if(!ptrs.size && !tween && cam.dist<40) goLevel(1); }, 1400);

  return { setMode, goLevel, flyToBlock, get city(){ return city; } };
}
window.ToolCity = ToolCity;
window.toolCity = ToolCity(document.getElementById('city'));
</script>
