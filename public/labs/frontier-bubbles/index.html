<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: a full-screen pannable field of cells (blobs) and blocks over a faint grid + flower-of-life; HUD bar on top, glass card at the bottom. */
:root{
  color-scheme:dark;
  --bg:#060d1c; --bg2:#0a1830;
  --grid:rgba(110,160,230,.07); --grid2:rgba(110,160,230,.13);
  --hud:#7fb2ff; --hud-dim:rgba(127,178,255,.45); --hud-faint:rgba(127,178,255,.18);
  --glass:rgba(16,34,62,.58); --glass-hi:rgba(150,195,255,.16);
  --ink:#e6eefb; --dim:#93a6c4;
  --gold:#e3bf72; --gold-dim:rgba(227,191,114,.45);
  --idea:#c9b8ff; --seen:#6f89a8;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--mono);overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;background:radial-gradient(120% 90% at 50% 45%,var(--bg2),var(--bg) 70%)}
#stage::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid2) 1px,transparent 1px),linear-gradient(90deg,var(--grid2) 1px,transparent 1px);
  background-size:24px 24px,24px 24px,120px 120px,120px 120px;background-position:var(--gx,0) var(--gy,0)}
svg#map{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab}
svg#map.drag{cursor:grabbing}
/* HUD corner brackets on the viewport */
.br{position:fixed;width:22px;height:22px;border-color:var(--hud-dim);border-style:solid;pointer-events:none;z-index:3}
.br.tl{top:calc(10px + env(safe-area-inset-top,0px));left:calc(10px + env(safe-area-inset-left,0px));border-width:1px 0 0 1px}
.br.tr{top:calc(10px + env(safe-area-inset-top,0px));right:calc(10px + env(safe-area-inset-right,0px));border-width:1px 1px 0 0}
.br.bl{bottom:calc(10px + env(safe-area-inset-bottom,0px));left:calc(10px + env(safe-area-inset-left,0px));border-width:0 0 1px 1px}
.br.brr{bottom:calc(10px + env(safe-area-inset-bottom,0px));right:calc(10px + env(safe-area-inset-right,0px));border-width:0 1px 1px 0}
header{position:fixed;top:0;left:0;right:0;z-index:4;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(28px,env(safe-area-inset-left,0px));padding-right:max(28px,env(safe-area-inset-right,0px));pointer-events:none;display:flex;flex-direction:column;gap:8px}
header>*{pointer-events:auto}
.eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--hud)}
h1{margin:0;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.1;letter-spacing:.01em}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{font:500 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);background:var(--glass);border:1px solid var(--hud-faint);border-radius:10px;padding:8px 10px;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);display:inline-flex;gap:6px;align-items:center}
.chip b{font-weight:500;color:var(--ink)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--hud)}
.chip.gold[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.chip:focus-visible,.st:focus-visible,.go:focus-visible{outline:1px solid var(--gold);outline-offset:2px}
.sym{display:inline-block;width:10px;height:10px;border-radius:3px;border:1px solid var(--hud-dim)}
.sym.i{background:var(--gold);border-color:var(--gold)}
.sym.v{border-color:var(--seen);background:transparent;position:relative}
.sym.v::after{content:"V";position:absolute;inset:-1px 0 0;font-size:8px;line-height:10px;text-align:center;color:var(--seen)}
.hint{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--hud-dim)}
/* bottom glass card */
#card{position:fixed;z-index:5;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));background:var(--glass);border:1px solid var(--glass-hi);border-radius:10px;backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);padding:16px 16px 14px;display:flex;flex-direction:column;gap:8px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#card::before,#card::after{content:"";position:absolute;width:12px;height:12px;border-color:var(--hud);border-style:solid;pointer-events:none}
#card::before{top:-1px;left:-1px;border-width:1px 0 0 1px}
#card::after{bottom:-1px;right:-1px;border-width:0 1px 1px 0}
#card .k{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hud)}
#card h2{margin:0;font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15;text-wrap:balance}
#card p{margin:0;font-family:var(--serif);font-size:17px;line-height:1.45;color:var(--ink);max-width:60ch}
#card .why{color:var(--gold);font-style:italic}
#card .meta{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.acts{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:4px}
.st{font:500 11px/1 var(--mono);letter-spacing:.08em;padding:10px 12px;border-radius:10px;background:transparent;color:var(--dim);border:1px solid var(--hud-faint);cursor:pointer}
.st[aria-pressed="true"]{color:var(--ink);border-color:var(--hud);background:rgba(127,178,255,.1)}
.st.i[aria-pressed="true"]{color:#1b1406;background:var(--gold);border-color:var(--gold)}
.st.v[aria-pressed="true"]{color:var(--ink);border-color:var(--seen);background:rgba(111,137,168,.22)}
.go{margin-left:auto;font:500 11px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--bg);background:var(--hud);border-radius:10px;padding:10px 14px;text-decoration:none}
.rel{display:flex;gap:6px;flex-wrap:wrap}
.rel button{font:400 11px/1.2 var(--mono);color:var(--idea);background:rgba(201,184,255,.08);border:1px solid rgba(201,184,255,.3);border-radius:10px;padding:6px 8px;cursor:pointer}
#x{position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;background:transparent;color:var(--dim);font:400 18px/1 var(--mono);cursor:pointer}
/* svg */
.edge{stroke:var(--hud-faint);stroke-width:1;fill:none}
.edge.rl{stroke:var(--idea);stroke-dasharray:2 9;stroke-linecap:round;opacity:.35;stroke-width:1.2}
.edge.rl.on{opacity:.85;stroke-width:1.6}
.flow{fill:none;stroke:#9cc3ff;stroke-linecap:round;stroke-dasharray:1.5 11}
.ripple{fill:none;pointer-events:none}
.chip.hot[aria-pressed="true"]{border-color:#9cc3ff;color:#cfe2ff;box-shadow:0 0 14px rgba(127,178,255,.35)}
.pulse-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#9cc3ff;box-shadow:0 0 0 0 rgba(156,195,255,.7);animation:pd 2s infinite}
@keyframes pd{70%{box-shadow:0 0 0 7px rgba(156,195,255,0)}100%{box-shadow:0 0 0 0 rgba(156,195,255,0)}}
.node{cursor:pointer;outline:none}
.node:focus-visible .body{stroke:#e3bf72;stroke-width:2}
.node .body{transition:opacity .3s}
.lbl{font-family:var(--serif);fill:var(--ink);text-anchor:middle;pointer-events:none;paint-order:stroke;stroke:rgba(6,13,28,.85);stroke-width:3px}
.lbl.cl{font-weight:600}
.tag{font-family:var(--mono);font-size:7px;letter-spacing:.14em;fill:var(--hud);text-anchor:middle;pointer-events:none;text-transform:uppercase}
.faded{opacity:.18}
#learn{position:fixed;z-index:6;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(560px,calc(100% - 32px));max-height:min(62vh,640px);overflow:auto;background:rgba(10,24,46,.82);border:1px solid var(--glass-hi);border-radius:10px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);padding:16px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#learn::before{content:"";position:absolute;top:-1px;left:-1px;width:12px;height:12px;border:solid var(--gold);border-width:1px 0 0 1px}
#learn h2{margin:0;font-family:var(--serif);font-weight:600;font-size:24px;line-height:1.15}
#learn .intro{margin:0;font-family:var(--serif);font-size:16px;line-height:1.45;color:var(--dim);max-width:60ch}
.tabs{display:flex;gap:6px}
.path{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.step{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--hud-faint);border-radius:10px;cursor:pointer;background:rgba(127,178,255,.04);text-align:left;font:inherit;color:inherit;width:100%}
.step:hover{border-color:var(--hud-dim)}
.step .n{width:26px;height:26px;border-radius:50%;border:1px solid var(--gold-dim);color:var(--gold);display:flex;align-items:center;justify-content:center;font-size:11px}
.step.done .n{background:var(--gold);color:#1b1406;border-color:var(--gold)}
.step.next{border-color:var(--gold-dim);box-shadow:0 0 18px rgba(227,191,114,.12)}
.step b{display:block;font-family:var(--serif);font-weight:600;font-size:18px;line-height:1.2}
.step span{display:block;font-family:var(--serif);font-size:14px;line-height:1.35;color:var(--dim)}
.step em{font-style:normal;font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--hud);white-space:nowrap}
.lsub{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--hud)}
.meet{margin:0;padding-left:16px;font-family:var(--serif);font-size:15px;line-height:1.45;color:var(--ink)}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center;font-size:11px;color:var(--dim)}
.bar i{display:block;height:8px;border-radius:4px;background:rgba(127,178,255,.12);overflow:hidden;position:relative}
.bar i s{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#7fb2ff,#e3bf72);border-radius:4px}
.bar b{font-weight:400;color:var(--ink);text-align:right;font-variant-numeric:tabular-nums}
.tl{list-style:none;margin:0;padding:0 0 0 14px;border-left:1px solid var(--hud-faint);display:flex;flex-direction:column;gap:8px}
.tl li{position:relative;font-family:var(--serif);font-size:15px;line-height:1.3}
.tl li::before{content:"";position:absolute;left:-18px;top:6px;width:7px;height:7px;border-radius:50%;background:var(--c,#7fb2ff)}
.tl li small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim)}
.spark{width:100%;height:56px;display:block}
.empty{font-family:var(--serif);font-size:15px;color:var(--dim);margin:0}
.chip.star{border-color:var(--gold-dim);color:var(--gold)}
@media (prefers-reduced-motion:reduce){.node .body{transition:none}.pulse-dot{animation:none}}
@media (max-width:520px){header{gap:6px}.hint{display:none}.chip{padding:7px 8px;letter-spacing:.06em}.eyebrow{font-size:9px}h1{font-size:23px}#card h2{font-size:21px}#card p{font-size:16px}}
</style>

  <radialGradient id="gCell" cx="35%" cy="30%" r="80%"><stop offset="0" stop-color="#9cc3ff" stop-opacity=".30"/><stop offset=".6" stop-color="#3d6fb8" stop-opacity=".16"/><stop offset="1" stop-color="#1a3766" stop-opacity=".30"/></radialGradient>
  <radialGradient id="gBlock" cx="30%" cy="25%" r="90%"><stop offset="0" stop-color="#b8d4ff" stop-opacity=".22"/><stop offset="1" stop-color="#20406f" stop-opacity=".26"/></radialGradient>
  <radialGradient id="gGold" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#ffe2a0" stop-opacity=".75"/><stop offset="1" stop-color="#b8862e" stop-opacity=".45"/></radialGradient>
  <radialGradient id="gIdea" cx="35%" cy="30%" r="85%"><stop offset="0" stop-color="#e2d8ff" stop-opacity=".30"/><stop offset="1" stop-color="#5a4a9c" stop-opacity=".22"/></radialGradient>
  <radialGradient id="gCore" cx="40%" cy="35%" r="75%"><stop offset="0" stop-color="#fff0c8" stop-opacity=".9"/><stop offset=".55" stop-color="#e3bf72" stop-opacity=".5"/><stop offset="1" stop-color="#7a5a1e" stop-opacity=".35"/></radialGradient>

</defs><g id="world"><g id="geo"></g><g id="edges"></g><g id="nodes"></g></g></svg></div>
<span class="br tl"></span><span class="br tr"></span><span class="br bl"></span><span class="br brr"></span>

<header>
  <div class="eyebrow">Constellation Club · frontier scan · Nov 2026</div>
  <h1 id="ttl">Constellation Frontiers</h1>
  <div class="row" role="group" aria-label="Page"><button class="chip pg" data-pg="front" aria-pressed="true">◌ Frontiers</button><button class="chip pg" data-pg="act" aria-pressed="false">→ Next moves</button></div>
  <div class="row" id="filters" role="group" aria-label="Filter by state">

    <button class="chip" data-f="v" aria-pressed="false"><span id="lV">V Discovered</span> <b id="cV">0</b></button>

</header>

<section id="learn" hidden aria-live="polite">
  <button id="lx" class="x2" aria-label="Close" style="position:absolute;top:8px;right:8px;width:32px;height:32px;border:0;background:transparent;color:var(--dim);font:400 18px/1 var(--mono);cursor:pointer">×</button>

</section>

  <p id="cS"></p>

  </div>
</section>

    b.querySelector('b').textContent=ALL[sugg].t;b.querySelector('span').textContent=ALL[sugg].w||ALL[sugg].s;b.querySelector('em').textContent=next?'path':'from your ★';b.onclick=()=>goTo(sugg);B.appendChild(b)}
  h('div','lsub','Timeline');
  const tl=h('ul','tl');log.slice(0,30).forEach(x=>{const li=document.createElement('li');li.style.setProperty('--c',x.m==='i'?'#e3bf72':'#6f89a8');li.style.cursor='pointer';
    const sm=document.createElement('small');sm.textContent=fmt(x.ts)+' · '+(x.m==='i'?'★ interested':'V discovered');li.appendChild(sm);li.appendChild(document.createTextNode(ALL[x.id].t));li.onclick=()=>goTo(x.id);tl.appendChild(li)});
}
document.getElementById('bLearn').onclick=()=>openLearn('path');
document.getElementById('bGrow').onclick=()=>openLearn('grow');
document.getElementById('lx').onclick=()=>{document.getElementById('learn').hidden=true};
document.querySelectorAll('#learn .tabs .chip').forEach(b=>b.onclick=()=>openLearn(b.dataset.tab));
function fmt(ts){try{return new Date(ts).toLocaleDateString(undefined,{day:'numeric',month:'short'})}catch(e){return''}}
function centerOn(id){const s=sim[id];if(!s)return;const W=innerWidth,H=innerHeight;const tx=W/2-s.x*view.k,ty=H*.42-s.y*view.k;const s0={...view},t0=performance.now();
  (function tw(now){const p=Math.min(1,(now-t0)/500),e=1-Math.pow(1-p,3);view.x=s0.x+(tx-s0.x)*e;view.y=s0.y+(ty-s0.y)*e;applyView();if(p<1)requestAnimationFrame(tw)})(t0)}
document.querySelectorAll('#cA .st').forEach(b=>b.addEventListener('click',()=>{
  if(!sel)return;const s=b.dataset.s;if(s)marks[sel]=s;else delete marks[sel];
  if(s)dates[sel]=Date.now();else delete dates[sel];
  save();refreshAll();select(sel);
  if(s==='i'){const g=sim[sel];g&&g.g.animate&&!reduce&&g.g.animate([{opacity:.4},{opacity:1}],{duration:400})}
}));
document.getElementById('x').onclick=()=>{const p=sel;sel=null;document.getElementById('card').hidden=true;if(p&&sim[p])styleNode(sim[p])};
document.querySelectorAll('#filters .chip').forEach(b=>b.addEventListener('click',()=>{
  filter=b.dataset.f;document.querySelectorAll('#filters .chip').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));
  if(filter!=='all'){ // grow clusters that hold matching cells
    PI().forEach(n=>{if(matches(n)){let p=PARENT[n.id];while(p&&ALL[p].depth>0){open.add(p);p=PARENT[p]}}});
    if(filter!=='todo')sync();
    if(filter!=='todo')setTimeout(()=>{const ids=PI().filter(matches).map(n=>n.id);if(ids.length)fit(true,[ROOTN().id,...ids])},1500)}
  refreshAll();
}));
document.getElementById('bOpen').onclick=()=>{Object.values(ALL).forEach(n=>{if(n.c&&n.depth>0)open.add(n.id)});lsSet('cf-open',[...open]);sync();setTimeout(()=>fit(true),1400)};
document.getElementById('bFold').onclick=()=>{open.clear();lsSet('cf-open',[]);sync();setTimeout(()=>fit(true),900)};
document.getElementById('bFit').onclick=()=>fit(true);
function refreshAll(){
  for(const id in sim)styleNode(sim[id]);
  const leaf=PI();let i=0,v=0;leaf.forEach(n=>{if(marks[n.id]==='i')i++;else if(marks[n.id]==='v')v++});
  document.getElementById('cAll').textContent=leaf.length;document.getElementById('cTodo').textContent=leaf.length-i-v;document.getElementById('cI').textContent=i;document.getElementById('cV').textContent=v;document.getElementById('cH').textContent=leaf.filter(n=>n.heat>=HOT).length;
}

function setPage(pg,first){
  PAGE=pg;try{localStorage.setItem('cf-page',pg)}catch(e){}
  document.querySelectorAll('.chip.pg').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pg===pg)));
  const L=LABELS[pg];document.getElementById('lTodo').textContent=L.todo;document.getElementById('lI').textContent=L.i;document.getElementById('lV').textContent=L.v;document.getElementById('lH').textContent=L.hot;
  document.getElementById('ttl').textContent=pg==='act'?'Next Moves':'Constellation Frontiers';
  document.getElementById('bLearn').hidden=document.getElementById('bGrow').hidden=pg==='act';
  document.querySelector('.eyebrow').textContent=pg==='act'?'Constellation Club · events and people · Nov 2026':'Constellation Club · frontier scan · Nov 2026';
  if(first)return;
  sel=null;document.getElementById('card').hidden=true;document.getElementById('learn').hidden=true;
  filter='all';document.querySelectorAll('#filters .chip').forEach(x=>x.setAttribute('aria-pressed',String(x.dataset.f==='all')));
  for(const id in sim){sim[id].g.remove();sim[id].line&&sim[id].line.remove();sim[id].flow&&sim[id].flow.remove();delete sim[id]}
  sync();for(let i=0;i<200;i++)step();alpha=.6;refreshAll();draw(0);fit(false);setTimeout(()=>fit(true),1200);
}
document.querySelectorAll('.chip.pg').forEach(b=>b.onclick=()=>{if(b.dataset.pg!==PAGE)setPage(b.dataset.pg)});
setPage(PAGE,true);
/* ---------------- boot ---------------- */
sync();
for(let i=0;i<260;i++)step();alpha=.6;
refreshAll();draw(0);fit(false);
requestAnimationFrame(loop);
setTimeout(()=>fit(true),1600);
</script>
</body>
