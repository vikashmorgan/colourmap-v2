<script>
/* ---------- Small drawings: tables in the page's own colours ----------
 * They follow day and night. */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// No maths subscripts on this page: coef_ and test_size keep their underscores.
const subs = html => html;
const text = s => esc(s);
const row = (...items) => `<div class="pic-flow">${items.map(i => `<div class="pic-step">${i}</div>`).join('')}</div>`;
// A cell that starts with * is shaded.
function tbl(head, rows) {
  const td = (v, tag) => { const on = String(v).startsWith('*'); return `<${tag}${on ? ' class="sel"' : ''}>${text(on ? String(v).slice(1) : v)}</${tag}>`; };
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h => td(h, 'th')).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => td(v, 'td')).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const cap = s => (s ? `<span class="pic-cap">${text(s)}</span>` : '');
const flow = steps => `<p class="flow">${steps.map(f => `<span>${esc(f)}</span>`).join('')}</p>`;
// A code box, already given its peeks. Answers are built from these, so they never pass through a second escape.
const code = s => `<pre>${mathHtml(s)}</pre>`;
// The four stores of the whole session: TV budget x (thousand €) and sales y (thousand units).
const STORES = [[1, 3], [2, 5], [3, 4], [4, 8]];
// The four stores as a table. extra adds columns on the right, each [heading, four values]; a value starting with * is shaded.
function stores({ extra = [], label = '' } = {}) {
  return cap(label) + tbl(['store', 'TV x', 'sales y', ...extra.map(e => e[0])], STORES.map(([x, y], i) => [String(i + 1), String(x), String(y), ...extra.map(e => e[1][i])]));
}
// Bars, to compare a few numbers at a glance: [label, value, shown]. The longest bar is the largest value.
function bars(title, rows) {
  const top = Math.max(...rows.map(r => Math.abs(r[1])));
  return `<div class="pic-chart">${title ? `<p class="pic-title">${text(title)}</p>` : ''}${rows.map(([l, v, shown]) => `<div class="pic-bar"><span>${text(l)}</span><i style="width: ${((100 * Math.abs(v)) / top).toFixed(1)}%"></i><b>${text(shown ?? v)}</b></div>`).join('')}</div>`;
}
// What each line predicts for the four stores, and line C's residuals.
const PRED_A = ['3', '4', '5', '6'], PRED_B = ['1.5', '3.5', '5.5', '7.5'], PRED_C = ['2.9', '4.3', '5.7', '7.1'], RES_C = ['0.1', '0.7', '−1.7', '0.9'];
const mseBars = (title = '') => bars(title, [['A: ŷ = x + 2', 1.5, '1.50'], ['B: ŷ = 2x − 0.5', 1.75, '1.75'], ['C: ŷ = 1.4x + 1.5', 1.05, '1.05']]);
const threeSets = () => tbl(['set', 'share', 'stores', 'its job'], [['training', '60 %', '90', 'each candidate learns its weights'], ['validation', '20 %', '30', 'the candidates are compared, one is chosen'], ['test', '20 %', '30', 'the chosen model is measured, once']]);
// Session 3: the five rounds of k-fold, leave-one-out on the four stores, and the penalty shrinking line C.
const kfoldTbl = () => tbl(['round', 'fold 1', 'fold 2', 'fold 3', 'fold 4', 'fold 5', 'gives'], [1, 2, 3, 4, 5].map(r => [String(r), ...[1, 2, 3, 4, 5].map(f => (f === r ? '*validate' : 'train')), `MSE${'₀₁₂₃₄₅'[r]}`]));
const looTbl = () => cap('Leave-one-out on the four stores: a line on three, judged on the fourth') + tbl(['left out', 'line on the other three', 'ŷ', 'y', 'error²'], [['store 1', 'ŷ = 1.5x + 1.17', '2.67', '3', '0.11'], ['store 2', 'ŷ = 1.5x + 1', '4', '5', '1.00'], ['store 3', 'ŷ = 1.64x + 1.5', '6.43', '4', '5.90'], ['store 4', 'ŷ = 0.5x + 3', '5', '8', '9.00'], ['', '', '', 'mean', '*4.00']]);
const shrinkTbl = () => cap('scikit-learn on the four stores: the slope w and the intercept b') + tbl(['model', 'alpha', 'w', 'b'], [['least squares', '0', '1.4', '1.5'], ['Ridge', '1', '1.17', '2.08'], ['Ridge', '5', '0.7', '3.25'], ['Lasso', '0.5', '1.0', '2.5'], ['Lasso', '1', '0.6', '3.5'], ['Lasso', '2', '*0', '*5: the mean']]);

/* ---------- The course, in plain words ----------
 * Written from the session deck and the take-home notebook in plain words; the slides themselves stay private.
 * Every number on the four stores was worked out again by hand. */
// Session 4: the ten customers of the deck (Example 2), their scores, and who really left.
const TEN = [['0.05', 'stays'], ['0.15', 'stays'], ['0.25', 'stays'], ['0.32', '*leaves'], ['0.35', 'stays'], ['0.45', 'stays'], ['0.55', '*leaves'], ['0.62', 'stays'], ['0.72', '*leaves'], ['0.90', '*leaves']];
const tenTbl = () => cap('The ten customers of the deck, by score: four leave (shaded), six stay') + tbl(['score p', 'really', 'at 0.3', 'at 0.5', 'at 0.7'], TEN.map(([p, who]) => { const v = Number(p), l = who.startsWith('*'); const at = t => (v >= t ? (l ? 'TP' : '*FP') : (l ? '*FN' : 'TN')); return [p, who, at(0.3), at(0.5), at(0.7)]; }));
const confTbl = () => tbl(['', 'predicted negative', 'predicted positive'], [['actually negative', 'TN: true negative', '*FP: false positive, a false alarm'], ['actually positive', '*FN: false negative, a missed case', 'TP: true positive']]);
const costTbl = () => cap('The 200 validation customers: cost = 50 × FP + 150 × FN') + tbl(['threshold', 'FP', 'FN', 'accuracy', 'cost (€)'], [['0.1', '45', '1', '0.770', '2,400'], ['0.2', '32', '3', '0.825', '2,050'], ['0.3', '18', '6', '0.880', '*1,800'], ['0.4', '13', '8', '*0.895', '1,850'], ['0.5', '8', '13', '*0.895', '2,350'], ['0.6', '5', '19', '0.880', '3,100'], ['0.7', '3', '23', '0.870', '3,600'], ['0.8', '0', '27', '0.865', '4,050'], ['0.9', '0', '33', '0.835', '4,950']]);
const SESSIONS = [
  { n: 1, pages: 197, short: 'Intro & data', title: 'Introduction to machine learning', lede: 'How the course works, seventy years of machine learning in a few cards, the kinds of learning and their tasks, the vocabulary of a dataset, and a first straight line through restaurant tips.', groups: [
    { name: 'The course', flowLabel: 'The thread of the five sessions', flow: ['Data', 'Model', 'Training', 'Evaluation'], cards: [
      { id: 'path', slide: 4, name: 'Five sessions, one path', what: 'The course has five sessions. 1: an introduction and data visualisation. 2: linear regression, training and evaluating a model. 3: cross-validation, regularisation and choosing hyperparameters. 4: linear models for classification. 5: unsupervised learning, and a mock exam. Each one adds a piece to the same workflow: data, model, training, evaluation.\n\nEvery session has three parts: theory (the ideas and the maths), a guided notebook that the teacher runs in Colab, and an exercise where you use the same methods on new data, started in class and finished at home.', more: { html: () => tbl(['session', 'topic', 'hours'], [['1', 'introduction, data visualisation', '3'], ['2', 'linear regression: training and evaluating', '4'], ['3', 'cross-validation, regularisation, hyperparameters', '3'], ['4', 'linear models for classification', '3'], ['5', 'unsupervised learning, mock exam', '3']]) } },
      { id: 'rules', slide: 14, name: 'The exercise, the folder and the AI rule', what: 'One notebook per session, named S1_<student id>.ipynb for this one. It must run from top to bottom (Runtime → Restart session and run all) and goes, with its outputs and plots, into your own Drive folder within 24 hours of the end of the lecture. The shared part of the course folder holds the notebooks, the slides and the gradebook, view only.\n\nAI assistants (ChatGPT, Gemini, Claude, Copilot) are allowed, as a help and not a replacement. You must be able to explain every line you submit; work beyond what you can explain at that point of the course scores zero.', watch: 'If you cannot explain it, it is not your work, and the exercise is worth zero.' },
      { id: 'grade', slide: 29, name: 'How the grade is built', what: 'Four exercises (sessions 1 to 4), 2.5 points each: 10 points, a third of the grade. A two-hour final exam: 20 points, two thirds. Total: 30. The exam asks about concepts, reading plots and model outputs, and short computations; session 5 ends with a mock exam of the same shape.\n\nEach exercise is graded on four things: implementation (the code works), method (the right data for training, choosing and testing, no leaks), interpretation (you explain what results and plots mean) and clarity (a tidy notebook that runs). The best score on a metric is not graded: understanding counts more than the number.', f: `final = S1 + S2 + S3 + S4 + exam     # out of 2.5 × 4 + 20 = 30`, more: { html: () => cap('The deck’s example row of the gradebook') + tbl(['S1', 'S2', 'S3', 'S4', 'exercises /10', 'exam /20', 'final /30'], [['2.0', '2.5', '1.5', '2.5', '8.5', '17.0', '*25.5']]) } },
    ] },
    { name: 'A short history', cards: [
      { id: 'mitchell', slide: 57, name: 'What “learning” means: task, experience, performance', what: 'Tom Mitchell’s definition (1997): a program learns from experience E, for a task T and a performance measure P, if its performance at T, measured by P, improves with E.\n\nOn a restaurant that wants to predict tips: T is predicting the tip of a bill; E is the bills and tips recorded so far; P is how far, on average, the predictions fall from the real tips. More recorded bills, smaller errors: the program has learned.', more: { html: () => tbl(['letter', 'means', 'for the tips'], [['T', 'the task', 'predict the tip of a bill'], ['E', 'the experience', 'the bills and tips recorded so far'], ['P', 'the performance measure', 'the average distance between predicted and real tips']]) } },
      { id: 'rules-data', slide: 61, name: 'Rules by hand, or rules from data', what: 'Classic programming: a person writes the rules, the program applies them to data and gives answers. Machine learning turns it round: give it data and the right answers, and learning produces the rules, called a model. A hand-written spam filter lists suspicious words; a learned one reads thousands of emails marked spam or not spam and finds the rules itself.\n\nThree nested words. Artificial intelligence: machines doing tasks we call intelligent. Machine learning: the part of AI that learns from data. Deep learning: machine learning with neural networks of many layers.', more: { html: () => row(cap('programming') + flow(['rules + data', 'program', 'answers']), cap('machine learning') + flow(['data + answers', 'learning', 'rules: a model'])) } },
      { id: 'timeline', slide: 108, name: 'Seventy years at a glance', what: '1950: Turing replaces “can machines think?” with a game, and already imagines a machine that learns like a child. 1956: a summer workshop at Dartmouth names the field artificial intelligence. 1958: Rosenblatt’s perceptron learns shapes from examples, nudging its weights after each mistake: a weighted sum of inputs, as in this course. 1959: Samuel’s checkers program improves by playing itself, and the name machine learning sticks.\n\nThen two winters: in 1969 Minsky and Papert show a single perceptron cannot learn some simple patterns, and funding dries up; the hand-written expert systems of the 1980s break on cases nobody foresaw. 1986: backpropagation trains networks of several layers. 1997: Deep Blue beats Kasparov at chess, by search and hand-written judgement: AI, but not learning. 2012: AlexNet, a deep network, wins ImageNet. 2016: AlphaGo beats Lee Sedol at Go. 2017: the Transformer; 2022: ChatGPT. 2024: a Nobel Prize in physics for Hopfield and Hinton.', more: { html: () => tbl(['year', 'milestone'], [['1950', 'Turing’s imitation game'], ['1956', 'Dartmouth names AI'], ['1958', 'the perceptron'], ['1959', 'Samuel: “machine learning”'], ['1969', 'first winter'], ['1986', 'backpropagation'], ['1997', 'Deep Blue (no learning)'], ['2012', 'AlexNet: top-5 error 15.3 % vs 26.2 %'], ['2016', 'AlphaGo 4–1'], ['2022', 'ChatGPT']]) } },
      { id: 'statistical', slide: 85, name: 'Statistical learning, and machine learning in business', what: 'In the 1990s and 2000s learning from data becomes a branch of statistics with solid maths (support vector machines, 1995; random forests, 2001) and moves into business: spam filters, credit scoring, fraud detection, recommendations. The common recipe: collect examples, fit a model, measure it on new data. Linear models, the subject of this course, are the oldest and simplest members of the family, and still used every day.\n\nToday: retail forecasts the demand of each product in each store; banks score credit and flag fraud; marketing predicts who will leave; e-commerce recommends and prices; operations plan deliveries and predict machine failures. Even language models follow the same recipe at a huge scale: data, a model, a measure of error, an algorithm that makes the error smaller.' },
    ] },
    { name: 'Kinds of learning', cards: [
      { id: 'four-ways', slide: 123, name: 'Four ways to learn', what: 'Supervised: examples come with the right answer. Unsupervised: examples without answers; find structure. Reinforcement: actions, and rewards for the good ones. Self-supervised: the answers come from the data itself.', more: { html: () => tbl(['kind', 'what it learns from', 'example'], [['supervised', 'inputs with the right answer', 'past customers, and whether they left'], ['unsupervised', 'inputs only', 'customers and purchases, no segments given'], ['reinforcement', 'actions and rewards', 'a pricing system watching revenue'], ['self-supervised', 'hidden parts of the data', 'guess the next word of a sentence']]) } },
      { id: 'supervised', slide: 127, name: 'Supervised learning: regression and classification', what: 'The model learns from pairs (input, right answer), then answers for new inputs. Past customers, with their features and whether they left, teach the model; a new customer arrives with features only, and the model predicts “will leave: yes” or “no”.\n\nTwo supervised tasks. Regression predicts a number: how much will we sell next month? Classification predicts a category: will this customer leave, yes or no?', more: { html: () => row(cap('learn') + flow(['past customers: features + answer', 'model']), cap('predict') + flow(['new customer: features only', 'model', 'will leave: yes'])) } },
      { id: 'unsupervised', slide: 135, name: 'Unsupervised learning: structure without answers', what: 'No right answers: the model looks for structure in the data. Clustering finds groups of similar customers, to target each segment. Dimensionality reduction summarises, for example 40 survey answers in 2 scores you can plot. Anomaly detection flags what does not look like the rest, such as unusual payments.' },
      { id: 'rl-self', slide: 139, name: 'Reinforcement and self-supervised learning', what: 'Reinforcement: an agent tries actions; the environment answers with a reward and a new state; over many tries the agent learns which actions pay. AlphaGo, a pricing system that adjusts prices and watches revenue, bidding for online ads.\n\nSelf-supervised: hide part of the data and learn to predict it, so the answers come for free. “The customer paid with a credit …”: the hidden word is “card”. Every sentence on the web becomes an exercise with its solution: this is how large language models are trained.', more: { html: () => flow(['agent', 'action', 'environment', 'reward + new state', 'agent']) } },
      { id: 'tasks', slide: 146, name: 'The tasks at a glance', what: 'Each task answers one kind of question. Read the question first, then the task follows.\n\nThe deck’s quiz in the table: the spam email is classification (a category), grouping customers with no groups given is clustering, learning prices by trying them is reinforcement.', more: { html: () => tbl(['task', 'question', 'business example'], [['regression', 'how much?', 'next month’s sales of a product'], ['classification', 'which category?', 'will a customer cancel?'], ['clustering', 'which groups?', 'customer segments for a campaign'], ['dimensionality reduction', 'how to summarise?', '40 survey answers in 2 scores'], ['anomaly detection', 'what is unusual?', 'fraudulent card payments']]) } },
    ] },
    { name: 'Data', cards: [
      { id: 'table', slide: 161, name: 'A dataset is a table', what: 'The tips dataset has one row per bill in a restaurant. A row is an observation: one bill, the unit we learn from. A column is a feature: one property of every bill. The target is the column we want to predict: here, the tip.', more: { html: () => tbl(['total_bill', 'tip', 'sex', 'smoker', 'day', 'time', 'size'], [['16.99', '*1.01', 'Female', 'No', 'Sun', 'Dinner', '2'], ['10.34', '*1.66', 'Male', 'No', 'Sun', 'Dinner', '3'], ['21.01', '*3.50', 'Male', 'No', 'Sun', 'Dinner', '3'], ['23.68', '*3.31', 'Male', 'No', 'Sun', 'Dinner', '2'], ['24.59', '*3.61', 'Female', 'No', 'Sun', 'Dinner', '4']]) } },
      { id: 'xy', slide: 165, name: 'Features X and target y', what: 'The features form a table X with one row per observation and one column per feature: n rows by p columns, written n × p. The target y has one value per observation: n values. Capital X is a table, small y a list.\n\nIn tips, n = 244 bills and p = 6 features besides the tip. With two numerical features, total_bill and size, the first three bills give the rows below.', f: `X = [[16.99, 2],      y = [1.01,
     [10.34, 3],           1.66,
     [21.01, 3], …]        3.50, …]` },
      { id: 'kinds', slide: 170, name: 'Numerical or categorical, labelled or not', what: 'Numerical features are numbers you can add and average: total_bill (16.99, 10.34 …), size (2, 3, 4 …). Categorical features take one label out of a few: day (Thur, Fri, Sat, Sun), smoker (Yes, No). Models compute with numbers, so categories need a translation, seen later in the course.\n\nLabelled data has the target for every observation (past bills with their tips): it feeds supervised learning. Unlabelled data has only the features (customers and purchases, no segment written anywhere): it feeds unsupervised learning.', more: { html: () => tbl(['column', 'kind', 'why'], [['total_bill', 'numerical', 'a mean bill makes sense'], ['size', 'numerical', 'a count of people'], ['sex, smoker', 'categorical', 'one label of two'], ['day, time', 'categorical', 'one label of a few']]) } },
    ] },
    { name: 'A first model', cards: [
      { id: 'first-line', slide: 178, name: 'A straight line through the tips', what: 'Plot the 244 bills, tip against total bill, one dot each, and draw a straight line through the cloud: tip ≈ 0.105 × bill + 0.92. The line is a model: give it a bill and it gives a tip.\n\nA new bill of 30 dollars: 0.105 × 30 + 0.92 ≈ 4.07 dollars of tip. Session 2 shows how the line is found.', f: `tip ≈ 0.105 × bill + 0.92` },
      { id: 'unseen', slide: 181, name: 'A model is judged on data it has never seen', what: 'A student who memorised last year’s exam is not ready for this year’s. So before training, part of the data is put aside as the test set: it plays the exam. The model learns on the training data only.\n\nData leakage is any information from the test set that reaches training. It makes the model look better than it is.', more: { html: () => flow(['all the data', 'training data: the model learns here', 'test data: the exam, kept aside']) }, watch: 'A model is good if it works on data it has never seen.' },
    ] },
    { name: 'Today in Colab', cards: [
      { id: 'guided', slide: 187, name: 'The guided notebook: five plots', what: 'The guided notebook: Colab (cells, running order, restarting, saving a copy), loading tips with pandas and exploring it, five plots, customising them (colours, markers, legends, panels, saving), and a preview of the straight line through the tips.\n\nEach of the five plots answers one kind of question. Pick the plot from the question.', more: { html: () => tbl(['plot', 'matplotlib / seaborn', 'answers'], [['scatter', 'plt.scatter(x, y)', 'how do two numbers move together?'], ['line', 'plt.plot(x, y)', 'how does a value change along an order?'], ['histogram', 'plt.hist(x, bins=50)', 'how are the values of one column spread?'], ['bar chart', 'plt.bar(labels, heights)', 'how many in each category?'], ['box plot', 'sns.boxplot(x=…, y=…)', 'how does a number differ between groups?']]) } },
    ] },
    { name: 'The exercise: exploring a dataset with plots', flowLabel: 'The ten tasks', flow: ['Look', 'Summarise', 'One column', 'Two columns', 'Groups', 'Panels', 'Save'], cards: [
      { id: 'ex-intro', name: 'The exercise: 54,000 diamonds', what: 'Prices and features of almost 54,000 diamonds, loaded from seaborn’s data on GitHub. carat is the weight; cut, color and clarity are quality grades; x, y and z are sizes in millimetres; price is in US dollars. Three lists give the grades in order: cut and clarity from worst to best, colour from best (D) to worst (J). Plots use them so the categories appear in a meaningful order, not alphabetically.\n\nHand it in: Runtime → Restart session and run all, every cell must run and every plot show; download the .ipynb, rename it S1_<student id>.ipynb and put it in your Drive folder within 24 hours of the end of the lecture. AI assistants: a help, not a replacement; you must be able to explain every line.', f: `diamonds = pd.read_csv(DIAMONDS_URL)

  { n: 2, pages: 165, short: 'Linear regression', title: 'Linear regression: training a model and measuring its error', lede: 'How a model finds its line, how good that line is, and how to choose between two models. Everything is worked out by hand on four stores, then done again in scikit-learn.', groups: [
    { name: 'Where we are', flowLabel: 'The path of the session', flow: ['Split', 'Fit a line', 'Measure the error', 'Choose a model'], cards: [
      { id: 'today', slide: 4, name: 'Last time, and the three questions of today', what: 'Supervised learning learns from examples that come with the right answer. A dataset has features X, the inputs, and a target y, the answer to predict. Last session drew a straight line through restaurant tips, and said that a model is judged on data it has never seen.\n\nToday asks three questions. How does a model find its line? How good is the line it found? How do we choose between two models? The example all session: a retail chain wants to know how much its stores sell, given what they spend on advertising.', f: `tip ≈ 0.105 × bill + 0.92` },
    ] },
    { name: 'Training and test data', cards: [
      { id: 'split', slide: 15, name: 'Put the test set aside first', what: 'Before looking at anything, split the data. The larger part, the training set, is where the model learns. The rest, the test set, is locked away and used once, at the very end: it plays the exam.\n\nThe notebook has 150 stores. With `test_size=0.2`, 20 % of them go to the test set and the others stay for training. If you look at the test set while building the model, the exam is no longer a surprise and its score means less.', f: `from sklearn.model_selection import train_test_split
train, test = train_test_split(data, test_size=0.2, random_state=0)
len(train), len(test)    # (120, 30)` },
      { id: 'leakage', slide: 18, name: 'Data leakage: information the model would not have', what: 'Leakage is when the training data holds information the model could not have at the moment it is used for real. The model then looks better on paper than it will be in practice.\n\nThe deck gives three examples. Each one is a column, or a step, that peeks at the answer.', more: { html: () => tbl(['Goal', 'The leak', 'Why it leaks'], [['predict who will cancel a subscription', 'a column "cancellation date"', 'it exists only once the person has cancelled'], ['predict the sales of a week', 'the stock left at the end of that week', 'it is known only after the week is over'], ['choose between models', 'looking at the test set', 'the exam was used to study, so its score is too kind']]) }, watch: 'Ask of every column: would I have this value at the moment I make the prediction?' },
    ] },
    { name: 'Linear regression', cards: [
      { id: 'line', slide: 24, name: 'One feature, one line: ŷ = w x + b', what: 'The model is a straight line. Give it a feature x, the TV budget of a store in thousand €, and it returns a prediction ŷ, the sales in thousand units. The hat on y means “predicted”, not observed.\n\nTwo numbers set the line. The weight, or slope, w says how much ŷ grows when x grows by 1. The intercept b is the value of ŷ when x is 0. The whole session uses four stores, small on purpose so that everything can be done by hand, and three candidate lines A, B and C. Which one fits best? To decide, we need a number.', f: `ŷ = w x + b`, more: { html: () => stores({ extra: [['A: x + 2', PRED_A], ['B: 2x − 0.5', PRED_B], ['C: 1.4x + 1.5', PRED_C]], label: 'The four stores, and what each line predicts' }) } },
      { id: 'residual', slide: 35, name: 'A residual is the gap between a point and the line', what: 'For each store, the residual is the vertical gap between what it really sold and what the line predicted. Positive: the store sold more than predicted, and its point sits above the line. Negative: it sold less, and its point sits below.\n\nResiduals are the raw material of every error measure that follows.', f: `eᵢ = yᵢ − ŷᵢ`, more: { html: () => stores({ extra: [['ŷ (line C)', ['2.9', '4.3', '*5.7', '7.1']], ['e = y − ŷ', ['0.1', '0.7', '*−1.7', '0.9']]], label: 'Line C: store 3 has the largest gap' }) } },
      { id: 'features', slide: 38, name: 'Several features: one weight each, ŷ = Xw + b', what: 'Real stores spend on more than TV. The notebook’s 150 stores spend on TV (x₁), radio (x₂) and social media (x₃), and the fitted model gives each channel its own weight.\n\nEach weight is the effect of one more thousand € on that channel, the others staying the same. Radio’s 0.1064 means about 106 more units sold per extra thousand € on radio. With two features the model is a plane through the points; with three or more it is a hyperplane: impossible to draw, same idea.\n\nWith matrices, one row of X per store and one weight per feature, the whole model is ŷ = Xw + b.', f: `ŷ = 0.0391 x₁ + 0.1064 x₂ + 0.0202 x₃ + 9.04
ŷ = Xw + b     # the same, for every store at once`, more: { say: 'Three of the stores: each row of X times the weights, plus b, gives that store’s ŷ.', html: () => tbl(['store', 'TV x₁', 'radio x₂', 'social x₃', 'ŷ'], [['1', '153.5', '48.2', '16.6', '*20.51'], ['2', '285.1', '20.1', '33.0', '22.99'], ['3', '43.2', '14.8', '33.4', '12.98']]) } },
    ] },
    { name: 'Loss and least squares', cards: [
      { id: 'mse', slide: 51, name: 'Mean squared error: one number for how wrong a line is', what: 'To compare lines we need one number. Take each residual, square it, and average the squares: that is the MSE. Squaring makes every error positive, so gaps above and below the line cannot cancel out, and it makes large errors weigh much more: a gap of 2 counts 4, a gap of 1 counts 1.\n\nTraining a linear regression means finding the w and b that give the smallest MSE on the training set.', f: `MSE = (1/n) Σᵢ (yᵢ − ŷᵢ)²`, more: { html: () => stores({ extra: [['ŷ (C)', PRED_C], ['e', RES_C], ['e²', ['0.01', '0.49', '*2.89', '0.81']]], label: 'Line C, row by row' }) }, watch: 'The MSE is in squared units (thousand units, squared): good for comparing, hard to read. The RMSE, later, fixes that.' },
      { id: 'ols', slide: 64, name: 'Least squares: the line with the smallest MSE', what: 'Work out the MSE of all three lines and C wins: A gives 1.50, B 1.75, C 1.05. No other line does better on these four stores, so C is the least-squares line.\n\nFor one feature, ordinary least squares (OLS) finds it with an exact formula. The top of the fraction asks: do x and y move together? The bottom asks: how spread out is x? The best line always passes through the point of the means, (x̄, ȳ).', f: `w = Σᵢ (xᵢ − x̄)(yᵢ − ȳ) / Σᵢ (xᵢ − x̄)²
b = ȳ − w x̄`, more: { html: () => row(mseBars('MSE of each line on the four stores'), tbl(['x', 'y', 'x − x̄', 'y − ȳ', 'product', '(x − x̄)²'], [['1', '3', '−1.5', '−2', '3', '2.25'], ['2', '5', '−0.5', '0', '0', '0.25'], ['3', '4', '0.5', '−1', '−0.5', '0.25'], ['4', '8', '1.5', '3', '4.5', '2.25'], ['', '', '', 'sum', '*7', '*5']])) } },
      { id: 'sklearn', slide: 74, name: 'Many features: LinearRegression solves it', what: 'With several features the formula becomes a matrix one, the normal equation w = (XᵀX)⁻¹Xᵀy. You never compute it by hand: scikit-learn’s `LinearRegression` does it in one call.\n\nThe pattern is the same for every model in scikit-learn: create it, `fit` it on the training data, read what it learned, `predict` on new rows. X must be a table, one row per store and one column per feature, even with a single feature: hence the double brackets.', f: `from sklearn.linear_model import LinearRegression
X = [[1], [2], [3], [4]]   # TV: 4 rows, 1 column
y = [3, 5, 4, 8]           # sales
model = LinearRegression()
model.fit(X, y)            # finds w and b
model.coef_                # array([1.4]): w
model.intercept_           # about 1.5: b
model.predict([[5]])       # array([8.5])` },
    ] },
    { name: 'Gradient descent', cards: [
      { id: 'descent', slide: 76, name: 'Gradient descent: walk downhill on the error', what: 'Fix b at 1.5 and work out the MSE of the four stores for every slope w: you get a bowl, and its bottom is the best w. Gradient descent finds it without any formula. Start somewhere, say w = 0; look which way the bowl slopes; take a step downhill; repeat until the ground is flat.\n\nOne step: the new w is the old w minus the learning rate times the gradient. The gradient is the slope of the bowl at the current w, and the minus sign sends you against it, downhill. The same rule moves b, and every weight when there are more features.', f: `w ← w − η · ∂MSE/∂w
∂MSE/∂w = −(2/n) Σᵢ xᵢ (yᵢ − ŷᵢ)`, more: { html: () => bars('MSE of the four stores for each w, b = 1.5: a bowl', [['w = 0', 15.75, '15.75'], ['w = 0.5', 7.125, '7.13'], ['w = 1', 2.25, '2.25'], ['w = 1.4, the bottom', 1.05, '1.05'], ['w = 2', 3.75, '3.75'], ['w = 2.5', 10.125, '10.13'], ['w = 3', 20.25, '20.25']]) } },
      { id: 'by-hand', slide: 85, name: 'Four steps by hand, η = 0.05', what: 'Keep going from w = 1.05 with the same rule. Each step is smaller than the one before, because the bowl flattens near the bottom: on these stores each gradient is a quarter of the one before. After four steps w is 1.39, close to the exact 1.4 of least squares.\n\nSame answer as the formula, reached by small corrections. Why bother? For many models there is no formula, and gradient descent still works.', more: { html: () => tbl(['step', 'w', 'MSE', 'gradient'], [['0', '0', '15.75', '−21.00'], ['1', '1.05', '1.97', '−5.25'], ['2', '1.31', '1.11', '−1.31'], ['3', '1.38', '1.05', '−0.33'], ['4', '*1.39', '*1.05', '−0.08']]) } },
      { id: 'rate', slide: 97, name: 'The learning rate: too small, right, too large', what: 'The learning rate η sets the size of the step. Too small, η = 0.01: right direction, tiny steps, slow. Right, η = 0.05: the bottom in a few steps. Too large, η = 0.15: every step jumps over the bottom to a higher point on the other side, and the error grows instead of shrinking.\n\nOn these four stores each step multiplies the distance to the best w, 1.4, by 1 − 15η. With 0.01 that is 0.85: it shrinks slowly. With 0.05 it is 0.25: fast. With 0.15 it is −1.25: the sign flips, to the other side of the bowl, and the distance grows.', more: { html: () => cap('w after each step, from w = 0 (b = 1.5)') + tbl(['step', 'η = 0.01', 'η = 0.05', 'η = 0.15'], [['0', '0', '0', '0'], ['1', '0.21', '1.05', '3.15'], ['2', '0.39', '1.31', '−0.79'], ['3', '0.54', '1.38', '4.13'], ['4', '0.67', '*1.39', '−2.02']]) } },
      { id: 'standardise', slide: 100, name: 'Standardise the features first', what: 'The TV budget runs from 0 to 300 thousand €. Features on such scales give a long, narrow bowl: gradient descent zig-zags across it and crawls along the bottom. Standardising puts each feature at mean 0 and standard deviation 1: the bowl becomes round, and the path goes straight down.\n\nSubtract the mean, divide by the standard deviation. Each z then says how many standard deviations a value sits from the mean.', f: `z = (x − mean(x)) / std(x)`, watch: 'Compute the mean and the std on the training set only, then use those same two numbers on validation and test. Taking them from all the data is a small leak.' },
      { id: 'gd-code', slide: 103, name: 'Gradient descent in NumPy', what: 'The notebook writes the whole walk in a few lines of NumPy. It starts at w = b = 0, repeats the update a fixed number of times, and keeps the MSE of every step in a list, so you can plot the error falling (or exploding, if the learning rate is too large).\n\nHere error is ŷ − y, the opposite sign of the residual, so the gradient has no minus in front: 2 × mean(error × x) is the same as −(2/n) Σ xᵢ(yᵢ − ŷᵢ).', f: `def gradient_descent(x, y, learning_rate, steps):
    w, b = 0.0, 0.0
    losses = []
    for _ in range(steps):
        error = (w * x + b) - y              # ŷ − y for every row
        losses.append(np.mean(error ** 2))   # the MSE now
        grad_w = 2 * np.mean(error * x)
        grad_b = 2 * np.mean(error)
        w = w - learning_rate * grad_w       # one step downhill
        b = b - learning_rate * grad_b
    return w, b, losses` },

      { id: 'poly', slide: 133, name: 'Polynomials are linear models too', what: 'A curve can still be a linear regression. Make new features from the standardised TV budget z: z, z², z³ and so on up to the power d. The model is still a weighted sum of features, so `LinearRegression` fits it as before.\n\nThe degree d sets how flexible the curve is, and each degree is a candidate model. Degree 1 is too simple: it misses the bend. Degree 3 follows the shape. Degree 12 is too flexible: it wiggles to follow the noise.', f: `ŷ = w₁z + w₂z² + w₃z³ + … + w_d·z^d + b`, more: { html: () => tbl(['degree', 'features', 'the curve'], [['1', 'z', 'a straight line: misses the bend'], ['*3', 'z, z², z³', 'follows the shape'], ['12', 'z, z², …, z¹²', 'follows the noise']]) }, watch: 'Standardise first: 300³ is 27 million, while 2³ is only 8. Unscaled powers explode.' },

    { name: 'One split is not enough', cards: [
      { id: 'one-split', slide: 17, name: 'Five ways to cut the same stores, five different degrees', what: 'Take the 120 training stores and cut them at random into 90 for training and 30 for validation. Fit every degree, keep the one with the lowest validation error. Then do it again with another random cut, five times in all. The five cuts choose degrees 5, 3, 10, 5 and 2.\n\nWhy does the choice move? Only 30 stores judge each model, so a few easy or difficult stores landing in the validation set change its error, and the winner depends on which stores happened to be set aside. The fix: let every store take a turn in the validation set, and average.', more: { html: () => tbl(['cut', 'training / validation', 'degree chosen'], [['1', '90 / 30, at random', '5'], ['2', 'another random cut', '3'], ['3', 'another random cut', '*10'], ['4', 'another random cut', '5'], ['5', 'another random cut', '2']]) }, watch: 'A single validation score is one draw of a random number. Before trusting it, ask how much it would move with another cut.' },
    ] },
    { name: 'Cross-validation', cards: [
      { id: 'kfold', slide: 30, name: 'k-fold cross-validation: every store validates once', what: 'Cut the training set into k equal parts, called folds; here k = 5. Round 1: fold 1 validates and the model trains on the other four. Round 2: fold 2 validates and the others train. And so on, until every fold has validated once. That makes k fits and k validation errors, and every store has been in the validation set exactly once.\n\nThe rows are shuffled before the folds are cut, so that each fold is a fair mix and not, say, the first 24 rows of a sorted file.', more: { html: kfoldTbl } },
      { id: 'cv-score', slide: 34, name: 'The CV score: the mean of the k errors, and their spread', what: 'The cross-validation score is the mean of the k validation errors: the estimate of how wrong the model will be on new data. Their spread, the standard deviation of the k errors, says how much that estimate depends on the cut.\n\nOn the 120 training stores, the multiple regression of last time (TV, radio, social) gets five fold errors from about 1.9 to 5.4: a CV MSE of 3.62, with a spread of 1.28. Any one fold alone could have told either story; the mean of the five is steadier.', f: `CV MSE = (1/k) Σᵢ MSEᵢ        # i = 1 … k` },
      { id: 'loo', slide: 54, name: 'Leave-one-out: k = n, one store per fold', what: 'Push k to its limit: as many folds as stores, so each fold holds a single store. That is n fits: 120 on the training stores instead of 5. With one store in a fold R² cannot be computed, so the score is the MSE. On the 120 stores it gives 3.65, against 3.62 with five folds, for 24 times the fits. Use it on small datasets, where every observation counts; otherwise 5 or 10 folds are enough.\n\nThe four stores are small enough to do it by hand: four rounds, each one fits a line on three stores and predicts the fourth.', f: `from sklearn.model_selection import LeaveOneOut, cross_val_score
X = [[1], [2], [3], [4]]
y = [3, 5, 4, 8]
errors = -cross_val_score(LinearRegression(), X, y, cv=LeaveOneOut(),
                          scoring='neg_mean_squared_error')
errors.round(3)          # array([0.111, 1.   , 5.898, 9.   ])
errors.mean().round(2)   # 4.0`, more: { html: looTbl }, watch: 'Line C’s error on the four stores it learned from was 1.05. On stores the line did not see, the error is about four times larger. That gap is exactly what validation is there to catch.' },
      { id: 'cv-code', slide: 59, name: 'Cross-validation in scikit-learn, and the minus sign', what: 'Two objects do the work. `KFold` decides the folds: how many, shuffled or not, and the seed of the shuffle. `cross_val_score` takes a model, the training data and the folds, and does the k rounds for you: fit on k − 1 folds, score on the one left out, and give back the k scores in an array.\n\nThe minus sign: scikit-learn always maximises a score (higher is better), so errors come back as negative numbers, `neg_mean_squared_error`. A minus in front turns them back into MSEs.', f: `from sklearn.model_selection import KFold, cross_val_score
kfold = KFold(n_splits=5, shuffle=True, random_state=SEED)
cv_mse = -cross_val_score(LinearRegression(), X_train, y_train, cv=kfold,
                          scoring='neg_mean_squared_error')
cv_mse.mean(), cv_mse.std()     # the CV MSE and its spread`, watch: 'Forget the minus and every “MSE” is negative: the largest number is then the worst model, not the best.' },
      { id: 'cv-degree', slide: 63, name: 'Choosing the degree with cross-validation: the recipe, updated', what: 'Do it for every degree of the TV polynomial, from 1 to 12. The training error keeps falling. The CV error, drawn with a bar for its spread across the folds, falls and then rises again; its lowest point is degree 2. One function, `validation_curve`, computes both curves in one call: the training and the validation error of each fold, for each value of one setting.\n\nThe recipe changes: there is no separate validation set any more.', list: ['Split. Training and test only.', 'Compare with cross-validation. Every candidate is scored with k-fold CV on the training set.', 'Refit. The chosen candidate is trained again on the whole training set.', 'Test once. Measure it on the test set and report that number.'], f: `train_scores, cv_scores = validation_curve(
    model, X_train, y_train,
    param_name='polynomialfeatures__degree', param_range=range(1, 13),
    cv=kfold, scoring='neg_mean_squared_error')
# one row per degree, one column per fold`, watch: 'Choose on the CV error, never on the training error: the training curve always prefers the most flexible model.' },
    ] },
    { name: 'Many features', cards: [
      { id: 'poly-many', slide: 73, name: 'Polynomial features of several inputs: squares and products', what: 'With two inputs x₁ and x₂, degree 2 makes five features: the inputs themselves; their squares, a curve instead of a line; and their product x₁x₂, an interaction: the effect of one input depends on the other. TV × radio: a TV campaign might sell more while the radio campaign runs too.\n\n`PolynomialFeatures` builds them all. `include_bias=False` leaves out a column of 1s, because the model already has its intercept b.', f: `from sklearn.preprocessing import PolynomialFeatures
poly = PolynomialFeatures(degree=2, include_bias=False)
poly.fit_transform([[2, 3]])      # array([[2., 3., 4., 6., 9.]])
poly.get_feature_names_out(['x1', 'x2'])
# array(['x1', 'x2', 'x1^2', 'x1 x2', 'x2^2'], dtype=object)` },
      { id: 'grow', slide: 82, name: 'How fast the features grow, and why so many overfit', what: 'The count explodes with the degree. Three inputs (the store budgets) give 3, 9, 19 and 34 features at degrees 1 to 4; six inputs (the offices of the exercise) give 6, 27, 83 and 209.\n\nA training fold of the stores holds 96 stores. With 34 features the model has almost one weight for every three stores: enough freedom to follow the noise. On the three budgets with plain least squares, the 5-fold CV MSE is 3.62 at degree 1, 1.35 at degree 2 and 1.26 at degree 3 (they catch the curve of the TV budget), then back up to 2.36 at degree 4. Can we keep a flexible model and still stop it from following the noise?', more: { html: () => tbl(['degree', 'features, 3 inputs', 'features, 6 inputs', '5-fold CV MSE, 3 budgets'], [['1', '3', '6', '3.62'], ['2', '9', '27', '1.35'], ['3', '19', '83', '*1.26'], ['4', '34', '209', '2.36']]) } },
    ] },
    { name: 'Regularisation', cards: [
      { id: 'penalty', slide: 89, name: 'A penalty on the weights', what: 'Keep all the features, but make large weights expensive. Large weights make a model react strongly to small changes in its inputs, which is what following the noise looks like. So training now makes the error plus a penalty on the size of the weights as small as possible.\n\nλ (lambda) sets the strength of the penalty, and it is never negative. λ = 0: no penalty, plain least squares as before. λ very large: every weight is pushed to zero and the model predicts the mean for everyone. In between, the model gives up a little training error for much smaller weights. scikit-learn calls λ `alpha`.', f: `Loss = MSE + λ · penalty on the weights`, watch: 'The intercept b is not penalised: only the weights that multiply features.' },
      { id: 'ridge-lasso', slide: 96, name: 'Ridge squares the weights, Lasso takes their sizes', what: 'Ridge adds the sum of the squared weights. It shrinks every weight, but none becomes exactly zero. Lasso adds the sum of their absolute values, their sizes without sign. It shrinks them too, and some become exactly zero: Lasso chooses features, dropping the ones it can do without. ElasticNet mixes the two penalties; it is not used in this course.\n\nOn the four stores, with one feature, both pull the slope of line C (w = 1.4) towards 0, and the line towards the mean, ŷ = 5. Ridge never gets there; Lasso does, from α = 1.75.', f: `Ridge:  MSE + λ Σⱼ wⱼ²
Lasso:  MSE + λ Σⱼ |wⱼ|`, more: { html: shrinkTbl, f: `from sklearn.linear_model import Ridge, Lasso
Ridge(alpha=1).fit(X, y).coef_     # array([1.16666667])
Lasso(alpha=1).fit(X, y).coef_     # array([0.6])
Lasso(alpha=2).fit(X, y).coef_     # array([0.])` }, watch: 'scikit-learn writes the two losses with different scalings: Ridge adds α Σ w² to the sum of the squared errors, Lasso adds α Σ |w| to half the MSE. The same α is not the same strength in Ridge and in Lasso.' },
      { id: 'two-models', slide: 107, name: 'Two models, one penalty: the trade', what: 'Model A has MSE 1.0 with weights (4, −3.5). Model B has MSE 1.2 with weights (0.5, 0.3). Without a penalty A wins: its error is lower. But two large weights of opposite sign are a sign that A is following the noise.\n\nAdd a penalty with λ = 0.1 and B wins, with Ridge and with Lasso: a slightly larger error, in exchange for much smaller weights.', more: { html: () => tbl(['model', 'MSE', 'weights', 'Ridge loss, λ = 0.1', 'Lasso loss, λ = 0.1'], [['A', '1.0', '(4, −3.5)', '3.825', '1.75'], ['B', '1.2', '(0.5, 0.3)', '*1.234', '*1.28']]) } },
      { id: 'ridge-poly', slide: 111, name: 'Ridge on a degree-12 polynomial: λ is one more setting', what: 'The degree-12 curve of the TV budget, three times. λ = 0: it wiggles, CV MSE 4.44. Ridge with λ = 10: smooth, CV MSE 3.99. Ridge with λ = 1000: too flat, CV MSE 6.14.\n\nToo little penalty overfits and too much underfits, just as with the degree. So λ is one more setting to choose, and cross-validation chooses it.', more: { html: () => tbl(['λ', 'the curve', '5-fold CV MSE'], [['0', 'wiggles: overfits', '4.44'], ['10', 'smooth', '*3.99'], ['1000', 'too flat: underfits', '6.14']]) } },
      { id: 'scale-first', slide: 117, name: 'Scale first: the penalty sees numbers, not units', what: 'The penalty only sees the size of each weight, and a weight’s size depends on its feature’s unit. An office’s area in m² gets a weight of 0.015 (thousand € of rent per m²). Measure the same area in thousands of m² and the weight becomes 15. Same model, same predictions, but w² goes from 0.000225 to 225: Ridge would punish the second a million times more.\n\nSo standardise every feature first, to mean 0 and standard deviation 1, and all of them are penalised alike. In code: `StandardScaler()` before the model, inside the same pipeline.', f: `make_pipeline(StandardScaler(), Ridge(alpha=10))` },
      { id: 'lasso-path', slide: 126, name: 'Reading a Lasso path, and a Ridge path', what: 'A coefficient path fits the model for many values of λ, from tiny to large, and draws each weight against λ on a log scale. The deck’s example: degree 2 of the three budgets, nine weights. At λ = 0.001 all nine are non-zero. As λ grows, the five squares and products other than tv² leave first; at λ = 0.3, tv, radio, social and tv² are left; tv stays the longest, up to about λ = 3.\n\nA Ridge path looks different: all the weights shrink together, smoothly, and none reaches zero. A Lasso path drops them one at a time, so the order in which they leave ranks how much the model needs each feature.', more: { html: () => tbl(['', 'Ridge path', 'Lasso path'], [['as λ grows', 'all shrink together', 'they hit zero one at a time'], ['exactly zero?', 'never', 'yes'], ['what it tells you', 'how strongly each weight resists', 'which features matter most: the last to leave']]) }, watch: 'Draw λ on a log scale: from 0.001 to 1 the interesting part is spread over three powers of ten, and a plain axis would squeeze it into the left edge.' },
    ] },
    { name: 'Hyperparameter optimisation', cards: [
      { id: 'hyper', slide: 136, name: 'Parameters are learned, hyperparameters are chosen', what: 'Parameters are learned by `fit`, from the data: the weights w and the intercept b. Hyperparameters are chosen by us, before `fit`: the degree of the polynomial, the strength λ of the penalty, the learning rate of gradient descent.\n\nWhich combination of hyperparameters works best on new data? Cross-validation answers it.', more: { html: () => tbl(['', 'parameters', 'hyperparameters'], [['who sets them', 'fit, from the data', 'you, before fit'], ['examples', 'the weights w, the intercept b', 'the degree, λ (alpha), the learning rate η'], ['how they are found', 'least squares or gradient descent', 'cross-validation']]) } },
      { id: 'grid', slide: 146, name: 'Grid search: every combination, scored with cross-validation', what: 'Make a grid: every degree in {1, 2, 3, 4} with every λ in {0.01, 0.1, 1, 10, 100}, so 4 × 5 = 20 combinations. Score each one with 5-fold cross-validation: 20 × 5 = 100 fits. The combination with the lowest CV MSE wins, and it is refitted on the whole training set: one more fit. `GridSearchCV` does all of it in one `fit`.\n\nOn the 120 training stores, Ridge on the three budgets, the winner is degree 3 with λ = 1. Degree 4 gets better as λ grows: the penalty rescues a flexible model. λ = 100 is too strong for every degree.', more: { html: () => cap('5-fold CV MSE of each combination') + tbl(['degree', 'λ = 0.01', '0.1', '1', '10', '100'], [['1', '3.622', '3.622', '3.620', '3.695', '6.467'], ['2', '1.352', '1.352', '1.352', '1.493', '5.197'], ['3', '1.261', '1.260', '*1.256', '1.404', '2.564'], ['4', '2.345', '2.260', '1.900', '2.038', '2.268']]) } },
      { id: 'pipeline', slide: 152, name: 'A pipeline: the scaler learns inside each fold', what: 'A pipeline chains the steps into one model: `StandardScaler` learns a mean and a standard deviation, `PolynomialFeatures` builds the powers and products, `Ridge` learns w and b. One `fit`, one `predict`, and the steps run in order.\n\nThe point is leakage. Inside cross-validation, in every round the scaler learns its mean and standard deviation from the training folds only. Scaling all the training data before cutting the folds would let the validation fold leak into them.', f: `model = make_pipeline(StandardScaler(),
                      PolynomialFeatures(include_bias=False),
                      Ridge())`, watch: 'Do not standardise the data first and cross-validate after: put the scaler in the pipeline, and cross-validate the pipeline.' },
      { id: 'grid-code', slide: 156, name: 'Grid search in scikit-learn', what: 'The grid is a dictionary. Each key names a step of the pipeline and one of its settings, joined by two underscores (`step__setting`); the step’s name is its class name in lower case. Each value is the list of values to try.\n\nOne `fit` runs the 100 CV fits and the refit. Then `best_params_` holds the winning combination, `best_score_` its CV score (negative, as always), and `best_estimator_` the winner, already refitted on the whole training set.', f: `param_grid = {'polynomialfeatures__degree': [1, 2, 3, 4],
              'ridge__alpha': [0.01, 0.1, 1, 10, 100]}
search = GridSearchCV(model, param_grid, cv=kfold,
                      scoring='neg_mean_squared_error')
search.fit(X_train, y_train)
search.best_params_       # the winning degree and alpha
-search.best_score_       # its CV MSE
best_model = search.best_estimator_`, watch: 'A single underscore, or a step name spelled differently, and GridSearchCV stops with “Invalid parameter”.' },
      { id: 'recipe', slide: 162, name: 'The full recipe: cross-validate to choose, test once', what: 'The whole session in one recipe. On the stores it ends with degree 3 and λ = 1, and a test MSE of 1.75: an RMSE of 1.32 thousand units.', list: ['Split. Training and test.', 'Build a pipeline. Scaler, features, model.', 'Grid search on the training set. Every combination, scored with cross-validation.', 'Refit. The best combination is trained again on the whole training set.', 'Test once. Evaluate it on the test set, and report that number.'], watch: 'Cross-validate to choose. Test once.' },
    ] },

      { id: 'ex-intro', name: 'The exercise: 200 offices for rent', what: 'An estate agency’s list of 200 offices for rent, made up by a small function in the notebook (synthetic data, written to offices.csv). Six features: floor area in m², number of rooms, distance from the city centre in km, walk to the nearest metro station in minutes, floor, and age of the building in years. The target is the monthly rent, in thousand €. The six feature names are listed once, in `FEATURES`.\n\nThe deck’s hint for this one: look for the features that Lasso sets to zero, and say why.\n\nHand it in: Runtime → Restart session and run all, check that every cell runs, download the .ipynb, rename it S3_<student id>.ipynb and put it in your Drive folder within 24 hours of the end of the lecture.\n\nAI assistants: a help, not a replacement. You must be able to explain every line you submit, which is what the cards below are for. The answers in words are yours to write.', f: `offices = pd.read_csv('offices.csv')
FEATURES = ['area', 'rooms', 'distance', 'metro', 'floor', 'age']`, more: { html: () => tbl(['column', 'unit', 'role'], [['area', 'm²', 'feature'], ['rooms', 'count', 'feature'], ['distance', 'km from the centre', 'feature'], ['metro', 'minutes on foot', 'feature'], ['floor', 'floor number', 'feature'], ['age', 'years', 'feature'], ['rent', 'thousand € per month', 'target']]) } },
      { id: 'ex-setup', name: 'The setup cell: what each import is for', what: 'The first cell loads the tools of the whole exercise, seeds NumPy’s random generator with SEED and sets one plot style. Each line brings one library or a few functions; the card says what each one does in this notebook.', f: `SEED = 42
import time
import numpy as np
import pandas as pd
import matplotlib.pyplot as plt

from sklearn.preprocessing import StandardScaler, PolynomialFeatures
from sklearn.pipeline import make_pipeline
from sklearn.linear_model import LinearRegression, Ridge, Lasso
from sklearn.metrics import mean_absolute_error, mean_squared_error, r2_score
np.random.seed(SEED)` },
      { id: 'ex-t1', name: 'Task 1 · Two sets', uses: ['cv-degree', 'recipe'], what: 'Split offices into a training set (80 %) and a test set (20 %), with random_state=SEED. Print the size of each set and show the summary statistics of the training set.\n\nWhat it practises: step 1 of the updated recipe. Only two sets now: cross-validation takes the place of the validation set.', f: `train, test = train_test_split(offices, test_size=0.2, random_state=SEED)

X_train, y_train = train[FEATURES], train['rent']
X_test, y_test = test[FEATURES], test['rent']

print(len(train), len(test))
train.describe()`, read: 'The two sizes should add up to 200, with four times as many offices in training as in test. In the describe table, read each column’s mean, min and max with its unit: a first check that the data look sensible (no negative area, rents of a few thousand € a month).', watch: 'Describe train, not offices: from here on the test set stays out of sight until Task 9.' },
      { id: 'ex-t2', name: 'Task 2 · Correlations', uses: ['ridge-lasso'], what: 'Draw a heatmap of the correlation matrix of the training set, the six features and the rent, with the value written in each cell. Use cmap=\'coolwarm\', vmin=-1 and vmax=1, and add a title. Then say which two features carry almost the same information, and which feature is most related to the rent.\n\nWhat it practises: looking before modelling. Two features that move together are exactly where Ridge and Lasso behave differently, which Task 6 shows.', f: `plt.figure(figsize=(9, 7))
sns.heatmap(train.corr(), annot=True, fmt='.2f', cmap='coolwarm', vmin=-1, vmax=1)
plt.yticks(rotation=0)
plt.title('Correlations in the training set')
plt.show()`, read: 'Each cell is the correlation of two columns: from −1 (one goes up when the other goes down), through 0 (no straight-line link), to +1 (they go up together). Ignore the diagonal of 1s. For the first question, find the cell between two features closest to +1 or −1, and think about why those two would move together. For the second, read the rent row and take the largest value in size, whatever its sign.', watch: 'train.corr(), not offices.corr(): the test set is not looked at.' },
      { id: 'ex-t3', name: 'Task 3 · Five folds', uses: ['one-split', 'kfold', 'cv-score', 'cv-code'], what: 'Create a KFold with 5 shuffled folds and random_state=SEED. With cross_val_score, compute the MSE of a LinearRegression on the six features in each fold. Print the five MSEs, their mean and their standard deviation. Then say how much the five errors differ, and what could go wrong if you judged the model on a single validation split.\n\nWhat it practises: k-fold cross-validation, the CV score and its spread.', f: `kfold = KFold(n_splits=5, shuffle=True, random_state=SEED)

cv_mse = -cross_val_score(LinearRegression(), X_train, y_train, cv=kfold, scoring='neg_mean_squared_error')
print(cv_mse.round(3))
print(cv_mse.mean(), cv_mse.std())`, read: 'Compare the smallest and the largest of the five, and the spread with the mean: a spread that is a large share of the mean means the folds disagree. For the second question, use the lecture’s five cuts: a single split gives one of these five numbers, and you would not know which. The model you choose, and the error you report, would depend on luck.', watch: 'Without the minus sign the MSEs are negative. The same kfold is reused in Tasks 4, 5 and 8, so every comparison is made on the same folds.' },
      { id: 'ex-t4', name: 'Task 4 · Leave-one-out', uses: ['loo', 'cv-code'], what: 'Score the same model with LeaveOneOut. Print the number of fits, the mean MSE and the time it takes, next to the same three numbers for the five folds of Task 3. Then say whether the two estimates of the error are close, and why leave-one-out takes longer.\n\nWhat it practises: leave-one-out, k = n.', f: `start = time.perf_counter()
kfold_mse = -cross_val_score(LinearRegression(), X_train, y_train, cv=kfold, scoring='neg_mean_squared_error').mean()
kfold_time = time.perf_counter() - start

start = time.perf_counter()
loo_mse = -cross_val_score(LinearRegression(), X_train, y_train, cv=LeaveOneOut(), scoring='neg_mean_squared_error').mean()
loo_time = time.perf_counter() - start

pd.DataFrame({'fits': [kfold.get_n_splits(), len(X_train)],
              'mean MSE': [kfold_mse, loo_mse],
              'seconds': [kfold_time, loo_time]},
             index=['5-fold', 'leave-one-out']).round(3)`, read: 'Leave-one-out makes one fit per training office; five folds make five. Compare the two mean MSEs: close means five folds were enough here. For the time, link it to the number of fits. Your seconds will not match a classmate’s, but the ratio of the times should be of the same order as the ratio of the fits.', watch: 'Read the clock right after the line it times: time.perf_counter() - start goes before any print. Each leave-one-out fold has one office, so score with the MSE: R² cannot be computed on one value.' },
      { id: 'ex-t5', name: 'Task 5 · Validation curve', uses: ['poly-many', 'grow', 'cv-degree', 'pipeline'], what: 'Build a pipeline of StandardScaler, PolynomialFeatures(include_bias=False) and LinearRegression. With validation_curve and the folds of Task 3, compute the training and the CV MSE for degrees 1 to 4 of the six features. Plot both against the degree. Then say which degree has the lowest CV error, what happens at degree 4, and why.\n\nWhat it practises: choosing the degree with cross-validation, and how fast polynomial features grow.', f: `poly_model = make_pipeline(StandardScaler(), PolynomialFeatures(include_bias=False), LinearRegression())

DEGREES = range(1, 5)
train_scores, cv_scores = validation_curve(
    poly_model, X_train, y_train,
    param_name='polynomialfeatures__degree', param_range=DEGREES,
    cv=kfold, scoring='neg_mean_squared_error')

train_mse = -train_scores.mean(axis=1)
cv_mean = -cv_scores.mean(axis=1)

plt.figure(figsize=(8, 5))
plt.plot(DEGREES, train_mse, marker='o', label='training')
plt.errorbar(DEGREES, cv_mean, yerr=cv_scores.std(axis=1), marker='o', capsize=4, label='5-fold CV')
plt.xticks(list(DEGREES))
plt.yscale('log')
plt.xlabel('degree')
plt.ylabel('MSE')
plt.legend()
plt.show()`, read: 'The lowest point of the CV curve is your degree. At degree 4, compare the two curves: the training error keeps falling, and the CV error? Then count: six inputs at degree 4 make 209 features (card “How fast the features grow”), and each round trains on 128 offices. Use the word overfitting.', watch: 'train_scores and cv_scores have one row per degree and one column per fold: average with axis=1, across the row. They are negative: put the minus in front.' },
      { id: 'ex-t6', name: 'Task 6 · Ridge and Lasso', uses: ['penalty', 'ridge-lasso', 'scale-first'], what: 'On the six standardised features (no polynomial), fit a pipeline with Ridge(alpha=10) and one with Lasso(alpha=0.05) on the training set. Show their coefficients side by side in one table, one row per feature. Then say which coefficients Lasso sets to zero, why that makes sense for those two features, and how Ridge treats area and rooms.\n\nWhat it practises: the two penalties, and why the features are standardised first.', f: `ridge = make_pipeline(StandardScaler(), Ridge(alpha=10))
ridge.fit(X_train, y_train)

lasso = make_pipeline(StandardScaler(), Lasso(alpha=0.05))
lasso.fit(X_train, y_train)

coefficients = pd.DataFrame({'Ridge': ridge[-1].coef_, 'Lasso': lasso[-1].coef_}, index=FEATURES)
coefficients.round(3)`, read: 'The features are standardised, so each coefficient is the change in rent (thousand €) for one standard deviation more of that feature: their sizes can be compared. Look for exact zeros in the Lasso column (−0.0 counts as zero). For the why, go back to Task 2: one zero is a feature that repeats another one; the other is a feature with little link to the rent. For Ridge, compare area and rooms: does it drop one, or share the weight between the two?', watch: 'ridge.coef_ does not exist: the pipeline has no weights, its last step has. Write ridge[-1].coef_, or ridge.named_steps[\'ridge\'].coef_.' },
      { id: 'ex-t7', name: 'Task 7 · Lasso path', uses: ['lasso-path', 'ridge-lasso'], what: 'For 50 values of α from 0.001 to 1 (np.logspace(-3, 0, 50)), fit the Lasso pipeline of Task 6 and store its six coefficients. Plot each coefficient against α, with a logarithmic x axis and a legend. Then say in which order the features leave the model as α grows, and which one stays the longest.\n\nWhat it practises: reading a Lasso path.', f: `ALPHAS = np.logspace(-3, 0, 50)
lasso_coefs = []
for alpha in ALPHAS:
    model = make_pipeline(StandardScaler(), Lasso(alpha=alpha))
    model.fit(X_train, y_train)
    lasso_coefs.append(model[-1].coef_)
lasso_path = pd.DataFrame(lasso_coefs, index=ALPHAS, columns=FEATURES)

plt.figure(figsize=(8, 5))
for feature in FEATURES:
    plt.plot(lasso_path.index, lasso_path[feature], label=feature)
plt.axhline(0, color='grey', linewidth=1)
plt.xscale('log')
plt.xlabel('alpha (log scale)')
plt.ylabel('coefficient')
plt.legend()
plt.show()`, read: 'Read from left to right: each line that reaches the zero line has left the model; note the order. The one still away from zero at the right edge stays the longest. Two checks: α = 0.05 is a point of this path, so it should agree with the Lasso column of Task 6; and the features that leave first should make sense with the correlations of Task 2.', watch: 'Without the log x axis the 50 values of α crowd into the right of the plot: np.logspace spreads them evenly over the powers of ten.' },
      { id: 'ex-t8', name: 'Task 8 · Grid search', uses: ['hyper', 'grid', 'pipeline', 'grid-code'], what: 'Run a GridSearchCV on a pipeline of StandardScaler, PolynomialFeatures(include_bias=False) and Ridge, with degrees 1, 2, 3 and α in 0.01, 0.1, 1, 10, 100, and the folds of Task 3. Print the best hyperparameters and their CV MSE, then draw the CV MSE of every combination as a heatmap. Then say which degree and α win, and why degree 3 needs a larger α than degree 2.\n\nWhat it practises: hyperparameters, grid search and pipelines.', f: `pipeline = make_pipeline(StandardScaler(), PolynomialFeatures(include_bias=False), Ridge())
param_grid = {
    'polynomialfeatures__degree': [1, 2, 3],
    'ridge__alpha': [0.01, 0.1, 1, 10, 100],
}
search = GridSearchCV(pipeline, param_grid, cv=kfold, scoring='neg_mean_squared_error')
search.fit(X_train, y_train)
print(search.best_params_)
print(-search.best_score_)

results = pd.DataFrame(search.cv_results_)
table = -results.pivot_table(index='param_polynomialfeatures__degree', columns='param_ridge__alpha',
                             values='mean_test_score')
plt.figure(figsize=(8, 4))
sns.heatmap(table, annot=True, fmt='.3f', cmap='viridis_r')
plt.xlabel('alpha')
plt.ylabel('degree')
plt.title('5-fold CV MSE of every combination')
plt.show()`, read: 'best_params_ names the winners, and the smallest number in the heatmap should be the same combination. For degree 3, read its row from left to right and compare it with the row of degree 2: where is each row lowest? For the why, use the lecture: count the features of each degree (card “How fast the features grow”) and say what a stronger penalty does to a model with more freedom.', watch: 'The keys are step__setting, with two underscores and the step names in lower case: polynomialfeatures, ridge. The grid has 3 × 5 = 15 combinations: 75 CV fits, then the refit.' },
      { id: 'ex-t9', name: 'Task 9 · Final evaluation', uses: ['recipe', 'grid-code'], what: 'Take the best pipeline of the grid search, already refitted on the whole training set, and compute its metrics on the test set, once. Then say what the test RMSE means in euros per month, and why the test set was kept out of Tasks 3 to 8.\n\nRun the given cell first: regression_metrics is the function of Session 2, giving MAE, MSE, RMSE and R².\n\nWhat it practises: the last step of the recipe, test once.', f: `best_model = search.best_estimator_
regression_metrics(y_test, best_model.predict(X_test))`, read: 'The rent is in thousand € per month, so the RMSE is too: × 1000 gives a typical error in euros on a month’s rent. Compare the test MSE with the best CV MSE of Task 8: close is normal, a little higher is common. For the why: every choice of Tasks 3 to 8 (the degree, α, the penalty) was made with cross-validation on the training offices; say what that leaves the test set worth.', watch: 'No fit here: best_estimator_ is already refitted. Run the cell once; changing the grid after seeing the test score turns the test set into a validation set.' },

      ['Round 1: fold A validates. Which line do the training stores give?', () => code(`train on stores 2 and 4: (2, 5) and (4, 8)

store 2: ŷ = 3.5    e = 5 − 3.5 = 1.5

spread = 2.0      # each error is 2.0 away from the mean`) + `<p>Training error 0 in each round, validation error 5.25 on average: <b>the error on stores a line has not seen is far larger</b> than on the stores it learned from, which is why a model is judged by cross-validation. The two rounds disagree a lot, 3.25 against 7.25: one split alone could have told either story.</p>`],

    { id: 'l3-e2', title: 'Ridge and Lasso by hand', setup: 'The four stores again. Line C, ŷ = 1.4x + 1.5, has MSE 1.05. A flatter line, ŷ = x + 2.5, also passes through the point of the means (2.5, 5). Use the deck’s form, loss = MSE + λ · penalty, with the one weight w.', parts: [
      ['Compute the MSE of the flatter line.', () => code(`ŷ   = 3.5, 4.5, 5.5, 6.5
e   = −0.5, 0.5, −1.5, 1.5
MSE = (0.25 + 0.25 + 2.25 + 2.25) / 4 = 5 / 4 = 1.25`) + `<p>Higher than line C’s 1.05, as it must be: C is the least-squares line.</p>`],
      ['Ridge with λ = 1: which line has the lower loss? And with λ = 0.1?', () => code(`λ = 1:    C     1.05 + 1 × 1.4² = 1.05 + 1.96 = 3.01

λ = 0.1:  C     1.05 + 0.1 × 1.96 = 1.246              ← lower
          flat  1.25 + 0.1 × 1    = 1.35`) + `<p>A weak penalty keeps the least-squares line; a strong one prefers the smaller weight.</p>`],

flat  1.25 + 1 × |1|   = 2.25   ← lower`) + `<p>The flatter line is in fact what scikit-learn’s Lasso finds on these stores with alpha = 0.5: w = 1.0, b = 2.5 (its loss is scaled differently).</p>`],
      ['What does λ = 0 choose? And a huge λ? How would you pick λ?', () => `<p><b>λ = 0</b>: no penalty, line C wins: least squares. <b>A huge λ</b>: any weight costs too much, so w = 0 and the line is flat at the mean, ŷ = 5, MSE 3.5. In between, <b>λ is a hyperparameter</b>: try several values and keep the one with the lowest cross-validation error, never the lowest training error, which would always pick λ = 0.</p>`],

CV fits      = 9 × 5 folds = 45

degree 2, λ = 0.1:  2.1
degree 3, λ = 1:    1.9`) + `<p>With a weak penalty degree 3 has more features than it can use, and follows the noise: <b>it overfits</b>. A stronger penalty shrinks its weights and brings it below degree 2. Too strong, λ = 10, and it underfits again.</p>`],
      ['And degree 1? What comes after the grid search?', () => `<p>Degree 1 stays around 4.0 whatever λ: too simple, <b>it underfits</b>, and a penalty cannot add the curve it lacks. Next: the winner, already refitted on the whole training set, is measured once on the test set, and that number is reported.</p>`],
