  ], recap: ['One validation split is luck: k-fold cross-validation lets every observation validate once and averages the k errors; leave-one-out is k = n.', 'Powers and products of the features multiply fast, and so many features overfit.', 'Regularisation adds a penalty on the weights: Ridge (λ Σ w²) shrinks them all, Lasso (λ Σ |w|) sets some to exactly zero. Standardise first.', 'Parameters are learned by fit; hyperparameters (the degree, λ) are chosen by a grid search with cross-validation, inside a pipeline so the scaler learns within each fold.', 'Cross-validate to choose, refit the best on the whole training set, test once.'] },
  { n: 4, pages: 133, short: 'Classification', title: 'Linear models for classification: from probabilities to decisions', lede: 'A yes-or-no question: will this customer leave? Logistic regression turns a linear score into a probability, a threshold turns the probability into a decision, and the confusion matrix counts what each kind of error costs. Worked out by hand on ten customers, then done in scikit-learn on a thousand.', groups: [
    { name: 'Where we are', flowLabel: 'The path of the session', flow: ['Probability', 'Threshold', 'Decision', 'Count the errors', 'Their cost'], cards: [
      { id: 'today', slide: 10, name: 'Last time, and a yes-or-no question', what: 'Last session: cross-validation lets every observation validate once; Ridge and Lasso keep the weights small with a penalty; a grid search with cross-validation chooses the hyperparameters; the test set is used once, at the end.\n\nToday the target is not a number but an answer, yes or no. Three steps. Will this customer leave? The model gives a probability. Do we act? A threshold turns the probability into a decision. Was it a good decision? We count the errors and what they cost.', list: ['Probability. The model says how likely the customer is to leave, a number between 0 and 1.', 'Decision. Above a threshold we act: we offer the customer a discount.', 'Cost. A needless discount and a lost customer are two different errors, with two different prices.'] },
    ] },
    { name: 'From regression to classification', cards: [
      { id: 'two-targets', slide: 16, name: 'Two kinds of target: a number or a category', what: 'In regression the target is a number: the units a store sells, the price of a used car. In classification it is a category: a customer leaves or stays, a card payment is a fraud or not.\n\nWith two categories the task is binary. They are coded 1 and 0, and class 1 is the positive class: the one we are looking for. Here, a customer who leaves. “Positive” does not mean good; it means “the thing we are hunting for”.', more: { html: () => tbl(['', 'regression', 'classification'], [['the target', 'a number', 'a category'], ['examples', 'units sold, the price of a car', 'leaves or stays, fraud or not'], ['the model gives', 'ŷ, a number', 'p, a probability of class 1'], ['the error measured with', 'MSE, MAE, R²', 'the confusion matrix, precision, recall, ROC-AUC']]) }, watch: 'Choose the positive class on purpose: every metric of the session (precision, recall, the ROC curve) is about class 1.' },
      { id: 'customers', slide: 19, name: 'The customers: 1,000 subscribers, 189 who left', what: 'The example of the whole session: 1,000 customers of a streaming service, with three features: months as a customer, hours watched per week, calls to customer support in the last three months. The target, `churn`, is 1 if the customer left the following month and 0 if they stayed.\n\n811 stayed and 189 left. The classes are imbalanced: about four stay for every one who leaves. Remember that number, it will matter for accuracy.', more: { html: () => tbl(['months', 'hours watched', 'support calls', 'churn'], [['33', '6.5', '1', '0'], ['39', '15.3', '1', '0'], ['38', '8.2', '1', '0'], ['25', '23.1', '0', '0'], ['27', '1.3', '1', '*1']]) } },
      { id: 'not-a-line', slide: 22, name: 'Why not a straight line?', what: 'Plot churn (0 or 1) against the months as a customer and fit a straight line through the dots, as in Session 2. For long-time customers the line goes below 0, and for some it would go above 1. But we want a probability, and a probability is never below 0 or above 1.\n\nWe want a curve that stays between 0 and 1: close to 1 where customers leave, close to 0 where they stay, and passing through 0.5 somewhere in between.', watch: 'A straight line can give −0.3 as a “probability of leaving”. That number means nothing.' },
    ] },
    { name: 'Logistic regression', cards: [
      { id: 'sigmoid', slide: 27, name: 'The sigmoid squeezes any score into a probability', what: 'The sigmoid, written σ, takes any number z, from very negative to very positive, and gives back a number between 0 and 1. At z = 0 it gives exactly 0.5. As z grows it climbs towards 1; as z goes very negative it falls towards 0. It is never exactly 0 or 1.\n\nIts shape is an S: flat at both ends, steep in the middle. Near z = 0 a small change in the score moves the probability a lot; far from 0 it hardly moves it.', f: `σ(z) = 1 / (1 + e⁻ᶻ)`, more: { html: () => tbl(['z', '−4', '−2', '0', '2', '4'], [['σ(z)', '0.02', '0.12', '*0.5', '0.88', '0.98']]) } },
      { id: 'logit-model', slide: 31, name: 'The model: a linear score, then the sigmoid, then a threshold', what: 'Logistic regression has three steps. First a score, exactly as in linear regression: z = b + w₁x₁ + … + w_dx_d. Then the sigmoid turns the score into a probability p = σ(z). Then a decision: positive (leaves) if p is at or above a threshold, negative (stays) otherwise.\n\nThe name is misleading: logistic regression predicts a probability, but we use it to classify.', f: `p = σ(b + w₁x₁ + w₂x₂ + … + w_dx_d)
decision = 1 if p ≥ threshold, else 0` },
      { id: 'calls', slide: 36, name: 'Example 1: support calls and churn, by hand', what: 'A model with one feature, the calls to customer support: z = −2.5 + 0.8 × calls. With no calls, the score is −2.5 and the probability of leaving 0.08: the customer stays. With 3 calls, z = −0.1 and p = 0.48: just under the threshold of 0.5, almost a coin toss. With 5 calls, z = 1.5 and p = 0.82: the customer is predicted to leave.\n\nEvery call adds 0.8 to the score. On the probability its effect is not constant: it depends on where on the S curve the customer already is.', more: { html: () => tbl(['calls', 'score z', 'p = σ(z)', 'decision at 0.5'], [['0', '−2.5', '0.08', 'stays'], ['3', '−0.1', '0.48', 'stays'], ['5', '1.5', '*0.82', '*leaves']]) } },
      { id: 'weights', slide: 41, name: 'Reading the weights', what: 'On the 600 training customers, with standardised features, the weights are −1.52 for months, −1.61 for hours watched and +0.63 for support calls. A positive weight pushes the score up, so the probability of leaving goes up; a negative weight pushes it down.\n\nBecause the features are standardised, the weights can be compared: each one is the change in the score for one standard deviation more of its feature. New customers and those who watch little leave more; support calls push towards leaving. A name you will meet: the score z is also called the log-odds.', more: { html: () => bars('Weights of the standardised features', [['months', -1.52, '−1.52'], ['hours watched', -1.61, '−1.61'], ['support calls', 0.63, '+0.63']]) }, watch: 'Compare weights only on standardised features. In raw units, a weight per month and a weight per call are not on the same scale.' },
      { id: 'boundary', slide: 45, name: 'The decision boundary is a straight line', what: 'Fit a model on two features only, months and hours watched, so that it can be drawn on a plane. Where p = 0.5 the score is exactly 0, and b + w₁x₁ + w₂x₂ = 0 is the equation of a straight line. That line is the decision boundary.\n\nOn our customers it runs from about 13.6 hours at month 0 down to 0 hours at about month 42. Below the line (new customers who watch little) p > 0.5: predicted to leave. Above it, predicted to stay. With three features the boundary is a plane; with more, its higher-dimensional version. That is why the model is called linear.', watch: 'Linear means a straight boundary, not a straight probability: p itself follows the S curve.' },
      { id: 'log-loss', slide: 50, name: 'The log-loss: what training makes small', what: 'For a regression the error was the MSE. For probabilities it is the log-loss. For a customer who left (y = 1) the loss is −log p: small when p is close to 1, huge when p is close to 0. For a customer who stayed (y = 0) it is −log(1 − p): small when p is close to 0.\n\nA confident mistake costs the most: saying 0.01 for a customer who leaves costs 4.6, saying 0.5 costs 0.69. Training finds the weights with the smallest average log-loss, as least squares found the smallest MSE. On our customers it is 0.289 on training and 0.237 on validation.', f: `Log-loss = −(1/n) Σᵢ [ yᵢ log pᵢ + (1 − yᵢ) log(1 − pᵢ) ]`, watch: 'log here is the natural logarithm, ln. And the formula has two halves, but for each customer only one of them is not zero.' },
      { id: 'logit-c', slide: 54, name: 'Regularised by default: C', what: 'LogisticRegression adds a penalty on the weights without being asked: the same penalty as Ridge, the sum of the squared weights. Its strength is set by C, and C is the inverse of λ: a small C is a strong penalty. The default is C = 1.\n\nOn our customers, C = 0.01 shrinks the three weights to about a third; C = 100 barely changes them from C = 1. C is a hyperparameter, like λ: chosen by cross-validation.', f: `Log-loss + (1/C) Σⱼ wⱼ²`, more: { html: () => tbl(['C', 'months', 'hours', 'calls'], [['0.01', '−0.46', '−0.49', '0.20'], ['1', '−1.52', '−1.61', '0.63'], ['100', '−1.60', '−1.69', '0.66']]) }, watch: 'C goes the other way from alpha: to regularise more, make C smaller.' },
      { id: 'logit-code', slide: 58, name: 'Logistic regression in scikit-learn', what: 'Scaler and model in one pipeline, fitted on the training set, as in Session 3. Then two ways to ask the model. `predict_proba` gives two columns, the probability of class 0 and of class 1; `[:, 1]` keeps the second, the probability of leaving. `predict` gives the class directly, with the threshold fixed at 0.5.', f: `model = make_pipeline(StandardScaler(), LogisticRegression())
model.fit(X_train, y_train)
proba_val = model.predict_proba(X_val)[:, 1]   # probability of leaving
pred_val = model.predict(X_val)                # 1 if the probability is at least 0.5`, watch: 'predict always uses 0.5. To use another threshold, compare predict_proba yourself: (proba_val >= 0.3).astype(int).' },
    ] },
    { name: 'Decisions', cards: [
      { id: 'threshold', slide: 63, name: 'Threshold and accuracy', what: 'The model says: this customer leaves with probability 0.35. Do we offer a discount? A threshold t decides: we act on every customer with p ≥ t. The default is 0.5, but nothing forces it.\n\nThe accuracy is the share of right decisions. It changes with the threshold. The threshold is a hyperparameter, so it is chosen on the validation set, never on the test set.', f: `Accuracy = right decisions / all decisions`, watch: 'Choosing the threshold on the test set is the same leak as choosing the degree there.' },
      { id: 'ten-customers', slide: 68, name: 'Example 2: ten customers, three thresholds', what: 'Ten customers, their scores, and who really left (four of them). At 0.3: three false alarms, nobody missed, accuracy 0.7. At 0.5: one false alarm, one missed, accuracy 0.8. At 0.7: no false alarm, two missed, accuracy 0.8.\n\n0.5 and 0.7 have the same accuracy but make different errors. Accuracy alone cannot tell them apart; the kind of error matters.', more: { html: tenTbl } },
    ] },
    { name: 'Evaluation', cards: [
      { id: 'confusion', slide: 75, name: 'The confusion matrix: four outcomes', what: 'Every decision falls in one of four boxes. TN, true negative: a customer who stays, predicted to stay. FP, false positive: a false alarm, someone who stays but was flagged. FN, false negative: a missed case, someone who leaves but was not flagged. TP, true positive: someone who leaves, flagged.\n\nIn scikit-learn the rows are what happened and the columns what the model said, negative first. `.ravel()` reads the four boxes row by row: tn, fp, fn, tp.', more: { html: confTbl, f: `cm = confusion_matrix(y_val, pred_val)
tn, fp, fn, tp = cm.ravel()` }, watch: 'Some books put the positive class first or swap rows and columns. In scikit-learn, top left is TN.' },
      { id: 'two-prices', slide: 79, name: 'Two errors, two prices', what: 'A false positive and a false negative do not cost the same. For churn, a false positive is a needless discount; a false negative is a lost customer. For fraud, a false positive is an honest card blocked; a false negative is a fraud paid.\n\nGive each error its price and add them up. For our customers a discount costs 50 € and a lost customer 150 €. At the threshold 0.5 the validation set has 8 false positives and 13 false negatives: 8 × 50 + 13 × 150 = 2,350 €.', f: `cost = c_FP × FP + c_FN × FN` },
      { id: 'metrics4', slide: 84, name: 'Four metrics: accuracy, precision, recall, F1', what: 'Accuracy: the share of right decisions. Precision: of the cases we flag, how many are positive? Recall: of the positive cases, how many do we flag? F1: one number that is high only if both precision and recall are.\n\nWhich one? Precision matters when false alarms are expensive; recall when missed cases are. On the 200 validation customers at 0.5 the model gets accuracy 0.895, precision 0.758, recall 0.658 and F1 0.704. A model that says “nobody leaves” gets accuracy 0.81, and 0 for the three others.', f: `accuracy  = (TP + TN) / all
precision = TP / (TP + FP)
recall    = TP / (TP + FN)
F1        = 2 · precision · recall / (precision + recall)`, more: { html: () => tbl(['', 'logistic regression', 'nobody leaves'], [['accuracy', '0.895', '0.81'], ['precision', '0.758', '*0.00'], ['recall', '0.658', '*0.00'], ['F1', '0.704', '*0.00']]) }, watch: 'With imbalanced classes a high accuracy can mean nothing: “nobody leaves” is right 81 % of the time and finds no one.' },
      { id: 'fraud', slide: 87, name: 'Example 3: card payments, where accuracy lies', what: '1,000 card payments, 10 of them frauds. At the threshold 0.5 the model catches 1 fraud and misses 9, with 2 false alarms: accuracy 0.989. Never saying “fraud” at all would score 0.990.\n\nLower the threshold to 0.1: 8 frauds caught out of 10, at the price of 30 false alarms. The accuracy goes down, to 0.968, but recall goes from 0.10 to 0.80 and F1 from 0.15 to 0.33. For a bank that pays every missed fraud, the second model is far better.', more: { html: () => tbl(['', 'at 0.5', 'at 0.1'], [['TN, FP', '988, 2', '960, 30'], ['FN, TP', '9, 1', '2, 8'], ['accuracy', '*0.989', '0.968'], ['precision', '0.33', '0.21'], ['recall', '0.10', '*0.80'], ['F1', '0.15', '*0.33']]) } },
      { id: 'roc', slide: 91, name: 'The ROC curve: every threshold at once', what: 'Two rates. The true positive rate, TP / (TP + FN), is the recall: the share of positives found. The false positive rate, FP / (FP + TN), is the share of negatives flagged by mistake.\n\nEach threshold gives one point (false positive rate, true positive rate). A threshold above every score flags nobody: the point (0, 0). A threshold of 0 flags everybody: (1, 1). The ROC curve joins the points in between. The diagonal is what random scores give; the top-left corner, every positive found and no false alarm, is perfect.', f: `TPR = TP / (TP + FN)     # the recall
FPR = FP / (FP + TN)     # negatives flagged by mistake` },
      { id: 'auc', slide: 95, name: 'The area under the ROC curve', what: 'ROC-AUC is the area under the ROC curve: 1 for a perfect model, 0.5 for random scores. It has a plain meaning: pick one positive and one negative at random; the AUC is the chance that the positive has the higher score.\n\nThe ten customers: 4 who leave × 6 who stay = 24 pairs. In 20 of them the one who leaves scores higher, so the AUC is 20 / 24 = 0.83. It is one number for all thresholds: it judges the order of the scores, not any one decision.', f: `roc_auc_score(y_val, proba_val)`, watch: 'Pass the probabilities, not the 0/1 decisions: with decisions there is only one threshold left, and the AUC no longer measures the ranking.' },
      { id: 'roc-ours', slide: 98, name: 'Our customers: ROC-AUC 0.95', what: 'On the 200 validation customers the ROC-AUC is 0.946. At the threshold 0.5, 66 % of those who leave are found (25 of 38) and 5 % of those who stay are flagged (8 of 162). At 0.3, 84 % are found and 11 % flagged: further up the curve, and further right.', more: { html: () => tbl(['threshold', 'TPR: found', 'FPR: flagged by mistake'], [['0.5', '25 / 38 = 0.66', '8 / 162 = 0.05'], ['0.3', '32 / 38 = 0.84', '18 / 162 = 0.11']]) } },
      { id: 'pr-curve', slide: 101, name: 'The precision-recall curve', what: 'Another curve, one point per threshold: recall across, precision up. Finding more positives usually costs precision. Random scores give a flat line at the share of positives, here 0.19: flag customers at random and 19 % of them will be leavers.\n\nIt ignores the true negatives. That makes it useful when the positive class is rare: with 990 honest payments, the true negatives make the ROC curve look good easily; the precision-recall curve does not let them.', f: `precision, recall, _ = precision_recall_curve(y_val, proba_val)` },
    ] },

      { id: 'stratify', slide: 105, name: 'Stratified splits', what: 'A random split can leave, by chance, few positives in a small set: 200 customers with 30 leavers instead of 38 would make every metric jump. A stratified split keeps the share of each class in every set. In code, `stratify=` the target column.\n\nOur sets: 600, 200 and 200 customers, with 18.8 %, 19.0 % and 19.0 % who leave.', f: `train, rest = train_test_split(customers, test_size=0.4, stratify=customers['churn'], random_state=SEED)
val, test = train_test_split(rest, test_size=0.5, stratify=rest['churn'], random_state=SEED)`, watch: 'The second split stratifies on rest[\'churn\'], not customers[\'churn\']: the column must have the same rows as the table being split.' },
      { id: 'cheapest', slide: 109, name: 'The cheapest threshold', what: 'For every threshold from 0.1 to 0.9, count the false positives and false negatives on the validation set and price them: 50 € each FP, 150 € each FN. The cheapest is 0.3, at 1,800 €, against 2,350 € at 0.5.\n\nThe highest accuracy (0.895, at 0.4 and 0.5) is not the lowest cost. A lost customer costs three times a discount, so it pays to flag more customers and accept more false alarms. The threshold comes from the costs of the business, not from the model.', more: { html: costTbl }, watch: 'If the costs change, the threshold changes, with the same model.' },
      { id: 'class-weights', slide: 114, name: 'Class weights', what: 'Four stay for each one who leaves, so the model learns mostly from those who stay. With `class_weight=\'balanced\'` each customer who leaves counts about four times as much in the log-loss: on the 600 training customers, 2.65 against 0.62.\n\nThe probabilities go up, so at 0.5 more customers are flagged: recall rises from 0.658 to 0.947, precision falls from 0.758 to 0.522. It acts like a lower threshold. The ROC-AUC hardly moves, 0.946 against 0.945: the order of the customers hardly changes.', f: `weight of a class = n / (2 × count of that class)`, more: { html: () => tbl(['at 0.5', 'default weights', 'balanced'], [['precision', '0.758', '0.522'], ['recall', '0.658', '*0.947'], ['ROC-AUC', '0.946', '0.945']]) } },

      { id: 'ex-intro', name: 'The exercise: 1,500 loans of a bank', what: 'A bank’s 1,500 past personal loans, made up by a small function in the notebook (synthetic data, written to loans.csv). Five features: the borrower’s yearly income (thousand €), the amount of the loan (thousand €), its duration (months), years in the current job, and late payments in the last two years. The target, `default`, is 1 if the loan was not repaid and 0 if it was.\n\nThe model flags defaults, and the bank refuses the loans it flags. A loan that defaults costs about 5,000 €; a good borrower refused costs about 1,000 € of lost interest. So here a false negative costs five times a false positive. The deck’s hint: look for the threshold that costs the bank the least, and how far it is from 0.5.\n\nHand it in: Runtime → Restart session and run all, check that every cell runs, download the .ipynb, rename it S4_<student id>.ipynb and put it in your Drive folder within 24 hours of the end of the lecture.\n\nAI assistants: a help, not a replacement. You must be able to explain every line you submit. Written answers: two or three sentences in your own words, with the numbers from your notebook; a long answer that is obviously AI-generated loses the points of its task.', f: `loans = pd.read_csv('loans.csv')

      { id: 'ex-t1', name: 'Task 1 · Class balance', uses: ['two-targets', 'customers', 'metrics4'], what: 'Count the repaid and the defaulted loans, and print the default rate. Draw the two counts as a bar plot, with a label on the y axis and a title. Then say what share of the loans defaulted, and what accuracy a model would reach if it predicted “repaid” for every loan.\n\nWhat it practises: the positive class, and imbalance.', f: `counts = loans['default'].value_counts().sort_index()

      { id: 'ex-t3', name: 'Task 3 · Weights', uses: ['logit-model', 'weights', 'logit-code'], what: 'Fit a pipeline of StandardScaler and LogisticRegression on the training set. Print the weight of each feature and draw the weights as a horizontal bar plot, with a vertical line at 0, a label on the x axis and a title. Then say which feature raises the probability of default the most, which lowers it the most, and which hardly matters.\n\nWhat it practises: the model, and reading its weights.', f: `model = make_pipeline(StandardScaler(), LogisticRegression())

      { id: 'ex-t4', name: 'Task 4 · Predicted probabilities', uses: ['logit-code', 'threshold'], what: 'Compute the predicted probability of default of the validation loans. In one figure, plot the histogram of these probabilities for the repaid loans and for the defaulted loans (bins from 0 to 1, alpha=0.6), with a vertical line at 0.5 and a legend. Then say whether the two histograms overlap, and on which side of 0.5 most defaulted loans fall.\n\nWhat it practises: probabilities, and the threshold.', f: `proba_val = model.predict_proba(X_val)[:, 1]

      { id: 'ex-t5', name: 'Task 5 · Confusion matrix', uses: ['confusion', 'metrics4'], what: 'Predict the class of the validation loans with the threshold at 0.5. Draw the confusion matrix as a heatmap, with the labels repaid and default, and print the four metrics with classification_metrics. Then say how many of the defaulted loans the model misses, and why the accuracy is high anyway.\n\nRun the given cell first: classification_metrics is the function of the guided notebook.\n\nWhat it practises: the confusion matrix and the four metrics.', f: `pred_val = (proba_val >= 0.5).astype(int)

      { id: 'ex-t6', name: 'Task 6 · ROC and precision-recall curves', uses: ['roc', 'auc', 'pr-curve'], what: 'Compute the ROC curve and the ROC-AUC of the validation probabilities. Plot the ROC curve with the diagonal of random scores and, next to it, the precision-recall curve with a horizontal line at the default rate of the validation set. Then say what the ROC-AUC is, and what it says about how the model ranks the loans.\n\nWhat it practises: the two curves and the AUC.', f: `fpr, tpr, _ = roc_curve(y_val, proba_val)

      { id: 'ex-t7', name: 'Task 7 · The cheapest threshold', uses: ['two-prices', 'cheapest'], what: 'A false negative (a loan approved that then defaults) costs 5,000 €; a false positive (a good borrower refused) costs 1,000 €. For the thresholds 0.1, 0.2, …, 0.9, compute on the validation set the four metrics, the number of false positives and false negatives, and the cost of the errors. Show them in one table, print the threshold with the lowest cost, and plot the cost against the threshold. Then say which threshold costs the bank the least, and how precision and recall change between that threshold and 0.5.\n\nWhat it practises: the cost of the errors, and choosing the threshold.', f: `COST_FP, COST_FN = 1000, 5000

      { id: 'ex-t8', name: 'Task 8 · Balanced weights', uses: ['class-weights', 'auc'], what: 'Fit the same pipeline with LogisticRegression(class_weight=\'balanced\'). In one table, compare the model of Task 3 and the balanced model on the validation set: the four metrics with the threshold at 0.5, and the ROC-AUC. Then say what changes with the threshold at 0.5, what stays about the same, and why.\n\nWhat it practises: class weights.', f: `balanced = make_pipeline(StandardScaler(), LogisticRegression(class_weight='balanced'))

  ], practice: [
    { id: 'l4-e1', title: 'A probability by hand', setup: 'The deck’s one-feature model: z = −2.5 + 0.8 × calls, and p = σ(z) = 1 / (1 + e⁻ᶻ). e^0.9 ≈ 2.460 and e^−0.7 ≈ 0.497.', parts: [
      ['A customer made 2 calls. Score, probability, decision at 0.5?', () => code(`z = −2.5 + 0.8 × 2 = −2.5 + 1.6 = −0.9
p = 1 / (1 + e^0.9) = 1 / (1 + 2.460) = 1 / 3.460 ≈ 0.29
0.29 < 0.5  →  stays`)],
      ['Another made 4 calls?', () => code(`z = −2.5 + 0.8 × 4 = −2.5 + 3.2 = 0.7
p = 1 / (1 + e^−0.7) = 1 / (1 + 0.497) = 1 / 1.497 ≈ 0.67
0.67 ≥ 0.5  →  leaves`)],
      ['From how many calls is a customer predicted to leave at 0.5?', () => code(`p = 0.5  ⟺  z = 0
−2.5 + 0.8 × calls = 0
calls = 2.5 / 0.8 = 3.125`) + `<p>3 calls give p = 0.48, just under; <b>4 calls or more</b> cross the line. At p = 0.5 the score is 0: that is the decision boundary, here a single number of calls.</p>`],
      ['The customer with 2 calls in fact left. Their log-loss? And if they had stayed?', () => code(`left,   y = 1:  −log p       = −log 0.29 ≈ 1.24
stayed, y = 0:  −log(1 − p) = −log 0.71 ≈ 0.34`) + `<p>The model gave this customer a low probability of leaving, so being wrong costs more than being right: <b>a confident mistake costs the most</b>.</p>`],
    ] },
    { id: 'l4-e2', title: 'Count the errors at 0.4', setup: 'The ten customers of the deck, with the scores 0.05, 0.15, 0.25, 0.32, 0.35, 0.45, 0.55, 0.62, 0.72, 0.90. Four left: those at 0.32, 0.55, 0.72 and 0.90. Take the threshold t = 0.4.', table: tenTbl, parts: [
      ['Fill the confusion matrix at 0.4.', () => code(`flagged (p ≥ 0.4): 0.45, 0.55, 0.62, 0.72, 0.90
TP = 3      # 0.55, 0.72, 0.90 left
FP = 2      # 0.45, 0.62 stayed
FN = 1      # 0.32 left, not flagged
TN = 4      # 0.05, 0.15, 0.25, 0.35`) + `<p>Check: 3 + 2 + 1 + 4 = 10 customers.</p>`],
      ['Accuracy, precision, recall and F1?', () => code(`accuracy  = (3 + 4) / 10 = 0.7
precision = 3 / (3 + 2) = 0.6
recall    = 3 / (3 + 1) = 0.75
F1        = 2 × 0.6 × 0.75 / (0.6 + 0.75) = 0.9 / 1.35 ≈ 0.67`)],
      ['A discount costs 50 €, a lost customer 150 €. The cost at 0.4, and at 0.3, 0.5 and 0.7?', () => code(`0.3:  3 FP, 0 FN  →  3 × 50 + 0 × 150 = 150 €
0.4:  2 FP, 1 FN  →  2 × 50 + 1 × 150 = 250 €
0.5:  1 FP, 1 FN  →  1 × 50 + 1 × 150 = 200 €
0.7:  0 FP, 2 FN  →  0 × 50 + 2 × 150 = 300 €`) + `<p><b>0.3 is the cheapest</b>, though its accuracy, 0.7, is below the 0.8 of 0.5 and 0.7. A missed customer costs three times a false alarm, so flagging more pays.</p>`],
      ['Where is the threshold 0.4 on the ROC curve?', () => code(`TPR = TP / (TP + FN) = 3 / 4 = 0.75
FPR = FP / (FP + TN) = 2 / 6 ≈ 0.33`) + `<p>The point (0.33, 0.75): three quarters of the leavers found, a third of those who stay flagged by mistake.</p>`],
    ] },
    { id: 'l4-e3', title: 'The AUC by counting pairs', setup: 'The same ten customers: four who leave (0.32, 0.55, 0.72, 0.90) and six who stay (0.05, 0.15, 0.25, 0.35, 0.45, 0.62).', parts: [
      ['How many pairs of one leaver and one stayer are there?', () => code(`4 leavers × 6 stayers = 24 pairs`)],
      ['In how many does the leaver have the higher score? The AUC?', () => code(`0.32 beats 0.05, 0.15, 0.25          → 3
0.55 beats all but 0.62              → 5
0.72 beats all six                   → 6
0.90 beats all six                   → 6
total = 3 + 5 + 6 + 6 = 20
AUC = 20 / 24 ≈ 0.83`) + `<p>The deck’s number, and what roc_auc_score gives on these ten.</p>`],
      ['Every score is replaced by its square root: 0.05 becomes 0.22, 0.90 becomes 0.95. What happens to the AUC? To the decisions at 0.5?', () => `<p><b>The AUC does not change</b>: a square root keeps the order, so the same 20 pairs are won. <b>The decisions do</b>: every score goes up, so at 0.5 more customers are flagged (0.32 becomes 0.57). That is what balanced class weights do: higher probabilities, almost the same order.</p>`],
      ['Which customer would you have to move, and where, to get an AUC of 1?', () => `<p>The leaver at 0.32 must score above every stayer, and so must the one at 0.55: above 0.62. With all four leavers above all six stayers, every one of the 24 pairs is won: 24 / 24 = 1, and a threshold between the two groups makes no error at all.</p>`],
    ] },
  ], recap: ['Classification predicts a category; class 1 is the positive class, the one we look for.', 'Logistic regression: a linear score z, the sigmoid p = σ(z), then a threshold. The boundary p = 0.5 is a straight line. Training makes the log-loss small; C (the inverse of λ) sets its built-in penalty.', 'The confusion matrix counts TN, FP, FN, TP. Precision: of those flagged, how many are positive. Recall: of the positives, how many are flagged. With imbalanced classes accuracy can lie.', 'The ROC curve shows every threshold; ROC-AUC is the chance that a positive outscores a negative. The precision-recall curve ignores the true negatives.', 'Stratify the splits; choose the threshold on validation from the costs of the errors; test once.'] },

/* ---------- Charts: the lessons drawn ----------

 * plot() draws one small SVG chart in the page's own colours (day and night): a grid, two axes and its series.
 * Series kinds: line, pts (dots, with a hover tip), segs (short lines between two points), bars ([x0, x1, y]),

let vizId = 0;

function plot({ x, y, series = [], vlines = [], hlines = [], notes = [], title = '', h = 290 }) {

  const sx = v => L + ((v - x.min) / (x.max - x.min)) * (W - L - R);
  const sy = v => H - B - ((v - y.min) / (y.max - y.min)) * (H - T - B);

  const fmt = (ax, v) => (ax.fmt ? ax.fmt(v) : vnum(v));
  let g = `<defs><clipPath id="${id}"><rect x="${L}" y="${T - 6}" width="${W - L - R}" height="${H - T - B + 6}"/></clipPath></defs>`;
  for (const t of y.ticks) g += `<line class="vz-grid" x1="${L}" x2="${W - R}" y1="${r1(sy(t))}" y2="${r1(sy(t))}"/><text class="vz-tick" x="${L - 7}" y="${r1(sy(t)) + 4}" text-anchor="end">${esc(fmt(y, t))}</text>`;
  for (const t of x.ticks) g += `<line class="vz-grid" x1="${r1(sx(t))}" x2="${r1(sx(t))}" y1="${H - B}" y2="${H - B + 4}"/><text class="vz-tick" x="${r1(sx(t))}" y="${H - B + 17}" text-anchor="middle">${esc(fmt(x, t))}</text>`;
  g += `<line class="vz-axis" x1="${L}" x2="${W - R}" y1="${H - B}" y2="${H - B}"/><line class="vz-axis" x1="${L}" x2="${L}" y1="${T}" y2="${H - B}"/>`;
  if (x.label) g += `<text class="vz-lab" x="${(L + W - R) / 2}" y="${H - 6}" text-anchor="middle">${esc(x.label)}</text>`;
  if (y.label) g += `<text class="vz-lab" transform="translate(13 ${(T + H - B) / 2}) rotate(-90)" text-anchor="middle">${esc(y.label)}</text>`;

  for (const v of vlines) body += `<line class="vz-ref" x1="${r1(sx(v.x))}" x2="${r1(sx(v.x))}" y1="${T}" y2="${H - B}"/>${v.label ? `<text class="vz-note vz-soft" x="${r1(sx(v.x)) + 4}" y="${T + 10}">${esc(v.label)}</text>` : ''}`;
  for (const s of series) {

    if (s.kind === 'line' || s.kind === 'area') {
      const d = s.data.map((p, i) => `${i ? 'L' : 'M'}${r1(sx(p[0]))} ${r1(sy(p[1]))}`).join('');
      if (s.kind === 'area') body += `<path class="vz-area ${c}" d="${d}L${r1(sx(s.data[s.data.length - 1][0]))} ${r1(sy(y.min))}L${r1(sx(s.data[0][0]))} ${r1(sy(y.min))}Z"/>`;

    } else if (s.kind === 'bars') {

    } else if (s.kind === 'pts') {

    }
    if (s.at) body += `<text class="vz-note vz-t${s.c || 'a'}" x="${r1(sx(s.at[0]))}" y="${r1(sy(s.at[1]))}"${s.anchor ? ` text-anchor="${s.anchor}"` : ''}>${esc(s.name)}</text>`;
  }

}

/* ---------- Store: this browser first, then the account ---------- */
// The same marks and notes as the Python page, under keys that start with llms|.
const ON_BRAIN = location.pathname.startsWith('/llms');
const MARKS_URL = '/api/coding/marks';
const NOTES_URL = '/api/coding/notes';
function readStore(key, empty) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v ?? empty; } catch (e) { return empty; } }
function writeStore(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
let marks = readStore('llms-marks', {});
let notes = readStore('llms-notes', []);
const saveLocal = () => { writeStore('llms-marks', marks); writeStore('llms-notes', notes); };
const syncEl = document.getElementById('sync');
const fromServer = n => ({ id: n.id, key: n.itemKey, kind: n.kind, body: n.body, answer: n.answer, readAt: n.readAt, createdAt: n.createdAt });
const mine = k => k.startsWith('llms|');

async function load() {
  if (!ON_BRAIN) { syncEl.textContent = 'Saved in this browser.'; return; }
  try {
    const [mr, nr] = await Promise.all([fetch(MARKS_URL), fetch(NOTES_URL)]);
    if (!mr.ok || !nr.ok) throw new Error('load');
    const sm = Object.fromEntries(Object.entries((await mr.json()).marks || {}).filter(([k]) => mine(k)));
    // Marks made here before signing in go up once; the account's own are never overwritten.
    const up = Object.fromEntries(Object.entries(marks).filter(([k]) => !(k in sm)));
    if (Object.keys(up).length) fetch(MARKS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ marks: up }) }).catch(() => {});
    marks = { ...sm, ...up };
    const server = (await nr.json()).notes.filter(n => mine(n.itemKey)).map(fromServer);
    const local = notes.filter(n => !n.id);
    if (local.length) {
      const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: local.map(n => ({ key: n.key, kind: n.kind, body: n.body })) }) });
      server.push(...(r.ok ? (await r.json()).notes.map(fromServer) : local));
    }
    notes = server;
    saveLocal();
    syncEl.textContent = 'Synced with your account: the same on your phone and computer.';
  } catch (e) { syncEl.textContent = 'Offline: kept in this browser for now.'; }
  renderSession(); renderNotebook(); paintBars(); showFiles(false);
}
function setMark(key, mark) {
  if (marks[key] === mark) delete marks[key]; else marks[key] = mark;
  saveLocal();
  if (ON_BRAIN) fetch(MARKS_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, mark: marks[key] ?? null, note: null }) })
    .catch(() => { syncEl.textContent = 'Offline: the mark is kept in this browser.'; });
}

/* ---------- Notes ---------- */
const noteRef = n => n.id || n.localId;
const notesOf = key => notes.filter(n => n.key === key);
async function addNote(key, kind, body) {
  const text = body.trim();
  if (!text) return;
  const n = { localId: `l${Date.now()}`, key, kind, body: text, answer: null, readAt: null, createdAt: new Date().toISOString() };
  notes.push(n); saveLocal(); paintNotes();
  if (!ON_BRAIN) return;
  try {
    const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: [{ key, kind, body: text }] }) });
    if (!r.ok) throw new Error();
    Object.assign(n, fromServer((await r.json()).notes[0])); delete n.localId; saveLocal();
  } catch (e) { syncEl.textContent = 'Could not save the note to your account; it is kept in this browser.'; }
}
function editNote(ref, kind, body) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n || !body.trim()) return;
  n.kind = kind; n.body = body.trim(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, body: n.body }) })
    .then(r => { if (!r.ok) throw new Error(); syncEl.textContent = 'Note changed.'; })
    .catch(() => { syncEl.textContent = 'Could not save the change to your account; it is kept in this browser.'; });
}
function deleteNote(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  notes = notes.filter(x => x !== n); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'DELETE' }).catch(() => {});
}
function markRead(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  n.readAt = new Date().toISOString(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ read: true }) }).catch(() => {});
}
const KIND = { question: 'Question', comment: 'Note' };
function noteHtml(n) {
  const done = n.kind !== 'question' || (n.answer && n.readAt);
  return `<div class="note${done ? ' done' : ''}" data-kind="${n.kind}" data-ref="${esc(noteRef(n))}">
    <div class="note-head"><span class="note-kind">${KIND[n.kind]}</span><span class="tools"><button type="button" class="n-edit" aria-label="Edit">✎ Edit</button><button type="button" class="n-del" aria-label="Delete">×</button></span></div>
    <div class="note-body">${boldHtml(esc(n.body))}</div>
    ${n.answer ? `<div class="answer"><span class="note-kind">Answer</span><div class="note-body"${n.id ? ` data-hl="llms|ans|${esc(n.id)}"` : ''}>${boldHtml(esc(n.answer))}</div>${n.readAt ? '' : '<button type="button" class="read">Got it, mark read</button>'}</div>` : ''}
  </div>`;
}
function editorHtml(kind, body) {
  return `<div class="editor" data-kind="${kind}"><div class="kinds" role="radiogroup" aria-label="Kind of note">${Object.entries(KIND).map(([k, l]) => `<button type="button" role="radio" data-kind="${k}" aria-checked="${k === kind}">${l}</button>`).join('')}</div>
    <textarea rows="3" maxlength="2000" aria-label="Your note" placeholder="Write your question or comment">${esc(body)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
/* Asked for 2026-11-08: "all the questions should be in a closed tab by default, so it doesn't make the whole
   lecture longer. I can just open and close them beneath each box." Open stays open while you read; a new
   answer opens its fold. */
const notesOpen = new Set();
function notesFold(key, list) {
  if (!list.length) return '';
  const fresh = list.some(n => n.answer && !n.readAt);
  return `<details class="notes-fold"${notesOpen.has(key) || fresh ? ' open' : ''}><summary>${list.length === 1 ? '1 question or comment' : `${list.length} questions and comments`}${fresh ? ' <span class="new">· new answer</span>' : ''}</summary><div class="notes-in">${list.map(noteHtml).join('')}</div></details>`;
}
document.addEventListener('toggle', e => {
  const f = e.target;
  if (!f.classList?.contains('notes-fold')) return;
  const key = f.closest('[data-key]')?.dataset.key;
  if (key) { if (f.open) notesOpen.add(key); else notesOpen.delete(key); }
}, true);
function paintNotes() {
  paintBoxes();
  for (const card of document.querySelectorAll('.card, .ex[data-key], .ess-item')) {
    const list = notesOf(card.dataset.key);
    card.querySelector('.notes').innerHTML = notesFold(card.dataset.key, list);
    const b = card.querySelector('.note-btn');
    b.setAttribute('aria-pressed', String(list.length > 0));
    b.textContent = list.length ? `Question or comment · ${list.length}` : 'Question or comment';
  }
  renderNotebook();
  applyHighlights();
}
/* ---------- Your own boxes ----------
 * Asked for 2026-11-05: "add ability to create new boxes, so I can write a new box and give it a title".
 * A box is one note under llms|box|, so it never shows in the notepad: the first line is its title,
 * the rest its text. A new box's unsaved words stay in this browser until it is saved or cancelled. */
const BOX_PREFIX = 'llms|box|';
const boxKey = (n, gi) => `${BOX_PREFIX}s${n}|g${gi}`;
const boxParts = body => { const at = body.indexOf('\n'); return at < 0 ? [body, ''] : [body.slice(0, at), body.slice(at + 1)]; };
const boxDrafts = () => readStore('llms-box-drafts', {});
function setBoxDraft(key, draft) {
  const all = boxDrafts();
  if (draft) all[key] = draft; else delete all[key];
  writeStore('llms-box-drafts', all);
}
function ownBoxHtml(n, part) {
  const [title, words] = boxParts(n.body);
  return `<article class="own-box" data-ref="${esc(noteRef(n))}"><h3><span>${esc(title)}</span><span class="part-tag">${esc(part)}</span><span class="tools"><button type="button" class="box-edit" aria-label="Edit">✎</button><button type="button" class="box-del" aria-label="Delete">×</button></span></h3>${words ? `<div class="words">${boldHtml(esc(words))}</div>` : ''}</article>`;
}
function boxEditorHtml(title, words, ref) {
  return `<div class="box-editor"${ref ? ` data-ref="${esc(ref)}"` : ''}><input type="text" maxlength="120" aria-label="Title of the box" placeholder="Title" value="${esc(title)}">
    <textarea rows="4" maxlength="1870" aria-label="What the box says" placeholder="Write here">${esc(words)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
function paintBoxes() {
  for (const wrap of document.querySelectorAll('.own-boxes')) {
    if (wrap.querySelector('.box-editor')) continue;
    wrap.innerHTML = `${notesOf(wrap.dataset.boxKey).map(n => ownBoxHtml(n, wrap.dataset.part)).join('')}<button type="button" class="box-add">+ New box</button>`;
  }
}
document.addEventListener('click', async e => {
  const t = e.target, wrap = t.closest('.own-boxes');
  if (!wrap) return;
  const key = wrap.dataset.boxKey, own = t.closest('.own-box'), ed = t.closest('.box-editor');
  const openEditor = wrap.querySelector('.box-editor');
  if (t.closest('.box-add')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const draft = boxDrafts()[key] || { title: '', words: '' };
    t.closest('.box-add').insertAdjacentHTML('beforebegin', boxEditorHtml(draft.title, draft.words));
    t.closest('.box-add').remove();
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-edit')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const n = notes.find(x => noteRef(x) === own.dataset.ref);
    if (!n) return;
    own.outerHTML = boxEditorHtml(...boxParts(n.body), noteRef(n));
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-del')) {
    const b = t.closest('.box-del');
    if (b.dataset.armed) { deleteNote(own.dataset.ref); return; }
    b.dataset.armed = '1'; b.textContent = 'Delete?'; b.classList.add('armed');
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if (ed && t.closest('.cancel')) {
    if (!ed.dataset.ref) setBoxDraft(key, null);
    ed.remove(); paintBoxes();
    return;
  }
  if (ed && t.closest('.save')) {
    const input = ed.querySelector('input'), title = input.value.trim(), words = ed.querySelector('textarea').value.trim();
    if (!title) { input.setAttribute('aria-invalid', 'true'); input.placeholder = 'Give the box a title'; input.focus(); return; }
    const body = words ? `${title}\n${words}` : title, ref = ed.dataset.ref;
    if (!ref) setBoxDraft(key, null);
    ed.remove();
    if (ref) { editNote(ref, 'comment', body); return; }
    await addNote(key, 'comment', body);
    paintBoxes();
  }
});
document.addEventListener('input', e => {
  const ed = e.target.closest('.box-editor');
  if (ed && !ed.dataset.ref) setBoxDraft(ed.closest('.own-boxes').dataset.boxKey, { title: ed.querySelector('input').value, words: ed.querySelector('textarea').value });
});
// One handler for every card and the notepad's list.
document.addEventListener('click', e => {
  const t = e.target;
  const k = t.closest('.editor .kinds [data-kind]');
  if (k) { const ed = k.closest('.editor'); ed.dataset.kind = k.dataset.kind; for (const b of ed.querySelectorAll('.kinds button')) b.setAttribute('aria-checked', String(b === k)); return; }
  const host = t.closest('.card, .ex[data-key], .ess-item, .nb-group');
  if (!host) return;
  const m = t.closest('.mark');
  if (m) {
    setMark(host.dataset.key, m.dataset.mark);
    const v = marks[host.dataset.key] || '';
    // A summary idea is on the page twice (the pill at the start and the lecture's end): both follow.
    for (const h of document.querySelectorAll(`[data-key="${CSS.escape(host.dataset.key)}"]`)) {
      if (!h.querySelector('.marks')) continue;
      h.dataset.mark = v;
      for (const b of h.querySelectorAll('.mark')) b.setAttribute('aria-pressed', String(b.dataset.mark === v));
    }
    paintBars(); renderMap();
    return;
  }
  if (t.closest('.note-btn')) {
    host.querySelector('.editor')?.remove();
    host.querySelector('.notes').insertAdjacentHTML('afterend', editorHtml('question', ''));
    host.querySelector('.editor textarea').focus();
    return;
  }
  const note = t.closest('.note');
  if (note && t.closest('.n-edit')) {
    const n = notes.find(x => noteRef(x) === note.dataset.ref);
    note.insertAdjacentHTML('afterend', editorHtml(n.kind, n.body));
    note.nextElementSibling.dataset.ref = note.dataset.ref;
    note.hidden = true;
    note.nextElementSibling.querySelector('textarea').focus();
    return;
  }
  if (note && t.closest('.n-del')) {
    const b = t.closest('.n-del');
    if (b.dataset.armed) { deleteNote(note.dataset.ref); return; }
    b.dataset.armed = '1'; b.textContent = 'Delete?'; b.classList.add('armed');
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if (note && t.closest('.read')) { markRead(note.dataset.ref); return; }
  const ed = t.closest('.editor');
  if (ed && t.closest('.save')) {
    const body = ed.querySelector('textarea').value;
    ed.remove();
    notesOpen.add(host.dataset.key);
    if (ed.dataset.ref) editNote(ed.dataset.ref, ed.dataset.kind, body); else addNote(host.dataset.key, ed.dataset.kind, body);
    paintNotes();
    return;
  }
  if (ed && t.closest('.cancel')) { ed.remove(); paintNotes(); }
});

const TERMS = /\b(residual plots?|residuals?|RMSE|MSE|MAE|gradient descent|gradients?|learning rate|overfitting|underfitting|baseline|data leakage|leakage|least squares|validation set|test set|training set|outliers?|standardis(?:e|ed|ing)|supervised learning|unsupervised learning|reinforcement learning|self-supervised learning|deep learning|classification|clustering|observations?|categorical|labelled|cross-validation|k-fold|leave-one-out|folds?|regularisation|ridge|lasso|logistic regression|sigmoid|log-loss|log-odds|thresholds?|confusion matrix|false positives?|false negatives?|precision-recall curve|precision|recall|F1|ROC-AUC|ROC curve|positive class|decision boundary|stratified|class weights?|imbalanced|accuracy|hyperparameters?|grid search|interactions?)\b/gi;
// No letters to explain on this page: each formula has its own "What each piece means".
const LETTERS = {};
const CODE_TOKENS = /\bLogisticRegression\b|\.predict_proba\b|\bconfusion_matrix\b|\broc_curve\b|\broc_auc_score\b|\bprecision_recall_curve\b|\blog_loss\b|\bstratify=|\bclass_weight=|\bneg_mean_squared_error\b|\bKFold\b|\bLeaveOneOut\b|\bcross_val_score\b|\bvalidation_curve\b|\bGridSearchCV\b|\bPolynomialFeatures\b|\bStandardScaler\b|\bmake_pipeline\b|\bRidge\b|\bLasso\b|\btrain_test_split\b|\btest_size=|\bLinearRegression\b|\bDummyRegressor\b|\bmean_squared_error\b|\.fit\b|\.predict\b|\.coef_|\.intercept_|\bRMSE\b|\bMSE\b|\bMAE\b|R²|η|\.hist\b|\.scatter\b|\.bar\b|\.plot\b|\bboxplot\b|\.subplots\b|\.savefig\b|\bvalue_counts\b|\bgroupby\b|\.describe\b/g;
const codeKey = m => m.replace(/^\./, '').replace(/[()=]+$/, '');
const symbolize = escaped => escaped.replace(CODE_TOKENS, m => (PEEK_TERM[codeKey(m)] ? `<span class="kw" data-kw="${codeKey(m)}">${m}</span>` : m));
const letterSpan = (key, shown) => `<span class="kw kw-v" data-kw="${key}">${shown}</span>`;
// Words in prose open their cheat-sheet line; text between backticks is code.
function kwText(s) { return esc(s).split(/`([^`]+)`/).map((p, i) => (i % 2 ? `<code>${symbolize(p)}</code>` : p.replace(TERMS, m => `<span class="kw-t" data-kw="${m.toLowerCase()}">${m}</span>`))).join(''); }
// A code box: calls get their peeks, comments go quiet.
function mathHtml(s) { return symbolize(esc(s)).replace(/(^|[ \t])(# [^\n]*)/gm, '$1<span class="cmt">$2</span>'); }
function readsHtml(r) {
  return `<div class="reads"><p class="flow-label">What each piece means</p><dl>${r.parts.map(([sym, say]) => `<div><dt>${mathHtml(sym)}</dt><dd>${kwText(say)}</dd></div>`).join('')}</dl></div>${r.walk ? `<div class="walk"><p class="flow-label">Worked out, step by step</p><p>${kwText(r.walk.intro)}</p><dl class="steps"><div class="steps-head"><dt>The piece</dt><dd>Gives</dd></div>${r.walk.steps.map(([piece, nums, result]) => `<div${result ? ' class="result"' : ''}><dt>${mathHtml(piece)}</dt><dd>${mathHtml(nums)}</dd></div>`).join('')}</dl></div>` : ''}`;
}
const PARA = String.fromCharCode(10, 10);
const paras = t => t.split(PARA).map(p => `<p>${kwText(p)}</p>`).join('');
// A rule in a list: its first sentence is its title, the rest says when it holds and when it fails.
function ruleHtml(r) {
  const at = r.search(/\.\s/);
  return at < 0 ? `<li>${kwText(r)}</li>` : `<li><b>${kwText(r.slice(0, at + 1))}</b><span>${kwText(r.slice(at + 2))}</span></li>`;
}
/* Asked for 2026-11-24: "connect it to the exercise in this notebook". An exercise task lists the lecture cards it
 * practises (`uses`); each of those cards links back to the tasks, so the two directions always agree. */
function linksHtml(s, c) {
  const cards = s.groups.flatMap(g => g.cards);
  const go = x => `<button type="button" class="ref-go" data-go="${esc(cardKey(s.n, x.id))}">${esc(x.num.split('.')[1])} · ${esc(x.name)} ›</button>`;
  const used = cards.filter(x => c.uses?.includes(x.id));
  const by = cards.filter(x => x.uses?.includes(c.id));
  return (used.length ? `<p class="links"><b>The lecture cards it practises</b>${used.map(go).join('')}</p>` : '')
    + (by.length ? `<p class="links"><b>Practised in the exercise</b>${by.map(go).join('')}</p>` : '');
}
function cardHtml(s, c, gi) {
  const key = cardKey(s.n, c.id), m = marks[key] || '';
  const r = READS[`${s.n}|${c.id}`], x = c.more || {};

    ${x.html ? x.html() : ''}

    ${c.watch ? `<p class="watch"><b>Watch out</b>${kwText(c.watch)}</p>` : ''}

      ${marksHtml(m)}</div>
  </article>`;
}

/* Asked for 2026-11-19: "a system for bold that works well, like all the notebooks in colourbrain". The write box
   is rich: B, Ctrl/Cmd+B or **two stars** show bold at once. Its value is still plain text, bold as **…**, so notes
   stay the same everywhere they are shown. */
function richText(root) {
  let out = '';
  const walk = (node, bold) => {
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out += n.nodeValue.replace(/ /g, ' '); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName;
      if (tag === 'BR') { out += '\n'; continue; }
      const block = tag === 'DIV' || tag === 'P';
      if (block && out && !out.endsWith('\n')) out += '\n';
      const b = !bold && (tag === 'B' || tag === 'STRONG' || Number(n.style?.fontWeight) >= 600 || n.style?.fontWeight === 'bold');
      if (b) {
        const start = out.length;
        walk(n, true);
        const inner = out.slice(start);
        const lead = inner.match(/^\s*/)[0], trail = inner.slice(lead.length).match(/\s*$/)[0], core = inner.trim();
        out = out.slice(0, start) + (core ? `${lead}**${core}**${trail}` : inner);
      } else walk(n, bold);
    }
  };
  walk(root, false);
  return out.replace(/\u200b/g, '').replace(/\*\*\*\*/g, '').replace(/\n+$/, '');
}

/* ---------- Your slides: the session decks ----------
   The decks are the teacher's material, so they stay out of this public page: each user uploads them once
   to their private folder (the same one as the Python page's slides), and each card's "Slide n ›" opens
   them. A deck is filed as LLMs<session>.pdf: one whose name says Linear Regression, slides2 or session 2
   becomes LLMs2.pdf; Cross-Validation, slides3 or session 3 becomes LLMs3.pdf; Logistic Regression, Classification, slides4
   or session 4 becomes LLMs4.pdf; one that says Introduction,
   slides1 or session 1 becomes LLMs1.pdf. */
const DECK_FILES = SESSIONS.map(s => `LLMs${s.n}.pdf`);
function deckName(name) {
  if (!/\.pdf$/i.test(name)) return null;
  let file = null;

  if (/linear[\s_-]*regression/i.test(name)) file = 'LLMs2.pdf';
  else if (/cross[\s_-]*validation|regularisation/i.test(name)) file = 'LLMs3.pdf';
  else if (/logistic|classification/i.test(name)) file = 'LLMs4.pdf';
  else if (m) file = `LLMs${Number(m[1])}.pdf`;

}
let filesUp = null;
async function showFiles(force) {
  if (!ON_BRAIN) return;
  const box = document.getElementById('files');
  if (filesUp === null) {
    try { const r = await fetch('/api/coding/slides'); filesUp = r.ok ? (await r.json()).uploaded.filter(f => DECK_FILES.includes(f)) : []; } catch (e) { filesUp = []; }
  }
  const missing = DECK_FILES.filter(f => !filesUp.includes(f));
  if (!missing.length && !force) { box.hidden = true; return; }
  box.innerHTML = `<span><b>Slides:</b> ${filesUp.length} of ${DECK_FILES.length} decks uploaded${missing.length ? ` (missing: Session ${missing.map(f => f.match(/\d+/)[0]).join(', ')})` : ''}. Pick the session PDFs, for example the Linear Regression deck from Downloads. They stay private to you.</span>
    <label class="files-up">Upload slides<input type="file" id="files-input" accept=".pdf,application/pdf" multiple></label>

  const skipped = [];
  let done = 0;
  for (const f of picked) {
    const name = deckName(f.name);
    if (!name) { skipped.push(/\.pptx?$/i.test(f.name) ? `${f.name} (a PowerPoint: pick the PDF instead)` : f.name); continue; }
    status.textContent = `Uploading ${f.name} as ${name}…`;
    const form = new FormData();
    form.append('file', new File([f], name, { type: 'application/pdf' }));
    try {
      const r = await fetch('/api/coding/slides', { method: 'POST', body: form });
      if (r.ok) done++; else skipped.push(`${f.name} (${(await r.json().catch(() => ({}))).error || r.status})`);
    } catch (err) { skipped.push(`${f.name} (offline)`); }
  }
  filesUp = null;
  await showFiles(true);
  document.getElementById('files-status').textContent = `${done} uploaded.${skipped.length ? ` Not uploaded: ${skipped.join('; ')}.` : ''}`;

  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  ta.focus();
  if (v.slice(a - 2, a) === '**' && v.slice(b, b + 2) === '**') {
    ta.setSelectionRange(a - 2, b + 2);
    if (!document.execCommand('insertText', false, v.slice(a, b))) ta.setRangeText(v.slice(a, b), a - 2, b + 2, 'end');
    ta.setSelectionRange(a - 2, b - 2);
  } else {
    const inner = v.slice(a, b);
    if (!document.execCommand('insertText', false, `**${inner}**`)) ta.setRangeText(`**${inner}**`, a, b, 'end');
    ta.setSelectionRange(a + 2, b + 2);
  }
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
const boldBtn = document.createElement('button');
boldBtn.type = 'button';
boldBtn.className = 'bold-btn';
boldBtn.textContent = 'B';
boldBtn.title = 'Bold (Ctrl+B)';
boldBtn.setAttribute('aria-label', 'Bold');
boldBtn.hidden = true;
document.body.append(boldBtn);
let boldFor = null;
function placeBold() {
  if (!boldFor || !boldFor.isConnected) { boldBtn.hidden = true; return; }
  const r = boldFor.getBoundingClientRect();
  boldBtn.style.top = `${r.top + 5}px`;
  boldBtn.style.left = `${r.right - 33}px`;
  boldBtn.hidden = r.bottom < 0 || r.top > innerHeight;
}
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches(NOTE_BOX)) { boldFor = e.target; placeBold(); } });
document.addEventListener('focusout', e => { if (e.target === boldFor) setTimeout(() => { if (document.activeElement !== boldFor) { boldFor = null; boldBtn.hidden = true; } }, 0); });
addEventListener('scroll', () => { if (boldFor) placeBold(); }, { passive: true, capture: true });
addEventListener('resize', () => { if (boldFor) placeBold(); });
document.addEventListener('input', e => { if (e.target === boldFor) placeBold(); });
boldBtn.addEventListener('mousedown', e => e.preventDefault());
boldBtn.addEventListener('click', () => { if (boldFor) toggleBold(boldFor); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'b' && e.target.matches && e.target.matches(NOTE_BOX)) { e.preventDefault(); toggleBold(e.target); }
});

/* ---------- The map: where you are ----------
   Asked for 2026-11-05: "a system that helps me know where I am, like a dot on the left that tells me
   this is segment 2 of Lecture 3, and I see the segments of Lecture 3, or the segments of Lecture 1 or 2",
   then "a vertical pill that opens, a column with the stacks of the segments that can be opened and closed".
   Closed: a pill on the left, one dot per segment in its colour, the current one larger with its number.
   Open: one stack per lecture, each with its segments in their colours; a segment opens to its cards.
   Moving through the page opens the segment you enter and closes the one you left. Opening anything
   else moves nothing: only the arrow, a card, or a row with nothing to open takes you there. */
const mapEl = document.getElementById('map');
const mapPill = document.getElementById('map-pill');
const PILL_LOOKS = ['bar', 'line', 'steps', 'gauge'];
let pillLook = 'bar';
try { const v = localStorage.getItem('llms-pill-look'); if (PILL_LOOKS.includes(v)) pillLook = v; } catch (e) {}
// Whether the page leaves room beside it: the boxes grow with the text size.
const MAP_WIDE = { get matches() { return document.documentElement.classList.contains('map-wide'); } };
function fitLayout() {
  const room = innerWidth - 760 * readSize();
  const root = document.documentElement, was = root.classList.contains('map-wide');
  root.classList.toggle('map-wide', room >= 480);
  root.classList.toggle('pill-edge', room <= 140);
  return was !== root.classList.contains('map-wide');
}
const mapOpenL = new Set(), mapOpenS = new Set();
let mapLecture = null, mapPlace = { seg: null, card: null };
function segsOf(s) {
  return [{ key: 'pic', name: 'The picture' },
    ...s.groups.map((g, gi) => ({ key: `g${gi}`, name: g.name, h: segHue(gi), cards: g.cards })),
    { key: 'practice', name: 'Practice', h: segHue(s.groups.length) }, { key: 'recap', name: 'Summary', h: segHue(s.groups.length + 1) }];
}
function findPlace() {
  let seg = null, card = null;
  const segEls = [...document.querySelectorAll('#session [data-seg]')];
  for (const el of segEls) if (!seg || el.getBoundingClientRect().top <= 110) seg = el.dataset.seg;
  // The last segment can be too short to reach the top: at the end of the lecture, you are in it.
  if (segEls.length && document.getElementById('session').getBoundingClientRect().bottom <= innerHeight) seg = segEls[segEls.length - 1].dataset.seg;
  if (seg) card = [...document.querySelectorAll(`#session [data-seg="${seg}"] .card`)].find(c => c.getBoundingClientRect().bottom > 110)?.id || null;
  return { seg, card };
}
function placeText() {
  const s = SESSIONS.find(x => x.n === current);
  if (!s) return 'Cheat sheet';
  const all = segsOf(s), at = all.find(x => x.key === mapPlace.seg), num = all.filter(x => x.key !== 'pic'), i = num.indexOf(at);
  // Where you are in the deck: the slide of the card you are reading, out of the lecture's length.
  const card = mapPlace.card && s.groups.flatMap(g => g.cards).find(c => `c-${s.n}-${c.id}` === mapPlace.card);
  const slide = card?.slide ? ` · Slide ${card.slide}/${s.pages}` : '';
  return i < 0 ? `Session ${current} · ${at ? at.name : ''}` : `Session ${current} · Part ${i + 1} of ${num.length}${slide} · ${at.name}`;
}
const hueStyle = x => x.h === undefined ? '' : ` style="--h: ${x.h.toFixed(0)}"`;
// The pinned label and the closed pill.
function paintPlace() {
  const s = SESSIONS.find(x => x.n === current), text = placeText();
  mapPill.setAttribute('aria-label', `${text}. Open the map`);
  mapPill.title = `${text}. Double-click to change its look.`;
  if (!s) { mapPill.innerHTML = '<b>≡</b>'; return; }
  const all = segsOf(s), at = all.find(x => x.key === mapPlace.seg);
  const i = all.indexOf(at), num = all.filter(x => x.key !== 'pic'), part = num.indexOf(at);
  let k = 0;
  mapPill.innerHTML = `<b>S${s.n}</b><span class="ln">${all.map((x, j) => `<i class="${j < i ? 'past' : j === i ? 'here' : ''}" data-n="${x.key === 'pic' ? '·' : ++k}"></i>`).join('')}</span>${part < 0 ? '' : `<span class="pn">${part + 1}<span class="of">/${num.length}</span></span>`}`;
  mapPill.dataset.look = pillLook;
  const where = document.getElementById('where-btn');
  if (where) {
    where.textContent = text;
    where.parentElement.style.setProperty('--h', at?.h === undefined ? '' : at.h.toFixed(0));
    where.classList.toggle('tinted', at?.h !== undefined);
  }
}
function renderMap() {
  if (mapEl.hidden) return;
  const stack = s => {
    const lit = s.n === current, open = mapOpenL.has(s.n);
    let n = 0;
    return `<div class="map-stack${lit ? ' in' : ''}"><button type="button" class="map-l" data-l="${s.n}" aria-expanded="${open}"><b>Session ${s.n}</b><span>${esc(s.short)}</span><span class="map-chev" style="flex:none">›</span></button>
      ${open ? `<ol class="map-segs">${segsOf(s).map(x => {
        if (x.key !== 'pic') n++;
        const here = lit && mapPlace.seg === x.key, id = `${s.n}|${x.key}`, up = mapOpenS.has(id);
        const label = `<span class="map-n">${x.key === 'pic' ? '' : n}</span><span class="t">${esc(x.name)}${here ? '<em>you are here</em>' : ''}</span>`;
        return `<li class="map-s${x.h === undefined ? ' plain' : ''}${here ? ' here' : ''}"${hueStyle(x)}>${x.cards
          ? `<div class="map-row"><button type="button" class="map-name" data-seg-toggle="${id}" aria-expanded="${up}">${label}<span class="map-chev">›</span></button><button type="button" class="map-go" data-s="${s.n}" data-to="${x.key}" aria-label="Go to ${esc(x.name)}" title="Go to this segment">→</button></div>
            ${up ? `<ol class="map-cards">${x.cards.map(c => `<li><button type="button" data-s="${s.n}" data-card="c-${s.n}-${c.id}"${lit && mapPlace.card === `c-${s.n}-${c.id}` ? ' class="on"' : ''}><b${marks[cardKey(s.n, c.id)] ? ` class="m-${marks[cardKey(s.n, c.id)]}"` : ''}>${c.num.split('.')[1]}</b>${esc(c.name)}</button></li>`).join('')}</ol>` : ''}`
          : `<div class="map-row"><button type="button" class="map-name" data-s="${s.n}" data-to="${x.key}">${label}<span class="map-go" style="width:auto;padding-right:10px">→</span></button></div>`}</li>`;
      }).join('')}</ol>` : ''}</div>`;
  };
  mapEl.innerHTML = `<div class="map-top"><span>Where you are</span><button type="button" class="map-close" aria-label="Close the map">×</button></div>
    <p class="map-now">${esc(placeText())}</p>${SESSIONS.map(stack).join('')}<button type="button" class="map-ref" data-goref>Cheat sheet</button>`;
}
function mapKeepInView() {
  const on = mapEl.querySelector('.map-cards .on') || mapEl.querySelector('.map-s.here');
  if (!on) return;
  const a = on.getBoundingClientRect(), b = mapEl.getBoundingClientRect();
  if (a.top < b.top + 8) mapEl.scrollTop -= b.top + 8 - a.top;
  else if (a.bottom > b.bottom - 8) mapEl.scrollTop += a.bottom - b.bottom + 8;
}
function setMap(open, remember) {
  mapEl.hidden = !open;
  mapPill.hidden = open;
  mapPill.setAttribute('aria-expanded', String(open));
  if (remember) { try { localStorage.setItem('llms-map-open', open ? '1' : ''); } catch (e) {} }
  if (open) { renderMap(); mapKeepInView(); }
}
const followSeg = seg => { if (seg) mapOpenS.add(`${current}|${seg}`); };
function mapFollow() {
  const p = findPlace();
  if (p.seg === mapPlace.seg && p.card === mapPlace.card) return;
  if (p.seg !== mapPlace.seg) { mapOpenS.delete(`${current}|${mapPlace.seg}`); followSeg(p.seg); }
  mapPlace = p;
  paintPlace();
  renderMap();
  if (!mapEl.hidden) mapKeepInView();
}
// After every redraw of the page. A new lecture starts with only that lecture open.
function mapRefresh() {
  mapPlace = findPlace();
  if (current !== mapLecture && !isTab(current)) {
    mapLecture = current;
    mapOpenL.clear(); mapOpenS.clear();
    mapOpenL.add(current);
    followSeg(mapPlace.seg);
  }
  paintPlace();
  renderMap();
}
function mapGo(lecture, seg, cardId) {
  if (lecture !== current) document.querySelector(`.sess[data-s="${lecture}"]`).click();
  const el = cardId ? document.getElementById(cardId) : document.querySelector(`#session [data-seg="${seg}"]`);
  if (!MAP_WIDE.matches) setMap(false);
  el?.scrollIntoView({ block: 'start' });
  mapFollow();
}
mapEl.addEventListener('click', e => {
  if (e.target.closest('.map-close')) { setMap(false, MAP_WIDE.matches); return; }
  const l = e.target.closest('[data-l]');
  if (l) {
    const n = Number(l.dataset.l);
    if (!mapOpenL.delete(n)) mapOpenL.add(n);
    renderMap();
    return;
  }
  const t = e.target.closest('[data-seg-toggle]');
  if (t) {
    const id = t.dataset.segToggle;
    if (!mapOpenS.delete(id)) mapOpenS.add(id);
    renderMap();
    return;
  }
  if (e.target.closest('[data-goref]')) { document.querySelector('.sess[data-s="ref"]').click(); if (!MAP_WIDE.matches) setMap(false); return; }
  const c = e.target.closest('[data-card]');
  if (c) { mapGo(Number(c.dataset.s), null, c.dataset.card); return; }
  const g = e.target.closest('[data-to]');
  if (g) mapGo(Number(g.dataset.s), g.dataset.to);
});
let pillTimer = 0;
mapPill.addEventListener('click', e => {
  clearTimeout(pillTimer);
  if (e.detail >= 2) {
    pillLook = PILL_LOOKS[(PILL_LOOKS.indexOf(pillLook) + 1) % PILL_LOOKS.length];
    try { localStorage.setItem('llms-pill-look', pillLook); } catch (err) {}
    paintPlace();
    return;
  }
  pillTimer = setTimeout(() => setMap(true, MAP_WIDE.matches), 260);
});
document.getElementById('session').addEventListener('click', e => { if (e.target.closest('#where-btn, .seg-tab')) setMap(true, MAP_WIDE.matches); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mapEl.hidden) setMap(false, MAP_WIDE.matches); });
document.addEventListener('click', e => {
  if (mapEl.hidden || MAP_WIDE.matches) return;
  const path = e.composedPath();
  if (!path.includes(mapEl) && !path.includes(mapPill) && !e.target.closest?.('#where-btn, .seg-tab')) setMap(false);
});
let mapTimer = 0;
addEventListener('scroll', () => { clearTimeout(mapTimer); mapTimer = setTimeout(mapFollow, 60); }, { passive: true });
const mapFit = () => { let open = false; try { open = localStorage.getItem('llms-map-open') === '1'; } catch (e) {} setMap(MAP_WIDE.matches && open); };
addEventListener('resize', () => { if (fitLayout()) mapFit(); });

/* ---------- Text size ----------
   Asked for 2026-11-05: "on the notepad, a button to define the size of the letters, so I can increase it
   when my eyes are tired; it can also open the horizontal space of the boxes so they expand with the type". */
const SIZES = [1, 1.1, 1.2, 1.35, 1.5];
function paintSize() {
  const now = readSize();
  document.getElementById('size-now').textContent = `${Math.round(now * 100)}%`;
  document.getElementById('size-down').disabled = now <= SIZES[0];
  document.getElementById('size-up').disabled = now >= SIZES[SIZES.length - 1];
}
function setSize(step) {
  const i = SIZES.indexOf(readSize());
  const next = SIZES[Math.min(SIZES.length - 1, Math.max(0, (i < 0 ? 0 : i) + step))];
  // Stay on the same card: everything above it changes height.
  const keep = document.getElementById(findPlace().card) || document.querySelector('#session [data-seg]');
  const top = keep?.getBoundingClientRect().top;
  document.documentElement.style.setProperty('--read', next);
  try { localStorage.setItem('llms-text-size', String(next)); } catch (e) {}
  paintSize();
  if (fitLayout()) mapFit();
  if (keep) scrollBy(0, keep.getBoundingClientRect().top - top);
  drawPeekLinks();
}
document.getElementById('size-down').addEventListener('click', () => setSize(-1));
document.getElementById('size-up').addEventListener('click', () => setSize(1));

/* ---------- Theme, first drawing ---------- */
const themeBtn = document.getElementById('theme');
const paintTheme = () => { const night = document.documentElement.dataset.theme === 'night'; themeBtn.textContent = night ? '☀ Day' : '☾ Night'; };
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('school-theme', next); } catch (e) {}
  paintTheme();
});
paintTheme();
renderTabs();
fitLayout();
paintSize();
renderSession();
mapFit();
load();
// Deep links: #s-2 opens a session, #c-2-mse a card, #c-2-ex-l2-e1 an exercise.
function followHash() {
  let h = '';
  try { h = decodeURIComponent(location.hash); } catch (e) { return; }
  const m = /^#(?:s-(\d+)|c-(\d+)-(.+))$/.exec(h);
  if (!m) return;
  if (m[1]) { const tab = document.querySelector(`.sess[data-s="${m[1]}"]`); if (tab && Number(m[1]) !== current) tab.click(); return; }
  goTo(cardKey(Number(m[2]), m[3]));
}
followHash();
addEventListener('hashchange', followHash);
</script>
