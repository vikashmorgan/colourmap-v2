/* ---------- Keyword peek ----------
   Asked for 2026-10-19: "when I hover on AS for a second it opens the box of AS on the side;
   same for CASE WHEN or other similar functions". Hover a keyword in any query (or written in
   capitals in a card) for 0.6 s, or tap it on a phone: its cheat-sheet line opens in a box at
   the side, with the link to its card. Escape, × or a click elsewhere closes it. */
const PEEK_TERM = {
  SELECT: 'SELECT … FROM', FROM: 'SELECT … FROM', AS: 'AS', DISTINCT: 'DISTINCT', LIMIT: 'LIMIT n',
  WHERE: 'WHERE', AND: 'AND  OR  NOT', OR: 'AND  OR  NOT', NOT: 'AND  OR  NOT', BETWEEN: 'BETWEEN a AND b',
  IN: 'IN (…)  NOT IN (…)', 'NOT IN': 'IN (…)  NOT IN (…)', LIKE: 'LIKE  %  _', IS: 'IS NULL  IS NOT NULL', NULL: 'IS NULL  IS NOT NULL', 'IS NULL': 'IS NULL  IS NOT NULL',
  COALESCE: 'COALESCE(x, fallback)', 'ORDER BY': 'ORDER BY … ASC | DESC', DESC: 'ORDER BY … ASC | DESC', ASC: 'ORDER BY … ASC | DESC',
  COUNT: 'COUNT(*)', SUM: 'SUM  AVG  MIN  MAX', AVG: 'SUM  AVG  MIN  MAX', MIN: 'SUM  AVG  MIN  MAX', MAX: 'SUM  AVG  MIN  MAX',
  ROUND: 'ROUND(x, n)', 'GROUP BY': 'GROUP BY', HAVING: 'HAVING', strftime: "strftime('%Y-%m', date)",
  CASE: 'CASE WHEN … THEN … ELSE … END', WHEN: 'CASE WHEN … THEN … ELSE … END', THEN: 'CASE WHEN … THEN … ELSE … END', ELSE: 'CASE WHEN … THEN … ELSE … END', END: 'CASE WHEN … THEN … ELSE … END',
  LOWER: 'LOWER(x)  UPPER(x)', UPPER: 'LOWER(x)  UPPER(x)', TRIM: 'TRIM(x)', LENGTH: 'LENGTH(x)', SUBSTR: 'SUBSTR(x, start, length)',
  JOIN: 'JOIN … ON', INNER: 'JOIN … ON', 'INNER JOIN': 'JOIN … ON', ON: 'ON a.key = b.key', LEFT: 'LEFT JOIN', 'LEFT JOIN': 'LEFT JOIN',
  RIGHT: 'RIGHT JOIN  FULL OUTER JOIN', FULL: 'RIGHT JOIN  FULL OUTER JOIN', OUTER: 'RIGHT JOIN  FULL OUTER JOIN',
  WITH: 'WITH name AS (…)', OVER: '… OVER (…)', 'PARTITION BY': 'PARTITION BY', ROW_NUMBER: 'ROW_NUMBER()', RANK: 'RANK()', DENSE_RANK: 'DENSE_RANK()',
  LAG: 'LAG(x)  LEAD(x)', LEAD: 'LAG(x)  LEAD(x)',
};
const refByTerm = term => { for (const g of REF) for (const it of g.items) if (it[0] === term) return it; return null; };
const peek = document.createElement('aside');
peek.className = 'peek';
peek.hidden = true;
peek.setAttribute('aria-label', 'Keyword');
document.body.append(peek);
let peekTimer = 0, peekWord = null;
function openPeek(word, el) {
  const it = refByTerm(PEEK_TERM[word]);
  if (!it) return;
  const [t, d, ex, n, id] = it;
  peekWord = el;
  peek.innerHTML = `<div class="peek-top"><p class="peek-term">${sqlHtml(t)}</p><button type="button" class="peek-close" aria-label="Close">×</button></div>
    <p>${esc(d)}</p>${ex ? `<pre>${sqlHtml(ex)}</pre>` : ''}
    <button type="button" class="ref-go" data-go="${esc(cardKey(n, id))}">Session ${n} · open the card ›</button>`;
  peek.hidden = false;
}
function closePeek() { peek.hidden = true; peekWord = null; clearTimeout(peekTimer); }
const peekTarget = e => e.target.closest && e.target.closest('#session .kw[data-kw], #session .kw-t');
document.addEventListener('mouseover', e => {
  const k = peekTarget(e);
  if (!k || k === peekWord || k.closest('.ref-row')) return;
  clearTimeout(peekTimer);
  peekTimer = setTimeout(() => { if (k.matches(':hover') && getSelection().isCollapsed) openPeek(k.dataset.kw, k); }, 600);
});
document.addEventListener('mouseout', e => { if (peekTarget(e)) clearTimeout(peekTimer); });
// A tap (no hover on a phone) opens it at once.
document.addEventListener('click', e => {
  if (e.target.closest('.peek-close')) { closePeek(); return; }
  const go = e.target.closest('.peek .ref-go');
  if (go) { closePeek(); goTo(go.dataset.go); return; }
  const k = peekTarget(e);
  if (k && !k.closest('.ref-row') && getSelection().isCollapsed && !k.closest('summary')) { openPeek(k.dataset.kw, k); return; }
  if (!peek.hidden && !e.target.closest('.peek')) closePeek();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !peek.hidden) closePeek(); });

/* ---------- Select a passage: highlight it, or ask about it ----------
   Asked for 2026-10-19: highlight the lessons "with the nice colour options like in
   the Python part". Select text on a card, a practice question, the recap or a
   cheat-sheet line and a bar appears: four light colours, and on a card Question and
   Comment. Highlights are kept on this device, found again by their text after every
   redraw, and removed with a tap on them. */
const HL_KEY = 'sql-highlights';
let highlights = readStore(HL_KEY, []);
const saveHighlights = () => writeStore(HL_KEY, highlights);
const HL_HOST = '.card[data-key]:not(.overall), [data-hl]';
const HL_SKIP = '.notes, .editor, .foot, .marks, .ref-go, .out-head, .more-rows, #sel-bar';
const hlKeyOf = host => host.dataset.hl || host.dataset.key;
function hlTextNodes(host) {
  const walker = document.createTreeWalker(host, NodeFilter.SHOW_TEXT, {
    acceptNode: n => (n.parentElement.closest(HL_SKIP) ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT),
  });
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  return nodes;
}
function hlOffset(nodes, container, offset) {
  let total = 0;
  for (const n of nodes) {
    if (n === container) return total + offset;
    if (container.nodeType === 1 && container.contains(n)) {
      const r = document.createRange();
      r.setStart(container, offset);
      if (r.comparePoint(n, 0) >= 0) return total;
    }
    total += n.nodeValue.length;
  }
  return total;
}
function hlWrap(host, start, end, attrs) {
  let pos = 0;
  for (const n of hlTextNodes(host)) {
    const len = n.nodeValue.length, a = Math.max(start, pos), b = Math.min(end, pos + len);
    if (a < b) {
      let mid = n;
      if (a > pos) mid = mid.splitText(a - pos);
      if (b < pos + len) mid.splitText(b - a);
      const m = document.createElement('mark');
      m.className = 'hl';
      for (const [k, v] of Object.entries(attrs)) m.dataset[k] = v;
      mid.replaceWith(m);
      m.append(mid);
    }
    pos += len;
    if (pos >= end) break;
  }
}
function hlApply(h) {
  const host = [...document.querySelectorAll(HL_HOST)].find(x => hlKeyOf(x) === h.key);
  if (!host || host.querySelector(`mark.hl[data-hid="${CSS.escape(h.id)}"]`)) return;
  const text = hlTextNodes(host).map(n => n.nodeValue).join('');
  let at = -1;
  for (let i = 0; i <= h.occ; i++) { at = text.indexOf(h.text, at + 1); if (at < 0) return; }
  hlWrap(host, at, at + h.text.length, { hid: h.id, c: h.color });
}
function applyHighlights() { highlights.forEach(hlApply); }
function hlRemove(id) {
  for (const m of document.querySelectorAll(`mark.hl[data-hid="${CSS.escape(id)}"]`)) {
    const parent = m.parentNode;
    m.replaceWith(...m.childNodes);
    parent.normalize();
  }
  highlights = highlights.filter(h => h.id !== id);
  saveHighlights();
}
const selBar = document.createElement('div');
selBar.id = 'sel-bar';
selBar.hidden = true;
selBar.setAttribute('role', 'toolbar');
selBar.setAttribute('aria-label', 'Selected passage');
document.body.append(selBar);
let selInfo = null;
function selBarAt(rect) {
  selBar.hidden = false;
  const w = selBar.offsetWidth, h = selBar.offsetHeight;
  selBar.style.left = `${Math.max(8, Math.min(rect.left + rect.width / 2 - w / 2, innerWidth - w - 8))}px`;
  const top = rect.top - h - 8 >= 8 ? rect.top - h - 8 : rect.bottom + 8;
  selBar.style.top = `${Math.max(8, Math.min(top, innerHeight - h - 8))}px`;
}
function hideSelBar() { selBar.hidden = true; selInfo = null; delete selBar.dataset.hid; }
function readSelection() {
  const sel = getSelection();
  if (!sel || sel.isCollapsed || !sel.rangeCount) return null;
  const range = sel.getRangeAt(0);
  const el = n => (n.nodeType === 1 ? n : n.parentElement);
  const a = el(range.startContainer), b = el(range.endContainer);
  if (!a || !b || a.closest('textarea, input, .editor, #sel-bar') || b.closest('textarea, input, .editor')) return null;
  const host = a.closest(HL_HOST);
  if (!host || host !== b.closest(HL_HOST)) return null;
  const nodes = hlTextNodes(host);
  const start = hlOffset(nodes, range.startContainer, range.startOffset);
  const end = hlOffset(nodes, range.endContainer, range.endOffset);
  const full = nodes.map(n => n.nodeValue).join('');
  const text = full.slice(start, end);
  if (!text.trim() || text.length > 1500) return null;
  let occ = 0, at = full.indexOf(text);
  while (at >= 0 && at < start) { occ++; at = full.indexOf(text, at + 1); }
  return { host, key: hlKeyOf(host), start, end, text, occ, rect: range.getBoundingClientRect() };
}
const HL_COLOURS = [['yellow', '#f2c14e'], ['green', '#6fbf8e'], ['blue', '#7aa6e6'], ['pink', '#e48fb4']];
function showSelBar() {
  const info = readSelection();
  if (!info) { if (!selBar.dataset.hid) hideSelBar(); return; }
  selInfo = info;
  delete selBar.dataset.hid;
  const card = info.host.classList.contains('card');
  selBar.innerHTML = HL_COLOURS.map(([c, v]) => `<button type="button" class="sb-c" data-colour="${c}" style="--hl: ${v}" title="Highlight (${c})" aria-label="Highlight in ${c}"></button>`).join('')
    + (card ? '<span class="sb-sep"></span><button type="button" class="sb-btn sb-ask" data-kind="question">Question</button><button type="button" class="sb-btn sb-ask sb-com" data-kind="comment">Comment</button>' : '');
  selBarAt(info.rect);
}
const inSelBar = e => !!(e.target.closest && e.target.closest('#sel-bar'));
document.addEventListener('mouseup', e => { if (!inSelBar(e)) setTimeout(showSelBar, 0); });
document.addEventListener('touchend', e => { if (!inSelBar(e)) setTimeout(showSelBar, 350); });
document.addEventListener('keyup', e => { if (e.shiftKey) showSelBar(); });
document.addEventListener('scroll', () => { if (!selBar.hidden) hideSelBar(); }, { passive: true, capture: true });
selBar.addEventListener('mousedown', e => e.preventDefault());
selBar.addEventListener('click', e => {
  const colour = e.target.closest('.sb-c');
  if (colour && selInfo) {
    const h = { id: `h${Date.now().toString(36)}${Math.random().toString(36).slice(2, 6)}`, key: selInfo.key, text: selInfo.text, occ: selInfo.occ, color: colour.dataset.colour };
    highlights.push(h);
    saveHighlights();
    hlWrap(selInfo.host, selInfo.start, selInfo.end, { hid: h.id, c: h.color });
    getSelection().removeAllRanges();
    hideSelBar();
    return;
  }
  const ask = e.target.closest('.sb-ask');
  if (ask && selInfo) {
    const { host, text } = selInfo;
    getSelection().removeAllRanges();
    hideSelBar();
    host.querySelector('.editor')?.remove();
    host.querySelector('.notes').insertAdjacentHTML('afterend', editorHtml(ask.dataset.kind, `“${text.trim()}” `));
    const ta = host.querySelector('.editor textarea');
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  if (e.target.closest('.sb-remove')) { hlRemove(selBar.dataset.hid); hideSelBar(); }
});
// Tap a highlight to remove it.
document.addEventListener('click', e => {
  const m = e.target.closest && e.target.closest('mark.hl');
  if (!m || !getSelection().isCollapsed) return;
  e.preventDefault();
  selBar.dataset.hid = m.dataset.hid;
  selBar.innerHTML = '<button type="button" class="sb-btn sb-remove">Remove highlight</button>';
  selBarAt(m.getBoundingClientRect());
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !selBar.hidden) hideSelBar(); });
document.addEventListener('mousedown', e => { if (e.target.closest && !e.target.closest('#sel-bar, mark.hl') && selBar.dataset.hid) hideSelBar(); });

/* ---------- Bold in notes ----------
   Asked for 2026-10-19: "mettre texte en gras" in questions and notepads. Notes stay plain text:
   bold is written **like this**, shown in bold. In any note box, the B button at its top right
   or Ctrl/Cmd+B makes the selection bold, or plain again. */
function boldHtml(html) { return html.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<b>$1</b>'); }
const NOTE_BOX = 'textarea[aria-label="Your note"]';
function toggleBold(ta) {
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  ta.focus();
  if (v.slice(a - 2, a) === '**' && v.slice(b, b + 2) === '**') {
    ta.setSelectionRange(a - 2, b + 2);
    if (!document.execCommand('insertText', false, v.slice(a, b))) ta.setRangeText(v.slice(a, b), a - 2, b + 2, 'end');
    ta.setSelectionRange(a - 2, b - 2);
  } else {
    const inner = v.slice(a, b);
    if (!document.execCommand('insertText', false, `**${inner}**`)) ta.setRangeText(`**${inner}**`, a, b, 'end');
    ta.setSelectionRange(a + 2, b + 2);
  }
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
const boldBtn = document.createElement('button');
boldBtn.type = 'button';
boldBtn.className = 'bold-btn';
boldBtn.textContent = 'B';
boldBtn.title = 'Bold (Ctrl+B)';
boldBtn.setAttribute('aria-label', 'Bold');
boldBtn.hidden = true;
document.body.append(boldBtn);
let boldFor = null;
function placeBold() {
  if (!boldFor || !boldFor.isConnected) { boldBtn.hidden = true; return; }
  const r = boldFor.getBoundingClientRect();
  boldBtn.style.top = `${r.top + 5}px`;
  boldBtn.style.left = `${r.right - 33}px`;
  boldBtn.hidden = r.bottom < 0 || r.top > innerHeight;
}
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches(NOTE_BOX)) { boldFor = e.target; placeBold(); } });
document.addEventListener('focusout', e => { if (e.target === boldFor) setTimeout(() => { if (document.activeElement !== boldFor) { boldFor = null; boldBtn.hidden = true; } }, 0); });
addEventListener('scroll', () => { if (boldFor) placeBold(); }, { passive: true, capture: true });
addEventListener('resize', () => { if (boldFor) placeBold(); });
document.addEventListener('input', e => { if (e.target === boldFor) placeBold(); });
boldBtn.addEventListener('mousedown', e => e.preventDefault());
boldBtn.addEventListener('click', () => { if (boldFor) toggleBold(boldFor); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'b' && e.target.matches && e.target.matches(NOTE_BOX)) { e.preventDefault(); toggleBold(e.target); }
});

/* ---------- Theme, first drawing ---------- */
const themeBtn = document.getElementById('theme');
const paintTheme = () => { const night = document.documentElement.dataset.theme === 'night'; themeBtn.textContent = night ? '☀ Day' : '☾ Night'; };
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('school-theme', next); } catch (e) {}
  paintTheme();
});
paintTheme();
renderTabs();
renderSession();
load();
</script>
</body>
