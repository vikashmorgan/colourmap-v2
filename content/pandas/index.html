  writeStore('pandas-box-drafts', all);
}
function ownBoxHtml(n, part) {
  const [title, words] = boxParts(n.body);
  return `<article class="own-box" data-ref="${esc(noteRef(n))}"><h3><span>${esc(title)}</span><span class="part-tag">${esc(part)}</span><span class="tools"><button type="button" class="box-edit" aria-label="Edit">✎</button><button type="button" class="box-del" aria-label="Delete">×</button></span></h3>${words ? `<div class="words">${boldHtml(esc(words))}</div>` : ''}</article>`;
}
function boxEditorHtml(title, words, ref) {
  return `<div class="box-editor"${ref ? ` data-ref="${esc(ref)}"` : ''}><input type="text" maxlength="120" aria-label="Title of the box" placeholder="Title" value="${esc(title)}">
    <textarea rows="4" maxlength="1870" aria-label="What the box says" placeholder="Write here">${esc(words)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
function paintBoxes() {
  for (const wrap of document.querySelectorAll('.own-boxes')) {
    if (wrap.querySelector('.box-editor')) continue;

}
document.addEventListener('click', async e => {
  const t = e.target, wrap = t.closest('.own-boxes');
  if (!wrap) return;
  const key = wrap.dataset.boxKey, own = t.closest('.own-box'), ed = t.closest('.box-editor');
  const openEditor = wrap.querySelector('.box-editor');
  if (t.closest('.box-add')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const draft = boxDrafts()[key] || { title: '', words: '' };
    t.closest('.box-add').insertAdjacentHTML('beforebegin', boxEditorHtml(draft.title, draft.words));
    t.closest('.box-add').remove();
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-edit')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const n = notes.find(x => noteRef(x) === own.dataset.ref);
    if (!n) return;
    own.outerHTML = boxEditorHtml(...boxParts(n.body), noteRef(n));
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-del')) {
    const b = t.closest('.box-del');

    b.dataset.armed = '1'; b.textContent = 'Delete?'; b.classList.add('armed');

    return;
  }

    if (!ed.dataset.ref) setBoxDraft(key, null);
    ed.remove(); paintBoxes();
    return;
  }
  if (ed && t.closest('.save')) {

/* ---------- Reflections: a second sheet, writing into Dreams in Action ----------
   Saved as dreams|<block> notes, so they appear there, with where you were reading as the last line. */
const RF_PREFIX = 'dreams|';
const RF_UNSORTED = 'Not sorted yet';
const RF_BLOCKS = ['New ways of learning', 'The future of education', 'Places to build', 'Logic and intuition', 'The wider world'];
const RF_MAX = 2000;
const RF_DRAFT = 'pandas-reflection-draft';
const rfSheet = document.getElementById('reflections');
const rfDot = document.getElementById('rf-dot');
const rfBlock = document.getElementById('rf-block');
const rfText = document.getElementById('rf-text');
const rfSaved = document.getElementById('rf-saved');
let rfNotes = [], rfSaving = false, rfUnsortedOpen = false;
function rfSource() {
  const key = currentSpot();
  const p = places().find(x => x.key === key);
  if (!p) return 'Pandas';
  if (!p.s) return 'Pandas';
  return p.id ? `Pandas, Lecture ${p.s}: ${p.tag} ${p.name}` : `Pandas, Lecture ${p.s}`;
}
function rfPaint() {
  const keep = rfBlock.value;
  const own = [...readStore('dreams-blocks', []), ...rfNotes.map(n => n.itemKey.slice(RF_PREFIX.length))];
  const names = [RF_UNSORTED, ...RF_BLOCKS, ...own].filter((n, i, list) => list.indexOf(n) === i);
  rfBlock.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  rfBlock.value = names.includes(keep) ? keep : RF_UNSORTED;
  const newest = list => [...list].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).slice(0, 5);
  const item = n => `<div class="rf-item"><span class="rf-block">${esc(n.itemKey.slice(RF_PREFIX.length))}</span><p class="rf-body">${esc(n.body.length > 220 ? `${n.body.slice(0, 220)}…` : n.body)}</p></div>`;
  // Not sorted yet waits in a closed pill below, so it does not take the space.
  const loose = n => n.itemKey === RF_PREFIX + RF_UNSORTED;
  const unsorted = newest(rfNotes.filter(loose));
  document.getElementById('rf-list').innerHTML = newest(rfNotes.filter(n => !loose(n))).map(item).join('')
    + (unsorted.length ? `<details class="nb-fold" id="rf-unsorted"${rfUnsortedOpen ? ' open' : ''}><summary>${RF_UNSORTED}</summary>${unsorted.map(item).join('')}</details>` : '')
    + '<a class="rf-all" href="/dreams-in-action">All reflections ›</a>';
}
async function rfLoad() {
  try {
    const r = await fetch(NOTES_URL);
    if (!r.ok) throw new Error('load');
    rfNotes = (await r.json()).notes.filter(n => n.itemKey.startsWith(RF_PREFIX));
  } catch (e) { /* Writing still works; the blocks fall back to the usual ones. */ }
  rfPaint();
}
const rfOnSheet = () => rfDot.classList.toggle('on-sheet', !notebook.hidden || !rfSheet.hidden || !document.getElementById('focus').hidden);
function setReflections(open) {
  rfSheet.hidden = !open;
  rfDot.setAttribute('aria-expanded', String(open));
  rfOnSheet();
  if (!open) return;
  setNotebook(false);
  setFocus(false);
  document.getElementById('rf-from').textContent = `From ${rfSource()}`;
  if (!rfText.value) rfText.value = readStore(RF_DRAFT, '');
  rfPaint();
  rfLoad();
}
async function rfSave() {
  const text = rfText.value.trim();
  if (!text) { rfText.focus(); return; }
  if (rfSaving) return;
  const source = `From ${rfSource()}`.slice(0, 160);
  const say = (msg, bad) => { rfSaved.textContent = msg; rfSaved.classList.toggle('bad', !!bad); };
  if (text.length + source.length + 2 > RF_MAX) { say(`Too long by ${text.length + source.length + 2 - RF_MAX} characters. Your words are still here.`, true); return; }
  rfSaving = true;
  const block = rfBlock.value;
  const key = RF_PREFIX + block;
  try {
    const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: [{ key, kind: 'comment', body: `${text}\n\n${source}` }] }) });
    if (!r.ok) throw new Error('save');
    rfNotes.push(...(await r.json()).notes);
    rfText.value = '';
    writeStore(RF_DRAFT, '');
    say(`Saved to ${block}.`);
    rfPaint();
  } catch (e) { say('Not saved. Your words are still here.', true); }
  rfSaving = false;
}
rfDot.hidden = !ON_BRAIN;

/* ---------- The notepad on the right ---------- */
const notebook = document.getElementById('notebook');
const nbDot = document.getElementById('nb-dot');
const nbAbout = document.getElementById('nb-about');
const nbText = document.getElementById('nb-text');
let nbKind = 'question', nbPinned = false, nbEarlierOpen = false;
function places() {
  return [{ key: 'pandas|notebook', tag: 'Pandas', name: 'The course in general' },
    ...SESSIONS.flatMap(s => [{ key: `pandas|s${s.n}`, tag: `L${s.n}`, name: `Lecture ${s.n} in general`, s: s.n },
      ...s.groups.flatMap(g => g.cards.map(c => ({ key: cardKey(s.n, c.id), tag: c.num, name: c.name, s: s.n, id: c.id }))),
      ...(s.practice || []).map((x, i) => ({ key: cardKey(s.n, `ex-${x.id}`), tag: `Ex ${i + 1}`, name: x.title, s: s.n, id: `ex-${x.id}` }))])];
}
nbAbout.innerHTML = places().map(p => `<option value="${esc(p.key)}">${p.id ? `${p.tag} · ` : ''}${esc(p.name)}</option>`).join('');
// Where you are: the card nearest the top of the screen, else the session.
function currentSpot() {
  let best = null;
  for (const c of document.querySelectorAll('.card, .ex[data-key]')) {
    const r = c.getBoundingClientRect();
    if (r.bottom > 80 && r.top < innerHeight * 0.6) { best = c; break; }
  }
  if (best) return best.dataset.key;
  return isTab(current) ? 'pandas|notebook' : `pandas|s${current}`;
}
function followSpot() { if (!nbPinned) nbAbout.value = currentSpot(); if (!notebook.hidden) renderNotebook(); }
let scrollTimer = 0;
addEventListener('scroll', () => { clearTimeout(scrollTimer); scrollTimer = setTimeout(() => { if (!notebook.hidden) followSpot(); if (!rfSheet.hidden) document.getElementById('rf-from').textContent = `From ${rfSource()}`; }, 150); }, { passive: true });
function setNotebook(open) {
  notebook.hidden = !open;
  nbDot.setAttribute('aria-expanded', String(open));
  if (open) { setReflections(false); setFocus(false); }
  rfOnSheet(); fcOnSheet();
  if (open) { if (!nbText.value.trim()) nbPinned = false; followSpot(); }
}
function renderNotebook() {
  nbDot.classList.toggle('has-notes', notes.some(n => !n.key.startsWith(BOX_PREFIX) && n.key !== 'pandas|focus'));
  if (notebook.hidden) return;
  const box = document.getElementById('nb-list');
  if (box.querySelector('.editor')) return;
  const here = nbAbout.value;
  const today = new Date().toDateString();
  const isNow = n => !n.createdAt || new Date(n.createdAt).toDateString() === today;
  const groupsOf = keep => places().map(p => ({ p, list: notesOf(p.key).filter(keep) })).filter(g => g.list.length);
  const paint = groups => groups.map(({ p, list }) => `<div class="nb-group${p.key === here ? ' here' : ''}" data-key="${esc(p.key)}">
      <div><button type="button" class="nb-go" data-go="${esc(p.key)}"><span class="t">${esc(p.tag)}</span>${esc(p.name)}${p.s ? ' ›' : ''}</button>${p.key === here ? '<span class="nb-here">you are here</span>' : ''}</div>
      <div class="notes">${list.map(noteHtml).join('')}</div></div>`).join('');
  const now = groupsOf(isNow), before = groupsOf(n => !isNow(n));
  box.innerHTML = now.length || before.length
    ? (now.length ? paint(now) : '<p class="empty">Nothing yet today. Write above: the note is filed under the card you are reading.</p>')
      + (before.length ? `<details class="nb-fold" id="nb-earlier"${nbEarlierOpen ? ' open' : ''}><summary>Earlier</summary>${paint(before)}</details>` : '')

  if (e.target.closest('#nb-save')) {

    const label = nbAbout.selectedOptions[0].textContent;

/* ---------- The case pad ----------
   Asked for 2026-11-08: "when you are in a box and it talks about the cells 11, 12, like box 3, I need a place
   where I can pop open the exercise or the current case: a pad that opens on the left, so I can have it on the
   side and understand what we are talking about, with the graph in it when there is one. For every lecture."
   A card's case is the last picture shown up to it in the lecture: its own, or the one before it. An
   exercise's case is the exercise: its setup, its numbers and its picture. The pad follows as you read. */
const casePad = document.getElementById('case-pad');
let caseShown = '';
function caseOf(key) {
  const m = /^pandas\|s(\d+)\|(.+)$/.exec(key || '');
  const s = m && SESSIONS.find(x => x.n === Number(m[1]));
  if (!s) return null;
  if (m[2].startsWith('ex-')) {
    const i = (s.practice || []).findIndex(x => `ex-${x.id}` === m[2]);

    hideSelBar();
    host.querySelector('.editor')?.remove();
    host.querySelector('.notes').insertAdjacentHTML('afterend', editorHtml(ask.dataset.kind, `“${text.trim()}” `));
    const ta = host.querySelector('.editor textarea');
    ta.focus();
    ta.setSelectionRange(ta.value.length, ta.value.length);
    return;
  }
  if (e.target.closest('.sb-remove')) { hlRemove(selBar.dataset.hid); hideSelBar(); }
});
// Tap a highlight to remove it.
document.addEventListener('click', e => {
  const m = e.target.closest && e.target.closest('mark.hl');
  if (!m || !getSelection().isCollapsed) return;
  e.preventDefault();
  selBar.dataset.hid = m.dataset.hid;
  selBar.innerHTML = '<button type="button" class="sb-btn sb-remove">Remove highlight</button>';
  selBarAt(m.getBoundingClientRect());
});
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !selBar.hidden) hideSelBar(); });
document.addEventListener('mousedown', e => { if (e.target.closest && !e.target.closest('#sel-bar, mark.hl') && selBar.dataset.hid) hideSelBar(); });

/* ---------- Your slides: the lecture decks ----------
   The decks are the teacher's material, so they stay out of this public page: each user uploads them once
   to their private folder (the same one as the Python page's slides), and each card's "Slide n ›" opens
   them. Any sensible name works: SelectingFilteringSlicing_2.pdf or Pandas2.pdf is filed as Pandas2.pdf. */
const DECK_FILES = ['Pandas1.pdf', 'Pandas2.pdf'];
function deckName(name) {
  if (!/\.pdf$/i.test(name)) return null;
  // The decks' own names say what they are: (Intro)DataFrames&Loading.pdf, SelectingFilteringSlicing_2.pdf.
  if (/dataframe/i.test(name)) return 'Pandas1.pdf';
  if (/selecting|filtering|slicing/i.test(name)) return 'Pandas2.pdf';
  const m = name.match(/^Pandas\s*([12])\.pdf$/i) || name.match(/(?:lecture|lesson|session)\s*_?\s*0*([12])(?!\d)/i);
  return m ? `Pandas${m[1]}.pdf` : null;
}
let filesUp = null;
async function showFiles(force) {
  if (!ON_BRAIN) return;
  const box = document.getElementById('files');
  if (filesUp === null) {
    try { const r = await fetch('/api/coding/slides'); filesUp = r.ok ? (await r.json()).uploaded.filter(f => DECK_FILES.includes(f)) : []; } catch (e) { filesUp = []; }
  }
  const missing = DECK_FILES.filter(f => !filesUp.includes(f));
  if (!missing.length && !force) { box.hidden = true; return; }
  box.innerHTML = `<span><b>Slides:</b> ${filesUp.length} of ${DECK_FILES.length} decks uploaded${missing.length ? ` (missing: Lecture ${missing.map(f => f[6]).join(', ')})` : ''}. Pick the lecture PDFs, for example (Intro)DataFrames&amp;Loading.pdf from Downloads. They stay private to you.</span>
    <label class="files-up">Upload slides<input type="file" id="files-input" accept=".pdf,application/pdf" multiple></label>
    <span id="files-status"></span>`;
  box.hidden = false;
}
document.getElementById('files').addEventListener('change', async e => {
  if (e.target.id !== 'files-input') return;
  const status = document.getElementById('files-status');
  const picked = [...e.target.files];
  const skipped = [];
  let done = 0;
  for (const f of picked) {
    const name = deckName(f.name);
    if (!name) { skipped.push(/\.pptx?$/i.test(f.name) ? `${f.name} (a PowerPoint: pick the PDF instead)` : f.name); continue; }
    status.textContent = `Uploading ${f.name} as ${name}…`;
    const form = new FormData();
    form.append('file', new File([f], name, { type: 'application/pdf' }));
    try {
      const r = await fetch('/api/coding/slides', { method: 'POST', body: form });
      if (r.ok) done++; else skipped.push(`${f.name} (${(await r.json().catch(() => ({}))).error || r.status})`);
    } catch (err) { skipped.push(`${f.name} (offline)`); }
  }
  filesUp = null;
  await showFiles(true);
  document.getElementById('files-status').textContent = `${done} uploaded.${skipped.length ? ` Not uploaded: ${skipped.join('; ')}.` : ''}`;
});


/* ---------- Bold in notes ----------
   Asked for 2026-10-19: "mettre texte en gras" in questions and notepads. Notes stay plain text:
   bold is written **like this**, shown in bold. In any note box, the B button at its top right
   or Ctrl/Cmd+B makes the selection bold, or plain again. */
function boldHtml(html) { return html.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<b>$1</b>'); }
const NOTE_BOX = 'textarea[aria-label="Your note"]';
function toggleBold(ta) {
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  ta.focus();
  if (v.slice(a - 2, a) === '**' && v.slice(b, b + 2) === '**') {
    ta.setSelectionRange(a - 2, b + 2);
    if (!document.execCommand('insertText', false, v.slice(a, b))) ta.setRangeText(v.slice(a, b), a - 2, b + 2, 'end');
    ta.setSelectionRange(a - 2, b - 2);
  } else {
    const inner = v.slice(a, b);
    if (!document.execCommand('insertText', false, `**${inner}**`)) ta.setRangeText(`**${inner}**`, a, b, 'end');
    ta.setSelectionRange(a + 2, b + 2);
  }
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
const boldBtn = document.createElement('button');
boldBtn.type = 'button';
boldBtn.className = 'bold-btn';
boldBtn.textContent = 'B';
boldBtn.title = 'Bold (Ctrl+B)';
boldBtn.setAttribute('aria-label', 'Bold');
boldBtn.hidden = true;
document.body.append(boldBtn);
let boldFor = null;
function placeBold() {
  if (!boldFor || !boldFor.isConnected) { boldBtn.hidden = true; return; }
  const r = boldFor.getBoundingClientRect();
  boldBtn.style.top = `${r.top + 5}px`;
  boldBtn.style.left = `${r.right - 33}px`;
  boldBtn.hidden = r.bottom < 0 || r.top > innerHeight;
}
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches(NOTE_BOX)) { boldFor = e.target; placeBold(); } });
document.addEventListener('focusout', e => { if (e.target === boldFor) setTimeout(() => { if (document.activeElement !== boldFor) { boldFor = null; boldBtn.hidden = true; } }, 0); });
addEventListener('scroll', () => { if (boldFor) placeBold(); }, { passive: true, capture: true });
addEventListener('resize', () => { if (boldFor) placeBold(); });
document.addEventListener('input', e => { if (e.target === boldFor) placeBold(); });
boldBtn.addEventListener('mousedown', e => e.preventDefault());
boldBtn.addEventListener('click', () => { if (boldFor) toggleBold(boldFor); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'b' && e.target.matches && e.target.matches(NOTE_BOX)) { e.preventDefault(); toggleBold(e.target); }
});

/* ---------- The map: where you are ----------
   Asked for 2026-11-05: "a system that helps me know where I am, like a dot on the left that tells me
   this is segment 2 of Lecture 3, and I see the segments of Lecture 3, or the segments of Lecture 1 or 2",
   then "a vertical pill that opens, a column with the stacks of the segments that can be opened and closed".
   Closed: a pill on the left, one dot per segment in its colour, the current one larger with its number.
   Open: one stack per lecture, each with its segments in their colours; a segment opens to its cards.
   Moving through the page opens the segment you enter and closes the one you left. Opening anything
   else moves nothing: only the arrow, a card, or a row with nothing to open takes you there. */
const mapEl = document.getElementById('map');
const mapPill = document.getElementById('map-pill');
const PILL_LOOKS = ['bar', 'line', 'steps', 'gauge'];
let pillLook = 'bar';
try { const v = localStorage.getItem('pandas-pill-look'); if (PILL_LOOKS.includes(v)) pillLook = v; } catch (e) {}
// Whether the page leaves room beside it: the boxes grow with the text size.
const MAP_WIDE = { get matches() { return document.documentElement.classList.contains('map-wide'); } };
function fitLayout() {
  const room = innerWidth - 760 * readSize();
  const root = document.documentElement, was = root.classList.contains('map-wide');
  root.classList.toggle('map-wide', room >= 480);
  root.classList.toggle('pill-edge', room <= 140);
  return was !== root.classList.contains('map-wide');
}
const mapOpenL = new Set(), mapOpenS = new Set();
let mapLecture = null, mapPlace = { seg: null, card: null };
function segsOf(s) {
  return [{ key: 'pic', name: 'The picture' },
    ...s.groups.map((g, gi) => ({ key: `g${gi}`, name: g.name, h: segHue(gi), cards: g.cards })),
    { key: 'practice', name: 'Practice', h: segHue(s.groups.length) }, { key: 'recap', name: 'Summary', h: segHue(s.groups.length + 1) }];
}
function findPlace() {
  let seg = null, card = null;
  const segEls = [...document.querySelectorAll('#session [data-seg]')];
  for (const el of segEls) if (!seg || el.getBoundingClientRect().top <= 110) seg = el.dataset.seg;
  // The last segment can be too short to reach the top: at the end of the lecture, you are in it.
  if (segEls.length && document.getElementById('session').getBoundingClientRect().bottom <= innerHeight) seg = segEls[segEls.length - 1].dataset.seg;
  if (seg) card = [...document.querySelectorAll(`#session [data-seg="${seg}"] .card`)].find(c => c.getBoundingClientRect().bottom > 110)?.id || null;
  return { seg, card };
}
function placeText() {
  const s = SESSIONS.find(x => x.n === current);
  if (!s) return 'Cheat sheet';
  const all = segsOf(s), at = all.find(x => x.key === mapPlace.seg), num = all.filter(x => x.key !== 'pic'), i = num.indexOf(at);
  // Where you are in the deck: the slide of the card you are reading, out of the lecture's length.
  const card = mapPlace.card && s.groups.flatMap(g => g.cards).find(c => `c-${s.n}-${c.id}` === mapPlace.card);
  const slide = card?.slide ? ` · Slide ${card.slide}/${s.pages}` : '';
  return i < 0 ? `Lecture ${current} · ${at ? at.name : ''}` : `Lecture ${current} · Part ${i + 1} of ${num.length}${slide} · ${at.name}`;
}
const hueStyle = x => x.h === undefined ? '' : ` style="--h: ${x.h.toFixed(0)}"`;
// The pinned label and the closed pill.
function paintPlace() {
  const s = SESSIONS.find(x => x.n === current), text = placeText();
  mapPill.setAttribute('aria-label', `${text}. Open the map`);
  mapPill.title = `${text}. Double-click to change its look.`;
  if (!s) { mapPill.innerHTML = '<b>≡</b>'; return; }
  const all = segsOf(s), at = all.find(x => x.key === mapPlace.seg);
  const i = all.indexOf(at), num = all.filter(x => x.key !== 'pic'), part = num.indexOf(at);
  let k = 0;
  mapPill.innerHTML = `<b>L${s.n}</b><span class="ln">${all.map((x, j) => `<i class="${j < i ? 'past' : j === i ? 'here' : ''}" data-n="${x.key === 'pic' ? '·' : ++k}"></i>`).join('')}</span>${part < 0 ? '' : `<span class="pn">${part + 1}<span class="of">/${num.length}</span></span>`}`;
  mapPill.dataset.look = pillLook;
  const where = document.getElementById('where-btn');
  if (where) {
    where.textContent = text;
    where.parentElement.style.setProperty('--h', at?.h === undefined ? '' : at.h.toFixed(0));
    where.classList.toggle('tinted', at?.h !== undefined);
  }
}
function renderMap() {
  if (mapEl.hidden) return;
  const stack = s => {
    const lit = s.n === current, open = mapOpenL.has(s.n);
    let n = 0;
    return `<div class="map-stack${lit ? ' in' : ''}"><button type="button" class="map-l" data-l="${s.n}" aria-expanded="${open}"><b>Lecture ${s.n}</b><span>${esc(s.short)}</span><span class="map-chev" style="flex:none">›</span></button>
      ${open ? `<ol class="map-segs">${segsOf(s).map(x => {
        if (x.key !== 'pic') n++;
        const here = lit && mapPlace.seg === x.key, id = `${s.n}|${x.key}`, up = mapOpenS.has(id);
        const label = `<span class="map-n">${x.key === 'pic' ? '' : n}</span><span class="t">${esc(x.name)}${here ? '<em>you are here</em>' : ''}</span>`;
        return `<li class="map-s${x.h === undefined ? ' plain' : ''}${here ? ' here' : ''}"${hueStyle(x)}>${x.cards
          ? `<div class="map-row"><button type="button" class="map-name" data-seg-toggle="${id}" aria-expanded="${up}">${label}<span class="map-chev">›</span></button><button type="button" class="map-go" data-s="${s.n}" data-to="${x.key}" aria-label="Go to ${esc(x.name)}" title="Go to this segment">→</button></div>
            ${up ? `<ol class="map-cards">${x.cards.map(c => `<li><button type="button" data-s="${s.n}" data-card="c-${s.n}-${c.id}"${lit && mapPlace.card === `c-${s.n}-${c.id}` ? ' class="on"' : ''}><b${marks[cardKey(s.n, c.id)] ? ` class="m-${marks[cardKey(s.n, c.id)]}"` : ''}>${c.num.split('.')[1]}</b>${esc(c.name)}</button></li>`).join('')}</ol>` : ''}`
          : `<div class="map-row"><button type="button" class="map-name" data-s="${s.n}" data-to="${x.key}">${label}<span class="map-go" style="width:auto;padding-right:10px">→</span></button></div>`}</li>`;
      }).join('')}</ol>` : ''}</div>`;
  };
  mapEl.innerHTML = `<div class="map-top"><span>Where you are</span><button type="button" class="map-close" aria-label="Close the map">×</button></div>
    <p class="map-now">${esc(placeText())}</p>${SESSIONS.map(stack).join('')}<button type="button" class="map-ref" data-goref>Cheat sheet</button>`;
}
function mapKeepInView() {
  const on = mapEl.querySelector('.map-cards .on') || mapEl.querySelector('.map-s.here');
  if (!on) return;
  const a = on.getBoundingClientRect(), b = mapEl.getBoundingClientRect();
  if (a.top < b.top + 8) mapEl.scrollTop -= b.top + 8 - a.top;
  else if (a.bottom > b.bottom - 8) mapEl.scrollTop += a.bottom - b.bottom + 8;
}
function setMap(open, remember) {
  mapEl.hidden = !open;
  mapPill.hidden = open;
  mapPill.setAttribute('aria-expanded', String(open));
  if (remember) { try { localStorage.setItem('pandas-map-open', open ? '1' : ''); } catch (e) {} }
  if (open) { renderMap(); mapKeepInView(); }
}
const followSeg = seg => { if (seg) mapOpenS.add(`${current}|${seg}`); };
function mapFollow() {
  const p = findPlace();
  if (p.seg === mapPlace.seg && p.card === mapPlace.card) return;
  if (p.seg !== mapPlace.seg) { mapOpenS.delete(`${current}|${mapPlace.seg}`); followSeg(p.seg); }
  mapPlace = p;
  paintPlace();
  renderMap();
  if (!mapEl.hidden) mapKeepInView();
}
// After every redraw of the page. A new lecture starts with only that lecture open.
function mapRefresh() {
  mapPlace = findPlace();
  if (current !== mapLecture && !isTab(current)) {
    mapLecture = current;
    mapOpenL.clear(); mapOpenS.clear();
    mapOpenL.add(current);
    followSeg(mapPlace.seg);
  }
  paintPlace();
  renderMap();
}
function mapGo(lecture, seg, cardId) {
  if (lecture !== current) document.querySelector(`.sess[data-s="${lecture}"]`).click();
  const el = cardId ? document.getElementById(cardId) : document.querySelector(`#session [data-seg="${seg}"]`);
  if (!MAP_WIDE.matches) setMap(false);
  el?.scrollIntoView({ block: 'start' });
  mapFollow();
}
mapEl.addEventListener('click', e => {
  if (e.target.closest('.map-close')) { setMap(false, MAP_WIDE.matches); return; }
  const l = e.target.closest('[data-l]');
  if (l) {
    const n = Number(l.dataset.l);
    if (!mapOpenL.delete(n)) mapOpenL.add(n);
    renderMap();
    return;
  }
  const t = e.target.closest('[data-seg-toggle]');
  if (t) {
    const id = t.dataset.segToggle;
    if (!mapOpenS.delete(id)) mapOpenS.add(id);
    renderMap();
    return;
  }
  if (e.target.closest('[data-goref]')) { document.querySelector('.sess[data-s="ref"]').click(); if (!MAP_WIDE.matches) setMap(false); return; }
  const c = e.target.closest('[data-card]');
  if (c) { mapGo(Number(c.dataset.s), null, c.dataset.card); return; }
  const g = e.target.closest('[data-to]');
  if (g) mapGo(Number(g.dataset.s), g.dataset.to);
});
let pillTimer = 0;
mapPill.addEventListener('click', e => {
  clearTimeout(pillTimer);
  if (e.detail >= 2) {
    pillLook = PILL_LOOKS[(PILL_LOOKS.indexOf(pillLook) + 1) % PILL_LOOKS.length];
    try { localStorage.setItem('pandas-pill-look', pillLook); } catch (err) {}
    paintPlace();
    return;
  }
  pillTimer = setTimeout(() => setMap(true, MAP_WIDE.matches), 260);
});
document.getElementById('session').addEventListener('click', e => { if (e.target.closest('#where-btn, .seg-tab')) setMap(true, MAP_WIDE.matches); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mapEl.hidden) setMap(false, MAP_WIDE.matches); });
document.addEventListener('click', e => {
  if (mapEl.hidden || MAP_WIDE.matches) return;
  const path = e.composedPath();
  if (!path.includes(mapEl) && !path.includes(mapPill) && !e.target.closest?.('#where-btn, .seg-tab')) setMap(false);
});
let mapTimer = 0;
addEventListener('scroll', () => { clearTimeout(mapTimer); mapTimer = setTimeout(mapFollow, 60); }, { passive: true });
const mapFit = () => { let open = false; try { open = localStorage.getItem('pandas-map-open') === '1'; } catch (e) {} setMap(MAP_WIDE.matches && open); };
addEventListener('resize', () => { if (fitLayout()) mapFit(); });

/* ---------- Text size ----------
   Asked for 2026-11-05: "on the notepad, a button to define the size of the letters, so I can increase it
   when my eyes are tired; it can also open the horizontal space of the boxes so they expand with the type". */
const SIZES = [1, 1.1, 1.2, 1.35, 1.5];
function paintSize() {
  const now = readSize();
  document.getElementById('size-now').textContent = `${Math.round(now * 100)}%`;
  document.getElementById('size-down').disabled = now <= SIZES[0];
  document.getElementById('size-up').disabled = now >= SIZES[SIZES.length - 1];
}
function setSize(step) {
  const i = SIZES.indexOf(readSize());
  const next = SIZES[Math.min(SIZES.length - 1, Math.max(0, (i < 0 ? 0 : i) + step))];
  // Stay on the same card: everything above it changes height.
  const keep = document.getElementById(findPlace().card) || document.querySelector('#session [data-seg]');
  const top = keep?.getBoundingClientRect().top;
  document.documentElement.style.setProperty('--read', next);
  try { localStorage.setItem('pandas-text-size', String(next)); } catch (e) {}
  paintSize();
  if (fitLayout()) mapFit();
  if (keep) scrollBy(0, keep.getBoundingClientRect().top - top);
  drawPeekLinks();
}
document.getElementById('size-down').addEventListener('click', () => setSize(-1));
document.getElementById('size-up').addEventListener('click', () => setSize(1));

/* ---------- Theme, first drawing ---------- */
const themeBtn = document.getElementById('theme');
const paintTheme = () => { const night = document.documentElement.dataset.theme === 'night'; themeBtn.textContent = night ? '☀ Day' : '☾ Night'; };
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('school-theme', next); } catch (e) {}
  paintTheme();
});
paintTheme();
renderTabs();
fitLayout();
paintSize();
renderSession();
mapFit();
load();
</script>
