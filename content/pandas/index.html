      const r = await fetch('/api/coding/slides', { method: 'POST', body: form });
      if (r.ok) done++; else skipped.push(`${f.name} (${(await r.json().catch(() => ({}))).error || r.status})`);
    } catch (err) { skipped.push(`${f.name} (offline)`); }
  }
  filesUp = null;
  await showFiles(true);
  document.getElementById('files-status').textContent = `${done} uploaded.${skipped.length ? ` Not uploaded: ${skipped.join('; ')}.` : ''}`;
});


/* ---------- Bold in notes ----------
   Asked for 2026-10-19: "mettre texte en gras" in questions and notepads. Notes stay plain text:
   bold is written **like this**, shown in bold. In any note box, the B button at its top right
   or Ctrl/Cmd+B makes the selection bold, or plain again. */
function boldHtml(html) { return html.replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<b>$1</b>'); }
const NOTE_BOX = 'textarea[aria-label="Your note"]';
function toggleBold(ta) {
  const a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
  ta.focus();
  if (v.slice(a - 2, a) === '**' && v.slice(b, b + 2) === '**') {
    ta.setSelectionRange(a - 2, b + 2);
    if (!document.execCommand('insertText', false, v.slice(a, b))) ta.setRangeText(v.slice(a, b), a - 2, b + 2, 'end');
    ta.setSelectionRange(a - 2, b - 2);
  } else {
    const inner = v.slice(a, b);
    if (!document.execCommand('insertText', false, `**${inner}**`)) ta.setRangeText(`**${inner}**`, a, b, 'end');
    ta.setSelectionRange(a + 2, b + 2);
  }
  ta.dispatchEvent(new Event('input', { bubbles: true }));
}
const boldBtn = document.createElement('button');
boldBtn.type = 'button';
boldBtn.className = 'bold-btn';
boldBtn.textContent = 'B';
boldBtn.title = 'Bold (Ctrl+B)';
boldBtn.setAttribute('aria-label', 'Bold');
boldBtn.hidden = true;
document.body.append(boldBtn);
let boldFor = null;
function placeBold() {
  if (!boldFor || !boldFor.isConnected) { boldBtn.hidden = true; return; }
  const r = boldFor.getBoundingClientRect();
  boldBtn.style.top = `${r.top + 5}px`;
  boldBtn.style.left = `${r.right - 33}px`;
  boldBtn.hidden = r.bottom < 0 || r.top > innerHeight;
}
document.addEventListener('focusin', e => { if (e.target.matches && e.target.matches(NOTE_BOX)) { boldFor = e.target; placeBold(); } });
document.addEventListener('focusout', e => { if (e.target === boldFor) setTimeout(() => { if (document.activeElement !== boldFor) { boldFor = null; boldBtn.hidden = true; } }, 0); });
addEventListener('scroll', () => { if (boldFor) placeBold(); }, { passive: true, capture: true });
addEventListener('resize', () => { if (boldFor) placeBold(); });
document.addEventListener('input', e => { if (e.target === boldFor) placeBold(); });
boldBtn.addEventListener('mousedown', e => e.preventDefault());
boldBtn.addEventListener('click', () => { if (boldFor) toggleBold(boldFor); });
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && !e.altKey && e.key.toLowerCase() === 'b' && e.target.matches && e.target.matches(NOTE_BOX)) { e.preventDefault(); toggleBold(e.target); }
});

/* ---------- The map: where you are ----------
   Asked for 2026-11-05: "a system that helps me know where I am, like a dot on the left that tells me
   this is segment 2 of Lecture 3, and I see the segments of Lecture 3, or the segments of Lecture 1 or 2",
   then "a vertical pill that opens, a column with the stacks of the segments that can be opened and closed".
   Closed: a pill on the left, one dot per segment in its colour, the current one larger with its number.
   Open: one stack per lecture, each with its segments in their colours; a segment opens to its cards.
   Moving through the page opens the segment you enter and closes the one you left. Opening anything
   else moves nothing: only the arrow, a card, or a row with nothing to open takes you there. */
const mapEl = document.getElementById('map');
const mapPill = document.getElementById('map-pill');
const PILL_LOOKS = ['bar', 'line', 'steps', 'gauge'];
let pillLook = 'bar';
try { const v = localStorage.getItem('pandas-pill-look'); if (PILL_LOOKS.includes(v)) pillLook = v; } catch (e) {}
// Whether the page leaves room beside it: the boxes grow with the text size.
const MAP_WIDE = { get matches() { return document.documentElement.classList.contains('map-wide'); } };
function fitLayout() {
  const room = innerWidth - 760 * readSize();
  const root = document.documentElement, was = root.classList.contains('map-wide');
  root.classList.toggle('map-wide', room >= 480);
  root.classList.toggle('pill-edge', room <= 140);
  return was !== root.classList.contains('map-wide');
}
const mapOpenL = new Set(), mapOpenS = new Set();
let mapLecture = null, mapPlace = { seg: null, card: null };
function segsOf(s) {
  return [{ key: 'pic', name: 'The picture' },
    ...s.groups.map((g, gi) => ({ key: `g${gi}`, name: g.name, h: segHue(gi), cards: g.cards })),
    { key: 'practice', name: 'Practice', h: segHue(s.groups.length) }, { key: 'notebook', name: 'Notebook', h: segHue(s.groups.length + 1) },
    { key: 'recap', name: 'Summary', h: segHue(s.groups.length + 2) }];
}
function findPlace() {
  let seg = null, card = null;
  const segEls = [...document.querySelectorAll('#session [data-seg]')];
  for (const el of segEls) if (!seg || el.getBoundingClientRect().top <= 110) seg = el.dataset.seg;
  // The last segment can be too short to reach the top: at the end of the lecture, you are in it.
  if (segEls.length && document.getElementById('session').getBoundingClientRect().bottom <= innerHeight) seg = segEls[segEls.length - 1].dataset.seg;
  if (seg) card = [...document.querySelectorAll(`#session [data-seg="${seg}"] .card`)].find(c => c.getBoundingClientRect().bottom > 110)?.id || null;
  return { seg, card };
}
function placeText() {
  const s = SESSIONS.find(x => x.n === current);
  if (!s) return 'Cheat sheet';
  const all = segsOf(s), at = all.find(x => x.key === mapPlace.seg), num = all.filter(x => x.key !== 'pic'), i = num.indexOf(at);
  // Where you are in the deck: the slide of the card you are reading, out of the lecture's length.
  const card = mapPlace.card && s.groups.flatMap(g => g.cards).find(c => `c-${s.n}-${c.id}` === mapPlace.card);
  const slide = card?.slide ? ` · Slide ${card.slide}/${s.pages}` : '';
  return i < 0 ? `Lecture ${current} · ${at ? at.name : ''}` : `Lecture ${current} · Part ${i + 1} of ${num.length}${slide} · ${at.name}`;
}
const hueStyle = x => x.h === undefined ? '' : ` style="--h: ${x.h.toFixed(0)}"`;
// The pinned label and the closed pill.
function paintPlace() {
  const s = SESSIONS.find(x => x.n === current), text = placeText();
  mapPill.setAttribute('aria-label', `${text}. Open the map`);
  mapPill.title = `${text}. Double-click to change its look.`;
  if (!s) { mapPill.innerHTML = '<b>≡</b>'; return; }
  const all = segsOf(s), at = all.find(x => x.key === mapPlace.seg);
  const i = all.indexOf(at), num = all.filter(x => x.key !== 'pic'), part = num.indexOf(at);
  let k = 0;
  mapPill.innerHTML = `<b>L${s.n}</b><span class="ln">${all.map((x, j) => `<i class="${j < i ? 'past' : j === i ? 'here' : ''}" data-n="${x.key === 'pic' ? '·' : ++k}"></i>`).join('')}</span>${part < 0 ? '' : `<span class="pn">${part + 1}<span class="of">/${num.length}</span></span>`}`;
  mapPill.dataset.look = pillLook;
  const where = document.getElementById('where-btn');
  if (where) {
    where.textContent = text;
    where.parentElement.style.setProperty('--h', at?.h === undefined ? '' : at.h.toFixed(0));
    where.classList.toggle('tinted', at?.h !== undefined);
  }
}
function renderMap() {
  if (mapEl.hidden) return;
  const stack = s => {
    const lit = s.n === current, open = mapOpenL.has(s.n);
    let n = 0;
    return `<div class="map-stack${lit ? ' in' : ''}"><button type="button" class="map-l" data-l="${s.n}" aria-expanded="${open}"><b>Lecture ${s.n}</b><span>${esc(s.short)}</span><span class="map-chev" style="flex:none">›</span></button>
      ${open ? `<ol class="map-segs">${segsOf(s).map(x => {
        if (x.key !== 'pic') n++;
        const here = lit && mapPlace.seg === x.key, id = `${s.n}|${x.key}`, up = mapOpenS.has(id);
        const label = `<span class="map-n">${x.key === 'pic' ? '' : n}</span><span class="t">${esc(x.name)}${here ? '<em>you are here</em>' : ''}</span>`;
        return `<li class="map-s${x.h === undefined ? ' plain' : ''}${here ? ' here' : ''}"${hueStyle(x)}>${x.cards
          ? `<div class="map-row"><button type="button" class="map-name" data-seg-toggle="${id}" aria-expanded="${up}">${label}<span class="map-chev">›</span></button><button type="button" class="map-go" data-s="${s.n}" data-to="${x.key}" aria-label="Go to ${esc(x.name)}" title="Go to this segment">→</button></div>
            ${up ? `<ol class="map-cards">${x.cards.map(c => `<li><button type="button" data-s="${s.n}" data-card="c-${s.n}-${c.id}"${lit && mapPlace.card === `c-${s.n}-${c.id}` ? ' class="on"' : ''}><b${marks[cardKey(s.n, c.id)] ? ` class="m-${marks[cardKey(s.n, c.id)]}"` : ''}>${c.num.split('.')[1]}</b>${esc(c.name)}</button></li>`).join('')}</ol>` : ''}`
          : `<div class="map-row"><button type="button" class="map-name" data-s="${s.n}" data-to="${x.key}">${label}<span class="map-go" style="width:auto;padding-right:10px">→</span></button></div>`}</li>`;
      }).join('')}</ol>` : ''}</div>`;
  };
  mapEl.innerHTML = `<div class="map-top"><span>Where you are</span><button type="button" class="map-close" aria-label="Close the map">×</button></div>
    <p class="map-now">${esc(placeText())}</p>${SESSIONS.map(stack).join('')}<button type="button" class="map-ref" data-goref>Cheat sheet</button>`;
}
function mapKeepInView() {
  const on = mapEl.querySelector('.map-cards .on') || mapEl.querySelector('.map-s.here');
  if (!on) return;
  const a = on.getBoundingClientRect(), b = mapEl.getBoundingClientRect();
  if (a.top < b.top + 8) mapEl.scrollTop -= b.top + 8 - a.top;
  else if (a.bottom > b.bottom - 8) mapEl.scrollTop += a.bottom - b.bottom + 8;
}
function setMap(open, remember) {
  mapEl.hidden = !open;
  mapPill.hidden = open;
  mapPill.setAttribute('aria-expanded', String(open));
  if (remember) { try { localStorage.setItem('pandas-map-open', open ? '1' : ''); } catch (e) {} }
  if (open) { renderMap(); mapKeepInView(); }
}
const followSeg = seg => { if (seg) mapOpenS.add(`${current}|${seg}`); };
function mapFollow() {
  const p = findPlace();
  if (p.seg === mapPlace.seg && p.card === mapPlace.card) return;
  if (p.seg !== mapPlace.seg) { mapOpenS.delete(`${current}|${mapPlace.seg}`); followSeg(p.seg); }
  mapPlace = p;
  paintPlace();
  renderMap();
  if (!mapEl.hidden) mapKeepInView();
}
// After every redraw of the page. A new lecture starts with only that lecture open.
function mapRefresh() {
  mapPlace = findPlace();
  if (current !== mapLecture && !isTab(current)) {
    mapLecture = current;
    mapOpenL.clear(); mapOpenS.clear();
    mapOpenL.add(current);
    followSeg(mapPlace.seg);
  }
  paintPlace();
  renderMap();
}
function mapGo(lecture, seg, cardId) {
  if (lecture !== current) document.querySelector(`.sess[data-s="${lecture}"]`).click();
  const el = cardId ? document.getElementById(cardId) : document.querySelector(`#session [data-seg="${seg}"]`);
  if (!MAP_WIDE.matches) setMap(false);
  el?.scrollIntoView({ block: 'start' });
  mapFollow();
}
mapEl.addEventListener('click', e => {
  if (e.target.closest('.map-close')) { setMap(false, MAP_WIDE.matches); return; }
  const l = e.target.closest('[data-l]');
  if (l) {
    const n = Number(l.dataset.l);
    if (!mapOpenL.delete(n)) mapOpenL.add(n);
    renderMap();
    return;
  }
  const t = e.target.closest('[data-seg-toggle]');
  if (t) {
    const id = t.dataset.segToggle;
    if (!mapOpenS.delete(id)) mapOpenS.add(id);
    renderMap();
    return;
  }
  if (e.target.closest('[data-goref]')) { document.querySelector('.sess[data-s="ref"]').click(); if (!MAP_WIDE.matches) setMap(false); return; }
  const c = e.target.closest('[data-card]');
  if (c) { mapGo(Number(c.dataset.s), null, c.dataset.card); return; }
  const g = e.target.closest('[data-to]');
  if (g) mapGo(Number(g.dataset.s), g.dataset.to);
});
let pillTimer = 0;
mapPill.addEventListener('click', e => {
  clearTimeout(pillTimer);
  if (e.detail >= 2) {
    pillLook = PILL_LOOKS[(PILL_LOOKS.indexOf(pillLook) + 1) % PILL_LOOKS.length];
    try { localStorage.setItem('pandas-pill-look', pillLook); } catch (err) {}
    paintPlace();
    return;
  }
  pillTimer = setTimeout(() => setMap(true, MAP_WIDE.matches), 260);
});
document.getElementById('session').addEventListener('click', e => { if (e.target.closest('#where-btn, .seg-tab')) setMap(true, MAP_WIDE.matches); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mapEl.hidden) setMap(false, MAP_WIDE.matches); });
document.addEventListener('click', e => {
  if (mapEl.hidden || MAP_WIDE.matches) return;
  const path = e.composedPath();
  if (!path.includes(mapEl) && !path.includes(mapPill) && !e.target.closest?.('#where-btn, .seg-tab')) setMap(false);
});
let mapTimer = 0;
addEventListener('scroll', () => { clearTimeout(mapTimer); mapTimer = setTimeout(mapFollow, 60); }, { passive: true });
const mapFit = () => { let open = false; try { open = localStorage.getItem('pandas-map-open') === '1'; } catch (e) {} setMap(MAP_WIDE.matches && open); };
addEventListener('resize', () => { if (fitLayout()) mapFit(); });

/* ---------- Text size ----------
   Asked for 2026-11-05: "on the notepad, a button to define the size of the letters, so I can increase it
   when my eyes are tired; it can also open the horizontal space of the boxes so they expand with the type". */
const SIZES = [1, 1.1, 1.2, 1.35, 1.5];
function paintSize() {
  const now = readSize();
  document.getElementById('size-now').textContent = `${Math.round(now * 100)}%`;
  document.getElementById('size-down').disabled = now <= SIZES[0];
  document.getElementById('size-up').disabled = now >= SIZES[SIZES.length - 1];
}
function setSize(step) {
  const i = SIZES.indexOf(readSize());
  const next = SIZES[Math.min(SIZES.length - 1, Math.max(0, (i < 0 ? 0 : i) + step))];
  // Stay on the same card: everything above it changes height.
  const keep = document.getElementById(findPlace().card) || document.querySelector('#session [data-seg]');
  const top = keep?.getBoundingClientRect().top;
  document.documentElement.style.setProperty('--read', next);
  try { localStorage.setItem('pandas-text-size', String(next)); } catch (e) {}
  paintSize();
  if (fitLayout()) mapFit();
  if (keep) scrollBy(0, keep.getBoundingClientRect().top - top);
  drawPeekLinks();
}
document.getElementById('size-down').addEventListener('click', () => setSize(-1));
document.getElementById('size-up').addEventListener('click', () => setSize(1));

/* ---------- Theme, first drawing ---------- */
const themeBtn = document.getElementById('theme');
const paintTheme = () => { const night = document.documentElement.dataset.theme === 'night'; themeBtn.textContent = night ? '☀ Day' : '☾ Night'; };
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('school-theme', next); } catch (e) {}

paintTheme();
renderTabs();
fitLayout();
paintSize();
renderSession();
mapFit();
load();
// Deep links, e.g. from the Pandas city (/pandas/city): #s-3 opens a lecture, #c-3-nan a card, #c-3-ex-l3-e1 an exercise.
function followHash() {
  let h = '';
  try { h = decodeURIComponent(location.hash); } catch (e) { return; }
  const m = /^#(?:s-(\d+)|c-(\d+)-(.+))$/.exec(h);
  if (!m) return;
  if (m[1]) { const tab = document.querySelector(`.sess[data-s="${m[1]}"]`); if (tab && Number(m[1]) !== current) tab.click(); return; }
  goTo(cardKey(Number(m[2]), m[3]));
}
followHash();
addEventListener('hashchange', followHash);

<script>
/*
 * HOVER A FUNCTION (2026-11-22): "make sure I can hover above [function names] and it explains the

(() => {

    clip: ['Caps values to a lower and/or upper bound.', 'df["age"].clip(0, 120)', '-1 → 0, 212 → 120'],

    transform: ['Like agg, but gives back one value per original row, so you can add it as a column.', 'df["share"] = df["total"] / df.groupby("country")["total"].transform("sum")', 'Each order\'s share of its country\'s total'],
    crosstab: ['Counts how often each pair of values occurs: a table of two columns against each other.', 'pd.crosstab(df["country"], df["status"])', 'Rows = countries, columns = statuses, cells = counts'],
    sort_values: ['Sorts the rows by one or more columns.', 'df.sort_values("total", ascending=False)', 'Biggest orders first'],
    nlargest: ['The n rows with the biggest values in a column.', 'df.nlargest(3, "total")', 'The 3 biggest orders'],
    query: ['Filters rows with a condition written as text.', 'df.query("total > 100 and country == \'FR\'")', 'French orders over 100'],
    where: ['Keeps values where a condition holds; elsewhere puts NaN (or what you give).', 'df["total"].where(df["total"] > 0)', 'Negative totals → NaN'],
    assign: ['Returns a copy with new or changed columns.', 'df.assign(vat=df["total"] * 0.2)', 'A new column vat'],
    replace: ['Swaps values for others.', 'df["country"].replace({"fr": "FR", "France": "FR"})', 'All three spellings → FR'],
    map: ['Turns each value into another through a dict or a function.', 'df["code"].map({"FR": "France", "IT": "Italy"})', 'FR → France'],
    strip: ['(.str.strip) Removes spaces at both ends of text.', 'df["name"].str.strip()', '"  Ana " → "Ana"'],
    lower: ['(.str.lower) Lowercases text.', 'df["email"].str.lower()', '"Ana@X.com" → "ana@x.com"'],
    upper: ['(.str.upper) Uppercases text.', 'df["country"].str.upper()', '"fr" → "FR"'],
    contains: ['(.str.contains) True where the text contains a pattern.', 'df["email"].str.contains("@")', 'False for emails without @'],
    split: ['(.str.split) Splits text into pieces at a separator.', 'df["full"].str.split(" ", expand=True)', 'First and last name in two columns'],
    startswith: ['(.str.startswith) True where text begins with something.', 'df["sku"].str.startswith("FR-")', 'True for French product codes'],
    select_dtypes: ['Keeps only columns of some types.', 'df.select_dtypes("number")', 'Only the numeric columns'],
    combine_first: ['Fills one Series\'s gaps with another\'s values at the same places.', 'df["phone"].combine_first(df["mobile"])', 'Phone, or mobile when phone is missing'],
    reset_index: ['Turns the index back into a column and numbers rows 0, 1, 2 …', 'df.groupby("country")["total"].sum().reset_index()', 'A DataFrame with columns country, total'],
    tolist: ['Turns a column into a plain Python list.', 'df["country"].unique().tolist()', "['FR', 'IT']"],
    copy: ['A separate copy, so changing it leaves the original alone.', 'clean = df.copy()', 'clean can change, df stays'],
    std: ['Standard deviation: how spread out values are around the mean.', 'df["total"].std()', '84.3'],
    median: ['The middle value when sorted; not pulled by extremes like the mean is.', 'df["total"].median()', '42.0'],
    mean: ['The average.', 'df["total"].mean()', '57.8'],
    sum: ['Adds up the values. On True/False it counts the Trues.', 'df["email"].isna().sum()', '42'],
    count: ['How many values are present (missing ones not counted).', 'df["email"].count()', '958'],
    loc: ['Picks rows and columns by label or condition.', 'df.loc[df["total"] > 100, ["id", "total"]]', 'Big orders, two columns'],
    iloc: ['Picks rows and columns by position (0 = first).', 'df.iloc[-2:, 0]', 'The last two rows, first column'],
    astype: ['Changes a column\'s type.', 'df["id"].astype(str)', '7 → "7"'],
    fit_transform: ['(scikit-learn) Learns from the data and transforms it in one step, e.g. scaling.', 'MinMaxScaler().fit_transform(df[["total"]])', 'Totals squeezed to 0..1'],
    fit_predict: ['(scikit-learn) Fits a model and returns its labels, e.g. outliers or clusters.', 'IsolationForest().fit_predict(df[["total"]])', '1 normal, -1 outlier'],
    jaro_winkler_similarity: ['(jellyfish) How alike two strings are, 0 to 1; catches typos.', 'jaro_winkler_similarity("Martha", "Marhta")', '0.96: probably the same name'],
    soundex: ['(jellyfish) A code for how a word sounds, so different spellings match.', 'soundex("Robert"), soundex("Rupert")', 'R163 and R163'],
    levenshtein_distance: ['(jellyfish) The fewest single-letter edits that turn one string into the other.', 'levenshtein_distance("Gramercy", "Gramecy")', '1: one letter missing'],
    // Lecture 6 and the notebooks (2026-11-25).
    merge: ['Joins two tables on a key column: each row gets the matching row\'s columns from the other table.', 'pd.merge(orders, customers, on="customer_id")', 'Each order with its customer\'s state'],
    concat: ['Stacks tables: under each other (more rows), or side by side with axis=1.', 'pd.concat([jan, feb], ignore_index=True)', 'The rows of jan, then feb, numbered 0, 1, 2 …'],
    pivot_table: ['Long to wide: one row per index value, one column per columns value, an aggregate in each cell.', 'pd.pivot_table(df, values="order_id", index="state", columns="month", aggfunc="count")', 'Orders per state (rows) and month (columns)'],
    melt: ['Wide to long: keeps the id columns and turns every other column into rows.', 'wide.melt(id_vars="state", var_name="month", value_name="n")', 'One row per (state, month)'],
    rename: ['Renames columns (or index labels) through a dict old → new.', 'df.rename(columns={"seller_state": "state"})', 'The column is now called state'],
    how: ['A merge parameter: which rows without a partner stay. "inner" (default), "left", "right" or "outer".', 'pd.merge(a, b, on="id", how="left")', 'Every row of a, NaN where b has no match'],
    on: ['A merge parameter: the key column, or a list of keys that must all match.', 'pd.merge(r17, r18, on=["month", "state"])', 'Rows match when month and state are both equal'],
    suffixes: ['A merge parameter: endings for the columns both tables share (default _x and _y).', 'pd.merge(r17, r18, on="state", suffixes=("_2017", "_2018"))', 'revenue_2017 and revenue_2018'],
    ignore_index: ['A concat parameter: numbers the result\'s rows 0, 1, 2 … again.', 'pd.concat([jan, feb], ignore_index=True)', 'No repeated labels'],
    axis: ['Which way an operation runs: 0 down the rows (per column), 1 across the columns (per row).', 'df.isna().any(axis=1)', 'True for each row with a missing cell'],
    normalize: ['A parameter of value_counts and crosstab: shares that sum to 1 instead of counts.', 'df["segment"].value_counts(normalize=True)', 'Consumer 0.52, Corporate 0.30 …'],
    size: ['Rows per group, missing values included.', 'df.groupby("region").size()', 'Central 2323, East 2848 …'],
    ngroups: ['How many groups a groupby made.', 'df.groupby("region").ngroups', '4'],
    idxmax: ['The label of the largest value.', 'df.groupby("region")["sales"].mean().idxmax()', "'South'"],
    filter: ['Keeps the columns whose name matches: like= a piece of text, regex= a pattern.', 'df.filter(like="zone").columns', 'pickup_zone, dropoff_zone'],
    mode: ['The most frequent value(s), as a Series: take [0] for the first.', 'df["passengers"].mode()[0]', '1.0'],
    abs: ['Absolute value: drops the minus sign.', 'df["fare"].abs()', '-21.0 → 21.0'],
    round: ['Rounds to a number of decimals.', 'df["tip"].mean().round(2)', '1.98'],
    to_datetime: ['Turns text into dates, so .dt works.', 'pd.to_datetime(df["order_purchase_timestamp"]).dt.year', '2017, 2018 …'],
    sort_index: ['Sorts by the index labels instead of the values.', 'df["month"].value_counts().sort_index()', '2018-01, 2018-02, 2018-03'],
    is_unique: ['True when no value of the column (or index) repeats.', 'df["ride_id"].is_unique', 'False: some ids repeat'],
    dayofweek: ['(.dt.dayofweek) The weekday of a date: Monday 0 … Sunday 6.', 'df["pickup"].dt.dayofweek == 6', 'True for Sunday rides'],
    hour: ['(.dt.hour) The hour of a date, 0 to 23.', 'df["pickup"].dt.hour < 5', 'True for night rides'],
    title: ['(.str.title) A capital at the start of each word.', 'df["borough"].str.title()', '"manhattan" → "Manhattan"'],
    sheet_name: ['A read_excel parameter: which sheet to load; None loads them all, as a dict.', 'pd.read_excel("f.xlsx", sheet_name=None)', '{"Sheet1": DataFrame, …}'],
    record_path: ['A json_normalize parameter: the nested list to turn into rows.', 'pd.json_normalize(raw, record_path="labels", meta=["number"])', 'One row per label, with its issue number'],
  };
  // Parameters are shown with =, attributes bare, everything else as a call.
  const PARAMS = new Set(['subset', 'keep', 'how', 'on', 'suffixes', 'ignore_index', 'axis', 'normalize', 'sheet_name', 'record_path']);
  const ATTRS = new Set(['ngroups', 'is_unique', 'dayofweek', 'hour']);

  const names = Object.keys(FN).sort((a, b) => b.length - a.length);
  const RE = new RegExp(`(\\.)?\\b(${names.join('|')})\\b(\\(\\)?|=)?`, 'g');
  const SKIP = new Set(['SCRIPT', 'STYLE', 'TEXTAREA', 'INPUT', 'SELECT', 'BUTTON', 'svg']);

  const plainOk = (m) => m[2].includes('_') || m[1] || m[3];

  function mark(root) {
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode(n) {
        for (let p = n.parentNode; p && p !== root.parentNode; p = p.parentNode) {
          if (p.nodeType !== 1) continue;
          if (SKIP.has(p.nodeName) || p.isContentEditable || p.classList.contains('fn-w') || p.classList.contains('fn-tip'))
            return NodeFilter.FILTER_REJECT;
        }
        RE.lastIndex = 0;
        return RE.test(n.nodeValue) ? NodeFilter.FILTER_ACCEPT : NodeFilter.FILTER_REJECT;
      },
    });
    const hits = [];
    while (walker.nextNode()) hits.push(walker.currentNode);
    for (const n of hits) {
      const text = n.nodeValue;
      const frag = document.createDocumentFragment();
      let last = 0;
      let changed = false;
      RE.lastIndex = 0;
      for (let m = RE.exec(text); m; m = RE.exec(text)) {
        if (!plainOk(m)) continue;
        const start = m.index + (m[1] ? 1 : 0);
        const end = m.index + m[0].length;
        frag.append(text.slice(last, start));
        const w = document.createElement('span');
        w.className = 'fn-w';
        w.dataset.fn = m[2];
        w.tabIndex = 0;
        w.textContent = text.slice(start, end);
        frag.append(w);
        last = end;
        changed = true;
      }
      if (!changed) continue;
      frag.append(text.slice(last));
      n.replaceWith(frag);
    }
  }

  // The tip: one for the page, under the name you are on.
  const tip = document.createElement('div');
  tip.className = 'fn-tip';
  tip.hidden = true;
  tip.setAttribute('role', 'tooltip');
  document.body.append(tip);
  let on = null;
  let hide = 0;

  function show(w) {
    const f = FN[w.dataset.fn];
    if (!f) return;
    clearTimeout(hide);
    on = w;
    tip.innerHTML = '';
    const name = document.createElement('div');
    name.className = 'fn-name';
    name.textContent = w.dataset.fn + (PARAMS.has(w.dataset.fn) ? '=' : ATTRS.has(w.dataset.fn) ? '' : '()');
    const is = document.createElement('p');
    is.className = 'fn-is';
    is.textContent = f[0];
    const more = document.createElement('button');
    more.type = 'button';
    more.className = 'fn-more';
    more.textContent = 'More ▸';
    more.addEventListener('click', (e) => {
      e.stopPropagation();
      const ex = document.createElement('pre');
      ex.textContent = f[1];
      const out = document.createElement('p');
      out.className = 'fn-out';
      out.textContent = '→ ' + f[2];
      more.replaceWith(ex, out);
      place(w);
    });
    tip.append(name, is, more);
    tip.hidden = false;
    place(w);
  }

  function place(w) {
    const r = w.getBoundingClientRect();
    const t = tip.getBoundingClientRect();
    const left = Math.min(Math.max(16, r.left), window.innerWidth - t.width - 16);
    const below = r.bottom + 8 + t.height < window.innerHeight;
    tip.style.left = `${left}px`;
    tip.style.top = `${below ? r.bottom + 8 : Math.max(8, r.top - t.height - 8)}px`;
  }

  const later = () => {
    clearTimeout(hide);
    hide = setTimeout(() => {
      tip.hidden = true;
      on = null;
    }, 220);
  };

  document.addEventListener('mouseover', (e) => {
    const w = e.target.closest?.('.fn-w');
    if (w && w !== on) show(w);
    else if (w || e.target.closest?.('.fn-tip')) clearTimeout(hide);
  });
  document.addEventListener('mouseout', (e) => {
    if (e.target.closest?.('.fn-w') || e.target.closest?.('.fn-tip')) later();
  });
  document.addEventListener('focusin', (e) => {
    const w = e.target.closest?.('.fn-w');
    if (w) show(w);
  });
  document.addEventListener('focusout', (e) => {
    if (e.target.closest?.('.fn-w') && !tip.contains(e.relatedTarget)) later();
  });
  // Touch: a tap opens it; a tap anywhere else closes it.
  document.addEventListener('click', (e) => {
    const w = e.target.closest?.('.fn-w');
    if (w) {
      e.preventDefault();
      e.stopPropagation();
      show(w);
    } else if (!e.target.closest?.('.fn-tip')) {
      tip.hidden = true;
      on = null;
    }
  }, true);
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && !tip.hidden) {
      tip.hidden = true;
      on?.focus();
      on = null;
    }
  });
  window.addEventListener('scroll', () => { if (!tip.hidden && on) place(on); }, { passive: true });

  // Mark what is there, and whatever is drawn later.
  const main = document.querySelector('main') || document.body;
  mark(main);
  let queued = false;
  new MutationObserver(() => {
    if (queued) return;
    queued = true;
    requestAnimationFrame(() => {
      queued = false;
      mark(main);
    });
  }).observe(main, { childList: true, subtree: true });
})();
</script>
</body>
</html>
