<script>
/* ---------- Small drawings: tables in the page's own colours ----------
 * They follow day and night. */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// No maths subscripts on this page: read_csv keeps its underscore.
const subs = html => html;
const text = s => esc(s);
const row = (...items) => `<div class="pic-flow">${items.map(i => `<div class="pic-step">${i}</div>`).join('')}</div>`;
// A cell that starts with * is shaded.
function tbl(head, rows) {
  const td = (v, tag) => { const on = String(v).startsWith('*'); return `<${tag}${on ? ' class="sel"' : ''}>${text(on ? String(v).slice(1) : v)}</${tag}>`; };
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h => td(h, 'th')).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => td(v, 'td')).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const cap = s => (s ? `<span class="pic-cap">${text(s)}</span>` : '');
const flow = steps => `<p class="flow">${steps.map(f => `<span>${esc(f)}</span>`).join('')}</p>`;
// A code box, already given its peeks. Answers are built from these, so they never pass through a second escape.
const code = s => `<pre>${mathHtml(s)}</pre>`;
// The toy table of Lecture 2. rows and cols pick what to shade: both given, only where they cross.
const ORDERS = [['o1', 'Ana', 'FR', '120', 'shipped'], ['o2', 'Ben', 'IT', '80', 'delivered'], ['o3', 'Cleo', 'IT', '250', 'cancelled'], ['o4', 'Dan', 'FR', '60', 'shipped'], ['o5', 'Eva', 'ES', '190', 'returned']];
const COLS = ['customer', 'country', 'total', 'status'];
function orders({ rows = [], cols = [], pos = false, only = false, label = '' } = {}) {
  const on = (r, c) => (rows.length || cols.length) && (!rows.length || rows.includes(r)) && (!cols.length || cols.includes(c));
  const list = only ? ORDERS.filter(r => !rows.length || rows.includes(r[0])) : ORDERS;
  const head = ['', ...COLS.filter(c => !only || !cols.length || cols.includes(c)).map(c => (pos ? `${c} · ${COLS.indexOf(c)}` : c))];
  const body = list.map(r => [pos ? `${r[0]} · ${ORDERS.indexOf(r)}` : r[0], ...COLS.map((c, i) => [c, r[i + 1]]).filter(([c]) => !only || !cols.length || cols.includes(c)).map(([c, v]) => (on(r[0], c) && !only ? `*${v}` : v))]);
  return cap(label) + tbl(head, body);
}
// The mask table of Lecture 2: A is total > 100, B is country == "FR".
const maskTable = () => tbl(['', 'A: total > 100', 'B: FR', 'A & B', 'A | B', '~A'], [['o1', 'True', 'True', '*True', '*True', 'False'], ['o2', 'False', 'False', 'False', 'False', '*True'], ['o3', 'True', 'False', 'False', '*True', 'False'], ['o4', 'False', 'True', 'False', '*True', '*True'], ['o5', 'True', 'False', 'False', '*True', 'False']]);
// The tiny table of Lecture 3, with its four problems. shade lists 'row:column' cells; add puts
// extra columns on the right, each [heading, one value per row], a value starting with * shaded.
// ␣ shows the hidden space in front of ES.
const DQ = [['0', '101', 'Ana', 'FR', '34.0', '120.0', 'shipped'], ['1', '102', 'Ben', 'it', 'NaN', '80.0', 'delivered'], ['2', '103', 'NaN', 'IT', '29.0', '−50.0', 'shipped'], ['3', '104', 'Dan', 'FR', '230.0', '95.0', 'unknown'], ['4', '101', 'Ana', 'FR', '34.0', '120.0', 'shipped'], ['5', '105', 'Eva', '␣ES', '41.0', 'NaN', 'returned']];
const DQ_COLS = ['order_id', 'customer', 'country', 'age', 'total', 'status'];
function dq({ shade = [], add = [], label = '' } = {}) {
  const head = ['', ...DQ_COLS, ...add.map(a => a[0])];
  const body = DQ.map((r, i) => [r[0], ...r.slice(1).map((v, j) => (shade.includes(`${i}:${DQ_COLS[j]}`) ? `*${v}` : v)), ...add.map(a => a[1][i])]);
  return cap(label) + tbl(head, body);
}
const F = 'False';
// Lecture 3's practice table: five clients.
const clients = (label = '') => cap(label) + tbl(['', 'id', 'city', 'age', 'plan'], [['0', '1', 'Paris', '25.0', 'basic'], ['1', '2', 'paris␣', 'NaN', 'pro'], ['2', '3', 'Lyon', '41.0', '?'], ['3', '3', 'Lyon', '41.0', '?'], ['4', '5', 'NaN', '180.0', 'pro']]);
const report3 = () => tbl(['check', 'rows', 'pct'], [['missing value', '*3', '*50.0'], ['status unknown', '1', '16.7'], ['country not standard', '2', '33.3'], ['duplicate row', '1', '16.7'], ['age outside 0-110', '1', '16.7'], ['total below 0', '1', '16.7']]);
const fourLoads = () => tbl(['Load', 'Shape', 'order_id', 'Outcome'], [['df1, no arguments', 'error', '—', 'UnicodeDecodeError: é is not UTF-8'], ['df2, sep="\\t"', 'error', '—', 'the same: decoding fails before the separator is used'], ['df3, + encoding="latin-1"', '(3, 6)', 'int64', 'accents right, but 00417 became 417'], ['*df4, + dtype={"order_id": str}', '*(3, 6)', '*text', '*accents right, 00417 kept']]);
const sixCalls = () => tbl(['Call', 'The question it answers'], [['.shape', 'How many rows and columns?'], ['.dtypes', 'Which type is each column?'], ['.head(10)', 'What do real rows look like?'], ['.info()', 'Where are the NULLs? How much memory?'], ['.describe()', 'Which range do the numbers span?'], ['.value_counts()', 'Which categories exist, and how often?']]);
// Lecture 4's people table: 8 people, 2 cities and 2 weights missing. shade lists 'row:column' cells; set replaces
// a cell's value (a value starting with * is shaded); add puts extra columns on the right.
const PPL = [['0', 'Ana', 'Paris', '160', '55.0'], ['1', 'Ben', 'Milan', '175', '72.0'], ['2', 'Carla', 'NaN', '168', 'NaN'], ['3', 'Dan', 'Paris', '182', '85.0'], ['4', 'Eva', 'Paris', '155', '50.0'], ['5', 'Fabio', 'Milan', '190', 'NaN'], ['6', 'Gia', 'Rome', '171', '63.0'], ['7', 'Hugo', 'NaN', '178', '76.0']];
const PPL_COLS = ['name', 'city', 'height', 'weight'];
function ppl({ shade = [], set = {}, add = [], label = '' } = {}) {
  const head = ['', ...PPL_COLS, ...add.map(a => a[0])];
  const body = PPL.map((r, i) => [r[0], ...r.slice(1).map((v, j) => { const at = `${i}:${PPL_COLS[j]}`; return at in set ? set[at] : shade.includes(at) ? `*${v}` : v; }), ...add.map(a => a[1][i])]);
  return cap(label) + tbl(head, body);
}
// Lecture 5's six orders.
const ORD5 = [['0', '1', 'France', 'web', '30'], ['1', '2', 'Italy', 'shop', '40'], ['2', '3', 'France', 'shop', '10'], ['3', '4', 'Spain', 'web', '40'], ['4', '5', 'Italy', 'web', '70'], ['5', '6', 'France', 'web', '20']];
const ORD5_COLS = ['order_id', 'country', 'channel', 'total'];
function ord5({ shade = [], label = '' } = {}) {
  return cap(label) + tbl(['', ...ORD5_COLS], ORD5.map((r, i) => [r[0], ...r.slice(1).map((v, j) => (shade.includes(`${i}:${ORD5_COLS[j]}`) ? `*${v}` : v))]));
}
const fourMoves = () => tbl(['Move', 'pandas', 'When'], [['Drop', 'dropna(), df[~mask]', 'few rows, certain error'], ['Fill', 'fillna(), interpolate(), KNNImputer', 'a plausible value exists'], ['Correct', 's.where(ok, fix), s.abs()', 'the cause is known'], ['Flag', 'df["x_missing"] = mask', 'keep it, decide later']]);

/* ---------- The course, in plain words ----------
 * Written from the lecture decks; the slides themselves stay private.
 * Every result was rerun in pandas 3. */
// Lecture 6: four linked tables. Order 4 has no item; the chair's order 5 is not in orders.
const f6orders = () => cap('orders') + tbl(['order_id', 'customer_id', 'status', 'month'], [['1', 'c1', 'delivered', '2018-01'], ['2', 'c2', 'delivered', '2018-01'], ['3', 'c1', 'canceled', '2018-02'], ['*4', 'c3', 'unavailable', '2018-02']]);
const f6customers = () => cap('customers') + tbl(['customer_id', 'state'], [['c1', 'SP'], ['c2', 'RJ'], ['c3', 'SP']]);
const f6items = () => cap('items') + tbl(['order_id', 'product', 'price'], [['1', 'lamp', '50'], ['1', 'mug', '10'], ['2', 'desk', '200'], ['3', 'mug', '10'], ['*5', 'chair', '80']]);
const f6payments = () => cap('payments') + tbl(['order_id', 'type', 'value'], [['*1', 'voucher', '20'], ['*1', 'card', '40'], ['2', 'card', '200'], ['3', 'card', '10']]);
const SESSIONS = [
  { n: 1, pages: 37, short: 'DataFrames & loading', title: 'DataFrames and loading data', lede: 'From a raw file to a table you can trust: what a DataFrame is, the three arguments that make a load right, and the six calls to run before changing anything.', groups: [
    { name: 'Why prepare data', flowLabel: 'The path of every dataset', flow: ['Raw file', 'Load', 'Profile', 'Clean', 'Use: chart or model'], cards: [
      { id: 'clean-table', slide: 8, name: 'Every analysis starts from a clean table', what: 'Data rarely arrives ready. Five scraped rental ads for Paris write the same facts five ways: "Marais, 2 rooms, 45 m², €1.650/ month", "MARAIS - 3 pièces - 70 m2 - 2400 EUR", and so on.\n\nAsk "what is the average rent per district?" On the raw text you cannot even start. On the clean table below it is one line of pandas. This class is everything between the raw file and the model: load it, find what is wrong, fix it, shape it.', more: { say: 'The same five ads as a DataFrame. The duplicate ad is gone, and the missing area is NaN, an empty value pandas knows how to skip.', html: () => tbl(['district', 'rooms', 'area_m2', 'rent_eur'], [['Marais', '2', '45.0', '1650.0'], ['Marais', '3', '70.0', '2400.0'], ['Belleville', '2', '*NaN', '1150.0'], ['Belleville', '1', '28.0', '980.0']]) } },
      { id: 'dirty', slide: 9, name: 'Each dirty value changes the answer', what: 'Each kind of mess in the ads gives a wrong number, and none of them raises an error. That is why you look at the data before you compute anything.\n\nThe table lists the five kinds. Real cases are worse: in 2020 England lost 16,000 COVID cases because an old Excel format stops at 65,536 rows, and spreadsheets have turned gene names like SEPT2 into dates.', more: { html: () => tbl(['Raw values', 'Problem', 'If you ignore it'], [['Marais, MARAIS, belleville', 'labels written differently', '4 districts instead of 2'], ['€1.650, €1,150', 'numbers stored as text', 'a sum glues text: "1650980"'], ['45 m², 70m2', 'units inside the value', 'no rent per m²'], ['n/a', 'a hidden missing value', 'the column stays text'], ['line 5 = line 1', 'a duplicate row', 'Marais mean 2025 €, not 1900 €']]) }, watch: 'Garbage in, garbage out: no chart or model can repair the data it is given.' },
    ] },
    { name: 'Pandas and DataFrames', cards: [
      { id: 'dataframe', slide: 13, name: 'Pandas, and what a DataFrame is', what: 'Pandas is Python’s library for tables: it loads, cleans, transforms and analyses them. It is imported under the short name pd, and its results go straight into charts and machine learning.\n\nIts central object is the DataFrame: a table in memory, with labelled rows (the index), named columns, and one type per column. Unlike a spreadsheet, the raw file is never edited: a script writes down every step, and rebuilds the result on every run.', f: `import pandas as pd`, more: { html: () => tbl(['', 'Spreadsheet', 'pandas'], [['Where the steps live', 'in your clicks and memory', 'in a script anyone can read'], ['A number looks wrong', 'search cells and copies', 'reread the script, fix one line'], ['Types', 'set per cell, can be mixed', 'one dtype per column'], ['Size', 'at most 1,048,576 rows', 'millions, limited by memory'], ['Next week’s files', 'redo every step by hand', 'rerun the same script']]) }, watch: 'Spreadsheets stay good for looking and one-off edits. Pandas wins when the work repeats, grows, or must be checked by someone else.' },
      { id: 'build', slide: 17, name: 'Building a Series and a DataFrame', what: 'A Series is one column of values with an index. A DataFrame is several columns sharing that index.\n\nBoth are built from Python lists and dicts. A list gives positions, so the index becomes 0, 1, 2. A dict gives labels: its keys become the index of a Series, or the column names of a DataFrame. A list of dicts gives one row per dict.', f: `pd.Series([10, 20, 30])                  # index 0, 1, 2
pd.Series({"a": 10, "b": 20, "c": 30})   # keys become the index
pd.DataFrame({"order_id": ["00417", "00418"],
              "total": [129.9, 45.0]})   # dict of lists: one column each
pd.DataFrame(records)                    # list of dicts: one row each` },
      { id: 'columns', slide: 18, name: 'A DataFrame is Series sharing one index', what: 'Pick one column of a DataFrame and you get a Series, with the same index as the table. The index is shared by every column.\n\nThis is why the index matters so much: whenever two objects meet, in a sum or a comparison, pandas lines them up by their index.', more: { html: () => tbl(['index', 'order_id', 'country', '*total'], [['0', '00417', 'France', '*129.9'], ['1', '00418', 'Spain', '*45.0'], ['2', '00419', 'Germany', '*NaN']]) + cap('df["total"] is the shaded column: a Series with the index 0, 1, 2') } },
      { id: 'align', slide: 19, name: 'Operations line up labels, not positions', what: 'When you add two Series, pandas matches equal labels, not the first with the first. b meets b, and c meets c.\n\nA label present in only one of the two gets NaN, never a silent shift. The result is a float64 column, because NaN is a float.', f: `s1 = pd.Series([10, 20, 30], index=["a", "b", "c"])
s2 = pd.Series([1, 2, 3], index=["b", "c", "d"])
s1 + s2`, more: { html: () => tbl(['index', 's1', 's2', 's1 + s2'], [['a', '10', '—', '*NaN'], ['b', '20', '1', '21.0'], ['c', '30', '2', '32.0'], ['d', '—', '3', '*NaN']]) }, watch: 'Predict first: many expect 11, 22, 33. Labels win over positions.' },
    ] },
    { name: 'Loading data', cards: [
      { id: 'traps', slide: 21, name: 'One small file, three loading traps', what: 'orders.tsv has three rows and looks harmless. It hides three traps, and each one needs an argument of read_csv.', list: ['Tabs separate the columns, not commas. read_csv expects commas, so pass `sep="\\t"`.', 'Accents are saved in latin-1, not UTF-8. Hélène and Café break the default decoder, so pass `encoding="latin-1"`.', 'Leading zeros. 00417 is an identifier, not a number, so pass `dtype={"order_id": str}` to keep it as text.'], watch: 'The goal: after loading, order_id still reads 00417 and every accent is right.' },
      { id: 'four-loads', slide: 23, name: 'Four loads of the same file', what: 'Each load adds one argument. Two fail, one loads wrongly, and one is right.\n\nThe first two stop on the accent, because the file is decoded before it is split into columns. The third loads, but pandas reads 00417 as the number 417. Only the fourth passes all three arguments.', f: `df1 = pd.read_csv(f)
df2 = pd.read_csv(f, sep="\\t")
df3 = pd.read_csv(f, sep="\\t", encoding="latin-1")
df4 = pd.read_csv(f, sep="\\t", encoding="latin-1",
                  dtype={"order_id": str})`, more: { html: fourLoads }, watch: 'Fix only the encoding and you get shape (3, 1): one column, with the tabs inside the text.' },
      { id: 'silent', slide: 24, name: 'Only the dtype mistake is silent', what: 'A wrong separator is visible: df.shape says (3, 1), one wide column. A wrong encoding is loud: the load stops with UnicodeDecodeError.\n\nA wrong dtype says nothing. 00417 quietly becomes 417, with no error and no warning. So pass `dtype=str` yourself for identifiers, zip codes and phone numbers.', more: { html: () => tbl(['Mistake', 'How it shows'], [['sep', 'visible: shape (3, 1)'], ['encoding', 'loud: UnicodeDecodeError'], ['*dtype', '*silent: 00417 becomes 417']]) } },
      { id: 'excel', slide: 25, name: 'Excel: sheet_name picks the sheet', what: 'read_excel reads the first sheet by default. sheet_name picks one sheet by its name, and `sheet_name=None` reads them all, as a dict with one DataFrame per sheet.\n\nAfter loading, everything works as with a CSV. It needs the openpyxl package installed.', f: `pd.read_excel("orders.xlsx")                        # first sheet
pd.read_excel("orders.xlsx", sheet_name="Refunds")  # one sheet by name
pd.read_excel("orders.xlsx", sheet_name=None)       # dict: {name: DataFrame}` },
      { id: 'json', slide: 27, name: 'JSON: json_normalize flattens', what: 'JSON nests: an order holds a customer, who holds a name and a country, and a list of items. json_normalize turns nested dicts into columns with dotted names: customer.name, customer.country. A nested list stays as it is.\n\nTo get one row per item, name the list with record_path. meta copies the parent’s fields onto every one of those rows.', f: `pd.json_normalize(data)
# order_id, items, customer.name, customer.country

pd.json_normalize(data, record_path="items",
                  meta=["order_id", ["customer", "country"]])`, more: { say: 'Two orders: 00417 with two items, 00418 with one. One row per item, the parent’s fields copied onto each.', html: () => tbl(['sku', 'qty', 'order_id', 'customer.country'], [['A1', '2', '*00417', '*France'], ['B2', '1', '*00417', '*France'], ['C3', '5', '*00418', '*Spain']]) } },
    ] },
    { name: 'Profiling and export', cards: [
      { id: 'profile', slide: 29, name: 'The profile: six calls, then a note', what: 'Before changing anything, run the same six calls on every new dataset. Each answers one question, in the table.\n\nThen write what they found in a comment block at the top of the script: facts first, open questions last. The practice questions are answered from this block alone.', f: `# DATASET PROFILE: orders.tsv
# Rows x columns : 3 x 6
# Column types   : id (text), text, date, number
# Quality issues : 1 NULL in total
# Open questions : why is order 00419 missing a total?`, more: { html: sixCalls }, watch: 'Describe the data before changing it.' },
      { id: 'to-csv', slide: 31, name: 'to_csv writes the index unless told not to', what: 'df.to_csv saves the index as a first column by default. Load the file back and that index returns as an extra column called "Unnamed: 0".\n\nPass `index=False`. Then choose the format by who reads the file next: CSV for any tool, Excel for business users, JSON for web APIs.', f: `df.to_csv("clean.csv")               # reload: ['Unnamed: 0', 'order_id', ...]
df.to_csv("clean.csv", index=False)  # reload: ['order_id', 'customer', ...]`, more: { html: () => tbl(['Format', 'Call', 'Good for', 'Watch out'], [['CSV', 'to_csv(index=False)', 'any tool; readable in Git', 'no dtypes: ids need dtype again'], ['Excel', 'to_excel(index=False)', 'business users; several sheets', 'needs openpyxl; hard to compare'], ['JSON', 'to_json(orient="records")', 'web APIs; nested data', 'repeats the column names on every row']]) } },
      { id: 'read-sql', slide: 33, name: 'read_sql gives the same DataFrame', what: 'A SQL query can feed pandas directly. read_sql sends the query to the database and returns its answer as an ordinary DataFrame.\n\nFrom there it is profiled and handled like any file. The GROUP BY in this query comes back in Session 5 as groupby.', f: `import sqlite3

query = """SELECT country, SUM(total) AS revenue
           FROM orders GROUP BY country"""
df = pd.read_sql(query, con)   # a pandas DataFrame` },
    ] },
  ], practice: [
    { id: 'l1-e1', title: 'Predict the loads', setup: 'orders.tsv has three orders. Its columns are separated by tabs, its accents (Hélène, Café) are saved in latin-1, and its order ids start with zeros, like 00417. For each question, predict first, then open the answer.', parts: [
      ['What does pd.read_csv(f) return?', () => `<p>An error: <b>UnicodeDecodeError</b>. The default decoder is UTF-8, and é saved in latin-1 is not valid UTF-8.</p>`],

  { n: 2, pages: 51, short: 'Selecting, filtering & slicing', title: 'Selecting, filtering and slicing', lede: 'Take only part of a table: columns by name, rows by label, by position or by condition, without ever breaking the original.', groups: [
    { name: 'Selecting columns', cards: [
      { id: 'toy', slide: 5, name: 'One tiny table for every example', what: 'Every example in this lecture uses the same five orders. Each row has a label, o1 to o5: that is the index. Each row also has a position, counted from 0.\n\nColumns too have both: a name, like total, and a position, 0 to 3. Picking columns is SQL’s SELECT. Picking rows is SQL’s WHERE.', f: `df = pd.DataFrame({
    "customer": ["Ana", "Ben", "Cleo", "Dan", "Eva"],
    "country":  ["FR", "IT", "IT", "FR", "ES"],
    "total":    [120, 80, 250, 60, 190],
    "status":   ["shipped", "delivered", "cancelled",
                 "shipped", "returned"]},
    index=["o1", "o2", "o3", "o4", "o5"])`, more: { html: () => orders({ pos: true, label: 'Each label with its position: o3 · 2 is label o3, position 2' }) } },
      { id: 'four-tools', slide: 6, name: 'Four tools select data', what: 'There are four ways to select, and each answers a different kind of question.', more: { html: () => tbl(['Tool', 'Selects', 'Example'], [['df["col"]', 'columns, by name', 'df["total"]'], ['df.loc[ ]', 'rows and columns, by label', 'df.loc["o2", "total"]'], ['df.iloc[ ]', 'rows and columns, by position', 'df.iloc[-2:]'], ['df[mask]', 'rows where a test is True', 'df[df["total"] > 100]']]) } },
      { id: 'brackets', slide: 7, name: '[ ] gives a Series, [[ ]] a DataFrame', what: 'One name in brackets gives a Series: one dimension, shape (5,). A list of names, so double brackets, gives a DataFrame, even with a single name in it: shape (5, 1).\n\nUse a Series for maths on one column of values. Use a DataFrame when you need a table. Columns come back in the order of the list.', f: `df["total"]               # Series, shape (5,)
df[["total"]]             # DataFrame, shape (5, 1)
df[["total", "customer"]] # two columns, in this order
df[["total", "custmer"]]  # KeyError: "['custmer'] not in index"`, more: { say: 'On wide tables, pick columns by pattern or by type instead of typing every name.', f: `df.filter(like="co")            # customer, country
df.filter(regex="^c")           # names starting with c
df.select_dtypes("number")      # total
df.select_dtypes(exclude="number")` } },
    ] },
    { name: 'loc and iloc', cards: [
      { id: 'loc', slide: 12, name: '.loc[rows, columns] selects by label', what: '.loc takes the names you see: the row labels and the column names. It always reads [rows, columns]; leave out the columns, or write :, to keep them all.\n\nWhat comes back depends on what you give. One label makes that dimension disappear: one row and one column give a single value. A list or a slice keeps the dimension, so you get a Series or a DataFrame.', f: `df.loc["o3", "total"]                    # 250, one value
df.loc["o2"]                             # one row: a Series
df.loc[:, "country":"total"]             # two columns
df.loc[["o2", "o4"], ["customer", "total"]]`, more: { html: () => row(orders({ rows: ['o3'], cols: ['total'], label: 'df.loc["o3", "total"] → 250' }), orders({ rows: ['o2', 'o4'], cols: ['customer', 'total'], label: 'df.loc[["o2", "o4"], ["customer", "total"]]' })) } },
      { id: 'iloc', slide: 14, name: '.iloc[rows, columns] selects by position', what: '.iloc counts instead: the first row is 0, the first column is 0. Negative numbers count from the end, so -1 is the last row.\n\nUse .iloc when the question is about order: the first row, the last three, the top ten. Use .loc when it is about which row: order o1, customer Ana.', f: `df.iloc[0, 2]              # 120: row 0, column 2
df.iloc[[0, 2, 4], [1, 3]] # rows 0, 2, 4; country and status
df.iloc[0:3, :]            # positions 0, 1, 2
df.iloc[-3:]               # the last 3 rows`, more: { html: () => row(orders({ rows: ['o1'], cols: ['total'], label: 'df.iloc[0, 2] → 120' }), orders({ rows: ['o3', 'o4', 'o5'], label: 'df.iloc[-3:] → o3, o4, o5' })) } },
      { id: 'sorted', slide: 16, name: 'Sorting moves positions, not labels', what: 'Sort the table by total and the rows change places. Position 0 is now Cleo, the highest total. But label o1 still belongs to Ana: labels travel with their rows.\n\nThe trap is an index of plain numbers, 0 to 4. After sorting, label 0 is no longer at position 0, so .loc[0] and .iloc[0] give different rows. Say what you mean: .loc or .iloc.', f: `s = df.sort_values("total", ascending=False)
s.iloc[0]    # top row: Cleo
s.loc["o1"]  # still Ana

d = df.reset_index(drop=True).sort_values("total", ascending=False)
d.loc[0, "customer"]     # 'Ana': label 0
d.iloc[0]["customer"]    # 'Cleo': position 0`, watch: 'After sorting or filtering, label 0 is no longer the first row.' },
    ] },
    { name: 'Slicing', cards: [
      { id: 'slice', slide: 19, name: 'A slice is start : stop : step', what: 'A slice takes a run of items. It starts at start, stops just before stop, and takes every step-th item. Leave out start and it is 0; leave out stop and it runs to the end.\n\nThe same rules work on lists, strings, .iloc and every position slice in pandas. x[1:4] keeps 4 − 1 = 3 items.', f: `x = ["a", "b", "c", "d", "e", "f"]
x[1:4]    # b, c, d: from 1 up to, not including, 4
x[:3]     # a, b, c: the first 3
x[-2:]    # e, f: the last 2
x[::2]    # a, c, e: every 2nd
x[::-1]   # f ... a: reversed` },
      { id: 'stop', slide: 20, name: 'iloc leaves out the stop, loc includes it', what: 'A position slice stops before its end: .iloc[1:3] gives positions 1 and 2, so 2 rows. A label slice includes its end: .loc["o2":"o4"] gives o2, o3 and o4, so 3 rows.\n\nThe reason: labels have no "next one". You could not write the label after "o4", so pandas includes it. Rows and columns can be sliced at once, and steps and negatives work too.', f: `df.iloc[1:3]                        # o2, o3: 2 rows
df.loc["o2":"o4"]                   # o2, o3, o4: 3 rows
df.iloc[1:4, 0:2]                   # the same rectangle...
df.loc["o2":"o4", "customer":"country"]  # ...spelled with labels
df.iloc[::2]                        # o1, o3, o5
df.iloc[:, -2:]                     # the last 2 columns`, more: { html: () => row(orders({ rows: ['o2', 'o3'], label: 'df.iloc[1:3] → 2 rows' }), orders({ rows: ['o2', 'o3', 'o4'], label: 'df.loc["o2":"o4"] → 3 rows' })) }, watch: 'Plain df[1:3] slices rows by position, and df["o2":"o3"] by label: the reader has to guess. Use df[...] for columns and masks, and .iloc or .loc for rows.' },
    ] },
    { name: 'Boolean masks', cards: [
      { id: 'mask', slide: 26, name: 'A condition makes a mask; df[mask] keeps True rows', what: 'df["total"] > 100 compares every total with 100 at once, with no loop. The answer is a column of True and False with the same index, called a mask.\n\ndf[mask] keeps the rows where the mask is True. A mask can be stored and reused. Since True counts as 1 and False as 0, mask.sum() answers "how many?" and mask.mean() answers "what share?".', f: `mask = df["total"] > 100
df[mask]                  # o1, o3, o5
df[~mask]                 # the other 2 rows
mask.sum()                # 3
mask.mean()               # 0.6: 3 of 5 rows
df.loc[mask, "customer"]  # Ana, Cleo, Eva`, more: { html: () => row(tbl(['', 'total', '> 100'], [['o1', '120', '*True'], ['o2', '80', 'False'], ['o3', '250', '*True'], ['o4', '60', 'False'], ['o5', '190', '*True']]), orders({ rows: ['o1', 'o3', 'o5'], only: true, label: 'df[mask]: the True rows' })) } },
      { id: 'combine', slide: 29, name: 'Combine masks with &, | and ~', what: '& means both are true, | means at least one, and ~ means not. They work row by row, like SQL’s AND, OR and NOT.\n\nPut each test in its own brackets. Python’s `and` and `or` need one single True or False, not a column, so they fail. And & runs before >, so without brackets the line breaks.', f: `A = df["total"] > 100
B = df["country"] == "FR"
df[A & B]   # o1: above 100 and French
df[A | B]   # o1, o3, o4, o5
df[(df["total"] > 100) & (df["country"] == "FR")]   # in one line`, more: { html: maskTable }, watch: 'df[df["total"] > 100 and df["country"] == "FR"] raises ValueError: the truth value of a Series is ambiguous. Without brackets, & runs first and you get a TypeError.' },
      { id: 'loc-mask', slide: 30, name: '.loc: a mask for rows, names for columns', what: 'The rows can come from a mask and the columns from a list of names, in one .loc. That is a full SQL query: SELECT the columns, WHERE the condition.\n\nThis same form is how you change values safely, in the last part.', f: `df.loc[df["total"] > 100, ["customer", "total"]]
# SELECT customer, total FROM df WHERE total > 100`, more: { html: () => orders({ rows: ['o1', 'o3', 'o5'], cols: ['customer', 'total'], label: 'Ana 120, Cleo 250, Eva 190' }) } },
    ] },
    { name: 'All filter conditions', cards: [
      { id: 'compare', slide: 34, name: 'Compare, isin, between', what: 'Six operators compare: ==, !=, >, >=, <, <=. Text needs quotes and exact case: "IT" is not "it".\n\nisin tests a list, so one call replaces a long chain of |. between tests a range and includes both ends by default; inclusive="left" keeps only the start.', f: `df["country"].isin(["FR", "ES"])               # o1, o4, o5   IN
~df["status"].isin(["cancelled", "returned"])  # o1, o2, o4   NOT IN
df["total"].between(80, 190)                   # o1, o2, o5   BETWEEN
df["total"].between(80, 190, inclusive="left") # o1, o2       >= and <` },
      { id: 'isna', slide: 35, name: 'Only isna and notna find missing values', what: 'NaN is not equal to anything, not even to NaN. So rating == np.nan keeps nothing, and every comparison with NaN is False: rating > 4 skips the missing rows too.\n\nTo find missing values, use isna. To keep the present ones, notna.', f: `rating = pd.Series([4.5, None, 3.8, None, 5.0], index=df.index)
rating.isna()       # o2, o4
rating.notna()      # o1, o3, o5
rating == np.nan    # nothing: always False
rating > 4          # o1, o5`, watch: 'Every comparison with NaN is False.' },
      { id: 'str-dt', slide: 37, name: 'Text with .str, dates with .dt, top n', what: '.str runs a text test on every value: contains, startswith, endswith, len. A NaN in the column makes the mask NaN too, so add na=False.\n\n.dt reads a part of a date: year, month, dayofweek. The column must be a real date first: use pd.to_datetime, or parse_dates in read_csv. nlargest keeps the top n rows.', f: `df["status"].str.contains("ship", na=False)  # o1, o4   LIKE '%ship%'
df["customer"].str.startswith("C")           # o3       LIKE 'C%'
df["customer"].str.len() > 3                 # o3
df["date"].dt.year == 2023
df["date"].dt.dayofweek >= 5                 # Saturday, Sunday
df.nlargest(2, "total")                      # o3, o5` },
      { id: 'query', slide: 40, name: '.query() writes a filter as a sentence', what: 'query takes the whole condition as one string, with plain and, or, not and in, and no repeated df[...] or extra brackets. It keeps the same rows as the mask.\n\nUse it for filters with several conditions that colleagues will read. Inside the string, text needs the other kind of quote, @ reads a Python variable, and backticks wrap a column name with spaces.', f: `df.query("total > 100")                     # o1, o3, o5
df.query("country == 'FR' and total > 100") # o1
df.query("status not in ['cancelled', 'returned']")
limit = 100
df.query("total > @limit")                  # a Python variable
df.query("80 <= total <= 190")              # o1, o2, o5
df.query("\`order total\` > 100")            # a name with a space` },
    ] },
    { name: 'Copy-on-Write', cards: [
      { id: 'cow', slide: 43, name: 'A result never changes df', what: 'Any selection or method gives what behaves like a new object. s = df["total"] shares df’s data at first, to save memory. The moment you write to s, pandas copies, then writes.\n\nSo changing a result never changes df, and changing df never changes a result. This is called Copy-on-Write.', f: `s = df["total"]       # shares df's data
s.iloc[0] = 0         # copy first, then write
s.tolist()            # [0, 80, 250, 60, 190]
df["total"].tolist()  # [120, 80, 250, 60, 190]: unchanged` },
      { id: 'chained', slide: 44, name: 'Chained assignment does nothing: use one .loc', what: 'df[df["country"] == "IT"]["total"] = 0 looks right but changes nothing. Python runs it in two steps: the first [ ] makes a new object, and the second changes that object, which is then thrown away. Pandas warns, and df stays as it was.\n\nChange df in one step: a single .loc with the rows and the column. To work on a part of the table on purpose, take it with .copy(), which makes the intent visible.', f: `df[df["country"] == "IT"]["total"] = 0   # does nothing to df

mask = df["country"] == "IT"
df.loc[mask, "total"] = 0                # o2 and o3 become 0

fr = df[df["country"] == "FR"].copy()    # a separate table, on purpose`, more: { html: () => orders({ rows: ['o2', 'o3'], cols: ['total'], label: 'After df.loc[mask, "total"] = 0, the shaded cells hold 0' }) }, watch: 'Exam question: "Why does this line not change df?" Look for two [ ] in a row on the left of =.' },
    ] },

  { n: 3, pages: 42, short: 'Data quality', title: 'Data quality assessment', lede: 'Before cleaning anything, measure what is wrong: missing values, spellings, duplicates and impossible values. Every check is a True/False mask, counted, then collected in one quality report.', groups: [
    { name: 'Assess before you clean', cards: [
      { id: 'four', slide: 5, name: 'Four questions define data quality', what: 'Missing: is the value there? Inconsistent: is it written one way? Duplicate: is each fact recorded once? Inaccurate: is the value possible?\n\nThis session only looks and counts: no line of code changes the data. Fixing comes in the next sessions. Quality depends on the question: one table can be good enough for one analysis and useless for another.', more: { html: () => tbl(['Problem', 'Question', 'In the tiny table'], [['Missing', 'Is the value there?', 'age is NaN in row 1'], ['Inconsistent', 'Is it written one way?', '"FR", "it", "IT", " ES"'], ['Duplicate', 'Is each fact recorded once?', 'order 101 appears twice'], ['Inaccurate', 'Is the value possible?', 'age 230, total −50']]) } },
      { id: 'toy', slide: 6, name: 'One tiny table hides all four problems', what: 'Every example uses these six orders. Each problem appears at least once, so every check has something to find.\n\nNone in a list becomes NaN, a missing value. " ES" starts with a space you cannot see on screen.', f: `df = pd.DataFrame({
    "order_id": [101, 102, 103, 104, 101, 105],
    "customer": ["Ana", "Ben", None, "Dan", "Ana", "Eva"],
    "country":  ["FR", "it", "IT", "FR", "FR", " ES"],
    "age":      [34, None, 29, 230, 34, 41],
    "total":    [120, 80, -50, 95, 120, None],
    "status":   ["shipped", "delivered", "shipped",
                 "unknown", "shipped", "returned"]})`, more: { html: () => dq({ shade: ['1:age', '2:customer', '5:total', '3:status', '1:country', '5:country', '4:order_id', '4:customer', '4:country', '4:age', '4:total', '4:status', '3:age', '2:total'], label: 'Shaded: every cell with a problem. Row 4 repeats row 0.' }) } },
      { id: 'wrong', slide: 7, name: 'Each problem quietly changes an answer', what: 'No error and no warning: pandas returns a number, and a wrong number looks as trustworthy as a right one.\n\n`count()` skips NaN. `nunique()` sees "it" and "IT" as two countries. `sum()` adds order 101 twice. `mean()` is pulled up by the impossible age 230.', f: `df["age"].count()        # 5, the table has 6 rows
df["country"].nunique()  # 4, there are 3 countries
df["total"].sum()        # 365.0, without the copy 245.0
df["age"].mean()         # 73.6, without 230 it is 34.5` },
      { id: 'pattern', slide: 8, name: 'Every check: condition, mask, count', what: 'Each check has three steps. Write a condition that is True where there is a problem. It gives a mask, one True or False per row. Then count the Trues.\n\nTrue counts as 1 and False as 0, so `mask.sum()` is how many rows have the problem and `mask.mean()` what share. A mask only reads df, it never changes it.', f: `mask = df["age"] > 110   # condition → mask
mask.sum()               # 1 row
mask.mean()              # 0.167: 1 of 6 rows`, more: { html: () => dq({ shade: ['3:age'], add: [['age > 110', [F, F, F, '*True', F, F]]] }) } },
    ] },
    { name: 'Missing values', cards: [
      { id: 'nan', slide: 10, name: 'NaN marks an empty cell, and behaves differently', what: 'Put None in a column and pandas stores NaN, Not a Number. NaN is a float, so whole numbers become float64.\n\nPandas skip NaN without telling you: `count()` gives 2 and `mean()` divides by 2, not 3. And NaN is equal to nothing, not even NaN.', f: `s = pd.Series([10, None, 30])
s.dtype           # float64: NaN is a float
len(s)            # 3 rows
s.count()         # 2 values that are there
s.mean()          # 20.0 = (10 + 30) / 2
np.nan == np.nan  # False`, watch: 'Never test x == np.nan: it is always False. Use isna().' },
      { id: 'isna', slide: 12, name: 'isna(), then sum() and mean() per column', what: '`df.isna()` gives a table of the same shape: True where a cell is missing. `notna()` is its opposite; `isnull()` is an older name for isna.\n\nAdd `.sum()` and each column’s Trues are counted: how many are missing. `.mean()` gives the share, and × 100 a percentage. `df.info()` shows the same as its non-null count: with 6 rows, any column below 6 has NaN.', f: `df.isna().sum()          # missing cells per column
df.isna().mean() * 100   # the same, in %
pd.DataFrame({"n_missing": df.isna().sum(),
              "pct": df.isna().mean() * 100})`, more: { html: () => cap('1 missing of 6 rows = 16.7 %') + tbl(['', 'n_missing', 'pct'], [['order_id', '0', '0.0'], ['customer', '*1', '*16.7'], ['country', '0', '0.0'], ['age', '*1', '*16.7'], ['total', '*1', '*16.7'], ['status', '0', '0.0']]) } },
      { id: 'any-row', slide: 13, name: 'any(axis=1) finds the incomplete rows', what: 'isna() gives one True or False per cell. `.any(axis=1)` looks across each row and is True when at least one cell in it is missing: one answer per row, so a mask of incomplete rows.\n\naxis=0 goes down each column, axis=1 across each row. Here 3 rows of 6 are incomplete: half the table.', f: `m = df.isna().any(axis=1)   # one True/False per row
m.sum()                     # 3 incomplete rows
df[m]                       # rows 1, 2 and 5`, more: { html: () => dq({ shade: ['1:age', '2:customer', '5:total'], add: [['any', [F, '*True', '*True', F, F, '*True']]] }) } },
      { id: 'placeholders', slide: 15, name: 'Placeholders hide missing values from isna()', what: 'A placeholder means "we do not know" but is stored as a value: "unknown", "?", "-", "n.d.", -1, 0, 999, "1900-01-01". isna() finds none of them: status has 0 NaN, yet one order is "unknown".\n\nFind them by reading `value_counts()` of text columns and the min and max of number columns. When loading, read_csv turns empty cells, N/A, NA and null into NaN; name any others with `na_values`.', f: `df["status"].isna().sum()    # 0: isna sees nothing
df["status"].value_counts()  # ... unknown 1
pd.read_csv(f)                         # "unknown" stays text
pd.read_csv(f, na_values=["unknown"])  # now NaN too`, more: { html: () => row(cap('pd.read_csv(f): temp is text, 2 missing') + tbl(['', 'city', 'temp'], [['0', 'Paris', '12'], ['1', 'Rome', 'NaN'], ['2', 'Milan', '*unknown'], ['3', 'Lyon', 'NaN']]), cap('na_values=["unknown"]: float64, 3 missing') + tbl(['', 'city', 'temp'], [['0', 'Paris', '12.0'], ['1', 'Rome', 'NaN'], ['2', 'Milan', '*NaN'], ['3', 'Lyon', 'NaN']])) }, watch: 'A number column with dtype str is a clue: a placeholder is keeping it as text.' },

      { id: 'to-numeric', slide: 21, name: 'to_numeric finds text in a number column', what: 'A column of numbers with dtype str always hides at least one value that is not a number. To find it, try to convert: `pd.to_numeric` turns text into numbers.\n\n`errors="coerce"` turns each value it cannot convert into NaN, instead of stopping with an error. Count the NaN: that is how many non-numbers were hiding.', f: `p = pd.Series(["10", "12.5", "n.d.", "8"])

      { id: 'agree', slide: 22, name: 'Related columns must agree', what: 'Some columns are tied by a rule: total must equal qty × price. Write the rule with != ("does not match") and the mask shows the rows that break it.\n\nRules of the same kind: a drop-off after its pick-up, an end date after its start date, total = fare + tip + tolls.', f: `o = pd.DataFrame({"qty":   [2, 1, 3, 2],
                  "price": [5.0, 20.0, 4.0, 10.0],

    { name: 'Duplicates', cards: [
      { id: 'duplicated', slide: 25, name: 'duplicated() flags every repeat after the first', what: 'A duplicate counts one fact twice: order 101 is in the table twice, so `total.sum()` adds 120 that never existed. Duplicates come from files appended twice, forms sent twice, or a merge on the wrong key.\n\n`df.duplicated()` is True when a whole row is identical to an earlier row; the first copy stays False. `keep=False` marks every copy, to read them side by side.', f: `df.duplicated()                # True for row 4 only
df.duplicated().sum()          # 1 extra row
df[df.duplicated(keep=False)]  # rows 0 and 4`, more: { html: () => dq({ add: [['duplicated()', [F, F, F, F, '*True', F]], ['keep=False', ['*True', F, F, F, '*True', F]]] }) } },
      { id: 'subset', slide: 27, name: 'subset= checks a key, not the whole row', what: 'Two rows can share an id and differ elsewhere: id 2 has two prices. They are not identical, so `duplicated()` misses them. `subset="id"` compares only that column, and `is_unique` says in one word whether a key repeats.\n\nWhich price is right is a question for the owner of the data: the check finds the conflict, it does not choose.', f: `k = pd.DataFrame({"id":    [1, 2, 2, 3],
                  "item":  ["pen", "cup", "cup", "mug"],
                  "price": [2.0, 5.0, 5.5, 8.0]})

k.duplicated(subset="id").sum()  # 1: id 2 repeats
k["id"].is_unique                # False` },
    ] },
    { name: 'Accuracy', cards: [
      { id: 'describe', slide: 30, name: 'describe() shows the impossible extremes', what: 'An accurate value is possible and plausible. The quickest look is `describe()`: read min and max first. Max age 230 is impossible; min total −50 is an order that cost less than nothing.\n\nThe mean age, 73.6, is pulled up by that one value. count is 5, not 6: describe skips NaN.', f: `df[["age", "total"]].describe()`, more: { html: () => tbl(['', 'age', 'total'], [['count', '5.0', '5.0'], ['mean', '73.6', '73.0'], ['min', '29.0', '*−50.0'], ['max', '*230.0', '120.0']]) } },
      { id: 'between', slide: 31, name: 'between() tests a range, but NaN fails it too', what: '`between(0, 110)` is True when 0 ≤ age ≤ 110, both ends included; ~ turns it into "outside the range".\n\nThe trap: NaN is never in a range, so ~between also marks the missing age, and you count 2 wrong ages instead of 1. Test only the values that exist, with `notna() &`. Missing values are counted once, in the missing check.', f: `ok = df["age"].between(0, 110)
(~ok).sum()                    # 2: wrong, NaN counted
bad = df["age"].notna() & ~ok
bad.sum()                      # 1: only age 230`, more: { html: () => dq({ shade: ['1:age', '3:age'], add: [['~ok', [F, '*True', F, '*True', F, F]], ['notna & ~ok', [F, F, F, '*True', F, F]]] }) } },
      { id: 'isin', slide: 32, name: 'isin() tests a list of allowed values', what: '`isin(allowed)` is True when the value is in the list, and ~ marks those that are not. "unknown" is not an allowed status: 1 row fails.\n\nThe list comes from the business, not from the data: ask which statuses exist. "cancelled" is allowed even though no order has it.', f: `allowed = ["shipped", "delivered", "returned", "cancelled"]

bad.sum()               # 1

      { id: 'iqr', slide: 33, name: 'An outlier is suspicious, not wrong', what: 'The IQR rule flags values far from the middle. q1 is the value a quarter of the way up the sorted data, q3 three quarters up. iqr = q3 − q1 is the width of the middle half.\n\nAnything more than 1.5 × iqr below q1 or above q3 is an outlier. 30 delivery days may be a typo for 3, or a real lost parcel: the check flags it, a person decides.', f: `days = pd.Series([2, 3, 3, 4, 5, 4, 30])
q1 = days.quantile(0.25)   # 3.0
q3 = days.quantile(0.75)   # 4.5
iqr = q3 - q1              # 1.5
low = q1 - 1.5 * iqr       # 0.75
high = q3 + 1.5 * iqr      # 6.75
days[(days < low) | (days > high)]   # 30` },

    { name: 'The quality report', cards: [
      { id: 'report', slide: 36, name: 'One mask per check, one row per mask', what: 'Give each check a name, as a mask. Then build a table with one row per check: how many rows fail it, and what share.\n\nA row can fail several checks, so the shares do not add up to 100 %. The report shows where the table is weakest: half the rows miss a value. Measure every problem before you fix any.', f: `miss  = df.isna().any(axis=1)

dup   = df.duplicated()

  ], recap: ['Assess before you clean: today no line changes df.', 'Every check is a mask. mask.sum() counts the rows, mask.mean() gives the share.', 'Missing: isna(), and placeholders with value_counts() and min/max.', 'Spellings: nunique() and value_counts(); normalise a copy with .str.strip().str.upper() to count the variants.', 'Duplicates: duplicated() for whole rows, subset= for a key.', 'Accuracy: describe(), between() with notna() &, isin() for allowed values, the IQR rule for outliers.', 'Collect every count in one quality report; a row can fail several checks.'] },
  { n: 4, pages: 63, short: 'Data cleaning', title: 'Data cleaning', lede: 'Last week we measured, today we fix. Three families of errors, three toolboxes: fill what is missing, handle what is implausible, merge what is there twice. Every fix is a decision: make it, count it, write it down.', groups: [
    { name: 'From assessment to cleaning', flowLabel: 'Where this session sits', flow: ['Load', 'Select', 'Assess', 'Clean: today', 'Analyse'], cards: [
      { id: 'four-moves', slide: 4, name: 'Every fix is one of four moves', what: 'Drop: remove the row or the column. Fill: estimate a plausible value. Correct: undo a known mistake, like 1.75 typed in metres. Flag: keep the value, mark it, decide later.\n\nDetection, last session, tells you where a problem is. Choosing the move is a decision about the analysis, not about the code.', more: { html: () => tbl(['Move', 'What it does', 'Example'], [['Drop', 'removes the row or the column', 'a row with every value missing'], ['Fill', 'puts in a plausible value', 'NaN weight → 63.3'], ['Correct', 'undoes a known mistake', '1.75 m → 175.0 cm'], ['Flag', 'keeps it and marks it', '230 + a flag column']]) } },
      { id: 'rules', slide: 5, name: 'Four rules make a cleaning step trustworthy', what: 'Never overwrite the raw file: clean a copy. One problem, one decision, with a reason. Count the rows before and after every step. Write each decision down, in a comment or a docstring.\n\nThen a colleague can rerun your script, get the same table, and understand every change.', f: `clean = df.copy()            # the raw df stays as it was
n0 = len(clean)
clean = clean.drop_duplicates()
print(n0, "→", len(clean))   # 6,508 → 6,468 taxi rides
# exact copies dropped: same ride sent twice` },
    ] },
    { name: 'Missing values: imputation', cards: [
      { id: 'why-missing', slide: 7, name: 'Why a value is missing decides how to fill it', what: 'MCAR, missing completely at random: a sensor drops a reading now and then. The gaps are a fair sample, so a simple fill is unbiased on average.\n\nMAR, missing at random given another column: tips are missing mostly for cash rides. Use that column to fill. MNAR, missing not at random: high earners skip the income question. The value itself hides it, so every fill is biased: flag it and say so.', more: { html: () => tbl(['Kind', 'Example', 'What to do'], [['MCAR', 'a sensor skips a reading', 'any simple fill, or drop a few rows'], ['MAR', 'tips missing for cash rides', 'fill from the related column'], ['MNAR', 'high earners skip income', 'flag it, say so: every fill is biased']]) } },
      { id: 'dropna', slide: 9, name: 'dropna removes rows or columns with NaN', what: 'The people table has 8 rows: 2 cities and 2 weights are missing. `dropna()` removes every row with at least one NaN. `subset=` looks only at some columns, `thresh=` keeps rows with at least that many values, `axis=1` removes columns instead.\n\nEach dropped row takes its known values with it: 3 rows go to delete 4 missing cells, and 8 known values are thrown away. Hugo has a height and a weight, lost because his city is unknown.', f: `p.dropna()                    # 5 rows left
p.dropna(subset=["weight"])   # 6 rows left
p.dropna(thresh=4)            # rows with ≥ 4 values: 5
p.dropna(axis=1)              # columns left: 2`, more: { html: () => ppl({ shade: ['2:city', '2:weight', '5:weight', '7:city'], label: 'Shaded: the 4 missing cells. dropna() removes rows 2, 5 and 7.' }) }, watch: 'Drop rows only when few are affected and the gaps look random (MCAR). how="all" drops only rows that are completely empty.' },
      { id: 'fill-flag', slide: 11, name: 'A constant fills text gaps; a flag remembers them', what: 'Text gaps can take a constant: "Unknown" becomes its own category. `fillna(0)` only when 0 is the truth, like no tolls paid.\n\nCreate the flag before filling: a True/False column that says which values were missing. After the fill you can no longer tell.', f: `f = p.copy()
f["weight_missing"] = f["weight"].isna()   # flag first
f["city"] = f["city"].fillna("Unknown")`, more: { html: () => ppl({ set: { '2:city': '*Unknown', '7:city': '*Unknown' }, add: [['weight_missing', [F, F, '*True', F, F, '*True', F, F]]] }) } },
      { id: 'mean-median', slide: 12, name: 'Mean, median or mode: let the shape choose', what: 'Minutes to commute: 10, 12, 15, 15, 18, 20, 25, 90, and one NaN. One 90-minute trip pulls the mean to 25.6, longer than 7 of the 8 commutes. The median, 16.5, is a typical value.\n\nMean for symmetric columns, median for skewed ones or with outliers, mode for categories. But any single number shrinks the spread: 20 missing grades all become 23.6, and the standard deviation drops from 2.86 to 2.32. The table looks more certain than it is.', f: `m = pd.Series([10, 12, 15, 15, 18, 20, 25, 90, None])
m.mean()                         # 25.6
m.median()                       # 16.5
m.fillna(m.median())
city.fillna(city.mode()[0])      # the most frequent category`, watch: 'Filling with one number makes spread, correlations and tests too optimistic.' },
      { id: 'ffill', slide: 14, name: 'Ordered data: carry forward or interpolate', what: 'When row order means something, like days, a gap can borrow from its neighbours. `ffill()` repeats the last known value, `bfill()` the next one, `interpolate()` draws a straight line between them.\n\nDay 3 and 4 sit between 13 and 16: the line gives 14 and 15.', f: `t = pd.Series([12, 13, None, None, 16, 15, None, 14])
t.ffill()         # 12 13 13 13 16 15 15 14
t.bfill()         # 12 13 16 16 16 15 14 14
t.interpolate()   # 12 13 14 15 16 15 14.5 14`, more: { html: () => tbl(['day', 'temp', 'ffill', 'bfill', 'interpolate'], [['1', '12.0', '12.0', '12.0', '12.0'], ['2', '13.0', '13.0', '13.0', '13.0'], ['3', 'NaN', '*13.0', '*16.0', '*14.0'], ['4', 'NaN', '*13.0', '*16.0', '*15.0'], ['5', '16.0', '16.0', '16.0', '16.0'], ['6', '15.0', '15.0', '15.0', '15.0'], ['7', 'NaN', '*15.0', '*14.0', '*14.5'], ['8', '14.0', '14.0', '14.0', '14.0']]) }, watch: 'Only on ordered rows: on a shuffled table, ffill copies a random neighbour.' },
      { id: 'deduce', slide: 15, name: 'Some values can be computed, not guessed', what: 'If total = qty × price, a missing total is not a mystery: compute it. A deduced value is exact, not estimated.\n\nOther rules of the same kind: borough from zone, age from birth date, city from postcode. Always try a business rule before a statistic.', f: `o["total"] = o["total"].fillna(o["qty"] * o["price"])`, more: { html: () => row(cap('before') + tbl(['', 'qty', 'price', 'total'], [['0', '2', '5.0', '10.0'], ['1', '1', '20.0', '*NaN'], ['2', '3', '4.0', '12.0'], ['3', '2', '10.0', '*NaN']]), cap('after') + tbl(['', 'qty', 'price', 'total'], [['0', '2', '5.0', '10.0'], ['1', '1', '20.0', '*20.0'], ['2', '3', '4.0', '12.0'], ['3', '2', '10.0', '*20.0']])) } },
      { id: 'knn', slide: 16, name: 'KNN fills a gap with the values of similar rows', what: 'Carla is 168 cm, weight unknown. Measure the distance on the known column, height: the 3 closest people are Gia (171), Ben (175) and Ana (160). Their weights are 63, 72 and 55: the average, 63.3, fills the gap.\n\nNo formula to fit: people of similar height have similar weight. KNNImputer does it for a whole table; it works on numbers only and returns a NumPy array, assigned back to the columns. A model can go further: IterativeImputer predicts each column from the others, round after round.', f: `from sklearn.impute import KNNImputer
cols = ["height", "weight"]
imp = KNNImputer(n_neighbors=3)
p[cols] = imp.fit_transform(p[cols])
# Carla 63.3, Fabio (190 cm): Dan 85, Hugo 76, Ben 72 → 77.7`, more: { html: () => ppl({ set: { '2:weight': '*63.3', '5:weight': '*77.7' }, label: 'After KNNImputer(n_neighbors=3)' }) }, watch: 'Distances need columns on the same scale: standardise first, (X - X.mean()) / X.std(). Otherwise income in euros outweighs height in metres.' },
    ] },
    { name: 'Outliers', cards: [
      { id: 'error-or-news', slide: 22, name: 'An outlier is far from the rest: error or news?', what: 'An error is a wrong value: typed, measured or converted wrongly. Correct it if you know the cause, otherwise treat it as missing. A real outlier is rare but true, often the most interesting row: keep it, and flag it if it would distort an average.\n\nGlobal outliers break a column (13 km for 85.0). Local ones break a pattern (3.2 km for 16.5, odd next to tight neighbours). Multivariate ones are normal on each axis and odd together (21 km for 10.0). Look first: a boxplot, a histogram, a scatter.', more: { html: () => tbl(['Kind', 'Ride', 'Why odd'], [['Global', '13.0 km, 85.0', 'far from every other ride'], ['Local', '3.2 km, 16.5', 'normal overall, odd next to its neighbours'], ['Multivariate', '21.0 km, 10.0', 'each value is common, the pair never happens']]) } },
      { id: 'zscore', slide: 25, name: 'The z-score counts standard deviations', what: 'z = (x − mean) / std: how many standard deviations a value is from the mean. Flag |z| > 2 or 3; the cut-off is a choice, and the rule assumes a roughly bell-shaped column.\n\nOne extreme value can hide the others: with a typo of 500 instead of 50, the std grows 14-fold and the 5 looks normal (z = −0.42). This is called masking. In small samples |z| cannot even reach 3: with 11 values the largest possible is (n − 1) / √n = 3.02.', f: `s = pd.Series([20, 21, 26, 24, 29, 22, 21, 50, 28, 27, 5])
z = (s - s.mean()) / s.std()   # mean 24.8, std 10.6
s[z.abs() > 2]                 # 50 (z = 2.38); 5 has z = -1.87`, watch: 'The mean and std are pulled by the outlier itself: masking.' },
      { id: 'robust-z', slide: 27, name: 'The robust z-score uses the median and the MAD', what: 'Replace the mean by the median and the std by the MAD, the median of |x − median|. One value cannot drag them. 0.6745 makes the score comparable to a z; flag |robust z| > 3.5.\n\nHere the median is 24 and the MAD 3 minutes: 50 scores 5.8 and 5 scores −4.3, so both are flagged. Even with the 500 typo, the 5 still scores −4.3.', f: `med = s.median()                 # 24
mad = (s - med).abs().median()   # 3
rz = 0.6745 * (s - med) / mad
s[rz.abs() > 3.5]                # 50 and 5`, watch: 'If more than half the values are equal, the MAD is 0 and the score divides by 0.' },
      { id: 'iqr-fences', slide: 28, name: 'IQR fences: the boxplot rule', what: 'Q1 and Q3 cut off the lowest and highest quarter; IQR = Q3 − Q1 is the width of the middle half. The fences sit 1.5 × IQR outside: here 11.25 and 37.25.\n\nQuartiles ignore how far the extremes are, so there is no masking. The same idea with percentiles: flag below the 1st and above the 99th.', f: `q1, q3 = s.quantile([0.25, 0.75])   # 21.0, 27.5
iqr = q3 - q1                       # 6.5
low, high = q1 - 1.5*iqr, q3 + 1.5*iqr
s[(s < low) | (s > high)]           # 5 and 50` },
      { id: 'knn-lof', slide: 30, name: 'KNN score and LOF compare whole rows', what: 'A multivariate outlier needs distances between whole rows. KNN score: the mean distance to the k nearest rows; far from everyone, high score. LOF, Local Outlier Factor: the density of my neighbours divided by my density. About 1 is normal, above 1.5 an outlier here.\n\nLOF judges each point locally: a 7 mm gap is normal in a sparse group and odd next to a dense one. It flags all three odd rides; the local one ranks 3rd by LOF and only 6th by KNN score.', f: `from sklearn.neighbors import LocalOutlierFactor
Z = (X - X.mean()) / X.std()           # standardise first
lof = LocalOutlierFactor(n_neighbors=5)
labels = lof.fit_predict(Z)            # -1 = outlier
score = -lof.negative_outlier_factor_`, more: { html: () => tbl(['ride', 'km', 'fare', 'KNN score', 'LOF'], [['multivariate', '21.0', '10.0', '*1.84', '*9.9'], ['global', '13.0', '85.0', '*1.71', '*4.9'], ['local', '3.2', '16.5', '0.22', '*3.7'], ['airport', '23.6', '62.5', '0.39', '1.4'], ['city', '5.0', '13.8', '0.05', '1.2']]) }, watch: 'Other detectors you will meet: Grubbs test, Isolation Forest, kernel density, DBSCAN. All give a score or a label; the handling decision is the same.' },

      { id: 'exact-approx', slide: 39, name: 'Duplicates come exact or approximate', what: 'Eight rows of people. `df.duplicated()` finds 1 duplicate; a person sees four: Maria three times, Luca twice, Giulia twice.\n\nVariants come in four kinds: an exact copy; the same with other case and spaces ("maria rossi"); the same with a typo or swapped words ("Maria Rosi", "Verdi Giulia"); and similar but another person ("Mario Rossi").', more: { html: () => tbl(['', 'name', 'city', 'email'], [['0', 'Maria Rossi', 'Milano', 'maria.rossi@mail.it'], ['1', 'Luca Bianchi', 'Roma', 'luca.b@mail.it'], ['2', '*maria rossi', 'milano', 'maria.rossi@mail.it'], ['3', '*Luca Bianchi', 'Roma', 'luca.b@mail.it'], ['4', '*Maria Rosi', 'Milano', 'maria.rossi@mail.it'], ['5', 'Mario Rossi', 'Milano', 'mario.rossi@mail.it'], ['6', 'Giulia Verdi', 'Torino', 'giulia.verdi@mail.it'], ['7', '*Verdi Giulia', 'Torino', 'g.verdi@mail.it']]) } },

      { id: 'similarity', slide: 43, name: 'Similarity turns "almost equal" into a number', what: 'A similarity is a number from 0, nothing in common, to 1, identical. Above a threshold, here 0.85, two strings count as the same.\n\nLevenshtein counts the fewest insertions, deletions or substitutions: Rossi / Rosi is 1 edit, similarity 1 − 1/5 = 0.80. Jaro-Winkler rewards a shared beginning and forgives swapped letters: Fritz / Frizt scores 0.95. Soundex codes how a name sounds: Robert and Rupert are both R163. Jaccard compares sets of words in any order: Giulia Verdi / Verdi Giulia scores 1.00.', f: `import jellyfish

      { id: 'blocking', slide: 51, name: 'Blocking compares only rows that share a key', what: 'Comparing every pair does not scale: n rows give n(n − 1)/2 pairs, 499,500 for 1,000 rows and 20,849,653 for the 6,458 taxi rides. Most pairs are obviously different, Milano against Roma.\n\nBlocking keeps only pairs that share a key, like the city: 15 pairs become 4.', f: `import recordlinkage

/* ---------- Store: this browser first, then the account ---------- */
// The same marks and notes as the Python page, under keys that start with pandas|.
const ON_BRAIN = location.pathname.startsWith('/pandas');
const MARKS_URL = '/api/coding/marks';
const NOTES_URL = '/api/coding/notes';
function readStore(key, empty) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v ?? empty; } catch (e) { return empty; } }
function writeStore(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
let marks = readStore('pandas-marks', {});
let notes = readStore('pandas-notes', []);
const saveLocal = () => { writeStore('pandas-marks', marks); writeStore('pandas-notes', notes); };
const syncEl = document.getElementById('sync');
const fromServer = n => ({ id: n.id, key: n.itemKey, kind: n.kind, body: n.body, answer: n.answer, readAt: n.readAt, createdAt: n.createdAt });
const mine = k => k.startsWith('pandas|');

async function load() {
  if (!ON_BRAIN) { syncEl.textContent = 'Saved in this browser.'; return; }
  try {
    const [mr, nr] = await Promise.all([fetch(MARKS_URL), fetch(NOTES_URL)]);
    if (!mr.ok || !nr.ok) throw new Error('load');
    const sm = Object.fromEntries(Object.entries((await mr.json()).marks || {}).filter(([k]) => mine(k)));
    // Marks made here before signing in go up once; the account's own are never overwritten.
    const up = Object.fromEntries(Object.entries(marks).filter(([k]) => !(k in sm)));
    if (Object.keys(up).length) fetch(MARKS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ marks: up }) }).catch(() => {});
    marks = { ...sm, ...up };
    const server = (await nr.json()).notes.filter(n => mine(n.itemKey)).map(fromServer);
    const local = notes.filter(n => !n.id);
    if (local.length) {
      const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: local.map(n => ({ key: n.key, kind: n.kind, body: n.body })) }) });
      server.push(...(r.ok ? (await r.json()).notes.map(fromServer) : local));
    }
    notes = server;
    saveLocal();
    syncEl.textContent = 'Synced with your account: the same on your phone and computer.';
  } catch (e) { syncEl.textContent = 'Offline: kept in this browser for now.'; }
  renderSession(); renderNotebook(); paintBars(); showFiles(false);
}
function setMark(key, mark) {
  if (marks[key] === mark) delete marks[key]; else marks[key] = mark;
  saveLocal();
  if (ON_BRAIN) fetch(MARKS_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, mark: marks[key] ?? null, note: null }) })
    .catch(() => { syncEl.textContent = 'Offline: the mark is kept in this browser.'; });
}

/* ---------- Notes ---------- */
const noteRef = n => n.id || n.localId;
const notesOf = key => notes.filter(n => n.key === key);
async function addNote(key, kind, body) {
  const text = body.trim();
  if (!text) return;
  const n = { localId: `l${Date.now()}`, key, kind, body: text, answer: null, readAt: null, createdAt: new Date().toISOString() };
  notes.push(n); saveLocal(); paintNotes();
  if (!ON_BRAIN) return;
  try {
    const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: [{ key, kind, body: text }] }) });
    if (!r.ok) throw new Error();
    Object.assign(n, fromServer((await r.json()).notes[0])); delete n.localId; saveLocal();
  } catch (e) { syncEl.textContent = 'Could not save the note to your account; it is kept in this browser.'; }
}
function editNote(ref, kind, body) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n || !body.trim()) return;
  n.kind = kind; n.body = body.trim(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, body: n.body }) })
    .then(r => { if (!r.ok) throw new Error(); syncEl.textContent = 'Note changed.'; })
    .catch(() => { syncEl.textContent = 'Could not save the change to your account; it is kept in this browser.'; });
}
function deleteNote(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  notes = notes.filter(x => x !== n); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'DELETE' }).catch(() => {});
}
function markRead(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  n.readAt = new Date().toISOString(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ read: true }) }).catch(() => {});
}
const KIND = { question: 'Question', comment: 'Note' };
function noteHtml(n) {
  const done = n.kind !== 'question' || (n.answer && n.readAt);
  return `<div class="note${done ? ' done' : ''}" data-kind="${n.kind}" data-ref="${esc(noteRef(n))}">
    <div class="note-head"><span class="note-kind">${KIND[n.kind]}</span><span class="tools"><button type="button" class="n-edit" aria-label="Edit">✎ Edit</button><button type="button" class="n-del" aria-label="Delete">×</button></span></div>
    <div class="note-body">${boldHtml(esc(n.body))}</div>
    ${n.answer ? `<div class="answer"><span class="note-kind">Answer</span><div class="note-body"${n.id ? ` data-hl="pandas|ans|${esc(n.id)}"` : ''}>${boldHtml(esc(n.answer))}</div>${n.readAt ? '' : '<button type="button" class="read">Got it, mark read</button>'}</div>` : ''}
  </div>`;
}
function editorHtml(kind, body) {
  return `<div class="editor" data-kind="${kind}"><div class="kinds" role="radiogroup" aria-label="Kind of note">${Object.entries(KIND).map(([k, l]) => `<button type="button" role="radio" data-kind="${k}" aria-checked="${k === kind}">${l}</button>`).join('')}</div>
    <textarea rows="3" maxlength="2000" aria-label="Your note" placeholder="Write your question or comment">${esc(body)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
/* Asked for 2026-11-08: "all the questions should be in a closed tab by default, so it doesn't make the whole
   lecture longer. I can just open and close them beneath each box." Open stays open while you read; a new
   answer opens its fold. */
const notesOpen = new Set();
function notesFold(key, list) {
  if (!list.length) return '';
  const fresh = list.some(n => n.answer && !n.readAt);
  return `<details class="notes-fold"${notesOpen.has(key) || fresh ? ' open' : ''}><summary>${list.length === 1 ? '1 question or comment' : `${list.length} questions and comments`}${fresh ? ' <span class="new">· new answer</span>' : ''}</summary><div class="notes-in">${list.map(noteHtml).join('')}</div></details>`;
}
document.addEventListener('toggle', e => {
  const f = e.target;
  if (!f.classList?.contains('notes-fold')) return;
  const key = f.closest('[data-key]')?.dataset.key;
  if (key) { if (f.open) notesOpen.add(key); else notesOpen.delete(key); }
}, true);
function paintNotes() {
  paintBoxes();
  for (const card of document.querySelectorAll('.card, .ex[data-key], .ess-item')) {
    const list = notesOf(card.dataset.key);
    card.querySelector('.notes').innerHTML = notesFold(card.dataset.key, list);
    const b = card.querySelector('.note-btn');
    b.setAttribute('aria-pressed', String(list.length > 0));
    b.textContent = list.length ? `Question or comment · ${list.length}` : 'Question or comment';
  }
  renderNotebook();
  applyHighlights();
}
/* ---------- Your own boxes ----------
 * Asked for 2026-11-05: "add ability to create new boxes, so I can write a new box and give it a title".
 * A box is one note under pandas|box|, so it never shows in the notepad: the first line is its title,
 * the rest its text. A new box's unsaved words stay in this browser until it is saved or cancelled. */
const BOX_PREFIX = 'pandas|box|';
const boxKey = (n, gi) => `${BOX_PREFIX}s${n}|g${gi}`;
const boxParts = body => { const at = body.indexOf('\n'); return at < 0 ? [body, ''] : [body.slice(0, at), body.slice(at + 1)]; };
const boxDrafts = () => readStore('pandas-box-drafts', {});
function setBoxDraft(key, draft) {
  const all = boxDrafts();
  if (draft) all[key] = draft; else delete all[key];
  writeStore('pandas-box-drafts', all);
}
function ownBoxHtml(n, part) {
  const [title, words] = boxParts(n.body);
  return `<article class="own-box" data-ref="${esc(noteRef(n))}"><h3><span>${esc(title)}</span><span class="part-tag">${esc(part)}</span><span class="tools"><button type="button" class="box-edit" aria-label="Edit">✎</button><button type="button" class="box-del" aria-label="Delete">×</button></span></h3>${words ? `<div class="words">${boldHtml(esc(words))}</div>` : ''}</article>`;
}

function paintBoxes() {

// Terms in a card's text, and calls in a code box: hoverable, but not coloured.
const TERMS = /\b(DataFrames?|Series|index|masks?|dtypes?|NaN|Copy-on-Write|chained assignment|slices?|alignment|profile|placeholders?|outliers?)\b/g;
// No letters to explain on this page: the code is the formula.
const LETTERS = {};
const CODE_TOKENS = /\.loc\b|\.iloc\b|\.str\b|\.dt\b|\bread_csv\b|\bread_excel\b|\bread_sql\b|\bjson_normalize\b|\bto_csv\b|\bisin\b|\bbetween\b|\bisna\b|\bnotna\b|\bquery\b|\bdtype=|\bsep=|\bencoding=|\bvalue_counts\b|\bdescribe\b|\binfo\b|\bnlargest\b|\.copy\(\)|\breset_index\b|\bsort_values\b|\bselect_dtypes\b|\bnunique\b|\bduplicated\b|\bto_numeric\b|\bquantile\b|\bna_values=|\bmerge\b|\bconcat\b|\bpivot_table\b|\bmelt\b|\bhow=|\bsuffixes=|\bignore_index=/g;
const codeKey = m => m.replace(/^\./, '').replace(/[()=]+$/, '');
const symbolize = escaped => escaped.replace(CODE_TOKENS, m => (PEEK_TERM[codeKey(m)] ? `<span class="kw" data-kw="${codeKey(m)}">${m}</span>` : m));
const letterSpan = (key, shown) => `<span class="kw kw-v" data-kw="${key}">${shown}</span>`;
// Words in prose open their cheat-sheet line; text between backticks is code.
function kwText(s) { return esc(s).split(/`([^`]+)`/).map((p, i) => (i % 2 ? `<code>${symbolize(p)}</code>` : p.replace(TERMS, m => `<span class="kw-t" data-kw="${m.toLowerCase()}">${m}</span>`))).join(''); }
// A code box: calls get their peeks, comments go quiet.
function mathHtml(s) { return symbolize(esc(s)).replace(/(^|[ \t])(# [^\n]*)/gm, '$1<span class="cmt">$2</span>'); }
function readsHtml(r) {
  return `<div class="reads"><p class="flow-label">What each piece means</p><dl>${r.parts.map(([sym, say]) => `<div><dt>${mathHtml(sym)}</dt><dd>${kwText(say)}</dd></div>`).join('')}</dl></div>${r.walk ? `<div class="walk"><p class="flow-label">Worked out, step by step</p><p>${kwText(r.walk.intro)}</p><dl class="steps"><div class="steps-head"><dt>The piece</dt><dd>Gives</dd></div>${r.walk.steps.map(([piece, nums, result]) => `<div${result ? ' class="result"' : ''}><dt>${mathHtml(piece)}</dt><dd>${mathHtml(nums)}</dd></div>`).join('')}</dl></div>` : ''}`;
}
const PARA = String.fromCharCode(10, 10);
const paras = t => t.split(PARA).map(p => `<p>${kwText(p)}</p>`).join('');
// A rule in a list: its first sentence is its title, the rest says when it holds and when it fails.
function ruleHtml(r) {
  const at = r.search(/\.\s/);
  return at < 0 ? `<li>${kwText(r)}</li>` : `<li><b>${kwText(r.slice(0, at + 1))}</b><span>${kwText(r.slice(at + 2))}</span></li>`;
}
function cardHtml(s, c, gi) {
  const key = cardKey(s.n, c.id), m = marks[key] || '';
  const r = READS[`${s.n}|${c.id}`], x = c.more || {};
  return `<article class="card" id="c-${s.n}-${c.id}" data-key="${esc(key)}" data-mark="${m}">
    <h3><span class="num">${c.num.split('.')[1]}</span><span>${esc(c.name)}</span>${partTag(s, gi)}</h3>
    ${paras(c.what)}
    ${c.list ? `<ol class="rules">${c.list.map(ruleHtml).join('')}</ol>` : ''}
    ${c.f ? `<pre>${mathHtml(c.f)}</pre>` : ''}
    ${x.html ? x.html() : ''}
    ${r ? readsHtml(r) : ''}
    ${x.say ? `<p>${kwText(x.say)}</p>` : ''}${x.f ? `<pre>${mathHtml(x.f)}</pre>` : ''}
    ${c.watch ? `<p class="watch"><b>Watch out</b>${kwText(c.watch)}</p>` : ''}
    <div class="notes"></div>
    <div class="foot"><button type="button" class="note-btn" aria-pressed="false">Question or comment</button>${caseOf(key) ? '<button type="button" class="case-btn" aria-controls="case-pad">The case</button>' : ''}${ON_BRAIN && c.slide ? `<a class="slide-link" href="/api/coding/slides/Pandas${s.n}.pdf#page=${c.slide}" target="_blank" rel="noopener" aria-label="Slide ${c.slide} of ${s.pages}">Slide ${c.slide}<span class="of">/${s.pages}</span> ›</a>` : ''}
      ${marksHtml(m)}</div>
  </article>`;
}
// The three dots: how well you know a card or a summary idea.
const marksHtml = m => `<span class="marks" role="group" aria-label="How well do you know this?">${[['got', 'Got it'], ['mid', 'Confused'], ['late', 'Super confused']].map(([k, l]) => `<button type="button" class="mark m-${k}" data-mark="${k}" data-label="${l}" aria-label="${l}" aria-pressed="${m === k}"></button>`).join('')}</span>`;

function filterRef(q) {

  for (const g of document.querySelectorAll('.ref-group')) g.hidden = !g.querySelector('.ref-row:not([hidden])');
  document.getElementById('ref-none').hidden = !!document.querySelector('.ref-row:not([hidden])');

const DEEP_STOP = new Set('with that this from into they each than what when your have will only them then there their which every rows row column columns value values df pd the and for are not one two per'.split(' '));
const deepWords = t => new Set(String(t || '').toLowerCase().match(/[a-z_][a-z0-9_]{2,}/g)?.filter(w => !DEEP_STOP.has(w)) || []);
function deepCards(s, e) {
  const cards = (SESSIONS.find(x => x.n === s.n)?.groups || []).flatMap(g => g.cards);
  if (e.cards) return e.cards.map(id => cards.find(c => c.id === id)).filter(Boolean);
  const want = deepWords(`${e.name} ${e.is} ${e.f || ''}`);
  const named = deepWords(e.name);
  const scored = cards.map(c => {
    const has = deepWords(`${c.name} ${c.what} ${c.f || ''} ${c.more?.say || ''}`);
    const title = deepWords(c.name);
    let score = 0;
    for (const w of want) if (has.has(w)) score += title.has(w) ? 3 : 1;
    for (const w of named) if (title.has(w)) score += 4;
    return { c, score };
  }).filter(x => x.score >= 4).sort((a, b) => b.score - a.score);

}

/* Asked for 2026-11-19: "a system for bold that works well, like all the notebooks in colourbrain". The write box
   is rich: B, Ctrl/Cmd+B or **two stars** show bold at once. Its value is still plain text, bold as **…**, so notes
   stay the same everywhere they are shown. */
function richText(root) {
  let out = '';
  const walk = (node, bold) => {
    for (const n of node.childNodes) {
      if (n.nodeType === 3) { out += n.nodeValue.replace(/ /g, ' '); continue; }
      if (n.nodeType !== 1) continue;
      const tag = n.tagName;
      if (tag === 'BR') { out += '\n'; continue; }
      const block = tag === 'DIV' || tag === 'P';
      if (block && out && !out.endsWith('\n')) out += '\n';
      const b = !bold && (tag === 'B' || tag === 'STRONG' || Number(n.style?.fontWeight) >= 600 || n.style?.fontWeight === 'bold');
      if (b) {
        const start = out.length;
        walk(n, true);
        const inner = out.slice(start);
        const lead = inner.match(/^\s*/)[0], trail = inner.slice(lead.length).match(/\s*$/)[0], core = inner.trim();
        out = out.slice(0, start) + (core ? `${lead}**${core}**${trail}` : inner);
      } else walk(n, bold);
    }
  };
  walk(root, false);
  return out.replace(/\u200b/g, '').replace(/\*\*\*\*/g, '').replace(/\n+$/, '');
}
