<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pandas · School</title>
<script>
  // Day (beige) or night, one choice for every School page, remembered on this device. Day by default.
  try { document.documentElement.dataset.theme = localStorage.getItem('school-theme') || 'day'; } catch (e) {}
  try { const size = Number(localStorage.getItem('pandas-text-size')); if (size) document.documentElement.style.setProperty('--read', size); } catch (e) {}
</script>
<style>
  /* Scrollbars: ochre on beige, never grey (docs/specs/visual-identity.md). */
  html { scrollbar-width: thin; scrollbar-color: #b08a45 #efe3cc; }
  html[data-theme="night"] { scrollbar-color: #c6a05c #3a3125; }
  /* School's paper: beige by day, warm dark by night. Kept sober on purpose: one session at a time. */
  :root, [data-theme="day"] {
    --paper: #f7f3ea; --card: #fbf8f1; --ink: #2b2620; --soft: #6f665a; --line: #e3dccd;
    --accent: #8a5a2b; --code: #efe7d6;
    --got: #2f7a4f; --mid: #b07a12; --late: #8a5a9e; --q: #985a22; --c: #357a4f;
    --nb-bg: #efe5d2; --nb-top: #e5d6b9; --nb-rule: #d6c3a0;
  }
  [data-theme="night"] {
    --paper: #191714; --card: #201d19; --ink: #ece6da; --soft: #a49b8d; --line: #34302a;
    --accent: #d9a46a; --code: #15130f;
    --got: #7cc49a; --mid: #e0b45a; --late: #c39be0; --q: #e0a06a; --c: #86c29f;
    --nb-bg: #221c15; --nb-top: #2c241a; --nb-rule: #45392a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.6 Georgia, 'Times New Roman', serif; }
  button, select, textarea { font-family: system-ui, sans-serif; }
  /* --read is the text size from the notepad. zoom grows the writing and the width of the boxes together. */
  :root { --read: 1; }
  main { zoom: var(--read); max-width: 760px; margin: 0 auto; padding: 24px 18px 90px; overflow-wrap: break-word; }
  .cards, .card, .seg { min-width: 0; }
  .pic-body, .pic-step { grid-template-columns: minmax(0, 1fr); }
  .cards, .card, .practice, .pq .ans { grid-template-columns: minmax(0, 1fr); }
  .card table { display: block; max-width: 100%; overflow-x: auto; }
  .topline { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; }
  .back { font: 600 14px system-ui, sans-serif; color: var(--accent); text-decoration: none; }
  .theme { font: 600 14px system-ui, sans-serif; color: var(--accent); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 14px; min-height: 36px; cursor: pointer; }
  .theme:hover { border-color: var(--accent); }
  .course { margin: 0; color: var(--soft); font: 13px/1.4 system-ui, sans-serif; letter-spacing: .02em; }
  h1 { font-size: 32px; font-weight: 600; margin: 6px 0 0; line-height: 1.2; }
  /* Which session you are in: top left, outside the boxes, and it stays while scrolling. */
  .where { position: sticky; top: 0; z-index: 3; margin: 22px -18px 0;  padding: 8px 18px; background: var(--paper); font: 600 13px/21px  ui-monospace, Consolas, monospace; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
  .lede { margin: 6px 0 0; color: var(--soft); }

  /* The three sessions: one shown at a time. */
  .sessions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 22px 0 6px; }
  .sess.ref { align-content: start; border-style: dashed; }
  .sess.ref[aria-selected="true"] { border-style: solid; }
  /* Cheat sheet: one line per term, found by typing. */
  .ref-search { position: sticky; top: 37px; z-index: 2; width: 100%; margin: 18px 0 0; min-height: 42px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 15px system-ui, sans-serif; box-shadow: 0 6px 18px color-mix(in srgb, var(--paper) 80%, transparent); }
  .ref-search:focus { outline: none; border-color: var(--accent); }
  .ref-group h2 { margin: 28px 0 6px; }
  .ref { margin: 0; display: grid; }
  .ref-row { display: grid; grid-template-columns: minmax(0, 15em) minmax(0, 1fr); gap: 4px 16px; padding: 9px 0; border-bottom: 1px solid var(--line); }
  .ref-row dt { font: 600 14px/1.5 ui-monospace, 'Cascadia Code', Consolas, monospace; overflow-wrap: anywhere; }
  .ref-row dd { margin: 0; display: grid; gap: 6px; font-size: 15px; }
  .ref-row dd pre { font-size: 13px; padding: 6px 10px; }
  .ref-go { justify-self: start; padding: 0; border: 0; background: none; color: var(--soft); font: 600 12px system-ui, sans-serif; cursor: pointer; min-height: 24px; }
  .ref-go:hover { color: var(--accent); }
  .chart-group { display: grid; gap: 14px; margin-top: 26px; }
  .chart-group h2 { margin: 0; font-size: 19px; color: var(--ochre); }
  .chart-row { display: grid; grid-template-columns: minmax(0, 340px) minmax(0, 1fr); gap: 22px; align-items: start; padding: 16px; border-radius: 12px; background: var(--card); border: 1px solid var(--line); }
  .chart-fig { min-width: 0; }
  .chart-fig .pic-flow { flex-direction: column; align-items: stretch; }
  .chart-text { display: grid; gap: 8px; min-width: 0; }
  .chart-text h3 { margin: 0; font-size: 17px; }
  .chart-parts { display: grid; gap: 4px; margin: 0; }
  .chart-parts > div { display: grid; grid-template-columns: minmax(64px, max-content) 1fr; gap: 10px; }
  .chart-parts dt { font: 13px ui-monospace, Consolas, monospace; }
  .chart-parts dd { margin: 0; }
  .chart-read { margin: 0; color: var(--soft); }
  @media (max-width: 760px) { .chart-row { grid-template-columns: minmax(0, 1fr); } }
  .sess { display: grid; gap: 6px; text-align: left; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); color: var(--ink); cursor: pointer; font: 14px/1.3 system-ui, sans-serif; }
  .sess b { font: 600 12px ui-monospace, Consolas, monospace; color: var(--accent); }
  .sess[aria-selected="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .bar { height: 4px; border-radius: 99px; background: var(--line); overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--got); width: 0; transition: width .3s; }

  h2 { font-size: 21px; font-weight: 600; margin: 34px 0 10px; }
  .group-note { margin: -4px 0 12px; color: var(--soft); font-size: 15px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font: 600 13px ui-monospace, Consolas, monospace; margin: 4px 0 0; }
  .flow span { padding: 3px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--card); }
  .flow em { color: var(--soft); font-style: normal; }
  .flow-label { margin: 10px 0 4px; font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }

  /* A card: name, what it does, an example, then one quiet line of controls. */
  .cards { display: grid; gap: 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px; display: grid; gap: 8px; scroll-margin-top: 20px; }
  .card[data-mark="got"] { border-color: color-mix(in srgb, var(--got) 55%, var(--line)); }
  .card[data-mark="mid"] { border-color: color-mix(in srgb, var(--mid) 55%, var(--line)); }
  .card[data-mark="late"] { border-color: color-mix(in srgb, var(--late) 55%, var(--line)); }
  /* How clear a card is, at a glance: a long bar down its right edge in the colour of its dot. */
  article.card { position: relative; padding-right: 26px; }
  article.card::after { content: ''; position: absolute; right: 8px; top: 12px; bottom: 12px; width: 5px; border-radius: 3px; background: color-mix(in srgb, var(--line) 70%, transparent); transition: background .3s; }
  article.card[data-mark="got"]::after { background: var(--got); }
  article.card[data-mark="mid"]::after { background: var(--mid); }
  article.card[data-mark="late"]::after { background: var(--late); }
  .card.flash { box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 35%, transparent); }
  /* Overall: questions and comments about the course as a whole, above the sessions. */
  .card.overall { margin-top: 18px; border-style: dashed; padding-bottom: 12px; }
  .card.overall h3 { font-size: 16px; }
  .card.overall .hint { color: var(--soft); font-size: 14.5px; }
  .card h3 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  .num { font: 12px ui-monospace, Consolas, monospace; color: var(--soft); flex: none; }
  .card p { margin: 0; }
  pre { margin: 0; padding: 10px 12px; border-radius: 8px; background: var(--code); font: 13.5px/1.55 ui-monospace, 'Cascadia Code', Consolas, monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
  .kw { color: var(--accent); font-weight: 600; }
  .cm { color: var(--soft); }
  .watch { font-size: 15px; padding: 7px 11px; border-radius: 8px; background: color-mix(in srgb, var(--q) 9%, transparent); }
  .watch b { font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--q); margin-right: 6px; }
  .foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .note-btn { display: inline-flex; align-items: center; gap: 6px; padding: 3px 11px; min-height: 30px; border-radius: 999px; border: 1px dashed color-mix(in srgb, var(--q) 55%, transparent); background: none; color: var(--ink); opacity: .7; font: 600 12.5px system-ui, sans-serif; cursor: pointer; }
  .note-btn::before { content: '✎'; color: var(--q); }
  .note-btn:hover, .note-btn[aria-pressed="true"] { opacity: 1; border-style: solid; }
  .marks { display: flex; gap: 4px; margin-left: auto; }
  .mark { position: relative; width: 40px; height: 40px; padding: 0; border: 0; background: none; cursor: pointer; display: grid; place-items: center; }
  .mark::before { content: ''; width: 20px; height: 20px; border-radius: 50%; border: 2px solid var(--dot); opacity: .45; }
  .mark:hover::before { opacity: .9; }
  .mark[aria-pressed="true"]::before, .mark:active::before { background: var(--dot); opacity: 1; }
  .mark::after { content: attr(data-label); position: absolute; bottom: calc(100% + 2px); left: 50%; transform: translateX(-50%); white-space: nowrap; font: 600 12px system-ui, sans-serif; padding: 2px 9px; border-radius: 999px; background: var(--dot); color: var(--paper); opacity: 0; pointer-events: none; transition: opacity .15s; }
  .mark:hover::after, .mark:focus-visible::after, .mark:focus::after { opacity: 1; }
  /* The last dot sits at the right edge: its label opens leftwards so it is never cut off. */
  .mark.m-late::after { left: auto; right: 0; transform: none; }
  .m-got { --dot: var(--got); } .m-mid { --dot: var(--mid); } .m-late { --dot: var(--late); }

  /* Highlights: light, see-through colours over the text, as on the Python page. */
  mark.hl { --hl: #f2c14e; background: color-mix(in srgb, var(--hl) 38%, transparent); color: inherit; border-radius: 3px; padding: 0 1px; cursor: pointer; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  mark.hl[data-c="green"] { --hl: #6fbf8e; }
  mark.hl[data-c="blue"] { --hl: #7aa6e6; }
  mark.hl[data-c="pink"] { --hl: #e48fb4; }
  mark.hl[data-c="orange"] { --hl: #f08a3c; }
  [data-theme="night"] mark.hl { background: color-mix(in srgb, var(--hl) 30%, transparent); }
  #sel-bar { position: fixed; z-index: 75; display: flex; align-items: center; gap: 4px; padding: 5px; border-radius: 999px; background: var(--card); border: 1px solid var(--line); box-shadow: 0 8px 24px rgb(0 0 0 / .2); }
  #sel-bar .sb-c { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--card); background: color-mix(in srgb, var(--hl) 60%, var(--card)); cursor: pointer; box-shadow: 0 0 0 1px var(--line); }
  #sel-bar .sb-c:hover { box-shadow: 0 0 0 2px var(--hl); }
  #sel-bar .sb-btn { min-height: 30px; padding: 3px 12px; border: 0; border-radius: 999px; background: color-mix(in srgb, var(--q) 16%, var(--card)); color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  #sel-bar .sb-com { background: color-mix(in srgb, var(--c) 16%, var(--card)); }
  #sel-bar .sb-sep { width: 1px; height: 20px; background: var(--line); margin: 0 2px; }
  /* The picture: a small visual on a tiny made-up shop at the top of each session. */
  .pic { margin: 18px 0 0; border: 1px solid var(--line); border-radius: 12px; background: var(--card); }
  .pic > summary { cursor: pointer; list-style: none; display: flex; align-items: center; padding: 10px 14px; font: 600 15px system-ui, sans-serif; color: var(--accent); }
  .pic > summary::-webkit-details-marker { display: none; }
  .pic > summary::after { content: '▸ open'; margin-left: auto; font: 600 12px system-ui, sans-serif; color: var(--soft); }
  .pic[open] > summary::after { content: '× close'; }
  .pic-body { padding: 0 14px 14px; display: grid; gap: 10px; }
  .pic-lede { margin: 0; font-size: 15px; }
  .pic-flow { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; }
  .pic-next { display: flex; align-items: center; gap: 10px; min-width: 0; max-width: 100%; }
  .pic-arrow { color: var(--soft); font: 600 18px system-ui, sans-serif; }
  .pic-step { display: grid; gap: 4px; min-width: 0; max-width: 100%; align-self: flex-start; }
  .pic-cap { font: 600 12px ui-monospace, Consolas, monospace; color: var(--accent); }
  .pic-note { font: 13px/1.4 system-ui, sans-serif; color: var(--soft); max-width: 34ch; }
  .pic table { font-size: 12.5px; }
  .pic th, .pic td { padding: 3px 9px 3px 6px; }
  .pic .key { box-shadow: inset 0 -2px 0 var(--accent); }
  .pic .sel { background: color-mix(in srgb, var(--got) 16%, transparent); }
  .pic .new { background: color-mix(in srgb, var(--mid) 18%, transparent); }
  .pic tr.off td { opacity: .35; text-decoration: line-through; }
  /* Columns a clause reads, keeps or makes; groups in colour; and the little key that names them. */
  .pic .read, .xmore .read { border-radius: 0; background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--accent) 60%, transparent), inset -2px 0 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  .pic th.read, .xmore th.read { box-shadow: inset 2px 0 0 color-mix(in srgb, var(--accent) 60%, transparent), inset -2px 0 0 color-mix(in srgb, var(--accent) 60%, transparent), inset 0 2px 0 color-mix(in srgb, var(--accent) 60%, transparent); }
  .pic tr.ga td { background: color-mix(in srgb, var(--got) 12%, transparent); }
  .pic tr.gb td { background: color-mix(in srgb, var(--q) 12%, transparent); }
  .pic tr.gc td { background: color-mix(in srgb, var(--late) 12%, transparent); }
  .key-read, .key-sel, .key-new, .key-off, .key-grp { display: inline-block; margin: 0 8px 4px 0; padding: 1px 7px; border-radius: 5px; font: 600 11.5px ui-monospace, Consolas, monospace; color: var(--ink); }
  .key-read { background: color-mix(in srgb, var(--accent) 10%, transparent); box-shadow: inset 2px 0 0 color-mix(in srgb, var(--accent) 60%, transparent), inset -2px 0 0 color-mix(in srgb, var(--accent) 60%, transparent); border-radius: 0; }
  .key-sel { background: color-mix(in srgb, var(--got) 16%, transparent); }
  .key-new { background: color-mix(in srgb, var(--mid) 18%, transparent); }
  .key-off { text-decoration: line-through; opacity: .5; }
  .key-grp { background: color-mix(in srgb, var(--q) 12%, transparent); }
  .pic-chart { display: grid; gap: 4px; min-width: min(320px, 100%); }
  .pic-title { margin: 0 0 4px; font: 600 14px system-ui, sans-serif; }
  .pic-bar { display: grid; grid-template-columns: 8.5em 1fr auto; align-items: center; gap: 8px; font: 12.5px system-ui, sans-serif; }
  .pic-bar i { display: block; height: 12px; border-radius: 3px; background: var(--accent); opacity: .75; }
  .pic-bar b { font: 500 11.5px ui-monospace, Consolas, monospace; color: var(--soft); }
  /* Slide link on a card, and the private-files line. */
  .slide-link { font: 600 12.5px system-ui, sans-serif; color: var(--soft); text-decoration: none; padding: 3px 4px; }
  .slide-link:hover { color: var(--accent); }
  .slide-link .of { font-weight: 400; opacity: .75; }
  .files { margin-top: 28px; padding: 12px 14px; border: 1px dashed var(--line); border-radius: 12px; font: 14px system-ui, sans-serif; color: var(--soft); display: grid; gap: 8px; }
  .files b { color: var(--ink); }
  .files-up { justify-self: start; display: inline-flex; align-items: center; min-height: 34px; padding: 4px 14px; border-radius: 999px; background: var(--accent); color: var(--paper); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .files-up input { display: none; }
  .kw-chip { text-transform: none; letter-spacing: 0; font: 600 12px ui-monospace, Consolas, monospace; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; cursor: help; }
  .kw-chip i { font-style: normal; color: var(--soft); margin-left: 5px; }
  .kw-chip:hover { border-color: var(--accent); }
  /* Keyword peek: hover a keyword for a moment and its cheat-sheet box opens on the side. */
  .kw[data-kw], .kw-t { cursor: help; border-radius: 3px; }
  .kw.kw-v { color: inherit; font-weight: inherit; }
  .kw[data-kw]:hover, .kw-t:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
  .peeks { position: fixed; z-index: 58; zoom: var(--read); right: 30px; top: 86px; width: min(348px, calc((100vw - 8px) / var(--read))); max-height: calc((100vh - 96px) / var(--read)); padding: 10px 14px 18px; overflow-y: auto; display: grid; gap: 22px; align-content: start; }
  .peek { display: grid; gap: 8px; padding: 12px 14px 12px; border-radius: 14px; background: var(--card); border: 1px solid var(--accent); box-shadow: 0 5px 14px rgb(0 0 0 / .14); }
  /* Capital X (the variable) and small x (one value) never look alike: X upright, bold and larger; x a curved italic. */
  .kw-v[data-kw="X"] { font-weight: 700; font-size: 1.12em; font-style: normal; }
  .kw-v[data-kw="x"] { font-family: Georgia, 'Times New Roman', serif; font-style: italic; font-size: 1.08em; }
  .peek .kw[data-kw], .peek .kw-t { text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: color-mix(in srgb, var(--accent) 60%, transparent); }
  .peek .peek-from { background: color-mix(in srgb, var(--accent) 30%, transparent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent); border-radius: 3px; }
  .peek-links { position: fixed; inset: 0; z-index: 59; width: 100vw; height: 100vh; pointer-events: none; overflow: visible; }
  .peek-links path { fill: none; stroke: var(--accent); stroke-width: 2; }
  .peek-links circle { fill: var(--accent); }
  .peek-top { display: flex; align-items: flex-start; gap: 8px; }
  .peek-term { margin: 0; font: 600 14.5px/1.45 ui-monospace, 'Cascadia Code', Consolas, monospace; flex: 1; overflow-wrap: anywhere; }
  .peek-close { flex: none; width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--soft); cursor: pointer; font-size: 16px; }
  .peek p { margin: 0; }
  .peek pre { font-size: 12.5px; padding: 6px 10px; }
  .peek .ref-go { color: var(--accent); }
  .peek-more { font: 600 12px system-ui, sans-serif; color: var(--soft); }
  @media (max-width: 900px) { .peeks { right: 2px; left: 2px; top: auto; bottom: 2px; width: auto; max-height: calc(60vh / var(--read)); } }
.bold-btn { position: fixed; z-index: 80; width: 28px; height: 28px; padding: 0; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 700 14px Georgia, serif; cursor: pointer; opacity: .75; }
.bold-btn:hover { opacity: 1; border-color: var(--accent); }
textarea[aria-label="Your note"] { padding-right: 40px !important; }
  /* Notes: questions and comments */
  .notes { display: grid; gap: 6px; }
  .note { --nc: var(--q); border-radius: 8px; padding: 7px 11px; background: color-mix(in srgb, var(--nc) 9%, transparent); display: grid; gap: 3px; font-family: system-ui, sans-serif; font-size: 14.5px; }
  .note[data-kind="comment"] { --nc: var(--c); }
  .note-head { display: flex; align-items: center; gap: 8px; }
  .note-kind { font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--nc); }
  .note-kind::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--nc); margin-right: 6px; vertical-align: 1px; }
  .note.done .note-kind::before { background: none; box-shadow: inset 0 0 0 1.5px var(--nc); }
  .tools { margin-left: auto; display: flex; }
  .tools button { min-width: 28px; min-height: 28px; border: 0; background: none; color: var(--soft); cursor: pointer; border-radius: 6px; font: 600 13px system-ui, sans-serif; }
  .tools button.armed { background: var(--late); color: var(--paper); padding: 0 8px; }
  .note-body { white-space: pre-wrap; overflow-wrap: anywhere; }
  .answer { border-left: 3px solid var(--nc); padding-left: 9px; margin-top: 2px; }
  .read { justify-self: start; min-height: 28px; padding: 2px 10px; border-radius: 999px; border: 1px solid var(--nc); background: none; color: var(--ink); font: 600 12px system-ui, sans-serif; cursor: pointer; }
  .editor { display: grid; gap: 7px; }
  .editor textarea, .nb-write textarea { width: 100%; font: 15px system-ui, sans-serif; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; resize: vertical; }
  .kinds, .acts { display: flex; gap: 6px; flex-wrap: wrap; }
  .kinds button, .acts button { min-height: 32px; padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .kinds button[aria-checked="true"] { background: var(--q); border-color: var(--q); color: var(--paper); }
  .kinds button[data-kind="comment"][aria-checked="true"] { background: var(--c); border-color: var(--c); }
  .acts .save { background: var(--ink); border-color: var(--ink); color: var(--paper); }

  /* Your own boxes, at the end of a segment. */
  .own-boxes { display: grid; grid-template-columns: minmax(0, 1fr); gap: 12px; margin-top: 12px; }
  .own-box, .box-editor { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; display: grid; gap: 8px; }
  .seg .own-box, .seg .box-editor { background: color-mix(in srgb, var(--tint), var(--card)); border-color: transparent; }
  .own-box h3 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; overflow-wrap: anywhere; }
  .own-box .words { white-space: pre-wrap; overflow-wrap: anywhere; }
  .box-editor input, .box-editor textarea { width: 100%; color: var(--ink); background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; }
  .box-editor input { font: 600 16px system-ui, sans-serif; }
  .box-editor input[aria-invalid="true"] { border-color: var(--late); }
  .box-editor textarea { font: 15px system-ui, sans-serif; resize: vertical; }
  .box-add { justify-self: start; min-height: 30px; padding: 3px 11px; border: 1px dashed var(--line); border-radius: 999px; background: none; color: var(--soft); font: 500 13px system-ui, sans-serif; cursor: pointer; }
  .box-add:hover { color: var(--ink); border-color: var(--soft); }

  /* Practice: the question first, the answer behind a tap. */
  .practice { display: grid; gap: 8px; }
  .pq { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 14px; }
  .pq > summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: baseline; }
  .pq > summary::-webkit-details-marker { display: none; }
  .pq > summary::after { content: 'Answer ▸'; margin-left: auto; font: 600 12.5px system-ui, sans-serif; color: var(--accent); white-space: nowrap; }
  .pq[open] > summary::after { content: 'Hide ▾'; }
  .pq[open] > summary { margin-bottom: 10px; }
  .pq .ans { display: grid; gap: 8px; }
  .out-head { font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; font: 13px ui-monospace, Consolas, monospace; }
  th, td { text-align: left; padding: 3px 12px 3px 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { color: var(--soft); font-weight: 600; }
  .null { color: var(--soft); font-style: italic; }
  .more-rows { font: 12.5px system-ui, sans-serif; color: var(--soft); }
  .recap { margin: 0; padding-left: 20px; }
  .recap li { margin: 4px 0; }
  /* Summary: each lecture's essentials, one box per idea. */
  .ess-fold { border: 1px solid var(--line); border-radius: 12px; background: var(--card); padding: 10px 14px; }
  .ess-fold > summary { cursor: pointer; list-style: none; display: flex; gap: 10px; align-items: baseline; }
  .ess-fold > summary::-webkit-details-marker { display: none; }
  .ess-fold > summary::after { content: 'Open ▸'; margin-left: auto; font: 600 12.5px system-ui, sans-serif; color: var(--accent); white-space: nowrap; }
  .ess-fold[open] > summary::after { content: 'Hide ▾'; }
  .ess-fold[open] > summary { margin-bottom: 10px; }
  .ess { display: grid; gap: 12px; margin: 4px 0 18px; }
  .ess-item { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; display: grid; gap: 8px; }
  .ess-item h3 { margin: 0; font-size: 17px; font-weight: 600; display: flex; gap: 10px; align-items: baseline; }
  .ess-is { margin: 0; font-size: 16px; }
  .ess-ex { margin: 0; }
  .ess-ex b { margin-right: 4px; }
  .ess-breath { margin-top: 6px; }
  .sync { margin-top: 36px; color: var(--soft); font: 13px system-ui, sans-serif; }

  /* The notepad on the right: the same dot and paper as Practice. */
  .nb-dot { position: fixed; z-index: 55; right: 10px; top: 50%; width: 22px; height: 22px; padding: 0; border-radius: 50%; cursor: pointer; border: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); background: var(--nb-bg); }
  .nb-dot::after { content: ''; position: absolute; inset: -11px; }
  .nb-dot:hover, .nb-dot[aria-expanded="true"] { border-color: var(--accent); }
  .nb-dot.has-notes { background: var(--accent); }
  .nb-dot.on-sheet { right: 5px; }
  .notebook { position: fixed; z-index: 60; right: 16px; top: 16px; bottom: 16px; width: min(420px, calc(100vw - 32px)); overflow: auto; background: var(--nb-bg); border: 1px solid var(--nb-rule); border-radius: 16px; box-shadow: 0 18px 48px rgb(0 0 0 / .3); --line: var(--nb-rule); --card: color-mix(in srgb, var(--nb-bg) 70%, #fff 30%); }
  .rf-dot { position: fixed; z-index: 61; right: 10px; top: calc(50% + 36px); width: 22px; height: 22px; padding: 0; border-radius: 50%; cursor: pointer; border: 2px solid var(--ochre); background: color-mix(in srgb, var(--ochre) 35%, var(--nb-bg)); box-shadow: 0 2px 8px rgb(0 0 0 / .18); }
  .rf-dot::after { content: ''; position: absolute; inset: -7px -11px; }
  .rf-dot:hover, .rf-dot[aria-expanded="true"] { background: var(--ochre); }
  .rf-dot.on-sheet { right: 5px; }
  .fc-dot { position: fixed; z-index: 61; right: 10px; top: calc(50% + 72px); width: 22px; height: 22px; padding: 0; border-radius: 50%; cursor: pointer; border: 2px solid var(--c); background: color-mix(in srgb, var(--c) 30%, var(--nb-bg)); box-shadow: 0 2px 8px rgb(0 0 0 / .18); }
  .fc-dot::after { content: ''; position: absolute; inset: -7px -11px; }
  .fc-dot:hover, .fc-dot[aria-expanded="true"] { background: var(--c); }
  .fc-dot.on-sheet { right: 5px; }
  .fc-q { margin: 4px 0 0; font: 600 14px system-ui, sans-serif; color: var(--ink); }
  .fc-scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
  .fc-scale button, .fc-where button { min-height: 34px; padding: 4px 6px; border-radius: 8px; border: 1px solid var(--nb-rule); background: var(--card); color: var(--ink); font: 13px system-ui, sans-serif; cursor: pointer; }
  .fc-scale button[aria-checked="true"], .fc-where button[aria-pressed="true"] { background: var(--c); border-color: var(--c); color: var(--nb-bg); font-weight: 600; }
  .fc-where { display: flex; flex-wrap: wrap; gap: 4px; }
  .fc-where button { min-height: 30px; padding: 2px 10px; border-radius: 999px; }
  .fc-item { display: grid; gap: 2px; padding: 8px 11px; border-radius: 12px; border: 1px solid var(--nb-rule); background: var(--card); font: 13.5px/1.4 system-ui, sans-serif; }
  .fc-item time { font: 600 12px system-ui, sans-serif; color: var(--c); }
  .fc-item p { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--ink); }
  .rf-from { margin: 0; font: 13px system-ui, sans-serif; color: var(--soft); }
  .rf-saved.bad { color: var(--accent); }
  .rf-item { display: grid; gap: 3px; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--nb-rule); background: var(--card); }
  .rf-block { font: 600 12px system-ui, sans-serif; color: var(--ochre); }
  .rf-body { margin: 0; font: 14px/1.45 system-ui, sans-serif; color: var(--ink); white-space: pre-wrap; overflow-wrap: anywhere; }
  .rf-all { font: 600 14px system-ui, sans-serif; color: var(--accent); }
  [data-theme="night"] .notebook { --card: color-mix(in srgb, var(--nb-bg) 85%, #fff 15%); }
  .nb-top { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; padding: 12px 10px 12px 16px; background: var(--nb-top); border-bottom: 1px solid var(--nb-rule); }
  .nb-title { font-size: 20px; font-weight: 600; color: var(--accent); margin-right: auto; }
  .text-size { display: inline-flex; align-items: center; gap: 4px; margin: 0 8px 0 auto; }
  .text-size button { min-width: 36px; height: 34px; padding: 0 6px; border-radius: 8px; border: 1px solid var(--nb-rule); background: var(--card); color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .text-size button:disabled { opacity: .4; cursor: default; }
  .text-size output { min-width: 3.1em; text-align: center; font: 600 12px system-ui, sans-serif; color: var(--soft); }
  .nb-close { width: 34px; height: 34px; border-radius: 50%; border: 1px solid var(--nb-rule); background: var(--card); color: var(--ink); font-size: 17px; cursor: pointer; }
  .nb-write { display: grid; gap: 8px; padding: 14px 16px; border-bottom: 1px solid var(--nb-rule); }
  .about { display: flex; align-items: center; gap: 8px; font: 14px system-ui, sans-serif; color: var(--soft); min-width: 0; }
  .about select { flex: 1; min-width: 0; width: 100%; min-height: 34px; font: 13px ui-monospace, Consolas, monospace; color: var(--ink); background: var(--card); border: 1px solid var(--nb-rule); border-radius: 8px; padding: 3px 6px; }
  .nb-write .acts .save { background: var(--accent); border-color: var(--accent); }
  .saved { margin: 0; min-height: 1.2em; font: 13px system-ui, sans-serif; color: var(--got); }
  .nb-list { display: grid; gap: 10px; padding: 12px 16px 16px; }
  .nb-group { display: grid; gap: 6px; padding: 9px 11px; border-radius: 12px; border: 1px solid var(--nb-rule); background: var(--card); }
  .nb-group.here { border-color: var(--accent); }
  .nb-fold { display: grid; gap: 10px; }
  .nb-fold > summary { justify-self: start; list-style: none; padding: 5px 14px; border-radius: 999px; border: 1px solid var(--nb-rule); background: var(--card); color: var(--soft); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .nb-fold > summary::-webkit-details-marker { display: none; }
  .nb-fold > summary::after { content: ' ›'; }
  .nb-fold[open] > summary::after { content: ' ‹'; }
  .rf-new { justify-self: start; padding: 0; border: 0; background: none; color: var(--soft); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .rf-new:hover { color: var(--accent); }
  .rf-add { display: flex; gap: 6px; }
  .rf-add input { flex: 1; min-width: 0; min-height: 34px; padding: 3px 8px; font: 14px system-ui, sans-serif; color: var(--ink); background: var(--card); border: 1px solid var(--nb-rule); border-radius: 8px; }
  .rf-add button { padding: 0 12px; border-radius: 8px; border: 1px solid var(--nb-rule); background: var(--card); color: var(--ink); font: 600 13px system-ui, sans-serif; cursor: pointer; }
  .nb-go { text-align: left; padding: 0; border: 0; background: none; color: var(--ink); font: 600 14px system-ui, sans-serif; cursor: pointer; min-height: 28px; }
  .nb-go .t { font: 600 11px ui-monospace, Consolas, monospace; color: var(--nb-bg); background: var(--accent); border-radius: 6px; padding: 1px 6px; margin-right: 6px; }
  .nb-here { font: 600 12px system-ui, sans-serif; color: var(--accent); margin-left: 6px; }
  .empty { color: var(--soft); font: 14px system-ui, sans-serif; margin: 0; }

  /* Pandas: formulas, exercises and the small drawings. */
  .seg { --tint: oklch(0.80 0.11 var(--h, 250) / 0.30); --title: oklch(0.45 0.13 var(--h, 250)); }
  [data-theme="night"] .seg { --tint: oklch(0.62 0.12 var(--h, 250) / 0.20); --title: oklch(0.84 0.11 var(--h, 250)); }
  .seg > h2 { color: var(--title); }
  .part-no { display: block; margin-bottom: 2px; font: 600 12px system-ui, sans-serif; letter-spacing: .04em; color: var(--ochre); }
  .part-tag { margin-left: auto; flex-shrink: 0; font: 500 11px system-ui, sans-serif; color: var(--ochre); white-space: nowrap; }
  .ex h3 { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; }
  .own-box .tools { margin-left: 0; }
  .seg + .seg { margin-top: 36px; border-top: 1px solid color-mix(in srgb, var(--ochre) 45%, transparent); }
  .seg { position: relative; }
  :root { --ochre: #b08a45; }
  [data-theme="night"] { --ochre: #c6a05c; }
  .seg-rail { position: absolute; left: -16px; top: 26px; bottom: 0; width: 14px; background: radial-gradient(circle, var(--ochre) 1.1px, transparent 1.5px) center top / 4px 9px repeat-y; }
  .seg-tab:hover { color: var(--ink); }
  .seg-tab { position: sticky; top: 46px; display: block; width: 14px; padding: 7px 0; border: 0; background: var(--paper); color: var(--ochre); font: 500 11px/14px system-ui, sans-serif; letter-spacing: .02em; writing-mode: vertical-rl; white-space: nowrap; cursor: pointer; }
  .seg .card, .seg .pq { background: color-mix(in srgb, var(--tint), var(--card)); border-color: transparent; }
  .seg .card pre, .seg .pq pre, .seg .card .watch { background: color-mix(in srgb, var(--paper) 72%, transparent); }
  .seg .num, .seg .ex-num { color: var(--title); opacity: 1; font-weight: 700; }
  .card .sel { background: color-mix(in srgb, var(--got) 18%, transparent); }
  .card table { font-size: 12.5px; }
  .card th, .card td { padding: 3px 9px 3px 6px; }
  .steps { margin: 0; padding-left: 22px; display: grid; gap: 8px; }
  .walk { display: grid; gap: 6px; }
  .walk .flow-label { margin: 0; }
  .steps { margin: 0; padding: 4px 12px; border-radius: 8px; background: color-mix(in srgb, var(--paper) 72%, transparent); font: 13.5px/1.45 ui-monospace, 'Cascadia Code', Consolas, monospace; }
  .steps > div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 2px 14px; padding: 6px 0; border-bottom: 1px solid var(--line); }
  .steps > div:last-child { border-bottom: 0; }
  .steps dt, .steps dd { margin: 0; overflow-wrap: anywhere; }
  .steps-head dt, .steps-head dd { font: 600 11.5px/1.4 system-ui, sans-serif; letter-spacing: .05em; text-transform: uppercase; color: var(--soft); }
  .steps .result dt, .steps .result dd { color: var(--ink); font-weight: 700; }
  .reads dl { margin: 0; display: grid; }
  .reads dl > div { display: grid; grid-template-columns: minmax(0, 8.5em) minmax(0, 1fr); gap: 2px 12px; padding: 5px 0; border-bottom: 1px solid var(--line); }
  .reads dl > div:last-child { border-bottom: 0; }
  .reads dt { font: 600 13.5px/1.5 ui-monospace, 'Cascadia Code', Consolas, monospace; overflow-wrap: anywhere; }
  .reads dd { margin: 0; font-size: 15px; line-height: 1.45; }
  .reads .flow-label { margin: 0 0 2px; }
  sub, sup { font-size: .72em; line-height: 0; }
  .ex { display: grid; gap: 8px; padding: 12px 0 4px; }
  .ex > .foot { margin-top: 2px; }
  .ex-pic { display: grid; gap: 8px; }
  .ex-pic .out-head { margin: 6px 0 0; }
  .ex { grid-template-columns: minmax(0, 1fr); }
  .ex-given td { white-space: normal; }
  .ex-given td:last-child { min-width: 150px; font-family: system-ui, sans-serif; }
  .ex-sub { margin: 4px 0 0; font: 600 13px system-ui, sans-serif; color: var(--ink); }
  .ex-read { margin: 0; font-size: 14.5px; color: var(--soft); }
  .laws { display: grid; gap: 10px; margin-top: 6px; padding: 10px 12px; border-radius: 10px; border-left: 3px solid var(--accent); background: color-mix(in srgb, var(--accent) 6%, transparent); }
  .laws .out-head { margin: 0; }
  .law { display: grid; gap: 3px; }
  .law-name { margin: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font: 14px system-ui, sans-serif; }
  .law pre { margin: 0; }
  .law-here { margin: 2px 0 0; font: 600 11px system-ui, sans-serif; letter-spacing: .06em; text-transform: uppercase; color: var(--soft); }
  .ex h3 { margin: 0; font-size: 17px; font-weight: 600; }
  .ex-num { font: 600 12px ui-monospace, Consolas, monospace; color: var(--accent); margin-right: 8px; }
  .ex-setup { margin: 0; }
  .ans p { margin: 0; }
  .ans .sel, .ex .sel { background: color-mix(in srgb, var(--got) 16%, transparent); }
  .venn { margin: 0; width: 170px; max-width: 100%; }
  .venn svg, .tree { display: block; width: 100%; height: auto; }
  figcaption { margin-top: 4px; font: 12.5px/1.35 system-ui, sans-serif; color: var(--soft); }
  .pmf { margin: 0; width: 310px; max-width: 100%; }
  .curve svg { display: block; width: 100%; height: auto; }
  .pmf.narrow { width: 170px; }
  .pmf-plot { position: relative; height: 104px; margin: 14px 0 0 34px; border-bottom: 1px solid var(--soft); border-left: 1px solid var(--soft); }
  .pmf-yt { position: absolute; left: 0; right: 0; height: 0; border-top: 1px dashed var(--line); }
  .pmf-yt em { position: absolute; right: calc(100% + 5px); top: 0; transform: translateY(-50%); font: normal 11px ui-monospace, Consolas, monospace; color: var(--soft); }
  .pmf-yname { font: 11px system-ui, sans-serif; color: var(--soft); }
  .pmf-xname { margin: -8px 0 0 34px; text-align: center; font: 11px system-ui, sans-serif; color: var(--soft); }
  .pmf-bar { position: absolute; bottom: 0; width: 18px; transform: translateX(-50%); border-radius: 4px 4px 0 0; background: var(--accent); }
  .pmf-bar.thin { width: 9px; border-radius: 3px 3px 0 0; }
  .pmf-bar.dim { opacity: .3; }
  .pmf-bar b { position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%); padding-bottom: 1px; font: 500 11px ui-monospace, Consolas, monospace; color: var(--ink); white-space: nowrap; }
  .pmf-x { position: relative; margin-left: 34px; height: 32px; font: 11.5px ui-monospace, Consolas, monospace; color: var(--soft); }
  .pmf-x span { position: absolute; top: 3px; transform: translateX(-50%); }
  .pmf-x i { position: absolute; top: 15px; transform: translateX(-50%); font-style: normal; font-size: 11px; color: var(--ink); }

  /* The map: a vertical pill on the left that opens into stacks of segments. */
  [data-seg], .card { scroll-margin-top: 46px; }
  .where-btn { display: block; width: 100%; padding: 0; border: 0; background: none; font: inherit; letter-spacing: inherit; text-transform: inherit; text-align: left; color: var(--accent); cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .where-btn.tinted { color: oklch(0.45 0.13 var(--h, 60)); }
  [data-theme="night"] .where-btn.tinted { color: oklch(0.84 0.11 var(--h, 60)); }
  .map-pill { position: fixed; z-index: 50; left: max(12px, calc(50vw - 380px * var(--read) - 110px)); top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 7px; width: 32px; padding: 10px 0 12px; border-radius: 999px; border: 1px solid var(--line); background: var(--card); color: var(--ink); cursor: pointer; box-shadow: 0 4px 14px rgb(0 0 0 / .10); }
  .map-pill[hidden], .map[hidden] { display: none; }
  .map-pill:hover { border-color: var(--accent); }
  .map-pill b { font: 700 11px/1 ui-monospace, Consolas, monospace; }
  /* A life bar: one segment per part, filled up to the part you are reading. */
  .map-pill .ln { display: flex; flex-direction: column; gap: 3px; }
  .map-pill i { display: block; width: 8px; height: 18px; border-radius: 3px; background: color-mix(in srgb, var(--ochre) 22%, transparent); }
  .map-pill i.past { background: color-mix(in srgb, var(--ochre) 70%, transparent); }
  .map-pill i.here { background: var(--ochre); }
  .map-pill .pn { font: 700 11px/1 ui-monospace, Consolas, monospace; color: var(--ochre); }
  .map-pill .of { display: none; }
  /* Four looks, changed with a double-click on the pill (pandas-pill-look). Bar is the default. */
  .map-pill[data-look="line"] .ln { gap: 0; }
  .map-pill[data-look="line"] i { width: 3px; height: 20px; border-radius: 0; }
  .map-pill[data-look="line"] i:first-child { border-radius: 2px 2px 0 0; }
  .map-pill[data-look="line"] i:last-child { border-radius: 0 0 2px 2px; }
  .map-pill[data-look="line"] i + i { box-shadow: 0 -1px 0 var(--card); }
  .map-pill[data-look="steps"] .ln { gap: 4px; }
  .map-pill[data-look="steps"] i { width: auto; height: auto; background: none; font: 600 11px/1.1 ui-monospace, Consolas, monospace; color: color-mix(in srgb, var(--ochre) 40%, transparent); }
  .map-pill[data-look="steps"] i::before { content: attr(data-n); }
  .map-pill[data-look="steps"] i.past { color: color-mix(in srgb, var(--ochre) 75%, transparent); }
  .map-pill[data-look="steps"] i.here { color: var(--ink); font-weight: 800; }
  .map-pill[data-look="steps"] .pn { display: none; }
  .map-pill[data-look="gauge"] .ln { gap: 0; padding: 2px; border-radius: 6px; border: 1px solid color-mix(in srgb, var(--ochre) 45%, transparent); }
  .map-pill[data-look="gauge"] i { width: 6px; height: 16px; border-radius: 0; background: none; }
  .map-pill[data-look="gauge"] i.past, .map-pill[data-look="gauge"] i.here { background: var(--ochre); }
  .map-pill[data-look="gauge"] .of { display: inline; font-weight: 500; opacity: .7; }
  .map { position: fixed; z-index: 60; left: 0; top: 0; bottom: 0; width: min(310px, 86vw); padding: 12px 12px 20px; overflow-y: auto; background: var(--paper); border-right: 1px solid var(--line); box-shadow: 4px 0 24px rgb(0 0 0 / .16); font: 13.5px/1.35 system-ui, sans-serif; }
  .map button { font: inherit; color: var(--ink); cursor: pointer; }
  .map-top { display: flex; align-items: center; justify-content: space-between; color: var(--soft); font-weight: 600; font-size: 12px; letter-spacing: .05em; text-transform: uppercase; }
  .map .map-close { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line); background: none; color: var(--soft); font-size: 16px; }

<script>
/* ---------- Small drawings: tables in the page's own colours ----------
 * They follow day and night. */
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// No maths subscripts on this page: read_csv keeps its underscore.
const subs = html => html;
const text = s => esc(s);
const row = (...items) => `<div class="pic-flow">${items.map(i => `<div class="pic-step">${i}</div>`).join('')}</div>`;
// A cell that starts with * is shaded.
function tbl(head, rows) {
  const td = (v, tag) => { const on = String(v).startsWith('*'); return `<${tag}${on ? ' class="sel"' : ''}>${text(on ? String(v).slice(1) : v)}</${tag}>`; };
  return `<div class="tbl-wrap"><table><thead><tr>${head.map(h => td(h, 'th')).join('')}</tr></thead><tbody>${rows.map(r => `<tr>${r.map(v => td(v, 'td')).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const cap = s => (s ? `<span class="pic-cap">${text(s)}</span>` : '');
const flow = steps => `<p class="flow">${steps.map(f => `<span>${esc(f)}</span>`).join('')}</p>`;
// A code box, already given its peeks. Answers are built from these, so they never pass through a second escape.
const code = s => `<pre>${mathHtml(s)}</pre>`;
// The toy table of Lecture 2. rows and cols pick what to shade: both given, only where they cross.
const ORDERS = [['o1', 'Ana', 'FR', '120', 'shipped'], ['o2', 'Ben', 'IT', '80', 'delivered'], ['o3', 'Cleo', 'IT', '250', 'cancelled'], ['o4', 'Dan', 'FR', '60', 'shipped'], ['o5', 'Eva', 'ES', '190', 'returned']];
const COLS = ['customer', 'country', 'total', 'status'];
function orders({ rows = [], cols = [], pos = false, only = false, label = '' } = {}) {
  const on = (r, c) => (rows.length || cols.length) && (!rows.length || rows.includes(r)) && (!cols.length || cols.includes(c));
  const list = only ? ORDERS.filter(r => !rows.length || rows.includes(r[0])) : ORDERS;
  const head = ['', ...COLS.filter(c => !only || !cols.length || cols.includes(c)).map(c => (pos ? `${c} · ${COLS.indexOf(c)}` : c))];
  const body = list.map(r => [pos ? `${r[0]} · ${ORDERS.indexOf(r)}` : r[0], ...COLS.map((c, i) => [c, r[i + 1]]).filter(([c]) => !only || !cols.length || cols.includes(c)).map(([c, v]) => (on(r[0], c) && !only ? `*${v}` : v))]);
  return cap(label) + tbl(head, body);
}
// The mask table of Lecture 2: A is total > 100, B is country == "FR".
const maskTable = () => tbl(['', 'A: total > 100', 'B: FR', 'A & B', 'A | B', '~A'], [['o1', 'True', 'True', '*True', '*True', 'False'], ['o2', 'False', 'False', 'False', 'False', '*True'], ['o3', 'True', 'False', 'False', '*True', 'False'], ['o4', 'False', 'True', 'False', '*True', '*True'], ['o5', 'True', 'False', 'False', '*True', 'False']]);
const fourLoads = () => tbl(['Load', 'Shape', 'order_id', 'Outcome'], [['df1, no arguments', 'error', '—', 'UnicodeDecodeError: é is not UTF-8'], ['df2, sep="\\t"', 'error', '—', 'the same: decoding fails before the separator is used'], ['df3, + encoding="latin-1"', '(3, 6)', 'int64', 'accents right, but 00417 became 417'], ['*df4, + dtype={"order_id": str}', '*(3, 6)', '*text', '*accents right, 00417 kept']]);
const sixCalls = () => tbl(['Call', 'The question it answers'], [['.shape', 'How many rows and columns?'], ['.dtypes', 'Which type is each column?'], ['.head(10)', 'What do real rows look like?'], ['.info()', 'Where are the NULLs? How much memory?'], ['.describe()', 'Which range do the numbers span?'], ['.value_counts()', 'Which categories exist, and how often?']]);

/* ---------- The course, in plain words ----------
 * Written from the lecture decks; the slides themselves stay private.
 * Every result was rerun in pandas 3. */
const SESSIONS = [
  { n: 1, pages: 37, short: 'DataFrames & loading', title: 'DataFrames and loading data', lede: 'From a raw file to a table you can trust: what a DataFrame is, the three arguments that make a load right, and the six calls to run before changing anything.', groups: [
    { name: 'Why prepare data', flowLabel: 'The path of every dataset', flow: ['Raw file', 'Load', 'Profile', 'Clean', 'Use: chart or model'], cards: [
      { id: 'clean-table', slide: 8, name: 'Every analysis starts from a clean table', what: 'Data rarely arrives ready. Five scraped rental ads for Paris write the same facts five ways: "Marais, 2 rooms, 45 m², €1.650/ month", "MARAIS - 3 pièces - 70 m2 - 2400 EUR", and so on.\n\nAsk "what is the average rent per district?" On the raw text you cannot even start. On the clean table below it is one line of pandas. This class is everything between the raw file and the model: load it, find what is wrong, fix it, shape it.', more: { say: 'The same five ads as a DataFrame. The duplicate ad is gone, and the missing area is NaN, an empty value pandas knows how to skip.', html: () => tbl(['district', 'rooms', 'area_m2', 'rent_eur'], [['Marais', '2', '45.0', '1650.0'], ['Marais', '3', '70.0', '2400.0'], ['Belleville', '2', '*NaN', '1150.0'], ['Belleville', '1', '28.0', '980.0']]) } },
      { id: 'dirty', slide: 9, name: 'Each dirty value changes the answer', what: 'Each kind of mess in the ads gives a wrong number, and none of them raises an error. That is why you look at the data before you compute anything.\n\nThe table lists the five kinds. Real cases are worse: in 2020 England lost 16,000 COVID cases because an old Excel format stops at 65,536 rows, and spreadsheets have turned gene names like SEPT2 into dates.', more: { html: () => tbl(['Raw values', 'Problem', 'If you ignore it'], [['Marais, MARAIS, belleville', 'labels written differently', '4 districts instead of 2'], ['€1.650, €1,150', 'numbers stored as text', 'a sum glues text: "1650980"'], ['45 m², 70m2', 'units inside the value', 'no rent per m²'], ['n/a', 'a hidden missing value', 'the column stays text'], ['line 5 = line 1', 'a duplicate row', 'Marais mean 2025 €, not 1900 €']]) }, watch: 'Garbage in, garbage out: no chart or model can repair the data it is given.' },
    ] },
    { name: 'Pandas and DataFrames', cards: [
      { id: 'dataframe', slide: 13, name: 'Pandas, and what a DataFrame is', what: 'Pandas is Python’s library for tables: it loads, cleans, transforms and analyses them. It is imported under the short name pd, and its results go straight into charts and machine learning.\n\nIts central object is the DataFrame: a table in memory, with labelled rows (the index), named columns, and one type per column. Unlike a spreadsheet, the raw file is never edited: a script writes down every step, and rebuilds the result on every run.', f: `import pandas as pd`, more: { html: () => tbl(['', 'Spreadsheet', 'pandas'], [['Where the steps live', 'in your clicks and memory', 'in a script anyone can read'], ['A number looks wrong', 'search cells and copies', 'reread the script, fix one line'], ['Types', 'set per cell, can be mixed', 'one dtype per column'], ['Size', 'at most 1,048,576 rows', 'millions, limited by memory'], ['Next week’s files', 'redo every step by hand', 'rerun the same script']]) }, watch: 'Spreadsheets stay good for looking and one-off edits. Pandas wins when the work repeats, grows, or must be checked by someone else.' },
      { id: 'build', slide: 17, name: 'Building a Series and a DataFrame', what: 'A Series is one column of values with an index. A DataFrame is several columns sharing that index.\n\nBoth are built from Python lists and dicts. A list gives positions, so the index becomes 0, 1, 2. A dict gives labels: its keys become the index of a Series, or the column names of a DataFrame. A list of dicts gives one row per dict.', f: `pd.Series([10, 20, 30])                  # index 0, 1, 2
pd.Series({"a": 10, "b": 20, "c": 30})   # keys become the index
pd.DataFrame({"order_id": ["00417", "00418"],
              "total": [129.9, 45.0]})   # dict of lists: one column each
pd.DataFrame(records)                    # list of dicts: one row each` },
      { id: 'columns', slide: 18, name: 'A DataFrame is Series sharing one index', what: 'Pick one column of a DataFrame and you get a Series, with the same index as the table. The index is shared by every column.\n\nThis is why the index matters so much: whenever two objects meet, in a sum or a comparison, pandas lines them up by their index.', more: { html: () => tbl(['index', 'order_id', 'country', '*total'], [['0', '00417', 'France', '*129.9'], ['1', '00418', 'Spain', '*45.0'], ['2', '00419', 'Germany', '*NaN']]) + cap('df["total"] is the shaded column: a Series with the index 0, 1, 2') } },
      { id: 'align', slide: 19, name: 'Operations line up labels, not positions', what: 'When you add two Series, pandas matches equal labels, not the first with the first. b meets b, and c meets c.\n\nA label present in only one of the two gets NaN, never a silent shift. The result is a float64 column, because NaN is a float.', f: `s1 = pd.Series([10, 20, 30], index=["a", "b", "c"])
s2 = pd.Series([1, 2, 3], index=["b", "c", "d"])
s1 + s2`, more: { html: () => tbl(['index', 's1', 's2', 's1 + s2'], [['a', '10', '—', '*NaN'], ['b', '20', '1', '21.0'], ['c', '30', '2', '32.0'], ['d', '—', '3', '*NaN']]) }, watch: 'Predict first: many expect 11, 22, 33. Labels win over positions.' },
    ] },
    { name: 'Loading data', cards: [
      { id: 'traps', slide: 21, name: 'One small file, three loading traps', what: 'orders.tsv has three rows and looks harmless. It hides three traps, and each one needs an argument of read_csv.', list: ['Tabs separate the columns, not commas. read_csv expects commas, so pass `sep="\\t"`.', 'Accents are saved in latin-1, not UTF-8. Hélène and Café break the default decoder, so pass `encoding="latin-1"`.', 'Leading zeros. 00417 is an identifier, not a number, so pass `dtype={"order_id": str}` to keep it as text.'], watch: 'The goal: after loading, order_id still reads 00417 and every accent is right.' },
      { id: 'four-loads', slide: 23, name: 'Four loads of the same file', what: 'Each load adds one argument. Two fail, one loads wrongly, and one is right.\n\nThe first two stop on the accent, because the file is decoded before it is split into columns. The third loads, but pandas reads 00417 as the number 417. Only the fourth passes all three arguments.', f: `df1 = pd.read_csv(f)
df2 = pd.read_csv(f, sep="\\t")
df3 = pd.read_csv(f, sep="\\t", encoding="latin-1")
df4 = pd.read_csv(f, sep="\\t", encoding="latin-1",
                  dtype={"order_id": str})`, more: { html: fourLoads }, watch: 'Fix only the encoding and you get shape (3, 1): one column, with the tabs inside the text.' },
      { id: 'silent', slide: 24, name: 'Only the dtype mistake is silent', what: 'A wrong separator is visible: df.shape says (3, 1), one wide column. A wrong encoding is loud: the load stops with UnicodeDecodeError.\n\nA wrong dtype says nothing. 00417 quietly becomes 417, with no error and no warning. So pass `dtype=str` yourself for identifiers, zip codes and phone numbers.', more: { html: () => tbl(['Mistake', 'How it shows'], [['sep', 'visible: shape (3, 1)'], ['encoding', 'loud: UnicodeDecodeError'], ['*dtype', '*silent: 00417 becomes 417']]) } },
      { id: 'excel', slide: 25, name: 'Excel: sheet_name picks the sheet', what: 'read_excel reads the first sheet by default. sheet_name picks one sheet by its name, and `sheet_name=None` reads them all, as a dict with one DataFrame per sheet.\n\nAfter loading, everything works as with a CSV. It needs the openpyxl package installed.', f: `pd.read_excel("orders.xlsx")                        # first sheet
pd.read_excel("orders.xlsx", sheet_name="Refunds")  # one sheet by name
pd.read_excel("orders.xlsx", sheet_name=None)       # dict: {name: DataFrame}` },
      { id: 'json', slide: 27, name: 'JSON: json_normalize flattens', what: 'JSON nests: an order holds a customer, who holds a name and a country, and a list of items. json_normalize turns nested dicts into columns with dotted names: customer.name, customer.country. A nested list stays as it is.\n\nTo get one row per item, name the list with record_path. meta copies the parent’s fields onto every one of those rows.', f: `pd.json_normalize(data)
# order_id, items, customer.name, customer.country

pd.json_normalize(data, record_path="items",
                  meta=["order_id", ["customer", "country"]])`, more: { say: 'Two orders: 00417 with two items, 00418 with one. One row per item, the parent’s fields copied onto each.', html: () => tbl(['sku', 'qty', 'order_id', 'customer.country'], [['A1', '2', '*00417', '*France'], ['B2', '1', '*00417', '*France'], ['C3', '5', '*00418', '*Spain']]) } },
    ] },
    { name: 'Profiling and export', cards: [
      { id: 'profile', slide: 29, name: 'The profile: six calls, then a note', what: 'Before changing anything, run the same six calls on every new dataset. Each answers one question, in the table.\n\nThen write what they found in a comment block at the top of the script: facts first, open questions last. The practice questions are answered from this block alone.', f: `# DATASET PROFILE: orders.tsv
# Rows x columns : 3 x 6
# Column types   : id (text), text, date, number
# Quality issues : 1 NULL in total
# Open questions : why is order 00419 missing a total?`, more: { html: sixCalls }, watch: 'Describe the data before changing it.' },
      { id: 'to-csv', slide: 31, name: 'to_csv writes the index unless told not to', what: 'df.to_csv saves the index as a first column by default. Load the file back and that index returns as an extra column called "Unnamed: 0".\n\nPass `index=False`. Then choose the format by who reads the file next: CSV for any tool, Excel for business users, JSON for web APIs.', f: `df.to_csv("clean.csv")               # reload: ['Unnamed: 0', 'order_id', ...]
df.to_csv("clean.csv", index=False)  # reload: ['order_id', 'customer', ...]`, more: { html: () => tbl(['Format', 'Call', 'Good for', 'Watch out'], [['CSV', 'to_csv(index=False)', 'any tool; readable in Git', 'no dtypes: ids need dtype again'], ['Excel', 'to_excel(index=False)', 'business users; several sheets', 'needs openpyxl; hard to compare'], ['JSON', 'to_json(orient="records")', 'web APIs; nested data', 'repeats the column names on every row']]) } },
      { id: 'read-sql', slide: 33, name: 'read_sql gives the same DataFrame', what: 'A SQL query can feed pandas directly. read_sql sends the query to the database and returns its answer as an ordinary DataFrame.\n\nFrom there it is profiled and handled like any file. The GROUP BY in this query comes back in Session 5 as groupby.', f: `import sqlite3
con = sqlite3.connect("shop.db")
query = """SELECT country, SUM(total) AS revenue
           FROM orders GROUP BY country"""
df = pd.read_sql(query, con)   # a pandas DataFrame` },
    ] },
  ], practice: [
    { id: 'l1-e1', title: 'Predict the loads', setup: 'orders.tsv has three orders. Its columns are separated by tabs, its accents (Hélène, Café) are saved in latin-1, and its order ids start with zeros, like 00417. For each question, predict first, then open the answer.', parts: [

  { n: 2, pages: 51, short: 'Selecting, filtering & slicing', title: 'Selecting, filtering and slicing', lede: 'Take only part of a table: columns by name, rows by label, by position or by condition, without ever breaking the original.', groups: [
    { name: 'Selecting columns', cards: [
      { id: 'toy', slide: 5, name: 'One tiny table for every example', what: 'Every example in this lecture uses the same five orders. Each row has a label, o1 to o5: that is the index. Each row also has a position, counted from 0.\n\nColumns too have both: a name, like total, and a position, 0 to 3. Picking columns is SQL’s SELECT. Picking rows is SQL’s WHERE.', f: `df = pd.DataFrame({
    "customer": ["Ana", "Ben", "Cleo", "Dan", "Eva"],
    "country":  ["FR", "IT", "IT", "FR", "ES"],
    "total":    [120, 80, 250, 60, 190],
    "status":   ["shipped", "delivered", "cancelled",
                 "shipped", "returned"]},
    index=["o1", "o2", "o3", "o4", "o5"])`, more: { html: () => orders({ pos: true, label: 'Each label with its position: o3 · 2 is label o3, position 2' }) } },
      { id: 'four-tools', slide: 6, name: 'Four tools select data', what: 'There are four ways to select, and each answers a different kind of question.', more: { html: () => tbl(['Tool', 'Selects', 'Example'], [['df["col"]', 'columns, by name', 'df["total"]'], ['df.loc[ ]', 'rows and columns, by label', 'df.loc["o2", "total"]'], ['df.iloc[ ]', 'rows and columns, by position', 'df.iloc[-2:]'], ['df[mask]', 'rows where a test is True', 'df[df["total"] > 100]']]) } },
      { id: 'brackets', slide: 7, name: '[ ] gives a Series, [[ ]] a DataFrame', what: 'One name in brackets gives a Series: one dimension, shape (5,). A list of names, so double brackets, gives a DataFrame, even with a single name in it: shape (5, 1).\n\nUse a Series for maths on one column of values. Use a DataFrame when you need a table. Columns come back in the order of the list.', f: `df["total"]               # Series, shape (5,)
df[["total"]]             # DataFrame, shape (5, 1)
df[["total", "customer"]] # two columns, in this order
df[["total", "custmer"]]  # KeyError: "['custmer'] not in index"`, more: { say: 'On wide tables, pick columns by pattern or by type instead of typing every name.', f: `df.filter(like="co")            # customer, country
df.filter(regex="^c")           # names starting with c
df.select_dtypes("number")      # total
df.select_dtypes(exclude="number")` } },
    ] },
    { name: 'loc and iloc', cards: [
      { id: 'loc', slide: 12, name: '.loc[rows, columns] selects by label', what: '.loc takes the names you see: the row labels and the column names. It always reads [rows, columns]; leave out the columns, or write :, to keep them all.\n\nWhat comes back depends on what you give. One label makes that dimension disappear: one row and one column give a single value. A list or a slice keeps the dimension, so you get a Series or a DataFrame.', f: `df.loc["o3", "total"]                    # 250, one value
df.loc["o2"]                             # one row: a Series
df.loc[:, "country":"total"]             # two columns
df.loc[["o2", "o4"], ["customer", "total"]]`, more: { html: () => row(orders({ rows: ['o3'], cols: ['total'], label: 'df.loc["o3", "total"] → 250' }), orders({ rows: ['o2', 'o4'], cols: ['customer', 'total'], label: 'df.loc[["o2", "o4"], ["customer", "total"]]' })) } },
      { id: 'iloc', slide: 14, name: '.iloc[rows, columns] selects by position', what: '.iloc counts instead: the first row is 0, the first column is 0. Negative numbers count from the end, so -1 is the last row.\n\nUse .iloc when the question is about order: the first row, the last three, the top ten. Use .loc when it is about which row: order o1, customer Ana.', f: `df.iloc[0, 2]              # 120: row 0, column 2
df.iloc[[0, 2, 4], [1, 3]] # rows 0, 2, 4; country and status
df.iloc[0:3, :]            # positions 0, 1, 2
df.iloc[-3:]               # the last 3 rows`, more: { html: () => row(orders({ rows: ['o1'], cols: ['total'], label: 'df.iloc[0, 2] → 120' }), orders({ rows: ['o3', 'o4', 'o5'], label: 'df.iloc[-3:] → o3, o4, o5' })) } },
      { id: 'sorted', slide: 16, name: 'Sorting moves positions, not labels', what: 'Sort the table by total and the rows change places. Position 0 is now Cleo, the highest total. But label o1 still belongs to Ana: labels travel with their rows.\n\nThe trap is an index of plain numbers, 0 to 4. After sorting, label 0 is no longer at position 0, so .loc[0] and .iloc[0] give different rows. Say what you mean: .loc or .iloc.', f: `s = df.sort_values("total", ascending=False)
s.iloc[0]    # top row: Cleo
s.loc["o1"]  # still Ana

d = df.reset_index(drop=True).sort_values("total", ascending=False)
d.loc[0, "customer"]     # 'Ana': label 0
d.iloc[0]["customer"]    # 'Cleo': position 0`, watch: 'After sorting or filtering, label 0 is no longer the first row.' },
    ] },
    { name: 'Slicing', cards: [
      { id: 'slice', slide: 19, name: 'A slice is start : stop : step', what: 'A slice takes a run of items. It starts at start, stops just before stop, and takes every step-th item. Leave out start and it is 0; leave out stop and it runs to the end.\n\nThe same rules work on lists, strings, .iloc and every position slice in pandas. x[1:4] keeps 4 − 1 = 3 items.', f: `x = ["a", "b", "c", "d", "e", "f"]
x[1:4]    # b, c, d: from 1 up to, not including, 4
x[:3]     # a, b, c: the first 3
x[-2:]    # e, f: the last 2
x[::2]    # a, c, e: every 2nd
x[::-1]   # f ... a: reversed` },
      { id: 'stop', slide: 20, name: 'iloc leaves out the stop, loc includes it', what: 'A position slice stops before its end: .iloc[1:3] gives positions 1 and 2, so 2 rows. A label slice includes its end: .loc["o2":"o4"] gives o2, o3 and o4, so 3 rows.\n\nThe reason: labels have no "next one". You could not write the label after "o4", so pandas includes it. Rows and columns can be sliced at once, and steps and negatives work too.', f: `df.iloc[1:3]                        # o2, o3: 2 rows
df.loc["o2":"o4"]                   # o2, o3, o4: 3 rows
df.iloc[1:4, 0:2]                   # the same rectangle...
df.loc["o2":"o4", "customer":"country"]  # ...spelled with labels
df.iloc[::2]                        # o1, o3, o5
df.iloc[:, -2:]                     # the last 2 columns`, more: { html: () => row(orders({ rows: ['o2', 'o3'], label: 'df.iloc[1:3] → 2 rows' }), orders({ rows: ['o2', 'o3', 'o4'], label: 'df.loc["o2":"o4"] → 3 rows' })) }, watch: 'Plain df[1:3] slices rows by position, and df["o2":"o3"] by label: the reader has to guess. Use df[...] for columns and masks, and .iloc or .loc for rows.' },
    ] },
    { name: 'Boolean masks', cards: [
      { id: 'mask', slide: 26, name: 'A condition makes a mask; df[mask] keeps True rows', what: 'df["total"] > 100 compares every total with 100 at once, with no loop. The answer is a column of True and False with the same index, called a mask.\n\ndf[mask] keeps the rows where the mask is True. A mask can be stored and reused. Since True counts as 1 and False as 0, mask.sum() answers "how many?" and mask.mean() answers "what share?".', f: `mask = df["total"] > 100
df[mask]                  # o1, o3, o5
df[~mask]                 # the other 2 rows
mask.sum()                # 3
mask.mean()               # 0.6: 3 of 5 rows
df.loc[mask, "customer"]  # Ana, Cleo, Eva`, more: { html: () => row(tbl(['', 'total', '> 100'], [['o1', '120', '*True'], ['o2', '80', 'False'], ['o3', '250', '*True'], ['o4', '60', 'False'], ['o5', '190', '*True']]), orders({ rows: ['o1', 'o3', 'o5'], only: true, label: 'df[mask]: the True rows' })) } },
      { id: 'combine', slide: 29, name: 'Combine masks with &, | and ~', what: '& means both are true, | means at least one, and ~ means not. They work row by row, like SQL’s AND, OR and NOT.\n\nPut each test in its own brackets. Python’s `and` and `or` need one single True or False, not a column, so they fail. And & runs before >, so without brackets the line breaks.', f: `A = df["total"] > 100
B = df["country"] == "FR"
df[A & B]   # o1: above 100 and French
df[A | B]   # o1, o3, o4, o5
df[(df["total"] > 100) & (df["country"] == "FR")]   # in one line`, more: { html: maskTable }, watch: 'df[df["total"] > 100 and df["country"] == "FR"] raises ValueError: the truth value of a Series is ambiguous. Without brackets, & runs first and you get a TypeError.' },
      { id: 'loc-mask', slide: 30, name: '.loc: a mask for rows, names for columns', what: 'The rows can come from a mask and the columns from a list of names, in one .loc. That is a full SQL query: SELECT the columns, WHERE the condition.\n\nThis same form is how you change values safely, in the last part.', f: `df.loc[df["total"] > 100, ["customer", "total"]]
# SELECT customer, total FROM df WHERE total > 100`, more: { html: () => orders({ rows: ['o1', 'o3', 'o5'], cols: ['customer', 'total'], label: 'Ana 120, Cleo 250, Eva 190' }) } },
    ] },
    { name: 'All filter conditions', cards: [
      { id: 'compare', slide: 34, name: 'Compare, isin, between', what: 'Six operators compare: ==, !=, >, >=, <, <=. Text needs quotes and exact case: "IT" is not "it".\n\nisin tests a list, so one call replaces a long chain of |. between tests a range and includes both ends by default; inclusive="left" keeps only the start.', f: `df["country"].isin(["FR", "ES"])               # o1, o4, o5   IN
~df["status"].isin(["cancelled", "returned"])  # o1, o2, o4   NOT IN
df["total"].between(80, 190)                   # o1, o2, o5   BETWEEN
df["total"].between(80, 190, inclusive="left") # o1, o2       >= and <` },
      { id: 'isna', slide: 35, name: 'Only isna and notna find missing values', what: 'NaN is not equal to anything, not even to NaN. So rating == np.nan keeps nothing, and every comparison with NaN is False: rating > 4 skips the missing rows too.\n\nTo find missing values, use isna. To keep the present ones, notna.', f: `rating = pd.Series([4.5, None, 3.8, None, 5.0], index=df.index)
rating.isna()       # o2, o4
rating.notna()      # o1, o3, o5
rating == np.nan    # nothing: always False
rating > 4          # o1, o5`, watch: 'Every comparison with NaN is False.' },
      { id: 'str-dt', slide: 37, name: 'Text with .str, dates with .dt, top n', what: '.str runs a text test on every value: contains, startswith, endswith, len. A NaN in the column makes the mask NaN too, so add na=False.\n\n.dt reads a part of a date: year, month, dayofweek. The column must be a real date first: use pd.to_datetime, or parse_dates in read_csv. nlargest keeps the top n rows.', f: `df["status"].str.contains("ship", na=False)  # o1, o4   LIKE '%ship%'
df["customer"].str.startswith("C")           # o3       LIKE 'C%'
df["customer"].str.len() > 3                 # o3
df["date"].dt.year == 2023
df["date"].dt.dayofweek >= 5                 # Saturday, Sunday
df.nlargest(2, "total")                      # o3, o5` },
      { id: 'query', slide: 40, name: '.query() writes a filter as a sentence', what: 'query takes the whole condition as one string, with plain and, or, not and in, and no repeated df[...] or extra brackets. It keeps the same rows as the mask.\n\nUse it for filters with several conditions that colleagues will read. Inside the string, text needs the other kind of quote, @ reads a Python variable, and backticks wrap a column name with spaces.', f: `df.query("total > 100")                     # o1, o3, o5
df.query("country == 'FR' and total > 100") # o1
df.query("status not in ['cancelled', 'returned']")
limit = 100
df.query("total > @limit")                  # a Python variable
df.query("80 <= total <= 190")              # o1, o2, o5
df.query("\`order total\` > 100")            # a name with a space` },
    ] },
    { name: 'Copy-on-Write', cards: [
      { id: 'cow', slide: 43, name: 'A result never changes df', what: 'Any selection or method gives what behaves like a new object. s = df["total"] shares df’s data at first, to save memory. The moment you write to s, pandas copies, then writes.\n\nSo changing a result never changes df, and changing df never changes a result. This is called Copy-on-Write.', f: `s = df["total"]       # shares df's data
s.iloc[0] = 0         # copy first, then write
s.tolist()            # [0, 80, 250, 60, 190]
df["total"].tolist()  # [120, 80, 250, 60, 190]: unchanged` },
      { id: 'chained', slide: 44, name: 'Chained assignment does nothing: use one .loc', what: 'df[df["country"] == "IT"]["total"] = 0 looks right but changes nothing. Python runs it in two steps: the first [ ] makes a new object, and the second changes that object, which is then thrown away. Pandas warns, and df stays as it was.\n\nChange df in one step: a single .loc with the rows and the column. To work on a part of the table on purpose, take it with .copy(), which makes the intent visible.', f: `df[df["country"] == "IT"]["total"] = 0   # does nothing to df

mask = df["country"] == "IT"
df.loc[mask, "total"] = 0                # o2 and o3 become 0

fr = df[df["country"] == "FR"].copy()    # a separate table, on purpose`, more: { html: () => orders({ rows: ['o2', 'o3'], cols: ['total'], label: 'After df.loc[mask, "total"] = 0, the shaded cells hold 0' }) }, watch: 'Exam question: "Why does this line not change df?" Look for two [ ] in a row on the left of =.' },

/* ---------- Store: this browser first, then the account ---------- */
// The same marks and notes as the Python page, under keys that start with pandas|.
const ON_BRAIN = location.pathname.startsWith('/pandas');
const MARKS_URL = '/api/coding/marks';
const NOTES_URL = '/api/coding/notes';
function readStore(key, empty) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v ?? empty; } catch (e) { return empty; } }
function writeStore(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
let marks = readStore('pandas-marks', {});
let notes = readStore('pandas-notes', []);
const saveLocal = () => { writeStore('pandas-marks', marks); writeStore('pandas-notes', notes); };
const syncEl = document.getElementById('sync');
const fromServer = n => ({ id: n.id, key: n.itemKey, kind: n.kind, body: n.body, answer: n.answer, readAt: n.readAt, createdAt: n.createdAt });
const mine = k => k.startsWith('pandas|');

async function load() {
  if (!ON_BRAIN) { syncEl.textContent = 'Saved in this browser.'; return; }
  try {
    const [mr, nr] = await Promise.all([fetch(MARKS_URL), fetch(NOTES_URL)]);
    if (!mr.ok || !nr.ok) throw new Error('load');
    const sm = Object.fromEntries(Object.entries((await mr.json()).marks || {}).filter(([k]) => mine(k)));
    // Marks made here before signing in go up once; the account's own are never overwritten.
    const up = Object.fromEntries(Object.entries(marks).filter(([k]) => !(k in sm)));
    if (Object.keys(up).length) fetch(MARKS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ marks: up }) }).catch(() => {});
    marks = { ...sm, ...up };
    const server = (await nr.json()).notes.filter(n => mine(n.itemKey)).map(fromServer);
    const local = notes.filter(n => !n.id);
    if (local.length) {
      const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: local.map(n => ({ key: n.key, kind: n.kind, body: n.body })) }) });
      server.push(...(r.ok ? (await r.json()).notes.map(fromServer) : local));
    }
    notes = server;
    saveLocal();
    syncEl.textContent = 'Synced with your account: the same on your phone and computer.';
  } catch (e) { syncEl.textContent = 'Offline: kept in this browser for now.'; }
  renderSession(); renderNotebook(); paintBars(); showFiles(false);
}
function setMark(key, mark) {
  if (marks[key] === mark) delete marks[key]; else marks[key] = mark;
  saveLocal();
  if (ON_BRAIN) fetch(MARKS_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, mark: marks[key] ?? null, note: null }) })
    .catch(() => { syncEl.textContent = 'Offline: the mark is kept in this browser.'; });
}

/* ---------- Notes ---------- */
const noteRef = n => n.id || n.localId;
const notesOf = key => notes.filter(n => n.key === key);
async function addNote(key, kind, body) {
  const text = body.trim();
  if (!text) return;
  const n = { localId: `l${Date.now()}`, key, kind, body: text, answer: null, readAt: null, createdAt: new Date().toISOString() };
  notes.push(n); saveLocal(); paintNotes();
  if (!ON_BRAIN) return;
  try {
    const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: [{ key, kind, body: text }] }) });
    if (!r.ok) throw new Error();
    Object.assign(n, fromServer((await r.json()).notes[0])); delete n.localId; saveLocal();
  } catch (e) { syncEl.textContent = 'Could not save the note to your account; it is kept in this browser.'; }
}
function editNote(ref, kind, body) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n || !body.trim()) return;
  n.kind = kind; n.body = body.trim(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, body: n.body }) })
    .then(r => { if (!r.ok) throw new Error(); syncEl.textContent = 'Note changed.'; })
    .catch(() => { syncEl.textContent = 'Could not save the change to your account; it is kept in this browser.'; });
}
function deleteNote(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  notes = notes.filter(x => x !== n); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'DELETE' }).catch(() => {});
}
function markRead(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  n.readAt = new Date().toISOString(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ read: true }) }).catch(() => {});
}
const KIND = { question: 'Question', comment: 'Comment' };
function noteHtml(n) {
  const done = n.kind !== 'question' || (n.answer && n.readAt);
  return `<div class="note${done ? ' done' : ''}" data-kind="${n.kind}" data-ref="${esc(noteRef(n))}">
    <div class="note-head"><span class="note-kind">${KIND[n.kind]}</span><span class="tools"><button type="button" class="n-edit" aria-label="Edit">✎ Edit</button><button type="button" class="n-del" aria-label="Delete">×</button></span></div>
    <div class="note-body">${boldHtml(esc(n.body))}</div>
    ${n.answer ? `<div class="answer"><span class="note-kind">Answer</span><div class="note-body"${n.id ? ` data-hl="pandas|ans|${esc(n.id)}"` : ''}>${boldHtml(esc(n.answer))}</div>${n.readAt ? '' : '<button type="button" class="read">Got it, mark read</button>'}</div>` : ''}
  </div>`;
}
function editorHtml(kind, body) {
  return `<div class="editor" data-kind="${kind}"><div class="kinds" role="radiogroup" aria-label="Kind of note">${Object.entries(KIND).map(([k, l]) => `<button type="button" role="radio" data-kind="${k}" aria-checked="${k === kind}">${l}</button>`).join('')}</div>
    <textarea rows="3" maxlength="2000" aria-label="Your note" placeholder="Write your question or comment">${esc(body)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
/* Asked for 2026-11-08: "all the questions should be in a closed tab by default, so it doesn't make the whole
   lecture longer. I can just open and close them beneath each box." Open stays open while you read; a new
   answer opens its fold. */
const notesOpen = new Set();
function notesFold(key, list) {
  if (!list.length) return '';
  const fresh = list.some(n => n.answer && !n.readAt);
  return `<details class="notes-fold"${notesOpen.has(key) || fresh ? ' open' : ''}><summary>${list.length === 1 ? '1 question or comment' : `${list.length} questions and comments`}${fresh ? ' <span class="new">· new answer</span>' : ''}</summary><div class="notes-in">${list.map(noteHtml).join('')}</div></details>`;
}
document.addEventListener('toggle', e => {
  const f = e.target;
  if (!f.classList?.contains('notes-fold')) return;
  const key = f.closest('[data-key]')?.dataset.key;
  if (key) { if (f.open) notesOpen.add(key); else notesOpen.delete(key); }
}, true);
function paintNotes() {
  paintBoxes();
  for (const card of document.querySelectorAll('.card, .ex[data-key]')) {
    const list = notesOf(card.dataset.key);
    card.querySelector('.notes').innerHTML = notesFold(card.dataset.key, list);
    const b = card.querySelector('.note-btn');
    b.setAttribute('aria-pressed', String(list.length > 0));

/* ---------- Your own boxes ----------
 * Asked for 2026-11-05: "add ability to create new boxes, so I can write a new box and give it a title".
 * A box is one note under pandas|box|, so it never shows in the notepad: the first line is its title,
 * the rest its text. A new box's unsaved words stay in this browser until it is saved or cancelled. */
const BOX_PREFIX = 'pandas|box|';
const boxKey = (n, gi) => `${BOX_PREFIX}s${n}|g${gi}`;
const boxParts = body => { const at = body.indexOf('\n'); return at < 0 ? [body, ''] : [body.slice(0, at), body.slice(at + 1)]; };
const boxDrafts = () => readStore('pandas-box-drafts', {});
function setBoxDraft(key, draft) {
  const all = boxDrafts();
