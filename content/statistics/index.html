    { id: 'l1-e3', title: 'One week of orders', setup: 'Nookery records 400 orders in one week.', table: () => tbl(['', 'no refund', 'refund', 'total'], [['on time', '314', '30', '344'], ['late', '38', '18', '56'], ['total', '352', '48', '400']]), parts: [
      ['Compute f(L), f(R) and f(L ∩ R).', () => `<pre>f(L) = 56/400 = 0.14\nf(R) = 48/400 = 0.12\nf(L ∩ R) = 18/400 = 0.045</pre>`],
      ['Compute f(L ∪ R) twice: from the cells, and with the addition rule.', () => `<pre>cells: (38 + 18 + 30)/400 = 0.215\nrule:  0.14 + 0.12 − 0.045 = 0.215</pre>`],
      ['The model gives P(L ∪ R) = 0.20. Does this prove the model wrong? One sentence.', () => `<p><b>No.</b> A frequency from 400 orders varies from week to week around the model’s probability, so a gap of 0.015 alone shows nothing. About half of all such weeks land at least that far from 0.20.</p>`],
    ] },
  ], recap: ['A model is a sample space Ω plus a probability law P. An event is a set of outcomes.', 'Three axioms: P(A) ≥ 0, P adds over disjoint events, P(Ω) = 1. Everything else follows.', 'Or is ∪, and is ∩, not is a complement. A complement swaps ∪ and ∩ (De Morgan).', 'P(Aᶜ) = 1 − P(A), and P(A ∪ B) = P(A) + P(B) − P(A ∩ B).', 'Count outcomes only when they are equally likely.', 'Frequencies are data and probabilities are a model; with many trials the first settles near the second.'] },

  { n: 2, short: 'Conditioning, Bayes', title: 'Conditioning and independence', lede: 'How a probability changes when you learn something, and when it does not.', groups: [
    { name: 'Conditional probability', cards: [
      { id: 'dog', slide: 4, name: 'The question: a dog sits by a parcel', what: 'Detector dogs sniff parcels for prohibited food and plants. Only 2 % of parcels hold such an item. The dog sits next to 95 % of the parcels with an item, and by mistake next to 5 % of the others.\n\nThe dog has just sat next to this parcel. How likely is it that an item is inside? Most people say about 95 %. Make your own guess, above or below 50 %, and keep it in mind. Card 13 has the answer, and the surprise is the point of this lecture.' },
      { id: 'partial', slide: 5, name: 'Partial information changes the probability', what: 'Conditional probability is about updating when you learn something. A chance is not fixed: it depends on what you already know.\n\nRoll a die. The chance of "at least 4" is 3 out of 6, or 1/2. Now someone tells you the roll is even. Only 2, 4 and 6 are still possible, and two of those three are at least 4. So the chance has become 2/3. Same die, new information, new answer.', f: 'P(A ∣ B) = 2/3     read: A given B', more: { say: 'With equally likely outcomes, conditioning is counting: outcomes in A ∩ B divided by outcomes in B.' } },
      { id: 'conditional', slide: 6, name: 'Conditional probability', what: 'This is the general formula for the idea in the last card. P(A ∣ B) means "the chance of A, knowing that B happened".\n\nKnowing B shrinks your world: anything outside B is no longer possible, so B becomes the new whole. The question then is what share of B is also A. That share is the part where both happen, divided by all of B.', f: 'P(A ∣ B) = P(A ∩ B) / P(B),   for P(B) > 0', more: { say: 'Nookery’s last 1,000 orders. Given express, only the top row is left: 10 of its 200 orders are late. Given standard, 110 of 800. Overall, 120 of 1,000.', f: 'P(L ∣ E) = 10/200 = 0.05\nP(L ∣ S) = 110/800 = 0.1375\nP(L) = 120/1000 = 0.12', html: () => tbl(['', 'late', 'on time', 'total'], [['express', '*10', '*190', '*200'], ['standard', '110', '690', '800'], ['total', '120', '880', '1000']]) } },
      { id: 'law-given', slide: 8, name: 'Given B, the rules still hold', what: 'Once you know B, you are simply working in a smaller world, and in that smaller world all the rules from Lecture 1 still work. The complement rule, the addition rule and the rest are the same, as long as everything is "given B".\n\nSo if 5 % of express orders are late, then 95 % of express orders are on time.', f: 'P(Lᶜ ∣ E) = 1 − 0.05 = 0.95', watch: 'Each B gives its own law. P(L ∣ E) and P(L ∣ S) belong to different laws: their sum means nothing.' },
      { id: 'reverse', slide: 9, name: 'P(L ∣ S) is not P(S ∣ L)', what: 'This is the most important warning of the lecture. "The share of standard orders that are late" and "the share of late orders that are standard" are two different questions with two different answers.\n\nThe top of the fraction is the same 110 orders, but the bottom is different: all 800 standard orders in one case, all 120 late orders in the other. 13.75 % and 91.7 % are very far apart. Always ask: out of what?', f: 'P(L ∣ S) = 110/800 = 0.1375\nP(S ∣ L) = 110/120 = 0.917', watch: 'Mixing these two is the classic error. In the dog’s story, 95 % is P(sits ∣ item), but we want P(item ∣ sits).', more: { say: 'Given S, keep the row. Given L, keep the column.', html: () => row(tbl(['Given S', 'late', 'on time'], [['express', '', ''], ['standard', '*110', '*690']]), tbl(['Given L', 'late', 'on time'], [['express', '*10', ''], ['standard', '*110', '']])) } },
    ] },
    { name: 'Trees and total probability', cards: [
      { id: 'multiplication', slide: 13, name: 'The multiplication rule', what: 'This is how to get the chance that two things both happen: the chance of the first, times the chance of the second given the first.\n\nThink of it as taking a share of a share. 70 % of orders come from North, and 10 % of those are late. So 10 % of 70 %, which is 7 % of all orders, are both from North and late.', f: 'P(A ∩ B) = P(B) P(A ∣ B)' },
      { id: 'chain', slide: 14, name: 'The chain rule', what: 'The same idea for more than two steps. Walk along a path of a tree, multiplying at every step. Each step’s number is its chance given everything that has already happened on the path.\n\nA share of a share of a share.', f: 'P(A₁ ∩ A₂ ∩ A₃) = P(A₁) P(A₂ ∣ A₁) P(A₃ ∣ A₁ ∩ A₂)', more: { say: 'Why it holds: write each factor with the definition, and each numerator cancels the next denominator.', f: 'P(A₁) · P(A₁ ∩ A₂)/P(A₁) · P(A₁ ∩ A₂ ∩ A₃)/P(A₁ ∩ A₂) = P(A₁ ∩ A₂ ∩ A₃)' } },
      { id: 'tree', slide: 16, name: 'A tree for two warehouses', what: 'A tree is the best tool for these problems, so learn to draw it. Start at one point. The first split is the first thing that gets decided: which warehouse. The second split is the next thing: late or not, with its chance depending on the warehouse.\n\nTo get the chance of a full path, multiply along it. All the end points together must add up to 1, which is a good check on your work.', more: { say: 'Each leaf is width times height: P(N ∩ L) = 0.7 × 0.1 = 0.07.', html: () => warehouseTree() } },
      { id: 'total', slide: 17, name: 'Total probability', what: 'Use this when you know the answer inside each case and you want the overall answer. Split the world into cases that do not overlap (a partition), work out each case’s contribution, and add them.\n\nEach contribution is how big the case is, times how likely the event is inside it. The result is a weighted average: big cases count more. This is simply adding the matching end points of a tree.', f: 'P(B) = Σᵢ P(Aᵢ) P(B ∣ Aᵢ)', more: { say: 'What share of all orders is late? North and South form a partition. P(L) averages the two late rates, weighted by the warehouse shares, so it lies between 0.1 and 0.2, nearer 0.1 because North ships more.', f: 'P(L) = 0.7 × 0.1 + 0.3 × 0.2 = 0.13' } },
    ] },
    { name: 'Bayes’ rule', flowLabel: 'The table to fill in', flow: ['Prior', '× Likelihood', '= Product', 'Add: P(B)', 'Divide: Posterior'], cards: [
      { id: 'bayes', slide: 22, name: 'Bayes’ rule', what: 'Bayes’ rule turns a question around. You usually know "how likely is this evidence if the cause is true?". You want "how likely is the cause, now that I see this evidence?". As the warning in card 5 said, these are different, and this rule converts one into the other.\n\nThe formula is short, but in practice you fill in the table shown above: one row per possible cause.', f: 'P(A ∣ B) = P(A) P(B ∣ A) / P(B)', more: { say: 'P(B) P(A ∣ B) and P(A) P(B ∣ A) are both P(A ∩ B). Dividing by P(B) > 0 gives the rule. P(B) usually comes from total probability.' } },
      { id: 'prior', slide: 23, name: 'Prior, likelihood, posterior', what: 'Bayes’ rule comes with three names, and they are just "before", "evidence" and "after". The prior is how likely a cause is before you see anything. The likelihood is how likely the thing you saw would be, if that cause were true. The posterior is how likely the cause is after seeing it.\n\nIt is how you update your mind: what you believed, adjusted by how well each explanation fits what you just saw.', f: 'posterior = prior × likelihood / P(B)\nP(Aᵢ ∣ B) = P(Aᵢ) P(B ∣ Aᵢ) / P(B)', watch: 'The causes must form a partition. The denominator is what makes the posteriors sum to 1.' },
      { id: 'which', slide: 24, name: 'A late order: which warehouse?', what: 'A customer complains about a late order. Which warehouse shipped it? Before the complaint, South is 30 % likely, because it ships 30 % of orders. But South is also twice as often late as North.\n\nSo the complaint moves our belief towards South, from 30 % to 46 %. Fill in the table below from left to right: prior, likelihood, multiply, add the column, divide.', f: 'P(S ∣ L) = 0.06 / 0.13 = 0.46', more: { say: 'The table has four steps: prior, likelihood, multiply and add, then divide by the sum.', html: () => bayesTable([['North', '0.7', '0.1', '0.07', '0.54'], ['South', '0.3', '0.2', '0.06', '*0.46']], '0.13') } },
      { id: 'dog-answer', slide: 25, name: 'Back to the dog: most alerts are false', what: 'So the dog sits. Is there an item? Only 28 %, far below the 95 % most people guess. The reason is that items are rare.\n\nTrue alerts come from the tiny 2 % of parcels that hold an item. False alerts come from the huge 98 % that do not. Even at only 5 %, the false alerts outnumber the true ones. This same logic applies to medical tests and fraud detectors.', f: 'P(I ∣ D) = 0.019 / 0.068 = 0.28', watch: 'A high P(effect ∣ cause) does not mean a high P(cause ∣ effect) when the cause is rare.', more: { say: 'In counts, of 10,000 parcels: 200 hold an item and the dog sits by 190 of them. 9,800 are clean and the dog sits by 490 of them. So 190 of 680 alerts are real.', html: () => bayesTable([['item', '0.02', '0.95', '0.019', '*0.28'], ['no item', '0.98', '0.05', '0.049', '0.72']], '0.068') } },
    ] },
    { name: 'Independence', cards: [
      { id: 'independent', slide: 29, name: 'Independent events', what: 'Two events are independent when knowing one tells you nothing about the other. Knowing that it rains in Tokyo does not change the chance that your parcel is late.\n\nWhen events are independent, the chance of both is simply the two chances multiplied. To test whether two events are independent, compute both sides of that equation and see if they match.', f: 'P(A ∣ B) = P(A)     or     P(A ∩ B) = P(A) P(B)', watch: 'Disjoint is not independent. Disjoint events with positive probabilities are dependent: if one happens the other cannot, so P(A ∩ B) = 0 < P(A) P(B).', more: { say: 'Late and express are not independent: P(L ∣ E) = 0.05 but P(L) = 0.12.' } },
      { id: 'same-rolls', slide: 30, name: 'Independent on the same rolls', what: 'You cannot always tell independence by looking. Here both events depend on the first roll, yet they are independent, because the numbers fit: 1/16 = 4/16 × 4/16.\n\nRoll a 4-sided die twice. A is "the first roll is 1" and B is "the sum is 5". Knowing the first roll is 1 leaves B a chance of 1/4, the same as before. So knowing A changed nothing.', more: { say: 'The reason: given A, the sum is 5 only if the second roll is 4, so P(B ∣ A) = 1/4, the same as P(B). Independence is a fact about the numbers, and has to be checked.' } },
      { id: 'trials', slide: 31, name: 'Independent trials', what: 'Independent trials means doing the same thing several times, with no effect from one go on the next, and with the same chance p of success each time. Success just means the thing you are counting: late orders count as successes here, even if that sounds odd.\n\nThen the chance of any exact sequence is its numbers multiplied: p for each success and 1 − p for each failure. And "at least one" is best done through its opposite, "none at all".', f: 'one sequence with k successes: pᵏ (1 − p)ⁿ⁻ᵏ\nP(at least one) = 1 − (1 − p)ⁿ', more: { say: 'Three orders, each late with probability p. OOL has probability (1 − p)² p, and so do OLO and LOO. "At least one late" is easiest through its complement: 1 minus "none late".' } },
      { id: 'demere-2', slide: 32, name: 'De Méré settled', what: 'Now we can settle de Méré’s bets from Lecture 1. The easy way to get "at least one" is through its opposite: work out the chance of "not even one" by multiplying along the rolls, then subtract from 1.\n\nThe first bet wins 51.8 % of the time and the second 49.1 %. A small gap, but it decides who makes money over many games, just as he saw.', f: 'a six in 4 rolls:        1 − (5/6)⁴   = 0.518\na double six in 24 rolls: 1 − (35/36)²⁴ = 0.491' },
      { id: 'fallacy', slide: 33, name: 'Independent spins have no memory', what: 'Independent means the die, wheel or coin remembers nothing. In 1913 at Monte Carlo, the roulette ball landed on black 26 times in a row. Crowds bet heavily on red, sure it was due.\n\nThey lost. A long run is rare if you look ahead at it, about 1 in 137 million here, but once 25 blacks have already happened, the next spin is the same as any other: 18 black pockets out of 37.', watch: 'Expecting red to be "due" is the gambler’s fallacy.' },
      { id: 'cond-indep', slide: 34, name: 'Conditional independence', what: 'Two things can be linked overall, but unrelated once you know a third thing. That is conditional independence: once C is known, learning B tells you nothing more about A.\n\nEveryday example: ice cream sales and sunburns rise together, but once you know the weather, one tells you nothing more about the other. The next card shows it on real numbers.', f: 'P(A ∩ B ∣ C) = P(A ∣ C) P(B ∣ C)', watch: 'It holds for the law given C only. Given Cᶜ, or with no condition, it must be checked again.' },
      { id: 'two-checks', slide: 35, name: 'Two checks of one parcel', what: 'A dog and an X-ray both check each parcel. If you know what is inside, their errors are unrelated, so they are independent given the content. But if you do not know what is inside, they are linked: a dog alert makes an item more likely, and so makes an X-ray flag more likely too.\n\nSo the same two events are independent in one situation and dependent in another. This is why "independent given C" has to be stated carefully.', f: 'P(D ∩ X) = 0.02 × 0.9025 + 0.98 × 0.0025 = 0.0205\nP(D) P(X) = 0.068² = 0.0046', more: { say: 'Multiply within each row, because the checks are conditionally independent there. Then combine the rows with total probability.', html: () => tbl(['', 'P(D ∣ ·)', 'P(X ∣ ·)', 'P(D ∩ X ∣ ·)'], [['given item', '0.95', '0.95', '0.9025'], ['given no item', '0.05', '0.05', '0.0025']]) } },
    ] },
  ], practice: [
    { id: 'l2-e1', title: 'Read a support table', setup: '500 support tickets last month. Resolved means the first answer solved the problem. Pick one ticket uniformly at random.', table: () => tbl(['channel', 'tickets', 'resolved'], [['chat', '200', '150'], ['email', '180', '108'], ['phone', '120', '102'], ['total', '500', '360']]), parts: [
      ['Compute P(resolved).', () => `<pre>360/500 = 0.72</pre>`],
      ['Compute P(resolved ∣ chat), P(resolved ∣ email), P(resolved ∣ phone).', () => `<pre>chat   150/200 = 0.75\nemail  108/180 = 0.60\nphone  102/120 = 0.85</pre><p>The overall 0.72 lies between them: total probability makes it a weighted average.</p>`],
      ['Compute P(phone ∣ resolved).', () => `<pre>102/360 = 0.283</pre>`],
      ['Which is larger, P(resolved ∣ phone) or P(phone ∣ resolved)? Why, in one sentence?', () => `<p><b>P(resolved ∣ phone) = 0.85.</b> Phone tickets are usually resolved, but phone carries only 120 of the 500 tickets, so it accounts for a small part of the resolved ones.</p>`],
    ] },
    { id: 'l2-e2', title: 'Three carriers', setup: 'Carrier A takes 50 % of parcels, B 30 % and C 20 %. A parcel is late with probability 0.08 with A, 0.12 with B and 0.25 with C.', parts: [
      ['Draw the tree and compute its six leaves.', () => tree({ w: 460, kids: [{ label: 'A', p: '0.5', kids: [{ label: 'A ∩ L: 0.04', p: '0.08', on: 1 }, { label: 'A ∩ Lᶜ: 0.46', p: '0.92' }] }, { label: 'B', p: '0.3', kids: [{ label: 'B ∩ L: 0.036', p: '0.12', on: 1 }, { label: 'B ∩ Lᶜ: 0.264', p: '0.88' }] }, { label: 'C', p: '0.2', kids: [{ label: 'C ∩ L: 0.05', p: '0.25', on: 1 }, { label: 'C ∩ Lᶜ: 0.15', p: '0.75' }] }] }) + `<p>The multiplication rule on each path. The six leaves sum to 1.</p>`],
      ['Compute P(L).', () => `<pre>P(L) = 0.04 + 0.036 + 0.05 = 0.126</pre><p>Total probability: add the "late" leaves.</p>`],
    ] },
    { id: 'l2-e3', title: 'Fake reviews', setup: 'A detector flags 80 % of fake reviews and 2 % of genuine ones. For established products 1 % of reviews are fake, for new products 5 %.', parts: [
      ['Compute P(flag) for a review of a new product.', () => `<pre>P(flag) = 0.05 × 0.8 + 0.95 × 0.02 = 0.059</pre><p>Total probability over fake and genuine.</p>`],
      ['Compute P(fake ∣ flag) for new and for established products.', () => `<pre>new:         0.04 / 0.059 = 0.678\nestablished: P(flag) = 0.01 × 0.8 + 0.99 × 0.02 = 0.0278\n             0.008 / 0.0278 = 0.288</pre><p>The same detector, a different prior, a very different answer.</p>`],
    ] },
    { id: 'l2-e4', title: 'Newsletter and coupons', setup: '1,000 customers. 400 subscribe to the newsletter (S), 250 bought again within a month (R), 300 used a coupon (C). Of the subscribers, 100 bought again and 180 used a coupon. Pick one uniformly at random.', parts: [
      ['Are S and R independent?', () => `<pre>P(S ∩ R) = 0.10     P(S) P(R) = 0.4 × 0.25 = 0.10</pre><p><b>Independent:</b> P(R ∣ S) = 100/400 = 0.25 = P(R).</p>`],
      ['Are S and C independent?', () => `<pre>P(S ∩ C) = 0.18     P(S) P(C) = 0.4 × 0.3 = 0.12</pre><p><b>Dependent.</b></p>`],
      ['Compute P(C ∣ S) and P(C ∣ Sᶜ).', () => `<pre>P(C ∣ S) = 180/400 = 0.45\nP(C ∣ Sᶜ) = 120/600 = 0.20</pre>`],
      ['Are S and C disjoint?', () => `<p><b>No:</b> P(S ∩ C) = 0.18 > 0. With real data the two numbers rarely match exactly, so a small difference alone does not show dependence.</p>`],
    ] },
  ], recap: ['P(A ∣ B) = P(A ∩ B) / P(B): keep only the outcomes in B.', 'Multiply along a tree path; add across a partition (total probability).', 'Bayes: posterior = prior × likelihood / P(B). Fill in the table.', 'P(A ∣ B) is not P(B ∣ A). A rare cause stays fairly unlikely even after a good test.', 'Independent: P(A ∩ B) = P(A) P(B). Disjoint is not independent.', 'One sequence with k successes in n independent trials: pᵏ(1 − p)ⁿ⁻ᵏ. At least one: 1 − (1 − p)ⁿ.', 'Conditional independence holds given C only; check again without it.'] },

  { n: 3, short: 'Discrete variables', title: 'Discrete random variables', lede: 'Turning outcomes into numbers, then saying what those numbers look like and how far they spread.', groups: [
    { name: 'Random variables', cards: [
      { id: 'galton', slide: 4, name: 'The question: where will the ball land?', what: 'A Galton board is a board of pins. Balls fall from the top and bounce left or right at each pin, ending up in one of the bins at the bottom.\n\nYou cannot predict where any one ball lands. Yet with many balls, the same shape appears every time: a pile in the middle and almost nothing at the edges. Random one at a time, predictable in bulk. Which bins fill up? Card 7 has the answer.' },
      { id: 'rv', slide: 5, name: 'A random variable', what: 'Outcomes can be anything: pairs of rolls, words, parcels. But we want to calculate, and for that we need numbers. A random variable turns each outcome into a number. It is usually written with a capital letter, like X.\n\nDespite the name, it is really just a rule: outcome goes in, number comes out. The "random" part is only that we do not know the outcome yet. For two rolls, X could be the larger roll, or the sum, or anything you decide to measure.', f: 'X : Ω → ℝ', more: { say: 'Roll a fair 4-sided die twice. X is the larger of the two rolls, written in each cell. The sum of the rolls would be another random variable on the same Ω.', html: () => maxGrid() } },
      { id: 'statements', slide: 6, name: 'Statements about X are events', what: 'Once you have X, you can ask questions with it. "X is at most 2" is really an event: the group of all outcomes where the number comes out as 2 or less. So everything from Lectures 1 and 2 still applies.\n\nX is called discrete when its possible values can be listed one by one, like 1, 2, 3, 4 or 0, 1, 2, … and not a smooth range.', f: '{X ≤ 2} = {ω ∈ Ω ∣ X(ω) ≤ 2}     P(X ≤ 2) = 4/16', watch: 'Upper case X is the variable, decided by the experiment. Lower case x is a fixed number: "this time x = 3".' },
    ] },
    { name: 'Probability mass functions', flowLabel: 'To compute a PMF, for each value x', flow: ['Collect the outcomes with X = x', 'Add their probabilities'], cards: [
      { id: 'pmf', slide: 8, name: 'The PMF', what: 'The PMF, or probability mass function, is a list: each value X can take, with its chance next to it. It is the full description of X.\n\nThink of it as a table, or as the bar chart below. To build it: for each value, find the outcomes that give that value, and add up their chances. All the chances together add up to 1, since X must land somewhere.', f: 'm_X(x) = P(X = x)', watch: 'The book, Bertsekas and Tsitsiklis, writes p_X. The lectures write m_X, m for mass.', more: { say: 'For the larger of two rolls, count the cells of each value in the grid: 1, 3, 5 and 7 of 16.', html: () => bars([[1, 1 / 16, '1/16'], [2, 3 / 16, '3/16'], [3, 5 / 16, '5/16'], [4, 7 / 16, '7/16']], { x: 'the larger of two rolls', cap: 'PMF of X, the larger roll' }) } },
      { id: 'bernoulli', slide: 11, name: 'Bernoulli: one trial, two results', what: 'This is the simplest random variable there is: a single yes-or-no. Will the next visitor buy? We write 1 for yes and 0 for no.\n\nOnly one number is needed to describe it: p, the chance of yes. Then the chance of no is whatever remains, 1 − p. Anything with two answers fits: buy or not, late or on time, heads or tails.', f: 'X ∼ Ber(p)     m_X(1) = p     m_X(0) = 1 − p', more: { say: 'Read ∼ as "follows". Many questions have two answers: buy or not, late or on time.', html: () => bars([[0, 0.8, '0.8'], [1, 0.2, '0.2']], { x: 'purchases', cap: 'Ber(0.2): 0 no purchase, 1 purchase', narrow: 1 }) } },
      { id: 'binomial', slide: 16, name: 'Binomial: successes in n trials', what: 'Do the yes-or-no thing n times and count the yeses. If 10 visitors come, how many buy? That count follows a binomial distribution. You need two numbers: n, how many tries, and p, the chance of yes each time.\n\nThe formula has three parts, explained below. One: how many different orders can the yeses come in? Two: the chance of all those yeses. Three: the chance of all the noes. Multiply the three together.', f: 'X ∼ Bin(n, p)     k = 0, …, n\nm_X(k) = (n choose k) pᵏ (1 − p)ⁿ⁻ᵏ\n(n choose k) = n! / (k! (n − k)!)', more: { say: 'Four visitors, each buying with probability 0.2. One buyer: BNNN, NBNN, NNBN or NNNB, 4 sequences of 0.2 × 0.8³ = 0.1024 each, so 4 × 0.1024 = 0.4096.', html: () => bars(binom(4, 0.2).map((v, k) => [k, v, v.toFixed(3)]), { x: 'buyers out of 4', cap: 'Bin(4, 0.2): number of buyers', hi: [1] }) } },
      { id: 'galton-answer', slide: 17, name: 'The Galton board is binomial', what: 'Back to the board of pins. At each of 20 rows, a ball goes right with chance 0.5. The bin it lands in is the number of times it went right. So the bin number is a yes-or-no count over 20 tries: a binomial with n = 20 and p = 0.5.\n\nThe middle bins fill up because there are very many routes that give about 10 rights, and only one route that gives 20 rights out of 20. Bins 6 to 14 hold 96 % of the balls.', more: { html: () => bars(binom(20, 0.5).map((v, k) => [k, v, v.toFixed(3)]), { x: 'bin the ball lands in', cap: 'Bin(20, 0.5): bins 6 to 14 hold 96 %', hi: [6, 7, 8, 9, 10, 11, 12, 13, 14], thin: 1, mean: 10 }) } },
      { id: 'conditions', slide: 18, name: 'Check the four conditions', what: 'A binomial only describes the situation when all four of these conditions are true. If even one fails, you can still type the formula into a calculator, but the answer will not describe what is really happening. Go through the four, one at a time, every time you think you have a binomial.', list: ['The number of tries is fixed in advance. You know n before you start: "the next 10 visitors" is fine. This fails for "visitors until the first purchase", because nobody knows how many that will be.', 'Each try has exactly two results: yes or no. "Buys or does not buy" is fine. This fails for "buys 0, 1 or 2 items", which has three results. The fix is to count buyers instead of items.', 'The tries are independent: the result of one does not affect another. Different strangers are fine. This fails when one customer visits 5 times in a day, because someone who bought this morning is unlikely to buy again this afternoon.', 'The chance p is the same on every try. This fails when you mix groups: newsletter visitors buy more often than visitors from ads, so one single p does not describe them all.'] },
      { id: 'poisson', slide: 19, name: 'Poisson: counts in a fixed window', what: 'The Poisson is for counting how many times something happens in a fixed stretch of time or space: tickets in an hour, calls in a minute, typos on a page. There is no fixed number of tries here: nobody knows how many customers could write.\n\nYou only need one number to describe it: the average count, written with the Greek letter λ (lambda). If the shop gets 4 tickets an hour on average, then λ = 4. The formula then gives the chance of seeing exactly k tickets in the next hour, where k can be 0, 1, 2 and so on. You do not need to do this by hand: a calculator or Excel works it out.', f: 'X ∼ Pois(λ)     k = 0, 1, 2, …\nm_X(k) = e^(−λ) λᵏ / k!\nP(X = 0) = e⁻⁴ = 0.018', more: { html: () => bars(pois(4, 12).map((v, k) => [k, v, v.toFixed(3)]), { x: 'tickets in one hour', cap: 'Pois(4): tickets in one hour', thin: 1, mean: 4 }) } },
      { id: 'poisson-approx', slide: 20, name: 'A binomial with many rare trials', what: 'Think of 100 customers, each with a 1 % chance of writing. That is a binomial with many tries and a small chance each time, and it is painful to calculate. It turns out to be almost the same as a Poisson whose average is n × p, here 100 × 0.01 = 1.\n\nThis explains why the Poisson fits ticket counts: many people, each unlikely to write. You do not even need to know n and p separately, just the average.', watch: 'Use it when events are independent and their rate does not change. Tickets after a delivery failure break the second condition.', more: { say: 'Bin(100, 0.01) against Pois(1), where λ = np = 1.', html: () => tbl(['', 'binomial', 'Poisson'], [['P(X = 0)', '0.366', '0.368'], ['P(X = 1)', '0.370', '0.368'], ['P(X = 5)', '0.00290', '0.00307']]) } },
      { id: 'three-models', slide: 21, name: 'Three models side by side', what: 'Three named patterns, and the skill is recognising which one fits. Is it one yes-or-no? Bernoulli. Is it counting yeses in a known number of tries? Binomial. Is it counting events in a stretch of time, with no fixed number of tries? Poisson.', more: { html: () => tbl(['Model', 'Counts', 'Values'], [['Ber(p)', 'one trial, success or not', '0, 1'], ['Bin(n, p)', 'successes in n independent trials', '0, 1, …, n'], ['Pois(λ)', 'events in a fixed window', '0, 1, 2, …']]) } },
    ] },
    { name: 'Expectation', cards: [
      { id: 'expectation', slide: 29, name: 'The expectation', what: 'The expectation, or mean, is the average you would get if the situation were repeated many times. It is written E[X].\n\nTo get it, take each possible value, multiply it by its chance, and add the results. This way likely values count a lot and unlikely values count little. On the bar chart, it is the point where the chart would balance on your finger. The list below explains each symbol.', f: 'E[X] = Σₓ x m_X(x)', more: { say: 'A lamp order earns €12 if kept, −€6 if returned, −€30 if broken in transit. A single order never earns €8.10; the mean need not be a possible value.', f: 'E[X] = 12 × 0.85 − 6 × 0.10 − 30 × 0.05 = 8.1 euros', html: () => bars([[-30, 0.05, '0.05'], [-6, 0.1, '0.10'], [0, 0, ''], [12, 0.85, '0.85']], { x: 'margin, euros', cap: 'Margin of a lamp order, euros. ▲ the mean, €8.10', mean: 8.1 }) } },
      { id: 'long-run', slide: 30, name: 'The long-run average', what: 'This is why the formula deserves the name "average". Over many orders, each value shows up about as often as its chance says, so the average over all orders comes close to E[X].\n\nIn a simulation, the average margin was €6.00 after 10 orders and €7.88 after 2,000, closing in on €8.10. So expectation is what a business can plan on over many orders, and not what happens on any single one.' },
      { id: 'function', slide: 31, name: 'A function of X', what: 'Sometimes you care about something worked out from X, rather than X itself. X is the number of items in an order, but what you pay for is the number of boxes, and a box holds two items.\n\nA function is simply a rule that turns one number into another, here items into boxes. The number of boxes is itself random, so it is a new random variable, written Y = g(X).', more: { say: 'A box holds two items, so an order of x items ships in g(x) boxes. m_Y(1) = 0.4 + 0.3 = 0.7 and m_Y(2) = 0.3, so E[Y] = 1 × 0.7 + 2 × 0.3 = 1.3 boxes.', html: () => tbl(['items x', 'm_X(x)', 'boxes g(x)'], [['1', '0.4', '1'], ['2', '0.3', '1'], ['3', '0.2', '2'], ['4', '0.1', '2']]) } },
      { id: 'rule', slide: 32, name: 'The expected value rule', what: 'To find the average of something worked out from X, there is a direct way: apply the rule to each value of X first, multiply by that value’s chance, and add.\n\nThe trap is doing it in the other order. Taking the average first and then applying the rule usually gives the wrong answer: 2 items on average does not mean 1 box on average.', f: 'E[g(X)] = Σₓ g(x) m_X(x)', watch: 'In general E[g(X)] ≠ g(E[X]). With E[X] = 2 items, g(2) = 1 box is wrong: the true mean is 1.3.', more: { html: () => tbl(['x', 'm_X(x)', 'g(x)', 'g(x) m_X(x)'], [['1', '0.4', '1', '0.4'], ['2', '0.3', '1', '0.3'], ['3', '0.2', '2', '0.4'], ['4', '0.1', '2', '0.2'], ['sum', '', '', '*1.3']]) } },
      { id: 'linear-mean', slide: 33, name: 'The mean of a linear function', what: 'Some rules are very simple: multiply by a fixed number and add a fixed number, like a cost of €1 per order plus €2 per box. For these rules, there is a shortcut: just apply the same rule to the average.\n\nIf the average number of boxes is 1.3, the average cost is 1 + 2 × 1.3 = €3.60. This shortcut only works for this simple shape of rule.', f: 'E[aX + b] = a E[X] + b', more: { say: 'Packing costs €1 per order plus €2 per box.', f: 'E[1 + 2Y] = 1 + 2 × 1.3 = 3.6 euros' } },
    ] },
    { name: 'Variance', cards: [
      { id: 'spread', slide: 40, name: 'Same mean, different spread', what: 'Two warehouses can have the same average and behave very differently. Both dispatch after 2 days on average. North is reliable: almost always 1 to 3 days. South is all over the place: often 0 days, often 4.\n\nIf you promise customers 3 days, you always keep that promise with North but fail 20 % of the time with South. The average hides this. We need a second number for how spread out the values are.', more: { html: () => row(bars([[0, 0, ''], [1, 0.25, '0.25'], [2, 0.5, '0.50'], [3, 0.25, '0.25'], [4, 0, '']], { x: 'days to dispatch', cap: 'North, SD 0.71 days', mean: 2, max: 0.5 }), bars([[0, 0.2, '0.20'], [1, 0.15, '0.15'], [2, 0.3, '0.30'], [3, 0.15, '0.15'], [4, 0.2, '0.20']], { x: 'days to dispatch', cap: 'South, SD 1.38 days', mean: 2, max: 0.5 })) } },
      { id: 'variance', slide: 41, name: 'Variance and standard deviation', what: 'Variance measures how far values typically fall from the average. Step by step: find how far each value is from the mean, which is called its deviation; square that deviation, multiply by the value’s chance, and add.\n\nWhy square? Without it, deviations below and above the mean would cancel out to zero. But squaring also changes the units, to "days squared", which means nothing to anyone. So we take the square root at the end and get the standard deviation (SD), in plain days. A bigger SD means more spread.', f: 'Var(X) = E[(X − μ)²]     μ = E[X]\nσ_X = √Var(X)', more: { say: 'North warehouse, μ = 2 days. The variance is 0.50, so the SD is 0.71 days.', html: () => tbl(['x', 'm_X(x)', 'x − μ', '(x − μ)²', '× m_X(x)'], [['1', '0.25', '−1', '1', '0.25'], ['2', '0.50', '0', '0', '0'], ['3', '0.25', '1', '1', '0.25'], ['sum', '', '', '', '*0.50']]) } },
      { id: 'shortcut', slide: 42, name: 'The variance shortcut', what: 'This is the same variance, computed a quicker way, usually easier by hand. It needs two averages: the average of the squared values, and the square of the average value. Then subtract.\n\nCareful, those two are not the same: one squares first, the other squares last. The gap between them is exactly the variance.', f: 'Var(X) = E[X²] − (E[X])²', more: { say: 'Check with North: E[X²] = 1 × 0.25 + 4 × 0.5 + 9 × 0.25 = 4.5, and 4.5 − 2² = 0.5, the same as the table.', f: 'E[X² − 2μX + μ²] = E[X²] − 2μ E[X] + μ² = E[X²] − μ²' } },
      { id: 'linear-var', slide: 43, name: 'The variance of a linear function', what: 'What happens to the spread when you change every value? Adding a fixed amount moves everything together, so the spread does not change. If delivery takes one day more than dispatch, its spread is the same.\n\nMultiplying does change it: multiply by 2, and every distance doubles. Because variance uses squares, the variance becomes 4 times bigger, while the standard deviation just doubles.', f: 'Var(aX + b) = a² Var(X)\nσ_(aX+b) = |a| σ_X', more: { say: 'Delivery takes one day more than dispatch: X + 1 has mean 3 days and the same SD, 0.71 days.' } },
      { id: 'models-moments', slide: 44, name: 'Means and variances of the models', what: 'For the three named models, nobody needs to do the long calculation, because the answers are known. Just put your numbers into this table.\n\nExample: for a Galton board, n = 20 and p = 0.5, so the mean is 20 × 0.5 = 10, and the SD is √(20 × 0.5 × 0.5) = √5 = 2.24.', more: { html: () => tbl(['Model', 'E[X]', 'Var(X)', 'SD'], [['Ber(p)', 'p', 'p(1 − p)', '√(p(1 − p))'], ['Bin(n, p)', 'np', 'np(1 − p)', '√(np(1 − p))'], ['Pois(λ)', 'λ', 'λ', '√λ']]) } },
    ] },
  ], practice: [
    { id: 'l3-e1', title: 'Two parcels', setup: 'A lamp and a rug ship as two parcels. Each is late with probability 0.1, independently. X = 1 if the lamp is late, 0 if on time.', parts: [
      ['Write the distribution of X with ∼, and compute P(X = 0).', () => `<pre>X ∼ Ber(0.1)     P(X = 0) = 1 − 0.1 = 0.9</pre>`],
      ['Compute the probability both arrive on time.', () => `<pre>0.9 × 0.9 = 0.81</pre><p>Independent events multiply.</p>`],
      ['Compute the probability exactly one is late.', () => `<pre>0.9 × 0.1 + 0.1 × 0.9 = 0.09 + 0.09 = 0.18</pre><p>Two disjoint cases, so they add. Check: 0.81 + 0.09 + 0.09 + 0.01 = 1.</p>`],
    ] },
    { id: 'l3-e2', title: 'Ten visitors', setup: 'Ten visitors open a product page. Each buys with probability 0.2, independently. X is the number of buyers.', parts: [
      ['Name the distribution and its parameters.', () => `<pre>X ∼ Bin(10, 0.2)</pre><p>10 independent trials, two results each, the same p.</p>`],
      ['Compute P(X = 2) and P(X = 0).', () => `<pre>P(X = 2) = 45 × 0.04 × 0.168 = 0.302\nP(X = 0) = 0.8¹⁰ = 0.107</pre>` + bars(binom(10, 0.2).slice(0, 9).map((v, k) => [k, v, v.toFixed(3)]), { x: 'buyers out of 10', cap: 'PMF of Bin(10, 0.2), up to 8', hi: [0, 2] })],
      ['Compute P(X ≥ 1) with the complement rule.', () => `<pre>P(X ≥ 1) = 1 − P(X = 0) = 0.893</pre><p>Adding the ten values from 1 to 10 gives the same result with more work.</p>`],
      ['One customer opens the page 10 times in a day. Is the number of purchases Bin(10, 0.2)?', () => `<p><b>No.</b> The number of trials is fixed and each has two results, but one customer’s visits are not independent: someone who bought in the morning rarely buys again that afternoon.</p>`],
    ] },
    { id: 'l3-e3', title: 'Protection plan', setup: 'A one-year plan for lamps costs €6. In that year a lamp needs nothing with probability 0.90, a €40 repair with probability 0.07, or a €90 replacement with probability 0.03.', parts: [
      ['Write the PMF of Y, the profit on one plan.', () => tbl(['year', 'probability', 'cost', 'profit y'], [['no service', '0.90', '0', '6'], ['repair', '0.07', '40', '−34'], ['replacement', '0.03', '90', '−84']]) + `<p>Profit is the price minus the cost.</p>`],
      ['Compute E[Y].', () => `<pre>6 × 0.90 − 34 × 0.07 − 84 × 0.03\n= 5.40 − 2.38 − 2.52 = 0.50 euros</pre><p>A single plan never earns €0.50. It is the balance point.</p>`],
      ['What total profit should 1,000 plans bring?', () => `<pre>1,000 × 0.50 = 500 euros</pre>`],
      ['Would a price of €5 be profitable on average?', () => `<pre>E[S] = 40 × 0.07 + 90 × 0.03 = 5.50\nE[Y] = 5 − 5.50 = −0.50 euros</pre><p><b>No.</b> Only a price above €5.50 is profitable on average.</p>`],
    ] },
    { id: 'l3-e4', title: 'Returns desk', setup: 'X is the number of parcels returned to a store in one day.', table: () => tbl(['x', 'm_X(x)'], [['0', '0.3'], ['1', '0.4'], ['2', '0.2'], ['3', '0.1']]), parts: [
      ['Compute E[X].', () => `<pre>0 + 0.4 + 0.4 + 0.3 = 1.1 returns</pre>`],
      ['Compute Var(X) with the shortcut, and the SD.', () => `<pre>E[X²] = 0 + 0.4 + 0.8 + 0.9 = 2.1\nVar(X) = 2.1 − 1.1² = 0.89\nσ_X = √0.89 = 0.94 returns</pre>`],
      ['The desk costs €20 per day plus €5 per return: C = 20 + 5X. Compute E[C] and the SD of C.', () => `<pre>E[C] = 5 × 1.1 + 20 = 25.50 euros\nVar(C) = 25 × 0.89 = 22.25\nσ_C = 4.72 euros</pre>`],
      ['Why does the fixed €20 change E[C] but not its SD?', () => `<p>It is paid every day, so it moves every possible cost by 20: the PMF shifts without changing shape. The distances from the mean stay the same. Only the €5 per return, which multiplies the deviations, changes the SD.</p>`],
    ] },
  ], recap: ['A random variable gives each outcome a number. A statement about it is an event.', 'The PMF lists P(X = x) and sums to 1.', 'Bernoulli: one trial. Binomial: successes in n trials, with four conditions to check. Poisson: counts in a window, λ on average.', 'E[X] = Σ x m_X(x), the balance point and the long-run average.', 'E[g(X)] = Σ g(x) m_X(x), and in general it is not g(E[X]).', 'Var(X) = E[X²] − (E[X])². The SD is its root.', 'E[aX + b] = aE[X] + b, and Var(aX + b) = a² Var(X): adding shifts, multiplying scales.'] },
  { n: 4, short: 'Continuous variables', title: 'Continuous random variables and data', lede: 'Values that can be anything on a scale, where probability becomes an area. Then the bell curve, and how to summarise real data.', groups: [
    { name: 'Probability densities', cards: [
      { id: 'delivery', slide: 4, name: 'The question: how long will the parcel take?', what: 'Nookery logs how many hours each parcel takes: 60.25, 32.67, 50.51, and so on. A time can be any number on a scale, so almost no value ever repeats.\n\nThe PMF of Lecture 3 gives one probability to each value. Here that would give almost every value a probability close to 0, which tells us nothing. The useful question is about a range: how likely is a delivery between 42 and 54 hours? This whole lecture follows from asking about ranges.' },
      { id: 'bins', slide: 5, name: 'Narrower bars become a curve', what: 'Sort the parcels into bins, such as 36 to 44 hours, and draw a bar for each bin. Make each bar’s height the share of parcels in that bin, divided by the width of the bin. Then the area of the bar, width times height, is exactly that share.\n\nEvery parcel falls in one bin, so all the areas add up to 1, however wide the bins are. Now make the bins narrower and narrower. The bars settle into a smooth curve. That curve is called the density of the delivery time.', more: { html: () => row(curve(gauss(48, 6), 28, 68, { bins: 8, ticks: [36, 44, 52, 60], x: 'hours in transit', cap: 'Bins of 8 hours' }), curve(gauss(48, 6), 28, 68, { bins: 4, ticks: [36, 48, 60], x: 'hours in transit', cap: 'Bins of 4 hours' }), curve(gauss(48, 6), 28, 68, { bins: 1, ticks: [36, 48, 60], x: 'hours in transit', cap: 'Bins of 1 hour' })) } },
      { id: 'pdf', slide: 6, name: 'A density gives probabilities as areas', what: 'A continuous random variable has a probability density function, or PDF, written f_X. It is the curve from the card above. The curve is never below zero, and X must land somewhere, so the total area under it is 1.\n\nThe rule to remember: a probability is an area. The chance that X falls between a and b is the area under the curve between a and b. The symbol ∫ just means that area. Think of it as cutting the area into very thin strips, each one height times width, and adding them all up. It is a Σ for a curve.', f: 'Total area:   ∫ f_X(x) dx = 1\nProbability:  P(a ≤ X ≤ b) = ∫ₐᵇ f_X(x) dx', watch: 'The height f_X(x) is not a probability. Only an area is. A height can even be above 1: on a range only half a unit wide, the height of a flat density is 2.', more: { say: 'Parcels between 42 and 54 hours: the exact area is 0.683, close to the 68 % in the log.', html: () => curve(gauss(48, 6), 28, 68, { shade: [42, 54], label: '0.683', ticks: [30, 42, 54, 66], x: 'hours in transit', cap: 'Density of the delivery time, in hours. The shaded area is the probability.' }) } },
      { id: 'named', slide: 7, name: 'Named densities', what: 'Just as Lecture 3 had named PMFs, some densities come up so often that they have names and a few numbers that describe them. Three questions from a parcel service show the three of them.\n\nWhen will the courier come, between 9:00 and 12:00? Uniform. How long until the next support call? Exponential. How many hours will a parcel travel? Gaussian. The next cards take them one at a time.', more: { html: () => row(curve(unif(0, 180), -30, 210, { top: 1 / 110, ticks: [[0, '9:00'], [180, '12:00']], x: 'arrival time', cap: 'Uniform: flat' }), curve(expo(0.2), 0, 25, { ticks: [0, 10, 20], x: 'minutes until the next call', cap: 'Exponential: falls away' }), curve(gauss(48, 6), 28, 68, { ticks: [36, 48, 60], x: 'hours in transit', cap: 'Gaussian: a bell' })) } },
      { id: 'uniform', slide: 8, name: 'Uniform: equal lengths, equal chances', what: 'The courier arrives some time between 9:00 and 12:00, and no part of that window is more likely than another. So the density is flat: the same height everywhere between a and b, and zero outside.\n\nThe total area must be 1, and a flat shape is a rectangle, so its height has to be 1 divided by its width. A probability is then just the width of your interval times that height. The wheel of fortune from Lecture 1 was the same thing, between 0 and 1.', f: 'X ∼ Unif(a, b)\nf_X(x) = 1 / (b − a)     for a ≤ x ≤ b\nE[X] = (a + b) / 2     Var(X) = (b − a)² / 12', more: { html: () => curve(unif(0, 180), -30, 210, { top: 1 / 110, shade: [60, 80], label: '0.111', ticks: [[0, '9:00'], [60, '10:00'], [120, '11:00'], [180, '12:00']], x: 'arrival time', cap: 'Courier arrival. Between 10:00 and 10:20: 20/180 = 0.111' }) } },
      { id: 'zero', slide: 9, name: 'One exact value has probability zero', what: 'What is the chance the courier arrives at exactly 10:30:00.000, not a thousandth of a second off? A single point is a line with no width, and a shape with no width has no area. So the probability is 0, for every single value.\n\nThis has a handy result: endpoints do not matter. "Up to b" and "strictly below b" have the same probability.\n\nIt does not mean the event is impossible in real life, because recorded times are rounded. "Arrives at 10:30", to the minute, really means an interval one minute long, with probability 1/180.', f: 'P(X = x) = 0\nP(X < b) = P(X ≤ b)', watch: 'This is only for continuous variables. For a discrete X, like the number of buyers, P(X ≤ 2) and P(X < 2) are different.' },
      { id: 'integrals', slide: 10, name: 'Mean and variance: integrals replace sums', what: 'Nothing new here, only one swap. In Lecture 3 the mean was: each value, times its chance, all added up. For a continuous variable, Σ becomes ∫ and the PMF m_X becomes the density f_X. The meaning stays the same: the mean is still the balance point, and the variance is still the average squared deviation.\n\nThe rules of Lecture 3 all still hold, such as the shortcut for the variance and the rules for aX + b.', f: 'E[X] = ∫ x f_X(x) dx\nVar(X) = ∫ (x − μ)² f_X(x) dx', more: { html: () => tbl(['', 'Discrete X', 'Continuous X'], [['Total', 'Σₓ m_X(x) = 1', '∫ f_X(x) dx = 1'], ['Mean', 'Σₓ x m_X(x)', '∫ x f_X(x) dx'], ['Variance', 'Σₓ (x − μ)² m_X(x)', '∫ (x − μ)² f_X(x) dx']]) } },
      { id: 'exponential', slide: 15, name: 'Exponential: the time until the next event', what: 'How long until the next support call? Short waits are common, and long waits get rare quickly, so the curve starts high and falls away. This is the exponential.\n\nIt needs one number, λ, the rate: how many events per minute on average. It is the same λ as in the Poisson, which counts events in a window, while the exponential measures the wait for the next one. If calls come every 5 minutes on average, then λ = 1/5 = 0.2. The mean wait is 1/λ, and you do not need an integral for the chance of a long wait, because the formula is ready-made.', f: 'X ∼ Exp(λ)\nf_X(x) = λ e^(−λx)     for x ≥ 0\nP(X > a) = e^(−λa)\nE[X] = 1/λ     Var(X) = 1/λ²', more: { html: () => curve(expo(0.2), 0, 25, { shade: [10, 25], label: '0.135', ticks: [0, 5, 10, 15, 20, 25], x: 'minutes until the next call', cap: 'Minutes until the next call, λ = 0.2. Longer than 10 minutes: 0.135' }) } },
    ] },
    { name: 'Cumulative distribution functions', cards: [
      { id: 'cdf', slide: 21, name: 'The CDF adds up probability to x', what: 'PMFs are for discrete variables and densities for continuous ones. The cumulative distribution function, or CDF, works for both. It answers one question: what is the chance that X is at most x?\n\nFor a discrete variable it adds up the bars from the left, so it climbs in steps from 0 to 1. Once you have it, any range is one subtraction: everything up to b, minus everything up to a, leaves what lies between.', f: 'F_X(x) = P(X ≤ x)\nP(a < X ≤ b) = F_X(b) − F_X(a)', more: { html: () => bars(binom(10, 0.2).slice(0, 9).map((_, k) => [k, binom(10, 0.2).slice(0, k + 1).reduce((a, b) => a + b, 0), binom(10, 0.2).slice(0, k + 1).reduce((a, b) => a + b, 0).toFixed(3)]), { x: 'buyers out of 10', y: 'P(X ≤ x)', cap: 'CDF of Bin(10, 0.2): each bar is the chance of at most that many buyers', max: 1 }) } },
      { id: 'cdf-cont', slide: 22, name: 'The CDF of a continuous variable', what: 'For a continuous variable the CDF has no steps. F_X(x) is the area under the density to the left of x, so it rises smoothly from 0 to 1. For the uniform courier it is a straight line, from 0 at 9:00 to 1 at 12:00. For the exponential it is one minus the chance of waiting longer.\n\nGoing back the other way, the density is the slope of the CDF: where the CDF climbs fast, the density is high. For the Gaussian there is no simple formula, which is why it gets its own table later.', f: 'F_X(x) = ∫ f_X(t) dt, the area to the left of x\nUniform:      F_X(x) = (x − a) / (b − a)\nExponential:  F_X(x) = 1 − e^(−λx)', more: { html: () => curve(x => Math.min(1, Math.max(0, x / 180)), -20, 200, { top: 1.1, guide: [162, 0.9], ticks: [[0, '9:00'], [90, '10:30'], [162, '11:42']], x: 'arrival time', y: 'P(X ≤ x)', cap: 'CDF of the courier’s arrival. It reaches 0.9 at 11:42' }) } },
      { id: 'lamps', slide: 24, name: 'The question: how many lamps to stock?', what: 'A Nookery store sells X ∼ Pois(6) lamps in a day, and each morning the manager decides how many to put on the shelf. Too few loses sales. Too many ties up cash.\n\nWith 8 lamps on the shelf, demand is met with probability F_X(8) = 0.847. The manager wants at least 0.95. Notice the question has flipped: the CDF takes a value and gives a probability, but here we know the probability we want and look for the value.', more: { html: () => bars(pois(6, 14).map((v, k) => [k, v, v.toFixed(3)]), { x: 'lamps sold in a day', cap: 'Pois(6). In colour: the days a stock of 8 is enough', hi: [0, 1, 2, 3, 4, 5, 6, 7, 8], thin: 1 }) } },
      { id: 'quantile', slide: 25, name: 'A quantile reads the CDF backwards', what: 'The q-quantile is the smallest value x where the CDF reaches q. To read it on a chart: start from q on the vertical axis, go right until you hit the CDF, then go down and read x.\n\nThe 0.5-quantile has its own name, the median: half the values are at or below it. It works the same for a continuous variable. The courier’s CDF reaches 0.9 at 11:42, so 11:42 is its 0.9-quantile.', f: 'q-quantile: the smallest x with F_X(x) ≥ q', more: { html: () => tbl(['Stock k', 'F_X(k)', 'Reaches 0.95?'], [['8', '0.847', 'no'], ['9', '0.916', 'no'], ['10', '*0.957', '*yes'], ['11', '0.980', 'yes']]) } },
    ] },
    { name: 'The Gaussian distribution', flowLabel: 'To get a Gaussian probability', flow: ['Subtract μ and divide by σ: that is z', 'Read Φ(z) in the table', 'For the area to the right, take 1 − Φ(z)'], cards: [
      { id: 'bell', slide: 27, name: 'Why the bell curve appears', what: 'Astronomers measuring the same star many times got slightly different numbers. In 1809 Gauss described those errors with the bell-shaped curve that now carries his name.\n\nThe same bell comes up whenever a value is the sum of many small independent effects: errors in repeated measurements, the weight of a package filled by a machine, the bin of a Galton board. Each small effect pushes a little up or down, most of them cancel, and big totals are rare. That is why the Galton board of Lecture 3 looked like a bell.' },
      { id: 'gaussian', slide: 28, name: 'The Gaussian density', what: 'A Gaussian variable is described by two numbers: its mean μ, the centre of the bell, and its standard deviation σ, the width of the bell. A larger σ gives a lower, wider bell, since the total area must stay 1. It is also called the normal distribution, which is where the N comes from.\n\nThe formula looks frightening, and you will almost never use it by hand. Its heart is the deviation x − μ: the further x is from the middle, the smaller the curve.', f: 'X ∼ N(μ, σ)\nf_X(x) = 1 / (σ √(2π)) × e^(−(x − μ)² / (2σ²))\nE[X] = μ     Var(X) = σ²', more: { html: () => row(curve(gauss(48, 6), 20, 100, { top: 0.07, ticks: [20, 48, 100], x: 'hours', cap: 'N(48, 6)' }), curve(gauss(56, 6), 20, 100, { top: 0.07, ticks: [20, 56, 100], x: 'hours', cap: 'N(56, 6): the bell moves' }), curve(gauss(48, 10), 20, 100, { top: 0.07, ticks: [20, 48, 100], x: 'hours', cap: 'N(48, 10): lower and wider' })) } },
      { id: 'one-table', slide: 30, name: 'One table is enough', what: 'The area under a Gaussian has no simple formula, so its probabilities come from a printed table. But nobody can print one table for every μ and every σ.\n\nHere is the trick. Every Gaussian is the same bell, moved by μ and stretched by σ. So if you measure distance in standard deviations, they are all identical: the area up to 2 SDs above the mean is always 0.9772. One single table, for the Gaussian with mean 0 and SD 1, answers every question.', more: { html: () => row(curve(gauss(48, 6), 30, 66, { shade: [30, 60], label: '0.9772', ticks: [48, 60], x: 'hours in transit', cap: 'Parcels, N(48, 6), hours' }), curve(gauss(12, 3), 3, 21, { shade: [3, 18], label: '0.9772', ticks: [12, 18], x: 'minutes packing', cap: 'Packing, N(12, 3), minutes' }), curve(gauss(0, 1), -3, 3, { shade: [-3, 2], label: '0.9772', ticks: [0, 2], x: 'z, in SDs from the mean', cap: 'Standard, N(0, 1)' })) } },
      { id: 'standardize', slide: 31, name: 'Standardize, then read the table', what: 'To standardize a value: subtract the mean, then divide by the SD. The result, called z, says how many SDs above the mean you are. A negative z means below the mean.\n\nThe variable Z made this way is Gaussian with mean 0 and SD 1, called the standard Gaussian or standard normal. Its CDF has its own letter, Φ. The table gives Φ(z), the area to the left of z.', f: 'Z = (X − μ) / σ     is N(0, 1)\nΦ(z) = P(Z ≤ z)', more: { html: () => curve(gauss(0, 1), -3.5, 3.5, { shade: [2, 3.5], ticks: [-2, 0, 2], x: 'z, in SDs from the mean', cap: 'A parcel slower than 60 hours is the same area as z above 2: 0.023' }) } },
      { id: 'tables', slide: 32, name: 'The two tables', what: 'There are two tables, for the two directions. The first goes from z to a probability. The second goes from a probability back to z.\n\nThe tables only list positive z, and the bell is symmetric, so for a negative z use the mirror rule below. In a spreadsheet, the formulas shown here do the same job and work for any Gaussian directly.', f: 'Φ(−z) = 1 − Φ(z)\n=NORM.S.DIST(z, TRUE)     from z to a probability\n=NORM.S.INV(q)     from a probability to z\n=NORM.DIST(x, mu, sigma, TRUE)     P(X ≤ x)\n=NORM.INV(q, mu, sigma)     the q-quantile', more: { html: () => row(tbl(['z', 'Φ(z)'], [['0', '0.5000'], ['1', '0.8413'], ['2', '0.9772'], ['2.5', '0.9938']]), tbl(['q', 'z with Φ(z) = q'], [['0.90', '1.282'], ['0.95', '1.645'], ['0.975', '1.960'], ['0.99', '2.326']])) } },
      { id: 'quantile-g', slide: 34, name: 'A Gaussian quantile is μ + zσ', what: 'To turn a probability into a value: read z from the second table, then go that many SDs from the mean. That is standardizing run backwards.\n\nThis is how a delivery promise is set. To keep its promise on 95 % of parcels, Nookery promises delivery within about 58 hours of dispatch.', f: 'the q-quantile of N(μ, σ) is μ + zσ', more: { html: () => tbl(['q', 'z', '48 + z × 6, hours'], [['0.50', '0', '48.0'], ['0.90', '1.282', '55.7'], ['0.95', '1.645', '*57.9'], ['0.99', '2.326', '62.0']]) } },
      { id: 'three-continuous', slide: 33, name: 'Three continuous models side by side', what: 'The whole first half of this lecture in one table. As in Lecture 3, the skill is recognising which one fits. Is every moment in a window equally likely? Uniform. Is it the wait for the next event? Exponential. Is it a total of many small effects, a bell around a middle? Gaussian.', more: { html: () => tbl(['Model', 'Density f_X(x)', 'CDF F_X(x)', 'E[X]', 'Var(X)'], [['Unif(a, b)', '1/(b − a)', '(x − a)/(b − a)', '(a + b)/2', '(b − a)²/12'], ['Exp(λ)', 'λ e^(−λx)', '1 − e^(−λx)', '1/λ', '1/λ²'], ['N(μ, σ)', 'the bell formula', 'Φ((x − μ)/σ)', 'μ', 'σ²']]) } },
    ] },
    { name: 'Summaries of data', cards: [
      { id: 'model-gives', slide: 40, name: 'A model gives a mean', what: 'Everything so far started from a model, a density with its numbers, and computed from it the mean μ and the SD σ. A model describes what could happen. Its mean and SD are fixed, and in practice we usually do not know them.\n\nFor example, the time to handle a support ticket might follow a skewed density, with a long tail of slow tickets, whose mean is 10 minutes and whose SD is 7.07 minutes. The next card starts from the other side: from data.', f: 'f_X(x) = x e^(−x/θ) / θ²     with θ = 5 minutes\nμ = 10 minutes     σ_X = 7.07 minutes', more: { html: () => curve(x => (x <= 0 ? 0 : (x * Math.exp(-x / 5)) / 25), 0, 40, { ticks: [0, 10, 20, 30, 40], x: 'minutes handling', cap: 'A skewed density: handling time in minutes' }) } },
      { id: 'sample', slide: 41, name: 'Data give a sample mean', what: 'Data record what did happen: a table of outcomes, x₁ up to xₙ. From them we compute the sample mean, written x̄, and the sample SD, written s. These look like μ and σ, but they are different things: x̄ and s come from this one sample, and another sample of tickets would give other values.\n\nThe sample mean is just the ordinary average. The sample variance s² is nearly the average squared deviation, except that it divides by n − 1. The sample SD is its root.', f: 'x̄ = (1/n) Σᵢ xᵢ\ns² = (1/(n − 1)) Σᵢ (xᵢ − x̄)²\ns = √s²', watch: 'μ and σ belong to the model. x̄ and s belong to the data. Ten tickets from the model above gave x̄ = 9.07 and s = 5.49, not 10 and 7.07.' },
      { id: 'by-hand', slide: 42, name: 'Why divide by n − 1?', what: 'The deviations here are measured from x̄, and x̄ was computed from these same data, so it sits closer to them than the true unknown mean does. That makes the squared deviations come out a little too small. Dividing by n − 1 instead of n makes up for it. For large n the difference is small.\n\nOne check when you work by hand: the deviations from x̄ always add up to 0, as in the table.', more: { say: 'Handling times of six tickets, in minutes. The last row is the sums. So x̄ = 30/6 = 5, s² = 10/5 = 2 and s = √2 = 1.41 minutes.', html: () => tbl(['xᵢ', 'xᵢ − x̄', '(xᵢ − x̄)²'], [['4', '−1', '1'], ['6', '1', '1'], ['5', '0', '0'], ['7', '2', '4'], ['3', '−2', '4'], ['5', '0', '0'], ['*30', '*0', '*10']]) } },
      { id: 'median', slide: 46, name: 'Median and quartiles of data', what: 'Sort the values from smallest to largest. The median is the one in the middle. With an even number of values there are two in the middle, so take their average.\n\nThe quartiles cut the data into four. Q₁ is the median of the lower half and Q₃ is the median of the upper half. The distance between them is the interquartile range, the IQR: the width of the middle half of the data. With an odd number of values, the median belongs to both halves.', f: 'IQR = Q₃ − Q₁', more: { say: 'The six tickets, sorted: 3, 4, 5, 5, 6, 7. The two middle values are 5 and 5, so the median is 5. The lower half 3, 4, 5 gives Q₁ = 4, the upper half 5, 6, 7 gives Q₃ = 6, so the IQR is 6 − 4 = 2 minutes.' } },
      { id: 'boxplot', slide: 43, name: 'The parts of a box plot', what: 'A box plot draws those numbers as a picture. The box runs from Q₁ to Q₃, so it holds the middle half of the data, and the line inside it is the median. The whiskers reach out to the farthest values that are within 1.5 × IQR of the box. Anything beyond the whiskers is drawn as a separate dot, an outlier.\n\nAt one glance you see where the middle is, how wide the middle half is, and how many unusual values there are.', more: { html: () => boxplot({ lo: -15, hi: 40, q1: 2.52, med: 5.25, q3: 10.08, wlo: -8.7, whi: 21.41, out: [25, 28, 31, 34, 37], ticks: [-10, 0, 10, 20, 30, 40], cap: 'Margins of 2,000 orders, in euros. The dots only stand for the 144 outliers, they are not placed one by one.' }) + tbl(['Part', 'Name', 'Euros'], [['0.25-quantile, left of the box', 'Q₁', '2.52'], ['0.5-quantile, line in the box', 'median', '5.25'], ['0.75-quantile, right of the box', 'Q₃', '10.08'], ['Q₃ − Q₁, width of the box', 'IQR', '7.56'], ['Farthest values within 1.5 × IQR of the box', 'whiskers', '−8.70, 21.41'], ['Values beyond the whiskers', 'outliers', '144 of them']]) } },
      { id: 'robust', slide: 48, name: 'Robust summaries', what: 'The mean and the SD use every value, so one extreme value can move them a lot. The median and the IQR depend only on the middle of the sorted data, so they barely move. Summaries like these are called robust.\n\nThis tells you which number to trust. When a few extreme values are present, the median describes a typical case better than the mean does.', more: { say: 'The six tickets again, but the ticket of 7 minutes becomes 70, because someone forgot to close it. The mean jumps from 5 to 15.5 minutes, a value no typical ticket comes near. The median stays at 5.', html: () => tbl(['', '3, 4, 5, 5, 6, 7', '3, 4, 5, 5, 6, 70'], [['mean', '5', '15.5'], ['median', '5', '*5']]) } },
    ] },
  ], practice: [
    { id: 'l4-e1', title: 'Waiting for the shuttle', setup: 'A shuttle van links two warehouses and leaves every 20 minutes. A worker arrives without knowing the timetable, so the wait W for the next van is uniform between 0 and 20 minutes.', parts: [
      ['Write the distribution of W with ∼, and compute P(W > 15).', () => `<pre>W ∼ Unif(0, 20)     height = 1/20\nP(W > 15) = (20 − 15) × 1/20 = 0.25</pre>` + curve(unif(0, 20), -2, 22, { top: 0.075, shade: [15, 20], label: '0.25', ticks: [0, 5, 10, 15, 20], x: 'minutes waited', cap: 'Wait in minutes. A probability is an area.' })],
      ['Compute E[W] and the SD of W.', () => `<pre>E[W] = (0 + 20) / 2 = 10 minutes\nVar(W) = 20² / 12 = 33.3 minutes²\nσ_W = √33.3 = 5.77 minutes</pre><p>The mean of a uniform is the middle of the interval.</p>`],
    ] },
    { id: 'l4-e2', title: 'A quiet support desk', setup: 'The support log shows one chat every 4 minutes on average. The time X until the next chat is modeled as exponential, with that mean.', parts: [
      ['Write the distribution of X with ∼, and give the SD of X.', () => `<pre>E[X] = 1/λ = 4, so λ = 1/4 = 0.25 per minute\nX ∼ Exp(0.25)\nVar(X) = 1/λ², so σ_X = 1/λ = 4 minutes</pre>`],
      ['An agent needs 6 quiet minutes to file a report. Compute the probability that no chat arrives in that time.', () => `<p>No chat in 6 minutes means the next chat comes after more than 6 minutes: the event X > 6.</p><pre>P(X > 6) = e^(−0.25 × 6) = e^(−1.5) = 0.223</pre>` + curve(expo(0.25), 0, 20, { shade: [6, 20], label: '0.223', ticks: [0, 6, 12, 18], x: 'minutes until the next chat', cap: 'Minutes until the next chat' })],
    ] },
    { id: 'l4-e3', title: 'Packing time', setup: 'The time T to pack one order is modeled as N(12, 3) minutes. Use the table of Φ.', parts: [
      ['Compute P(T > 15) and P(T < 9).', () => `<pre>z = (15 − 12) / 3 = 1\nP(T > 15) = 1 − Φ(1) = 1 − 0.8413 = 0.159\n\nz = (9 − 12) / 3 = −1\nP(T < 9) = Φ(−1) = 1 − Φ(1) = 0.159</pre><p>The table gives the area to the left. The area to the right is the complement, and below the mean the bell’s symmetry gives the same number.</p>`],
      ['The team wants a time limit met by 99 % of orders. Compute the 0.99-quantile.', () => `<pre>Φ(z) = 0.99, so z = 2.326\n12 + 2.326 × 3 = 18.98 minutes</pre><p>A limit of 19 minutes is met by 99 % of orders.</p>`],
      ['Orders packed in less than 6 minutes are often packed badly. The team wants at most 1 % of orders below 6 minutes, with σ = 3 minutes. Compute the smallest mean μ that allows this.', () => `<p>The threshold of 6 must sit at the 0.01-quantile. Φ(2.326) = 0.99, so by symmetry Φ(−2.326) = 0.01: the threshold is 2.326 SDs below the mean.</p><pre>μ = 6 + 2.326 × 3 = 12.98 minutes</pre>`],
    ] },
    { id: 'l4-e4', title: 'Ride lengths', setup: 'Nine e-bike rides took 8, 10, 12, 12, 14, 15, 18, 18 and 19 minutes.', parts: [
      ['Compute the sample mean x̄, the sample variance s² and the sample SD s.', () => tbl(['xᵢ', '8', '10', '12', '12', '14', '15', '18', '18', '19', 'sum'], [['(xᵢ − x̄)²', '36', '16', '4', '4', '0', '1', '16', '16', '25', '*118']]) + `<pre>x̄ = 126 / 9 = 14 minutes\ns² = 118 / 8 = 14.75 minutes²\ns = √14.75 = 3.84 minutes</pre>`],
      ['Compute the median, Q₁, Q₃ and the IQR.', () => `<pre>median = the fifth of nine = 14 minutes\nQ₁ = median of 8, 10, 12, 12, 14 = 12 minutes\nQ₃ = median of 14, 15, 18, 18, 19 = 18 minutes\nIQR = 18 − 12 = 6 minutes</pre><p>With an odd number of values, the median belongs to both halves.</p>`],
      ['A rider forgets to lock a bike, and a tenth ride of 96 minutes joins the data. Compute all these summaries again.', () => tbl(['', '9 rides', '10 rides'], [['mean', '14', '22.2'], ['SD', '3.84', '26.18'], ['median', '14', '14.5'], ['Q₁, Q₃', '12, 18', '12, 18'], ['IQR', '6', '6']]) + `<pre>x̄ = 222 / 10 = 22.2 minutes\ns² = 6,169.6 / 9 = 685.5     s = 26.18 minutes\nmedian = (14 + 15) / 2 = 14.5 minutes</pre><p>The halves now run from 8 to 14 and from 15 to 96, so Q₁ and Q₃ stay put.</p>`],
      ['Which summaries barely move? Which ones describe a typical ride?', () => `<p>The mean rose by 8.2 and the SD by 22.34, because they use every value. The median rose by 0.5 and the IQR by 0, because they depend on the middle of the sorted data. They are <b>robust</b>.</p><p>Nine of the ten rides took at most 19 minutes, so the median, 14.5 minutes, describes a typical ride. The mean, 22.2 minutes, does not.</p>`],

  ], recap: ['For a continuous variable, a probability is an area under the density f_X. The total area is 1, and the height is not a probability.', 'One exact value has probability 0, so endpoints do not matter.', 'Uniform: flat on a window. Exponential: the wait for the next event, P(X > a) = e^(−λa). Gaussian: a bell, for totals of many small effects.', 'Mean and variance work as in Lecture 3, with ∫ in place of Σ.', 'The CDF is F_X(x) = P(X ≤ x), and P(a < X ≤ b) = F_X(b) − F_X(a). A quantile reads it backwards.', 'Gaussian: z = (x − μ)/σ, then the table of Φ. Going back, the quantile is μ + zσ.', 'A model has μ and σ. Data have x̄ and s, with n − 1. The median and IQR are robust, and the mean and SD are not.'] },

/* ---------- Every formula, piece by piece ----------
 * Asked for 2026-11-05: "the elements in the equation need to be explained one by one in the
 * more explanation part". parts: each symbol and what it means. walk: the formula worked out
 * on a tiny example, and "on the left I have the formulas by pieces so I connect the dots": each
 * step is [the piece of the formula, the same piece in numbers]; a third item marks a result.
 * "With the numbers p k n, so I can understand p = ... or n = ...": a walk opens with what each letter is. */
const READS = {

/* ---------- Store: this browser first, then the account ---------- */
// The same marks and notes as the Python page, under keys that start with stats|.
const ON_BRAIN = location.pathname.startsWith('/statistics');
const MARKS_URL = '/api/coding/marks';
const NOTES_URL = '/api/coding/notes';
function readStore(key, empty) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v ?? empty; } catch (e) { return empty; } }
function writeStore(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
let marks = readStore('stats-marks', {});
let notes = readStore('stats-notes', []);
const saveLocal = () => { writeStore('stats-marks', marks); writeStore('stats-notes', notes); };
const syncEl = document.getElementById('sync');
const fromServer = n => ({ id: n.id, key: n.itemKey, kind: n.kind, body: n.body, answer: n.answer, readAt: n.readAt, createdAt: n.createdAt });
const mine = k => k.startsWith('stats|');

async function load() {
  if (!ON_BRAIN) { syncEl.textContent = 'Saved in this browser.'; return; }
  try {
    const [mr, nr] = await Promise.all([fetch(MARKS_URL), fetch(NOTES_URL)]);
    if (!mr.ok || !nr.ok) throw new Error('load');
    const sm = Object.fromEntries(Object.entries((await mr.json()).marks || {}).filter(([k]) => mine(k)));
    // Marks made here before signing in go up once; the account's own are never overwritten.
    const up = Object.fromEntries(Object.entries(marks).filter(([k]) => !(k in sm)));
    if (Object.keys(up).length) fetch(MARKS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ marks: up }) }).catch(() => {});
    marks = { ...sm, ...up };
    const server = (await nr.json()).notes.filter(n => mine(n.itemKey)).map(fromServer);
    const local = notes.filter(n => !n.id);
    if (local.length) {
      const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: local.map(n => ({ key: n.key, kind: n.kind, body: n.body })) }) });
      server.push(...(r.ok ? (await r.json()).notes.map(fromServer) : local));
    }
    notes = server;
    saveLocal();
    syncEl.textContent = 'Synced with your account: the same on your phone and computer.';
  } catch (e) { syncEl.textContent = 'Offline: kept in this browser for now.'; }
  renderSession(); renderNotebook(); paintBars(); showFiles(false);
}
function setMark(key, mark) {
  if (marks[key] === mark) delete marks[key]; else marks[key] = mark;
  saveLocal();
  if (ON_BRAIN) fetch(MARKS_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, mark: marks[key] ?? null, note: null }) })
    .catch(() => { syncEl.textContent = 'Offline: the mark is kept in this browser.'; });
}

/* ---------- Notes ---------- */
const noteRef = n => n.id || n.localId;
const notesOf = key => notes.filter(n => n.key === key);
async function addNote(key, kind, body) {
  const text = body.trim();
  if (!text) return;
  const n = { localId: `l${Date.now()}`, key, kind, body: text, answer: null, readAt: null, createdAt: new Date().toISOString() };
  notes.push(n); saveLocal(); paintNotes();
  if (!ON_BRAIN) return;
  try {
    const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: [{ key, kind, body: text }] }) });
    if (!r.ok) throw new Error();
    Object.assign(n, fromServer((await r.json()).notes[0])); delete n.localId; saveLocal();
  } catch (e) { syncEl.textContent = 'Could not save the note to your account; it is kept in this browser.'; }
}
function editNote(ref, kind, body) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n || !body.trim()) return;
  n.kind = kind; n.body = body.trim(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, body: n.body }) }).catch(() => {});
}
function deleteNote(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  notes = notes.filter(x => x !== n); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'DELETE' }).catch(() => {});
}
function markRead(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  n.readAt = new Date().toISOString(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ read: true }) }).catch(() => {});
}
const KIND = { question: 'Question', comment: 'Comment' };
function noteHtml(n) {
  const done = n.kind !== 'question' || (n.answer && n.readAt);
  return `<div class="note${done ? ' done' : ''}" data-kind="${n.kind}" data-ref="${esc(noteRef(n))}">
    <div class="note-head"><span class="note-kind">${KIND[n.kind]}</span><span class="tools"><button type="button" class="n-edit" aria-label="Edit">✎</button><button type="button" class="n-del" aria-label="Delete">×</button></span></div>
    <div class="note-body">${boldHtml(esc(n.body))}</div>
    ${n.answer ? `<div class="answer"><span class="note-kind">Answer</span><div class="note-body"${n.id ? ` data-hl="stats|ans|${esc(n.id)}"` : ''}>${boldHtml(esc(n.answer))}</div>${n.readAt ? '' : '<button type="button" class="read">Got it, mark read</button>'}</div>` : ''}
  </div>`;
}
function editorHtml(kind, body) {
  return `<div class="editor" data-kind="${kind}"><div class="kinds" role="radiogroup" aria-label="Kind of note">${Object.entries(KIND).map(([k, l]) => `<button type="button" role="radio" data-kind="${k}" aria-checked="${k === kind}">${l}</button>`).join('')}</div>
    <textarea rows="3" maxlength="2000" aria-label="Your note" placeholder="Write your question or comment">${esc(body)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
function paintNotes() {
  paintBoxes();
  for (const card of document.querySelectorAll('.card')) {
    const list = notesOf(card.dataset.key);
    card.querySelector('.notes').innerHTML = list.map(noteHtml).join('');
    const b = card.querySelector('.note-btn');
    b.setAttribute('aria-pressed', String(list.length > 0));
    b.textContent = list.length ? `Question or comment · ${list.length}` : 'Question or comment';
  }
  renderNotebook();
  applyHighlights();
}
/* ---------- Your own boxes ----------
 * Asked for 2026-11-05: "add ability to create new boxes, so I can write a new box and give it a title".
 * A box is one note under stats|box|, so it never shows in the notepad: the first line is its title,
 * the rest its text. A new box's unsaved words stay in this browser until it is saved or cancelled. */
const BOX_PREFIX = 'stats|box|';
const boxKey = (n, gi) => `${BOX_PREFIX}s${n}|g${gi}`;
const boxParts = body => { const at = body.indexOf('\n'); return at < 0 ? [body, ''] : [body.slice(0, at), body.slice(at + 1)]; };
const boxDrafts = () => readStore('stats-box-drafts', {});
function setBoxDraft(key, draft) {
  const all = boxDrafts();
  if (draft) all[key] = draft; else delete all[key];
  writeStore('stats-box-drafts', all);
}
function ownBoxHtml(n, part) {
  const [title, words] = boxParts(n.body);
  return `<article class="own-box" data-ref="${esc(noteRef(n))}"><h3><span>${esc(title)}</span><span class="part-tag">${esc(part)}</span><span class="tools"><button type="button" class="box-edit" aria-label="Edit">✎</button><button type="button" class="box-del" aria-label="Delete">×</button></span></h3>${words ? `<div class="words">${boldHtml(esc(words))}</div>` : ''}</article>`;
}
function boxEditorHtml(title, words, ref) {
  return `<div class="box-editor"${ref ? ` data-ref="${esc(ref)}"` : ''}><input type="text" maxlength="120" aria-label="Title of the box" placeholder="Title" value="${esc(title)}">
    <textarea rows="4" maxlength="1870" aria-label="What the box says" placeholder="Write here">${esc(words)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
function paintBoxes() {
  for (const wrap of document.querySelectorAll('.own-boxes')) {
    if (wrap.querySelector('.box-editor')) continue;
    wrap.innerHTML = `${notesOf(wrap.dataset.boxKey).map(n => ownBoxHtml(n, wrap.dataset.part)).join('')}<button type="button" class="box-add">+ New box</button>`;
  }
}
document.addEventListener('click', async e => {
  const t = e.target, wrap = t.closest('.own-boxes');
  if (!wrap) return;
  const key = wrap.dataset.boxKey, own = t.closest('.own-box'), ed = t.closest('.box-editor');
  const openEditor = wrap.querySelector('.box-editor');
  if (t.closest('.box-add')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const draft = boxDrafts()[key] || { title: '', words: '' };
    t.closest('.box-add').insertAdjacentHTML('beforebegin', boxEditorHtml(draft.title, draft.words));
    t.closest('.box-add').remove();
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-edit')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const n = notes.find(x => noteRef(x) === own.dataset.ref);
    if (!n) return;
    own.outerHTML = boxEditorHtml(...boxParts(n.body), noteRef(n));
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-del')) {
    const b = t.closest('.box-del');
    if (b.dataset.armed) { deleteNote(own.dataset.ref); return; }
    b.dataset.armed = '1'; b.textContent = 'Delete?'; b.classList.add('armed');
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if (ed && t.closest('.cancel')) {
    if (!ed.dataset.ref) setBoxDraft(key, null);
    ed.remove(); paintBoxes();
    return;
  }
  if (ed && t.closest('.save')) {
    const input = ed.querySelector('input'), title = input.value.trim(), words = ed.querySelector('textarea').value.trim();
    if (!title) { input.setAttribute('aria-invalid', 'true'); input.placeholder = 'Give the box a title'; input.focus(); return; }
    const body = words ? `${title}\n${words}` : title, ref = ed.dataset.ref;
    if (!ref) setBoxDraft(key, null);
    ed.remove();
    if (ref) { editNote(ref, 'comment', body); return; }
    await addNote(key, 'comment', body);
    paintBoxes();
  }
});
document.addEventListener('input', e => {
  const ed = e.target.closest('.box-editor');
  if (ed && !ed.dataset.ref) setBoxDraft(ed.closest('.own-boxes').dataset.boxKey, { title: ed.querySelector('input').value, words: ed.querySelector('textarea').value });
});
// One handler for every card and the notepad's list.
document.addEventListener('click', e => {
  const t = e.target;
  const k = t.closest('.editor .kinds [data-kind]');
  if (k) { const ed = k.closest('.editor'); ed.dataset.kind = k.dataset.kind; for (const b of ed.querySelectorAll('.kinds button')) b.setAttribute('aria-checked', String(b === k)); return; }
  const host = t.closest('.card, .nb-group');
  if (!host) return;
  const m = t.closest('.mark');
  if (m) {
    setMark(host.dataset.key, m.dataset.mark);
    const v = marks[host.dataset.key] || '';
    host.dataset.mark = v;
    for (const b of host.querySelectorAll('.mark')) b.setAttribute('aria-pressed', String(b.dataset.mark === v));
    paintBars(); renderMap();
    return;
  }
  if (t.closest('.note-btn')) {
    host.querySelector('.editor')?.remove();
    host.querySelector('.notes').insertAdjacentHTML('afterend', editorHtml('question', ''));
    host.querySelector('.editor textarea').focus();
    return;
  }
  const note = t.closest('.note');
  if (note && t.closest('.n-edit')) {
    const n = notes.find(x => noteRef(x) === note.dataset.ref);
    note.insertAdjacentHTML('afterend', editorHtml(n.kind, n.body));
    note.nextElementSibling.dataset.ref = note.dataset.ref;
    note.hidden = true;
    note.nextElementSibling.querySelector('textarea').focus();
    return;
  }
  if (note && t.closest('.n-del')) {
    const b = t.closest('.n-del');
    if (b.dataset.armed) { deleteNote(note.dataset.ref); return; }
    b.dataset.armed = '1'; b.textContent = 'Delete?'; b.classList.add('armed');
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if (note && t.closest('.read')) { markRead(note.dataset.ref); return; }
  const ed = t.closest('.editor');
  if (ed && t.closest('.save')) {
    const body = ed.querySelector('textarea').value;
    ed.remove();
    if (ed.dataset.ref) editNote(ed.dataset.ref, ed.dataset.kind, body); else addNote(host.dataset.key, ed.dataset.kind, body);
    paintNotes();
    return;
  }
  if (ed && t.closest('.cancel')) { ed.remove(); paintNotes(); }
});

const TERMS = /\b(sample spaces?|complements?|unions?|intersections?|disjoint|partitions?|De Morgan|axioms?|events?|sample (?:mean|variance|SD)s?|densit(?:y|ies)|PDFs?|CDFs?|quantiles?|medians?|quartiles?|IQR|Gaussian|exponential|robust|standardize|standardization|conditional probabilit(?:y|ies)|total probability|chain rule|multiplication rule|Bayes|priors?|likelihoods?|posteriors?|independent|independence|PMFs?|Bernoulli|binomial|Poisson|expectation|variances?|standard deviation|deviations?|SD|random variables?|frequenc(?:y|ies))\b/gi;
