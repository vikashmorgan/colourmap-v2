      ['Compute the log-likelihood ℓ(λ) = ln L(λ) of each candidate. Which one has the largest value?', () => tbl(['λ', '1', '2', '3'], [['ℓ(λ)', '−5.485', '*−4.326', '−4.893']]) + `<p>λ = 2 again: the logarithm only grows with L, so it peaks at the same candidate.</p>`],
      ['A colleague proposes Bin(4, 0.5) for the same counts. Which model fits the data better, Pois(2) or Bin(4, 0.5), and by how many times?', () => `<pre>Bin(4, 0.5):  P(1) = 4/16     P(3) = 4/16     P(2) = 6/16\nL = 0.25 × 0.25 × 0.375 = 0.0234\n0.0234 / 0.01322 = 1.77</pre><p><b>Bin(4, 0.5)</b> fits better: the data are 1.77 times as probable under it.</p>`],
    ] },
    { id: 'l5-e6', title: 'A paid membership', setup: 'From the exercise sheet. Nookery offers a paid membership to 10 customers, and 4 join. Model the answers as i.i.d. Ber(p), with the candidates 0.2, 0.3, 0.4 and 0.5. Offering it to 1,000 customers costs 4,000 euros, and each member brings 15 euros. Nookery launches if the MLE gives a profit and the data are at least 5 times as probable under the MLE as under every candidate with a loss.', parts: [
      ['Write L(p) and compute it for each candidate. Which is the MLE on this grid?', () => `<pre>L(p) = p⁴ (1 − p)⁶</pre>` + tbl(['p', '0.2', '0.3', '0.4', '0.5'], [['L(p) × 10⁴', '4.19', '9.53', '*11.94', '9.77']]) + `<pre>p̂ = 0.4</pre>`],
      ['Write the profit g(p) of 1,000 offers for each candidate. Which ones give a loss?', () => `<pre>g(p) = 1,000 × p × 15 − 4,000 = 15,000p − 4,000</pre>` + tbl(['p', '0.2', '0.3', '0.4', '0.5'], [['g(p), euros', '*−1,000', '500', '2,000', '3,500']]) + `<p>Only p = 0.2 gives a loss.</p>`],
      ['Compute the likelihood ratio of the MLE against the candidate with a loss. Launch?', () => `<pre>L(0.4) / L(0.2) = 11.94 / 4.19 = 2.85</pre><p><b>Not yet.</b> The MLE gives a profit, but 2.85 is below 5: ten answers cannot rule out a loss.</p>`],
      ['A larger test has 16 joining among 40 customers. Repeat the MLE and the ratio. Launch?', () => `<pre>L(p) = p¹⁶ (1 − p)²⁴\np̂ = 0.4, again\nL(0.4) / L(0.2) = 65.8</pre><p><b>Launch.</b> The same share of members, 40 %, but four times as many answers: the data are now 65.8 times as probable under 0.4 as under 0.2, far above 5.</p>`],
    ] },
  ], recap: ['A joint PMF gives each pair of values a probability. Row and column sums give the marginal PMFs.', 'X and Y are independent if every cell equals m_X(x) m_Y(y).', 'Means always add. Variances add for independent variables.', 'i.i.d. variables: the probability of the whole list is the product.', 'Covariance and correlation measure how two variables move together on a straight line. ρ is between −1 and 1.', 'r = 0 does not mean independent, and a correlation does not show a cause.', 'The likelihood L(θ) = P(data ∣ θ). The MLE θ̂ is the candidate with the largest L. Compare two candidates by their ratio.', 'Use ℓ(θ) = ln L(θ) for many data: it peaks at the same candidate.', 'The MLE is the best on the list, not necessarily a good model.'] },
];
SESSIONS.forEach(s => { let k = 0; for (const g of s.groups) for (const c of g.cards) c.num = `${s.n}.${++k}`; });
const readSize = () => Number(document.documentElement.style.getPropertyValue('--read')) || 1;
const cardKey = (s, id) => `stats|s${s}|${id}`;

// The picture at the top of each lecture: drawn on Nookery, the course’s made-up shop.
const PICTURES = {
  1: () => `<p class="pic-lede">One order has four possible <b>outcomes</b>, the cells of this grid. The <b>model</b> gives each a probability, and they sum to 1. An <b>event</b> is a set of cells; add its cells to get its probability.</p>`
    + row(orderGrid(['ω3', 'ω4'], 'L = late: 0.14'), orderGrid(['ω2', 'ω4'], 'R = refunded: 0.10'))
    + row(orderGrid(['ω4'], 'L ∩ R, both: 0.04'), orderGrid(['ω2', 'ω3', 'ω4'], 'L ∪ R, either: 0.20'))
    + `<p class="pic-lede">The same operations on any two sets:</p>`
    + row(venn(['a', 'ab', 'b'], { cap: 'A ∪ B, or' }), venn(['ab'], { cap: 'A ∩ B, and' }), venn(['a'], { cap: 'A ∩ Bᶜ, and not' })),
  2: () => `<p class="pic-lede"><b>Forward, along the tree.</b> North ships 70 % of orders and South 30 %. Multiply along each path, then add the late leaves: P(L) = 0.07 + 0.06 = 0.13.</p>`
    + warehouseTree()
    + `<p class="pic-lede"><b>Backward, with Bayes.</b> A late order arrives: which warehouse? Divide each late leaf by the sum.</p>`

  '3|poisson': { parts: [['λ', 'Lambda: the average count in the window.'], ['k', 'The count you ask about: the chance of seeing exactly k tickets in the next hour. k can be 0, 1, 2 and so on.'], ['e', 'A fixed number, about 2.718.'], ['e^(−λ)', 'The chance of zero events.'], ['λᵏ', 'λ multiplied k times.'], ['k!', 'k factorial: k × (k − 1) × … × 1, and 0! = 1.']], walk: { intro: 'λ = 4 tickets an hour. Each line is one value of the PMF, m_X(k) = P(X = k): the chance of exactly k tickets in one hour.', steps: [['λ', '= 4 tickets an hour'], ['k', '= 0, then 1, then 2'], ['e', '= about 2.718'], ['k = 0: e^(−λ) λᵏ / k!', 'e^(−4) × 4⁰ / 0! = 0.018'], ['P(X = 0) = 0.018', 'about 1 hour in 55 has no ticket at all'], ['k = 1: e^(−λ) λᵏ / k!', 'e^(−4) × 4¹ / 1! = 0.073'], ['P(X = 1) = 0.073', 'about 1 hour in 14 has exactly one ticket'], ['k = 2: e^(−λ) λᵏ / k!', 'e^(−4) × 4² / 2! = 0.147'], ['P(X = 2) = 0.147', 'about 1 hour in 7 has exactly two'], ['P(X ≤ 2)', '= 0.018 + 0.073 + 0.147 = 0.238: about 1 hour in 4 is that quiet']] } },

  '4|pdf': { parts: [['f_X(x)', 'The height of the density at x. Not a probability on its own.'], ['∫', 'An integral, a long S for "sum": add up very thin strips under the curve to get an area.'], ['∫ₐᵇ', 'The small a and b say where the area starts and stops. With none written, it covers every x.'], ['dx', 'The width of each thin strip.'], ['f_X(x) dx', 'Height times width: the area of one strip.'], ['P(a ≤ X ≤ b)', 'The chance X lands between a and b.']], walk: { intro: 'From 42 to 54 hours, with only 3 strips instead of very many. Each strip is 4 hours wide, and we take its height at its middle:', steps: [['a', '= 42'], ['b', '= 54'], ['dx', '= 4'], ['x', '= 44, then 48, then 52'], ['f_X(x)', '= 0.0532, then 0.0665, then 0.0532'], ['x = 44: f_X(x) dx', '0.0532 × 4 = 0.213'], ['x = 48: f_X(x) dx', '0.0665 × 4 = 0.266'], ['x = 52: f_X(x) dx', '0.0532 × 4 = 0.213'], ['the sum of the strips', '0.213 + 0.266 + 0.213 = 0.692', 1], ['with very thin strips, ∫', '0.683, the exact area', 1]] } },

/* ---------- Store: this browser first, then the account ---------- */
// The same marks and notes as the Python page, under keys that start with stats|.
const ON_BRAIN = location.pathname.startsWith('/statistics');
const MARKS_URL = '/api/coding/marks';
const NOTES_URL = '/api/coding/notes';
function readStore(key, empty) { try { const v = JSON.parse(localStorage.getItem(key) || 'null'); return v ?? empty; } catch (e) { return empty; } }
function writeStore(key, value) { try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) {} }
let marks = readStore('stats-marks', {});
let notes = readStore('stats-notes', []);
const saveLocal = () => { writeStore('stats-marks', marks); writeStore('stats-notes', notes); };
const syncEl = document.getElementById('sync');
const fromServer = n => ({ id: n.id, key: n.itemKey, kind: n.kind, body: n.body, answer: n.answer, readAt: n.readAt, createdAt: n.createdAt });
const mine = k => k.startsWith('stats|');

async function load() {
  if (!ON_BRAIN) { syncEl.textContent = 'Saved in this browser.'; return; }
  try {
    const [mr, nr] = await Promise.all([fetch(MARKS_URL), fetch(NOTES_URL)]);
    if (!mr.ok || !nr.ok) throw new Error('load');
    const sm = Object.fromEntries(Object.entries((await mr.json()).marks || {}).filter(([k]) => mine(k)));
    // Marks made here before signing in go up once; the account's own are never overwritten.
    const up = Object.fromEntries(Object.entries(marks).filter(([k]) => !(k in sm)));
    if (Object.keys(up).length) fetch(MARKS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ marks: up }) }).catch(() => {});
    marks = { ...sm, ...up };
    const server = (await nr.json()).notes.filter(n => mine(n.itemKey)).map(fromServer);
    const local = notes.filter(n => !n.id);
    if (local.length) {
      const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: local.map(n => ({ key: n.key, kind: n.kind, body: n.body })) }) });
      server.push(...(r.ok ? (await r.json()).notes.map(fromServer) : local));
    }
    notes = server;
    saveLocal();
    syncEl.textContent = 'Synced with your account: the same on your phone and computer.';
  } catch (e) { syncEl.textContent = 'Offline: kept in this browser for now.'; }
  renderSession(); renderNotebook(); paintBars(); showFiles(false);
}
function setMark(key, mark) {
  if (marks[key] === mark) delete marks[key]; else marks[key] = mark;
  saveLocal();
  if (ON_BRAIN) fetch(MARKS_URL, { method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key, mark: marks[key] ?? null, note: null }) })
    .catch(() => { syncEl.textContent = 'Offline: the mark is kept in this browser.'; });
}

/* ---------- Notes ---------- */
const noteRef = n => n.id || n.localId;
const notesOf = key => notes.filter(n => n.key === key);
async function addNote(key, kind, body) {
  const text = body.trim();
  if (!text) return;
  const n = { localId: `l${Date.now()}`, key, kind, body: text, answer: null, readAt: null, createdAt: new Date().toISOString() };
  notes.push(n); saveLocal(); paintNotes();
  if (!ON_BRAIN) return;
  try {
    const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: [{ key, kind, body: text }] }) });
    if (!r.ok) throw new Error();
    Object.assign(n, fromServer((await r.json()).notes[0])); delete n.localId; saveLocal();
  } catch (e) { syncEl.textContent = 'Could not save the note to your account; it is kept in this browser.'; }
}
function editNote(ref, kind, body) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n || !body.trim()) return;
  n.kind = kind; n.body = body.trim(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ kind, body: n.body }) })
    .then(r => { if (!r.ok) throw new Error(); syncEl.textContent = 'Note changed.'; })
    .catch(() => { syncEl.textContent = 'Could not save the change to your account; it is kept in this browser.'; });
}
function deleteNote(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  notes = notes.filter(x => x !== n); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'DELETE' }).catch(() => {});
}
function markRead(ref) {
  const n = notes.find(x => noteRef(x) === ref);
  if (!n) return;
  n.readAt = new Date().toISOString(); saveLocal(); paintNotes();
  if (ON_BRAIN && n.id) fetch(`${NOTES_URL}/${n.id}`, { method: 'PATCH', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ read: true }) }).catch(() => {});
}
const KIND = { question: 'Question', comment: 'Comment' };
function noteHtml(n) {
  const done = n.kind !== 'question' || (n.answer && n.readAt);
  return `<div class="note${done ? ' done' : ''}" data-kind="${n.kind}" data-ref="${esc(noteRef(n))}">
    <div class="note-head"><span class="note-kind">${KIND[n.kind]}</span><span class="tools"><button type="button" class="n-edit" aria-label="Edit">✎ Edit</button><button type="button" class="n-del" aria-label="Delete">×</button></span></div>
    <div class="note-body">${boldHtml(esc(n.body))}</div>
    ${n.answer ? `<div class="answer"><span class="note-kind">Answer</span><div class="note-body"${n.id ? ` data-hl="stats|ans|${esc(n.id)}"` : ''}>${boldHtml(esc(n.answer))}</div>${n.readAt ? '' : '<button type="button" class="read">Got it, mark read</button>'}</div>` : ''}
  </div>`;
}
function editorHtml(kind, body) {
  return `<div class="editor" data-kind="${kind}"><div class="kinds" role="radiogroup" aria-label="Kind of note">${Object.entries(KIND).map(([k, l]) => `<button type="button" role="radio" data-kind="${k}" aria-checked="${k === kind}">${l}</button>`).join('')}</div>
    <textarea rows="3" maxlength="2000" aria-label="Your note" placeholder="Write your question or comment">${esc(body)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
/* Asked for 2026-11-08: "all the questions should be in a closed tab by default, so it doesn't make the whole
   lecture longer. I can just open and close them beneath each box." Open stays open while you read; a new
   answer opens its fold. */
const notesOpen = new Set();
function notesFold(key, list) {
  if (!list.length) return '';
  const fresh = list.some(n => n.answer && !n.readAt);
  return `<details class="notes-fold"${notesOpen.has(key) || fresh ? ' open' : ''}><summary>${list.length === 1 ? '1 question or comment' : `${list.length} questions and comments`}${fresh ? ' <span class="new">· new answer</span>' : ''}</summary><div class="notes-in">${list.map(noteHtml).join('')}</div></details>`;
}
document.addEventListener('toggle', e => {
  const f = e.target;
  if (!f.classList?.contains('notes-fold')) return;
  const key = f.closest('[data-key]')?.dataset.key;
  if (key) { if (f.open) notesOpen.add(key); else notesOpen.delete(key); }
}, true);
function paintNotes() {
  paintBoxes();
  for (const card of document.querySelectorAll('.card, .ex[data-key], .ess-item')) {
    const list = notesOf(card.dataset.key);
    card.querySelector('.notes').innerHTML = notesFold(card.dataset.key, list);
    const b = card.querySelector('.note-btn');
    b.setAttribute('aria-pressed', String(list.length > 0));
    b.textContent = list.length ? `Question or comment · ${list.length}` : 'Question or comment';
  }
  renderNotebook();
  applyHighlights();
}
/* ---------- Your own boxes ----------
 * Asked for 2026-11-05: "add ability to create new boxes, so I can write a new box and give it a title".
 * A box is one note under stats|box|, so it never shows in the notepad: the first line is its title,
 * the rest its text. A new box's unsaved words stay in this browser until it is saved or cancelled. */
const BOX_PREFIX = 'stats|box|';
const boxKey = (n, gi) => `${BOX_PREFIX}s${n}|g${gi}`;
const boxParts = body => { const at = body.indexOf('\n'); return at < 0 ? [body, ''] : [body.slice(0, at), body.slice(at + 1)]; };
const boxDrafts = () => readStore('stats-box-drafts', {});
function setBoxDraft(key, draft) {
  const all = boxDrafts();
  if (draft) all[key] = draft; else delete all[key];
  writeStore('stats-box-drafts', all);
}
function ownBoxHtml(n, part) {
  const [title, words] = boxParts(n.body);
  return `<article class="own-box" data-ref="${esc(noteRef(n))}"><h3><span>${esc(title)}</span><span class="part-tag">${esc(part)}</span><span class="tools"><button type="button" class="box-edit" aria-label="Edit">✎</button><button type="button" class="box-del" aria-label="Delete">×</button></span></h3>${words ? `<div class="words">${boldHtml(esc(words))}</div>` : ''}</article>`;
}
function boxEditorHtml(title, words, ref) {
  return `<div class="box-editor"${ref ? ` data-ref="${esc(ref)}"` : ''}><input type="text" maxlength="120" aria-label="Title of the box" placeholder="Title" value="${esc(title)}">
    <textarea rows="4" maxlength="1870" aria-label="What the box says" placeholder="Write here">${esc(words)}</textarea>
    <div class="acts"><button type="button" class="save">Save</button><button type="button" class="cancel">Cancel</button></div></div>`;
}
function paintBoxes() {
  for (const wrap of document.querySelectorAll('.own-boxes')) {
    if (wrap.querySelector('.box-editor')) continue;
    wrap.innerHTML = `${notesOf(wrap.dataset.boxKey).map(n => ownBoxHtml(n, wrap.dataset.part)).join('')}<button type="button" class="box-add">+ New box</button>`;
  }
}
document.addEventListener('click', async e => {
  const t = e.target, wrap = t.closest('.own-boxes');
  if (!wrap) return;
  const key = wrap.dataset.boxKey, own = t.closest('.own-box'), ed = t.closest('.box-editor');
  const openEditor = wrap.querySelector('.box-editor');
  if (t.closest('.box-add')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const draft = boxDrafts()[key] || { title: '', words: '' };
    t.closest('.box-add').insertAdjacentHTML('beforebegin', boxEditorHtml(draft.title, draft.words));
    t.closest('.box-add').remove();
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-edit')) {
    if (openEditor) { openEditor.querySelector('input').focus(); return; }
    const n = notes.find(x => noteRef(x) === own.dataset.ref);
    if (!n) return;
    own.outerHTML = boxEditorHtml(...boxParts(n.body), noteRef(n));
    wrap.querySelector('.box-editor input').focus();
    return;
  }
  if (own && t.closest('.box-del')) {
    const b = t.closest('.box-del');
    if (b.dataset.armed) { deleteNote(own.dataset.ref); return; }
    b.dataset.armed = '1'; b.textContent = 'Delete?'; b.classList.add('armed');
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if (ed && t.closest('.cancel')) {
    if (!ed.dataset.ref) setBoxDraft(key, null);
    ed.remove(); paintBoxes();
    return;
  }
  if (ed && t.closest('.save')) {
    const input = ed.querySelector('input'), title = input.value.trim(), words = ed.querySelector('textarea').value.trim();
    if (!title) { input.setAttribute('aria-invalid', 'true'); input.placeholder = 'Give the box a title'; input.focus(); return; }
    const body = words ? `${title}\n${words}` : title, ref = ed.dataset.ref;
    if (!ref) setBoxDraft(key, null);
    ed.remove();
    if (ref) { editNote(ref, 'comment', body); return; }
    await addNote(key, 'comment', body);
    paintBoxes();
  }
});
document.addEventListener('input', e => {
  const ed = e.target.closest('.box-editor');
  if (ed && !ed.dataset.ref) setBoxDraft(ed.closest('.own-boxes').dataset.boxKey, { title: ed.querySelector('input').value, words: ed.querySelector('textarea').value });
});
// One handler for every card and the notepad's list.
document.addEventListener('click', e => {
  const t = e.target;
  const k = t.closest('.editor .kinds [data-kind]');
  if (k) { const ed = k.closest('.editor'); ed.dataset.kind = k.dataset.kind; for (const b of ed.querySelectorAll('.kinds button')) b.setAttribute('aria-checked', String(b === k)); return; }
  const host = t.closest('.card, .ex[data-key], .ess-item, .nb-group');
  if (!host) return;
  const m = t.closest('.mark');
  if (m) {
    setMark(host.dataset.key, m.dataset.mark);
    const v = marks[host.dataset.key] || '';
    // A summary idea can be on the page twice (the Summary tab and a lecture's end): both follow.
    for (const h of document.querySelectorAll(`[data-key="${CSS.escape(host.dataset.key)}"]`)) {
      if (!h.querySelector('.marks')) continue;
      h.dataset.mark = v;
      for (const b of h.querySelectorAll('.mark')) b.setAttribute('aria-pressed', String(b.dataset.mark === v));
    }
    paintBars(); renderMap();
    return;
  }
  if (t.closest('.note-btn')) {
    host.querySelector('.editor')?.remove();
    host.querySelector('.notes').insertAdjacentHTML('afterend', editorHtml('question', ''));
    host.querySelector('.editor textarea').focus();
    return;
  }
  const note = t.closest('.note');
  if (note && t.closest('.n-edit')) {
    const n = notes.find(x => noteRef(x) === note.dataset.ref);
    note.insertAdjacentHTML('afterend', editorHtml(n.kind, n.body));
    note.nextElementSibling.dataset.ref = note.dataset.ref;
    note.hidden = true;
    note.nextElementSibling.querySelector('textarea').focus();
    return;
  }
  if (note && t.closest('.n-del')) {
    const b = t.closest('.n-del');
    if (b.dataset.armed) { deleteNote(note.dataset.ref); return; }
    b.dataset.armed = '1'; b.textContent = 'Delete?'; b.classList.add('armed');
    setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = '×'; b.classList.remove('armed'); } }, 3000);
    return;
  }
  if (note && t.closest('.read')) { markRead(note.dataset.ref); return; }
  const ed = t.closest('.editor');
  if (ed && t.closest('.save')) {
    const body = ed.querySelector('textarea').value;
    ed.remove();
    notesOpen.add(host.dataset.key);
    if (ed.dataset.ref) editNote(ed.dataset.ref, ed.dataset.kind, body); else addNote(host.dataset.key, ed.dataset.kind, body);
    paintNotes();
    return;
  }
  if (ed && t.closest('.cancel')) { ed.remove(); paintNotes(); }
});

  return subs(esc(s).replace(SYMBOLS, m => {

function phiTablesHtml() {
  const head = ['z', ...Array.from({ length: 10 }, (_, j) => `0.0${j}`)];
  const rows = Array.from({ length: 35 }, (_, i) => [(i / 10).toFixed(1), ...Array.from({ length: 10 }, (_, j) => Phi(i / 10 + j / 100).toFixed(4))]);
  const qs = [0.5, 0.6, 0.7, 0.75, 0.8, 0.85, 0.9, 0.95, 0.975, 0.98, 0.99, 0.995, 0.999];
  const zOf = q => { let lo = -6, hi = 6; for (let k = 0; k < 60; k++) { const m = (lo + hi) / 2; if (Phi(m) < q) lo = m; else hi = m; } return (lo + hi) / 2; };
  const cs = [0.8, 0.9, 0.95, 0.98, 0.99];
  return `<section class="phi-tables" id="phi-tables"><h2>Tables of Φ</h2><p class="group-note">Φ(z) = P(Z ≤ z) for Z ∼ N(0, 1). Row: z to one decimal; column: the second decimal. For a negative z, Φ(−z) = 1 − Φ(z).</p>`
    + tbl(head, rows)
    + `<p class="flow-label">Quantiles: the z with Φ(z) = q</p>${tbl(['q', ...qs.map(String)], [['z', ...qs.map(q => Math.abs(zOf(q)).toFixed(3))]])}`
    + `<p class="flow-label">Central: the z with P(−z < Z < z) = c</p>${tbl(['c', ...cs.map(String)], [['z', ...cs.map(c => zOf((1 + c) / 2).toFixed(3))]])}</section>`;
}

/* Every X and x the course writes gets its own look, also where no peek is attached:
   tables, worked rows, "aX + b". Highlights count letters, not tags, so the extra spans do not move them. */
const BARE_XX = /(?<![\p{L}\p{N}_])[Xx](?![\p{L}\p{N}_])|(?<=(?<![\p{L}])a)X(?![\p{L}\p{N}_])/gu;
function markXx(root) {
  const walk = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, { acceptNode: n => n.parentElement.closest('.kw-v, svg, textarea, .note, .own-boxes, button') ? NodeFilter.FILTER_REJECT : NodeFilter.FILTER_ACCEPT });
  const hits = [];
  for (let n = walk.nextNode(); n; n = walk.nextNode()) { BARE_XX.lastIndex = 0; if (BARE_XX.test(n.data)) hits.push(n); }
  for (const n of hits) {
    const frag = document.createDocumentFragment();
    let at = 0;
    BARE_XX.lastIndex = 0; // matchAll starts where the last test left off
    for (const m of n.data.matchAll(BARE_XX)) {
      frag.append(n.data.slice(at, m.index));
      const span = document.createElement('span');
      span.className = 'kw-v';
      span.dataset.kw = m[0];
      span.textContent = m[0];
      frag.append(span);
      at = m.index + 1;
    }
    frag.append(n.data.slice(at));
    n.replaceWith(frag);
  }
}

    { name: 'Bayes’ rule', is: 'Turns the question round: from how likely the evidence is given the cause, to how likely the cause is given the evidence.', f: 'P(B ∣ A) = P(B) P(A ∣ B) / P(A)', parts: [['P(B)', 'the prior: what you believed before'], ['P(A ∣ B)', 'the likelihood: how often B gives this evidence'], ['P(A)', 'the evidence, from total probability'], ['P(B ∣ A)', 'the posterior: what you believe after']], ex: 'The dog sits: 0.02 × 0.95 / 0.068 = 0.28, not 0.95.', pic: () => bayesTable([['item', '0.02', '0.95', '0.019', '*0.28'], ['no item', '0.98', '0.05', '0.049', '0.72']], '0.068') },
    { name: 'Independence', is: 'Knowing B tells you nothing about A: its chance stays the same.', f: 'P(A ∩ B) = P(A) P(B)\nthe same as  P(A ∣ B) = P(A)', watch: 'Disjoint is not independent. If A and B cannot happen together, knowing B tells you that A did not happen.' },
    { name: 'Repeated trials', is: 'One sequence of n independent trials with k successes: multiply the chances. "At least one" is easiest as 1 minus "none".', f: 'one sequence:   pᵏ (1 − p)ⁿ⁻ᵏ\nat least one:   1 − (1 − p)ⁿ', parts: [['p', 'the chance of success in one trial'], ['n', 'the number of trials'], ['k', 'the number of successes']], ex: 'At least one six in 4 rolls: 1 − (5/6)⁴ = 0.518.' },
  ],
  3: [
    { name: 'Random variable X', is: 'A rule that gives each outcome a number, such as the number of heads in 4 tosses.', f: 'X : Ω → numbers', parts: [['X', 'the random variable, before you look'], ['x', 'one value it can take']] },
    { name: 'PMF m_X', is: 'The list of every value X can take, with its chance. The chances add up to 1.', f: 'm_X(x) = P(X = x)\nΣ m_X(x) = 1', pic: () => bars(pmfRows(binom(4, 0.5), v => `${Math.round(v * 16)}/16`), { cap: 'Heads in 4 tosses of a coin', x: 'heads', mean: 2 }) },
    { name: 'Mean E[X]', is: 'The balance point of the PMF: each value times its chance, all added up. Over many repeats it is the average.', f: 'E[X] = Σ x m_X(x)', parts: [['x m_X(x)', 'a value, weighted by its chance'], ['Σ', 'add over every value']], ex: 'A die: (1 + 2 + 3 + 4 + 5 + 6) × 1/6 = 3.5.' },
    { name: 'Variance Var(X)', is: 'How far X typically lands from its mean: the average of the squared distance from μ.', f: 'Var(X) = E[(X − μ)²] = E[X²] − (E[X])²', parts: [['μ', 'the mean, E[X]'], ['(X − μ)²', 'the squared distance from the mean'], ['E[X²]', 'the mean of the squares']], ex: 'One toss, X = 1 for heads: E[X²] = 0.5, so Var(X) = 0.5 − 0.5² = 0.25.' },
    { name: 'Standard deviation σ_X', is: 'The spread back in the units of X: the square root of the variance.', f: 'σ_X = √Var(X)', ex: '√0.25 = 0.5.' },
    { name: 'Shift and scale', is: 'Adding b moves the mean and leaves the spread alone. Multiplying by a scales the mean by a and the variance by a².', f: 'E[aX + b] = a E[X] + b\nVar(aX + b) = a² Var(X)' },
    { name: 'E[g(X)]', is: 'To average a function of X, apply g to each value first, then weight by the chances.', f: 'E[g(X)] = Σ g(x) m_X(x)', watch: 'In general E[g(X)] is not g(E[X]).' },
    { name: 'Bernoulli', is: 'One trial: success, written 1, with chance p, and failure, written 0, otherwise.', f: 'P(X = 1) = p     E[X] = p     Var(X) = p(1 − p)' },
    { name: 'Binomial', is: 'The number of successes in n independent trials that all have the same chance p.', f: 'P(X = k) = C(n, k) pᵏ (1 − p)ⁿ⁻ᵏ\nE[X] = np     Var(X) = np(1 − p)', parts: [['C(n, k)', 'n choose k: how many orders the k successes can come in']], pic: () => bars(pmfRows(binom(10, 0.2)), { cap: 'Binomial with n = 10 and p = 0.2', x: 'successes k', mean: 2 }) },
    { name: 'Poisson', is: 'A count of events in a window, such as calls in an hour, with λ on average.', f: 'P(X = k) = e^(−λ) λᵏ / k!\nE[X] = Var(X) = λ', pic: () => bars(pmfRows(pois(3, 10)), { cap: 'Poisson with λ = 3', x: 'count k', mean: 3 }) },
  ],
  4: [
    { name: 'Density f_X', is: 'For a value on a scale, a probability is an area under the curve. The total area is 1, and the height alone is not a probability.', f: 'P(a ≤ X ≤ b) = ∫ₐᵇ f_X(x) dx\n∫ f_X(x) dx = 1', parts: [['∫ₐᵇ', 'the area from a to b'], ['f_X(x)', 'the height of the curve at x']], pic: () => curve(gauss(48, 6), 28, 68, { shade: [42, 54], label: '0.683', ticks: [30, 42, 54, 66], x: 'hours in transit', cap: 'Parcels between 42 and 54 hours: the shaded area, 0.683' }) },
    { name: 'One exact value', is: 'A single value has no width, so no area: its probability is 0. Endpoints do not matter.', f: 'P(X = a) = 0,  so  P(X < a) = P(X ≤ a)' },
    { name: 'Mean and variance', is: 'As in Lecture 3, with ∫ in place of Σ and f_X in place of m_X.', f: 'E[X] = ∫ x f_X(x) dx\nVar(X) = ∫ (x − μ)² f_X(x) dx' },
    { name: 'CDF F_X', is: 'The chance that X is at most x: the area to the left of x. Any interval is the difference of two CDF values.', f: 'F_X(x) = P(X ≤ x)\nP(a < X ≤ b) = F_X(b) − F_X(a)', pic: () => curve(x => Phi((x - 48) / 6), 28, 68, { top: 1, guide: [54, Phi(1)], ticks: [30, 42, 54, 66], x: 'hours in transit', y: 'P(X ≤ x)', cap: 'The CDF climbs from 0 to 1. At 54 hours it reads 0.84.' }) },
    { name: 'Quantile', is: 'The CDF read backwards: the value with a share q of X below it. The median is the 0.5 quantile.', f: 'the q-quantile is the x with F_X(x) = q' },
    { name: 'Uniform', is: 'Every moment of a window is equally likely: a flat density.', f: 'X ∼ Unif(a, b)\nf_X(x) = 1/(b − a)  on the window\nE[X] = (a + b)/2     Var(X) = (b − a)²/12', pic: () => curve(unif(0, 180), -30, 210, { top: 1 / 110, shade: [60, 80], label: '0.111', ticks: [[0, '9:00'], [60, '10:00'], [120, '11:00'], [180, '12:00']], x: 'arrival time', cap: 'Courier between 10:00 and 10:20: 20/180 = 0.111' }) },
    { name: 'Exponential', is: 'The wait until the next event, with λ events per unit of time on average. Short waits are the most likely.', f: 'X ∼ Exp(λ)\nf_X(x) = λ e^(−λx)     P(X > a) = e^(−λa)\nE[X] = 1/λ     Var(X) = 1/λ²', pic: () => curve(expo(0.2), 0, 25, { shade: [10, 25], ticks: [0, 5, 10, 15, 20], x: 'minutes until the next call', cap: 'λ = 0.2 per minute: longer than 10 minutes is e^(−2) = 0.135' }) },
    { name: 'Gaussian N(μ, σ)', is: 'The bell: the total of many small independent effects. μ is its centre and σ its width.', f: 'X ∼ N(μ, σ)     E[X] = μ     Var(X) = σ²', pic: () => curve(gauss(48, 6), 28, 68, { ticks: [[36, 'μ − 2σ'], [42, 'μ − σ'], [48, 'μ'], [54, 'μ + σ'], [60, 'μ + 2σ']], x: 'hours in transit', cap: 'N(48, 6)' }) },
    { name: 'Standardize: z', is: 'How many SDs a value sits from the mean. Then the table of Φ gives the area to its left.', f: 'z = (x − μ) / σ\nP(X ≤ x) = Φ(z)     Φ(−z) = 1 − Φ(z)', parts: [['z', 'the distance from the mean, counted in SDs'], ['Φ(z)', 'the area to the left of z under the standard bell']], ex: 'A parcel slower than 60 hours: z = (60 − 48)/6 = 2, so 1 − 0.977 = 0.023.' },
    { name: 'Gaussian quantile', is: 'Standardizing run backwards: read z for the share you want, then go z SDs from the mean.', f: 'x = μ + zσ', ex: 'Met by 95 % of parcels: 48 + 1.645 × 6 = 57.9 hours.' },
    { name: 'Data: x̄ and s', is: 'For data rather than a model. x̄ is the average of the values, and s is how far they typically sit from x̄.', f: 'x̄ = Σ xᵢ / n\ns² = Σ (xᵢ − x̄)² / (n − 1)     s = √s²', parts: [['xᵢ', 'one value of the data'], ['n − 1', 'one less than the count, because x̄ is itself fitted to the data']], watch: 'μ and σ belong to a model. x̄ and s are computed from data.' },
    { name: 'Median and IQR', is: 'The middle value, and the width of the middle half. A few extreme values barely move them, while they move the mean and the SD a lot.', f: 'IQR = Q₃ − Q₁', parts: [['Q₁', 'a quarter of the values are below it'], ['Q₃', 'three quarters are below it']], pic: () => boxplot({ lo: 30, hi: 70, q1: 44, med: 48, q3: 52, wlo: 34, whi: 62, out: [67], ticks: [30, 40, 50, 60, 70], cap: 'The box is the middle half; one far value sits apart' }) },
  ],
  5: [
    { name: 'Joint PMF', is: 'The probability of each pair of values of two variables. Row and column sums give the PMF of each one alone, the marginals.', f: 'm_X,Y(x, y) = P(X = x, Y = y)\nm_X(x) = Σ over y m_X,Y(x, y)', pic: () => jointDelays() },
    { name: 'Independent variables', is: 'Learning one tells nothing about the other: every cell equals its row total times its column total.', f: 'm_X,Y(x, y) = m_X(x) m_Y(y)  for every pair', ex: 'Delay 2 and 2 contacts: 0.04, but 0.10 × 0.10 = 0.01, so dependent.' },
    { name: 'Sums', is: 'The mean of a total is the total of the means. The variances add too, but only for independent variables.', f: 'E[X + Y] = E[X] + E[Y]\nVar(X + Y) = Var(X) + Var(Y)  if independent', watch: 'Add variances, not SDs.' },
    { name: 'i.i.d.', is: 'Independent and identically distributed: the chance of a whole list of values is the product of the single chances.', f: 'm(x₁) × … × m(xₙ)', ex: 'Visitors 1, 0, 0, 1 with p = 0.2: 0.2 × 0.8 × 0.8 × 0.2 = 0.0256.' },
    { name: 'Covariance', is: 'The average product of the two deviations: positive when the variables move up together.', f: 'Cov(X, Y) = E[XY] − μ_X μ_Y', parts: [['E[XY]', 'the mean of the product, cell by cell']] },
    { name: 'Correlation ρ and r', is: 'A covariance divided by the two SDs: no units, between −1 and 1. It measures a straight-line link only.', f: 'ρ = Cov(X, Y) / (σ_X σ_Y)\nr = s_xy / (s_x s_y)', parts: [['ρ', 'the model’s correlation'], ['r', 'the same from data, with n − 1']], watch: 'r = 0 does not mean independent, and a correlation does not show which causes which.' },
    { name: 'Likelihood', is: 'How probable the data are if a candidate θ were the true value. A probability of the data, not of θ.', f: 'L(θ) = P(data ∣ θ)\nL(p) = pᵏ (1 − p)ⁿ⁻ᵏ  for k successes in n', pic: () => curve(p => likeBuy(p) * 1e8, 0, 0.6, { guide: [0.15, likeBuy(0.15) * 1e8], ticks: [0, 0.15, 0.6], x: 'candidate p', y: 'L(p) × 10⁸', cap: '6 buyers among 40' }) },
    { name: 'MLE θ̂', is: 'The candidate with the largest likelihood. Compare two candidates by the ratio of their likelihoods.', f: 'θ̂ = the candidate with the largest L(θ)\nL(θ₁) / L(θ₂)', ex: '6 buyers among 40: p̂ = 0.15, and the data are 3.3 times as probable under 0.15 as under 0.25.' },
    { name: 'Log-likelihood ℓ', is: 'The logarithm turns the product into a sum, so very small numbers stay readable. It peaks at the same candidate.', f: 'ℓ(θ) = ln L(θ)     ln(ab) = ln a + ln b' },
  ],
};
/* Asked for 2026-11-13: "add three dots in school to see what u can understand clear confused for the summary
 * part, also put the summary tab at the start so i can access it from start to finish (notes and questions
 * are the same in summary up and bottom)". Each idea has a card's three dots and its Question or comment,
 * keyed by its name, so the Summary tab and the lecture's end show the same marks and notes. */
const essId = e => `sum-${e.name.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '')}`;
// `own` is the lecture's end: it carries the id that the notepad's links jump to.
function essItemHtml(s, e, i, own) {
  const key = cardKey(s.n, essId(e)), m = marks[key] || '';
  return `<article class="ess-item"${own ? ` id="c-${s.n}-${essId(e)}"` : ''} data-key="${esc(key)}" data-mark="${m}"><h3><span class="num">${i + 1}</span><span>${mathHtml(e.name)}</span></h3><p class="ess-is">${kwText(e.is)}</p>${e.f ? `<pre>${mathHtml(e.f)}</pre>` : ''}${e.parts ? readsHtml({ parts: e.parts }) : ''}${e.ex ? `<p class="ess-ex"><b>For example</b> ${kwText(e.ex)}</p>` : ''}${e.watch ? `<p class="watch"><b>Watch out</b>${kwText(e.watch)}</p>` : ''}${e.pic ? e.pic() : ''}`
    + `<div class="notes"></div><div class="foot"><button type="button" class="note-btn" aria-pressed="false">Question or comment</button>${marksHtml(m)}</div></article>`;
}
const essListHtml = (s, own) => `<div class="ess">${(ESSENTIALS[s.n] || []).map((e, i) => essItemHtml(s, e, i, own)).join('')}</div>`;
function summaryHtml(s) {
  // Folded until asked for, so the lecture reads first and the summary waits at the end.
  return `<details class="ess-fold"><summary>The lecture in its essentials: what each idea is, its formula, and what each piece means</summary>`
    + `<p class="group-note">Hover a symbol or a term to open its line from the cheat sheet.</p>`
    + essListHtml(s, true)
    + `<p class="flow-label ess-breath">In one breath</p><ul class="recap" data-hl="stats|s${s.n}|recap">${s.recap.map(r => `<li>${kwText(r)}</li>`).join('')}</ul></details>`;
}
// The Summary tab: every lecture's essentials, from the first to the last, open.
const allSummariesHtml = () => '<p class="where">Summary</p><h1>Every lecture in its essentials</h1><p class="lede">What each idea is, its formula, and what each piece means. The dots and the questions are the same as at the end of each lecture.</p>'
  + SESSIONS.map(s => `<section class="sum-l"><h2><span class="num">Lecture ${s.n}</span>${esc(s.title)}</h2>${essListHtml(s, false)}</section>`).join('');
// An answer's formula boxes get the same peeks as a card's; the words around them stay as written.
const answerHtml = h => h.split(/(<pre>[^<]*<\/pre>)/).map(part => (part.startsWith('<pre>') ? `<pre>${mathHtml(part.slice(5, -6))}</pre>` : subs(part))).join('');
function renderSession() {
  if (current === 'ref') { document.getElementById('session').innerHTML = '<p class="where">Cheat sheet</p>' + refHtml() + phiTablesHtml(); applyHighlights(); mapRefresh(); markXx(document.getElementById('session')); return; }
  if (current === 'charts') { document.getElementById('session').innerHTML = '<p class="where">Charts</p>' + chartsHtml(); mapRefresh(); markXx(document.getElementById('session')); return; }
  if (current === 'exam') { document.getElementById('session').innerHTML = examHtml(); paintNotes(); applyHighlights(); mapRefresh(); markXx(document.getElementById('session')); return; }
  if (current === 'sum') { document.getElementById('session').innerHTML = allSummariesHtml(); paintNotes(); mapRefresh(); markXx(document.getElementById('session')); return; }
  const s = SESSIONS.find(x => x.n === current);
  document.getElementById('session').innerHTML = `<p class="where"><button type="button" class="where-btn" id="where-btn">Lecture ${s.n}</button></p><h1>${esc(s.title)}</h1><p class="lede">${esc(s.lede)}</p>`
    + `<details class="pic" id="pic" data-seg="pic"${picOpen() ? ' open' : ''}><summary>The picture: the lecture on one page</summary><div class="pic-body">${PICTURES[s.n]()}</div></details>`
    + s.groups.map((g, gi) => `<section class="seg" data-seg="g${gi}" style="--h: ${segHue(gi)}">${segRail(s, gi)}${partHead(s, gi, g.name)}${g.flow ? `<p class="flow-label">${esc(g.flowLabel)}</p><p class="flow">${g.flow.map(f => `<span>${esc(f)}</span>`).join('<em>→</em>')}</p><div style="height: 10px"></div>` : ''}<div class="cards">${g.cards.map(c => cardHtml(s, c, gi)).join('')}</div><div class="own-boxes" data-box-key="${esc(boxKey(s.n, gi))}" data-part="Part ${gi + 1}/${s.groups.length + 2}"></div></section>`).join('')
    + `<section class="seg" data-seg="practice" style="--h: ${segHue(s.groups.length)}">${segRail(s, s.groups.length)}${partHead(s, s.groups.length, 'Practice')}<p class="group-note">Try each one on paper first, then open the answer.</p>${practiceHtml(s)}</section>`
    + `<section class="seg" data-seg="recap" style="--h: ${segHue(s.groups.length + 1)}">${segRail(s, s.groups.length + 1)}${partHead(s, s.groups.length + 1, 'Summary')}${summaryHtml(s)}</section>`;
  paintNotes();
  applyHighlights();
  mapRefresh();
  markXx(document.getElementById('session'));
}
document.getElementById('sessions').addEventListener('click', e => {
  const b = e.target.closest('.sess');
  if (!b) return;
  current = isTab(b.dataset.s) ? b.dataset.s : Number(b.dataset.s);
  try { localStorage.setItem('stats-session', current); } catch (err) {}
  for (const x of document.querySelectorAll('.sess')) x.setAttribute('aria-selected', String(x === b));
  renderSession();
  followSpot();
  scrollTo({ top: 0 });
});

/* ---------- Reflections: a second sheet, writing into Dreams in Action ----------
   Saved as dreams|<block> notes, so they appear there, with where you were reading as the last line. */
const RF_PREFIX = 'dreams|';
const RF_UNSORTED = 'Not sorted yet';
const RF_BLOCKS = ['New ways of learning', 'The future of education', 'Places to build', 'Logic and intuition', 'The wider world'];
const RF_MAX = 2000;
const RF_DRAFT = 'stats-reflection-draft';
const rfSheet = document.getElementById('reflections');
const rfDot = document.getElementById('rf-dot');
const rfBlock = document.getElementById('rf-block');
const rfText = document.getElementById('rf-text');
const rfSaved = document.getElementById('rf-saved');
let rfNotes = [], rfSaving = false, rfUnsortedOpen = false;
function rfSource() {
  const key = currentSpot();
  const p = places().find(x => x.key === key);
  if (!p) return 'Statistics';
  if (!p.s) return 'Statistics';
  if (p.s === 'exam') return `Statistics, exam practice: ${p.tag} ${p.name}`;
  return p.id ? `Statistics, Lecture ${p.s}: ${p.tag} ${p.name}` : `Statistics, Lecture ${p.s}`;
}
function rfPaint() {
  const keep = rfBlock.value;
  const own = [...readStore('dreams-blocks', []), ...rfNotes.map(n => n.itemKey.slice(RF_PREFIX.length))];
  const names = [RF_UNSORTED, ...RF_BLOCKS, ...own].filter((n, i, list) => list.indexOf(n) === i);
  rfBlock.innerHTML = names.map(n => `<option>${esc(n)}</option>`).join('');
  rfBlock.value = names.includes(keep) ? keep : RF_UNSORTED;
  const newest = list => [...list].sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt))).slice(0, 5);
  const item = n => `<div class="rf-item"><span class="rf-block">${esc(n.itemKey.slice(RF_PREFIX.length))}</span><p class="rf-body">${esc(n.body.length > 220 ? `${n.body.slice(0, 220)}…` : n.body)}</p></div>`;
  // Not sorted yet waits in a closed pill below, so it does not take the space.
  const loose = n => n.itemKey === RF_PREFIX + RF_UNSORTED;
  const unsorted = newest(rfNotes.filter(loose));
  document.getElementById('rf-list').innerHTML = newest(rfNotes.filter(n => !loose(n))).map(item).join('')
    + (unsorted.length ? `<details class="nb-fold" id="rf-unsorted"${rfUnsortedOpen ? ' open' : ''}><summary>${RF_UNSORTED}</summary>${unsorted.map(item).join('')}</details>` : '')
    + '<a class="rf-all" href="/dreams-in-action">All reflections ›</a>';
}
async function rfLoad() {
  try {
    const r = await fetch(NOTES_URL);
    if (!r.ok) throw new Error('load');
    rfNotes = (await r.json()).notes.filter(n => n.itemKey.startsWith(RF_PREFIX));
  } catch (e) { /* Writing still works; the blocks fall back to the usual ones. */ }
  rfPaint();
}
const rfOnSheet = () => rfDot.classList.toggle('on-sheet', !notebook.hidden || !rfSheet.hidden || !document.getElementById('focus').hidden);
function setReflections(open) {
  rfSheet.hidden = !open;
  rfDot.setAttribute('aria-expanded', String(open));
  rfOnSheet();
  if (!open) return;
  setNotebook(false);
  setFocus(false);
  document.getElementById('rf-from').textContent = `From ${rfSource()}`;
  if (!rfText.value) rfText.value = readStore(RF_DRAFT, '');
  rfPaint();
  rfLoad();
}
async function rfSave() {
  const text = rfText.value.trim();
  if (!text) { rfText.focus(); return; }
  if (rfSaving) return;
  const source = `From ${rfSource()}`.slice(0, 160);
  const say = (msg, bad) => { rfSaved.textContent = msg; rfSaved.classList.toggle('bad', !!bad); };
  if (text.length + source.length + 2 > RF_MAX) { say(`Too long by ${text.length + source.length + 2 - RF_MAX} characters. Your words are still here.`, true); return; }
  rfSaving = true;
  const block = rfBlock.value;
  const key = RF_PREFIX + block;
  try {
    const r = await fetch(NOTES_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ notes: [{ key, kind: 'comment', body: `${text}\n\n${source}` }] }) });
    if (!r.ok) throw new Error('save');
    rfNotes.push(...(await r.json()).notes);
    rfText.value = '';
    writeStore(RF_DRAFT, '');
    say(`Saved to ${block}.`);
    rfPaint();
  } catch (e) { say('Not saved. Your words are still here.', true); }
  rfSaving = false;
}
rfDot.hidden = !ON_BRAIN;

/* ---------- Focus: where my focus is and where I am in my body, while studying ----------
   Asked for 2026-11-07. Each check is a note under stats|focus: not on any card, not a mood check-in. */
const FOCUS_KEY = 'stats|focus';
const FC_FOCUS = ['Scattered', 'Drifting', 'Steady', 'Deep', 'In flow'];
const FC_BODY = ['Drained', 'Tired', 'OK', 'Good', 'Energised'];
const FC_WHERE = ['Eyes', 'Head', 'Neck', 'Shoulders', 'Back', 'Belly', 'Legs'];
const fcSheet = document.getElementById('focus'), fcDot = document.getElementById('fc-dot'), fcText = document.getElementById('fc-text');
const fcPick = { focus: 0, body: 0, where: new Set() };
let fcEarlierOpen = false;
const fcScale = (id, words, name) => { document.getElementById(id).innerHTML = words.map((w, i) => `<button type="button" role="radio" aria-checked="false" data-${name}="${i + 1}">${w}</button>`).join(''); };
fcScale('fc-focus', FC_FOCUS, 'focus');
fcScale('fc-body', FC_BODY, 'body');
document.getElementById('fc-where').innerHTML = FC_WHERE.map(w => `<button type="button" aria-pressed="false" data-where="${w}">${w}</button>`).join('');
function fcPaint() {

/* ---------- The case pad ----------
   Asked for 2026-11-08: "when you are in a box and it talks about the cells 11, 12, like box 3, I need a place
   where I can pop open the exercise or the current case: a pad that opens on the left, so I can have it on the
   side and understand what we are talking about, with the graph in it when there is one. For every lecture."
   A card's case is the last picture shown up to it in the lecture: its own, or the one before it. An
   exercise's case is the exercise: its setup, its numbers and its picture. The pad follows as you read. */
const casePad = document.getElementById('case-pad');
let caseShown = '';
function caseOf(key) {
  const m = /^stats\|s(\d+)\|(.+)$/.exec(key || '');

  if (m[2].startsWith('ex-')) {
    const i = (s.practice || []).findIndex(x => `ex-${x.id}` === m[2]);
    if (i < 0) return null;
    const x = s.practice[i];
    return { id: key, from: `Exercise ${i + 1} · ${x.title}`, go: key, html: () => `<p>${text(x.setup)}</p>${x.table ? x.table() : ''}${picHtml(x)}` };
  }
  const cards = s.groups.flatMap(g => g.cards);
  for (let j = cards.findIndex(c => c.id === m[2]); j >= 0; j--) {
    const c = cards[j], x = c.more || {};
    if (x.html) return { id: cardKey(s.n, c.id), from: `${c.num} ${c.name}`, go: cardKey(s.n, c.id), html: () => `${x.say ? `<p>${kwText(x.say)}</p>` : ''}${x.html()}${x.f ? `<pre>${mathHtml(x.f)}</pre>` : ''}` };
  }

}

    caseShown = c.id;

    from.textContent = `From ${c.from} ›`;

}
const caseSide = () => document.documentElement.classList.toggle('case-side', !casePad.hidden && innerWidth >= 316 + 760 * (parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--read')) || 1) + 40);
addEventListener('resize', caseSide);

/* ---------- The session clock ----------
   Asked for 2026-11-08: "a timer that counts how long I have worked on the session, geared to 45 minutes,
   a half circle from green to yellow; after 45 it gets orange, after 60 red, and it goes to 70. I can click
   on the clock and see how much time I worked. Colours like the highlighter."
   Time counts while the page is in front and you touched, scrolled or typed in the last 3 minutes. A break of
   30 minutes or more starts a new session. Kept on this device. */
const TM_KEY = 'stats-timer', TM_IDLE = 3 * 60e3, TM_GAP = 30 * 60e3, TM_FULL = 70;
const tmCard = document.getElementById('timer-card'), tmBtn = document.getElementById('timer');

if (!Array.isArray(tm.list)) tm = { list: [] };

const tmColour = min => (min >= 60 ? '#d9534f' : min >= 45 ? '#f08a3c' : tmMix('#6fbf8e', '#f2c14e', Math.max(0, min) / 45));
const tmMinutes = s => Math.floor((s?.ms || 0) / 60e3);

function tmSession(now) {

    s = { start: now, last: now, ms: 0, where: tmLecture() };

  }

}
function tmArc(min) {

    const p = a => `${(32 + 26 * Math.cos(a)).toFixed(2)} ${(32 - 26 * Math.sin(a)).toFixed(2)}`;
    return `<path d="M ${p(a0)} A 26 26 0 0 1 ${p(a1)}" stroke="${tmColour(i + 0.5)}" stroke-opacity="${i < min ? 1 : 0.22}"/>`;

  const today = new Date().toDateString();

  const earlier = tm.list.slice(0, live ? -1 : undefined).filter(x => tmMinutes(x) > 0).slice(-6).reverse();
  const when = x => new Date(x.start).toLocaleString([], { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
  // The half wheel again, large, with the session's time sitting in its curve (asked for 2026-11-09).
  const nowMin = live ? tmMinutes(s) : 0;
  tmCard.innerHTML = `<p class="tc-soft">This session</p><div class="tc-wheel"><svg viewBox="0 0 64 36" aria-hidden="true">${tmArc(nowMin)}</svg><p class="tc-now" style="color: ${live ? tmColour(nowMin) : 'inherit'}">${tmLength(nowMin)}</p></div>`
    + (live ? `<p class="tc-soft">Since ${new Date(s.start).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}${s.where ? ` · ${esc(s.where)}` : ''}</p>` : '')
    + `<p>Today: <b>${tmLength(todayMin)}</b></p>`
    + (earlier.length ? `<p class="tc-soft">Earlier sessions</p><ul class="tc-list">${earlier.map(x => `<li><span>${esc(when(x))}${x.where ? ` · ${esc(x.where.replace('Lecture ', 'L'))}` : ''}</span><b>${tmLength(tmMinutes(x))}</b></li>`).join('')}</ul>` : '')

addEventListener('pagehide', () => writeStore(TM_KEY, tm));
tmBtn.addEventListener('click', () => {
  const open = tmCard.hidden;

  tmBtn.setAttribute('aria-expanded', String(open));
  if (open) tmCardPaint();
});
tmCard.addEventListener('click', e => {
  if (!e.target.closest('.tc-new')) return;
  const now = Date.now();
  tm.list = [...tm.list, { start: now, last: now, ms: 0, where: tmLecture() }].slice(-40);
  writeStore(TM_KEY, tm);
  tmShown = -1;

document.addEventListener('click', e => { if (!tmCard.hidden && !e.target.closest('#timer, #timer-card')) { tmCard.hidden = true; tmBtn.setAttribute('aria-expanded', 'false'); } });

/* ---------- Term peek ----------

  }

  let done = 0;
  for (const f of picked) {

    if (!name) { skipped.push(/\.pptx?$/i.test(f.name) ? `${f.name} (a PowerPoint: pick the PDF instead)` : f.name); continue; }

  const s = SESSIONS.find(x => x.n === current), text = placeText();
  mapPill.setAttribute('aria-label', `${text}. Open the map`);
  mapPill.title = `${text}. Double-click to change its look.`;
  if (!s) { mapPill.innerHTML = '<b>≡</b>'; return; }
  const all = segsOf(s), at = all.find(x => x.key === mapPlace.seg);
  const i = all.indexOf(at), num = all.filter(x => x.key !== 'pic'), part = num.indexOf(at);
  let k = 0;
  mapPill.innerHTML = `<b>L${s.n}</b><span class="ln">${all.map((x, j) => `<i class="${j < i ? 'past' : j === i ? 'here' : ''}" data-n="${x.key === 'pic' ? '·' : ++k}"></i>`).join('')}</span>${part < 0 ? '' : `<span class="pn">${part + 1}<span class="of">/${num.length}</span></span>`}`;
  mapPill.dataset.look = pillLook;
  const where = document.getElementById('where-btn');
  if (where) {
    where.textContent = text;
    where.parentElement.style.setProperty('--h', at?.h === undefined ? '' : at.h.toFixed(0));
    where.classList.toggle('tinted', at?.h !== undefined);
  }
}
function renderMap() {
  if (mapEl.hidden) return;
  const stack = s => {
    const lit = s.n === current, open = mapOpenL.has(s.n);
    let n = 0;
    return `<div class="map-stack${lit ? ' in' : ''}"><button type="button" class="map-l" data-l="${s.n}" aria-expanded="${open}"><b>Lecture ${s.n}</b><span>${esc(s.short)}</span><span class="map-chev" style="flex:none">›</span></button>
      ${open ? `<ol class="map-segs">${segsOf(s).map(x => {
        if (x.key !== 'pic') n++;
        const here = lit && mapPlace.seg === x.key, id = `${s.n}|${x.key}`, up = mapOpenS.has(id);
        const label = `<span class="map-n">${x.key === 'pic' ? '' : n}</span><span class="t">${esc(x.name)}${here ? '<em>you are here</em>' : ''}</span>`;
        return `<li class="map-s${x.h === undefined ? ' plain' : ''}${here ? ' here' : ''}"${hueStyle(x)}>${x.cards
          ? `<div class="map-row"><button type="button" class="map-name" data-seg-toggle="${id}" aria-expanded="${up}">${label}<span class="map-chev">›</span></button><button type="button" class="map-go" data-s="${s.n}" data-to="${x.key}" aria-label="Go to ${esc(x.name)}" title="Go to this segment">→</button></div>
            ${up ? `<ol class="map-cards">${x.cards.map(c => `<li><button type="button" data-s="${s.n}" data-card="c-${s.n}-${c.id}"${lit && mapPlace.card === `c-${s.n}-${c.id}` ? ' class="on"' : ''}><b${marks[cardKey(s.n, c.id)] ? ` class="m-${marks[cardKey(s.n, c.id)]}"` : ''}>${c.num.split('.')[1]}</b>${esc(c.name)}</button></li>`).join('')}</ol>` : ''}`
          : `<div class="map-row"><button type="button" class="map-name" data-s="${s.n}" data-to="${x.key}">${label}<span class="map-go" style="width:auto;padding-right:10px">→</span></button></div>`}</li>`;
      }).join('')}</ol>` : ''}</div>`;
  };
  mapEl.innerHTML = `<div class="map-top"><span>Where you are</span><button type="button" class="map-close" aria-label="Close the map">×</button></div>
    <p class="map-now">${esc(placeText())}</p>${SESSIONS.map(stack).join('')}<button type="button" class="map-ref" data-goref>Cheat sheet</button><button type="button" class="map-ref" data-gocharts>Charts</button>`;
}
function mapKeepInView() {
  const on = mapEl.querySelector('.map-cards .on') || mapEl.querySelector('.map-s.here');
  if (!on) return;
  const a = on.getBoundingClientRect(), b = mapEl.getBoundingClientRect();
  if (a.top < b.top + 8) mapEl.scrollTop -= b.top + 8 - a.top;
  else if (a.bottom > b.bottom - 8) mapEl.scrollTop += a.bottom - b.bottom + 8;
}
function setMap(open, remember) {
  mapEl.hidden = !open;
  mapPill.hidden = open;
  mapPill.setAttribute('aria-expanded', String(open));
  if (remember) { try { localStorage.setItem('stats-map-open', open ? '1' : ''); } catch (e) {} }
  if (open) { renderMap(); mapKeepInView(); }
}
const followSeg = seg => { if (seg) mapOpenS.add(`${current}|${seg}`); };
function mapFollow() {
  const p = findPlace();
  if (p.seg === mapPlace.seg && p.card === mapPlace.card) return;
  if (p.seg !== mapPlace.seg) { mapOpenS.delete(`${current}|${mapPlace.seg}`); followSeg(p.seg); }
  mapPlace = p;
  paintPlace();
  renderMap();
  if (!mapEl.hidden) mapKeepInView();
}
// After every redraw of the page. A new lecture starts with only that lecture open.
function mapRefresh() {
  mapPlace = findPlace();
  if (current !== mapLecture && !isTab(current)) {
    mapLecture = current;
    mapOpenL.clear(); mapOpenS.clear();
    mapOpenL.add(current);
    followSeg(mapPlace.seg);
  }
  paintPlace();
  renderMap();
}
function mapGo(lecture, seg, cardId) {
  if (lecture !== current) document.querySelector(`.sess[data-s="${lecture}"]`).click();
  const el = cardId ? document.getElementById(cardId) : document.querySelector(`#session [data-seg="${seg}"]`);
  if (!MAP_WIDE.matches) setMap(false);
  el?.scrollIntoView({ block: 'start' });
  mapFollow();
}
mapEl.addEventListener('click', e => {
  if (e.target.closest('.map-close')) { setMap(false, MAP_WIDE.matches); return; }
  const l = e.target.closest('[data-l]');
  if (l) {
    const n = Number(l.dataset.l);
    if (!mapOpenL.delete(n)) mapOpenL.add(n);
    renderMap();
    return;
  }
  const t = e.target.closest('[data-seg-toggle]');
  if (t) {
    const id = t.dataset.segToggle;
    if (!mapOpenS.delete(id)) mapOpenS.add(id);
    renderMap();
    return;
  }
  if (e.target.closest('[data-goref]')) { document.querySelector('.sess[data-s="ref"]').click(); if (!MAP_WIDE.matches) setMap(false); return; }
  if (e.target.closest('[data-gocharts]')) { document.querySelector('.sess[data-s="charts"]').click(); if (!MAP_WIDE.matches) setMap(false); return; }
  const c = e.target.closest('[data-card]');
  if (c) { mapGo(Number(c.dataset.s), null, c.dataset.card); return; }
  const g = e.target.closest('[data-to]');
  if (g) mapGo(Number(g.dataset.s), g.dataset.to);
});
let pillTimer = 0;
mapPill.addEventListener('click', e => {
  clearTimeout(pillTimer);
  if (e.detail >= 2) {
    pillLook = PILL_LOOKS[(PILL_LOOKS.indexOf(pillLook) + 1) % PILL_LOOKS.length];
    try { localStorage.setItem('stats-pill-look', pillLook); } catch (err) {}
    paintPlace();
    return;
  }
  pillTimer = setTimeout(() => setMap(true, MAP_WIDE.matches), 260);
});
document.getElementById('session').addEventListener('click', e => { if (e.target.closest('#where-btn, .seg-tab')) setMap(true, MAP_WIDE.matches); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !mapEl.hidden) setMap(false, MAP_WIDE.matches); });
document.addEventListener('click', e => {
  if (mapEl.hidden || MAP_WIDE.matches) return;
  const path = e.composedPath();
  if (!path.includes(mapEl) && !path.includes(mapPill) && !e.target.closest?.('#where-btn, .seg-tab')) setMap(false);
});
let mapTimer = 0;
addEventListener('scroll', () => { clearTimeout(mapTimer); mapTimer = setTimeout(mapFollow, 60); }, { passive: true });
const mapFit = () => { let open = false; try { open = localStorage.getItem('stats-map-open') === '1'; } catch (e) {} setMap(MAP_WIDE.matches && open); };
addEventListener('resize', () => { if (fitLayout()) mapFit(); });

/* ---------- Text size ----------
   Asked for 2026-11-05: "on the notepad, a button to define the size of the letters, so I can increase it
   when my eyes are tired; it can also open the horizontal space of the boxes so they expand with the type". */
const SIZES = [1, 1.1, 1.2, 1.35, 1.5];
function paintSize() {
  const now = readSize();
  document.getElementById('size-now').textContent = `${Math.round(now * 100)}%`;
  document.getElementById('size-down').disabled = now <= SIZES[0];
  document.getElementById('size-up').disabled = now >= SIZES[SIZES.length - 1];
}
function setSize(step) {
  const i = SIZES.indexOf(readSize());
  const next = SIZES[Math.min(SIZES.length - 1, Math.max(0, (i < 0 ? 0 : i) + step))];
  // Stay on the same card: everything above it changes height.
  const keep = document.getElementById(findPlace().card) || document.querySelector('#session [data-seg]');
  const top = keep?.getBoundingClientRect().top;
  document.documentElement.style.setProperty('--read', next);
  try { localStorage.setItem('stats-text-size', String(next)); } catch (e) {}
  paintSize();
  if (fitLayout()) mapFit();
  if (keep) scrollBy(0, keep.getBoundingClientRect().top - top);
  drawPeekLinks();
}
document.getElementById('size-down').addEventListener('click', () => setSize(-1));
document.getElementById('size-up').addEventListener('click', () => setSize(1));

/* ---------- Theme, first drawing ---------- */
const themeBtn = document.getElementById('theme');
const paintTheme = () => { const night = document.documentElement.dataset.theme === 'night'; themeBtn.textContent = night ? '☀ Day' : '☾ Night'; };
themeBtn.addEventListener('click', () => {
  const next = document.documentElement.dataset.theme === 'night' ? 'day' : 'night';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('school-theme', next); } catch (e) {}
  paintTheme();
});
paintTheme();
renderTabs();
fitLayout();
paintSize();
renderSession();
mapFit();
load();
</script>
</body>
